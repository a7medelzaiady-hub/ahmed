<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحويل النص إلى صورة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --card: rgba(30, 41, 59, .75);
    --line: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-dark: #0284c7;
    --ok: #22c55e;
    --danger: #ef4444;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 20px; overflow-y: auto;
  }
  .container {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 28px;
    width: 100%; max-width: 620px;
    margin: auto;
    box-shadow: 0 15px 35px rgba(0,0,0,.5);
    text-align: center;
  }
  h1 { font-size: 26px; margin-bottom: 8px; color: var(--accent); }
  .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 22px; }
  textarea {
    width: 100%; height: 110px; padding: 14px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: #fff;
    font: inherit; font-size: 15px; resize: none; outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 6px 2px 12px; }
  button, .download-btn {
    font: inherit; font-weight: 700; cursor: pointer; border: none; color: #fff;
  }
  #generateBtn {
    width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
    background: linear-gradient(90deg, var(--accent-dark), var(--accent));
    transition: transform .2s, opacity .2s;
  }
  #generateBtn:hover:not(:disabled) { transform: translateY(-2px); }
  #generateBtn:disabled { background: #475569; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .result-box {
    margin-top: 22px; aspect-ratio: 1 / 1; width: 100%;
    display: flex; justify-content: center; align-items: center;
    border-radius: 12px; background: var(--bg);
    border: 2px dashed var(--line); overflow: hidden;
  }
  .result-box.has-image { border-style: solid; }
  .result-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .placeholder { color: #64748b; font-size: 14px; padding: 0 16px; }
  .loader-wrap { display: none; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .loader {
    width: 40px; height: 40px; border-radius: 50%;
    border: 4px solid var(--line); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .loader { animation-duration: 3s; } }

  .download-btn {
    margin-top: 16px; display: none; padding: 11px 24px;
    background: var(--ok); border-radius: 10px; font-size: 14px;
  }
  .download-btn:hover { background: #16a34a; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-box {
    background: #1e293b; padding: 24px; border-radius: 15px;
    max-width: 360px; width: 90%; text-align: center;
    border: 1px solid var(--line);
  }
  .modal-box p { font-size: 15px; line-height: 1.7; margin-bottom: 18px; color: #e2e8f0; }
  .modal-btn { background: var(--danger); padding: 8px 26px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>

<main class="container">
  <h1>تحويل النص إلى صورة 🎨</h1>
  <p class="subtitle">اكتبي الوصف بأي لغة وسيتم توليد الصورة تلقائياً</p>

  <textarea id="promptInput" maxlength="500" aria-label="وصف الصورة"
    placeholder="مثال: سيارة طائرة في مدينة مستقبلية عند الغروب"></textarea>
  <div class="meta">
    <span>Ctrl + Enter للإنشاء</span>
    <span id="counter">0 / 500</span>
  </div>

  <button id="generateBtn" type="button">إنشاء الصورة ✨</button>

  <div class="result-box" id="resultBox" aria-live="polite">
    <span class="placeholder" id="placeholderText">ستظهر الصورة هنا بعد التوليد</span>
    <div class="loader-wrap" id="loaderWrap"><div class="loader"></div><span>جاري إنشاء الصورة، قد يستغرق ذلك دقيقة...</span></div>
    <img id="generatedImage" alt="الصورة المنشأة">
  </div>

  <button id="downloadBtn" class="download-btn" type="button">تحميل الصورة 📥</button>
</main>

<div class="modal-overlay" id="customModal" role="alertdialog" aria-modal="true">
  <div class="modal-box">
    <p id="modalMessage"></p>
    <button class="modal-btn" id="modalClose" type="button">حسناً</button>
  </div>
</div>

<script>
(() => {
  const TIMEOUT_MS = 90000;
  const $ = id => document.getElementById(id);
  const input = $('promptInput'), btn = $('generateBtn'), img = $('generatedImage'),
        box = $('resultBox'), placeholder = $('placeholderText'), loader = $('loaderWrap'),
        dl = $('downloadBtn'), modal = $('customModal');

  let current = null;        // { loader: Image, timer: id }
  let currentUrl = '';
  let busy = false;

  function showAlert(msg) {
    $('modalMessage').textContent = msg;
    modal.style.display = 'flex';
    $('modalClose').focus();
  }
  const closeAlert = () => { modal.style.display = 'none'; };

  function setLoading(on) {
    busy = on;
    btn.disabled = on;
    btn.textContent = on ? 'جاري إنشاء الصورة...' : 'إنشاء الصورة ✨';
    loader.style.display = on ? 'flex' : 'none';
    if (on) {
      img.style.display = 'none';
      dl.style.display = 'none';
      placeholder.style.display = 'none';
      box.classList.remove('has-image');
    }
  }

  function fail(msg) {
    setLoading(false);
    if (!img.src || img.style.display === 'none') placeholder.style.display = 'block';
    showAlert(msg);
  }

  function cancelCurrent() {
    if (!current) return;
    clearTimeout(current.timer);
    current.loader.onload = current.loader.onerror = null;
    current = null;
  }

  function generate() {
    if (busy) return;
    const prompt = input.value.trim();
    if (!prompt) return showAlert('يرجى كتابة وصف للصورة أولاً!');

    cancelCurrent();
    setLoading(true);

    const seed = Math.floor(Math.random() * 1e6);
    const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) +
      '?width=1024&height=1024&nologo=true&seed=' + seed;

    const loaderImg = new Image();
    const timer = setTimeout(() => {
      cancelCurrent();
      fail('انتهت مهلة الإنشاء. حاولي مرة أخرى بعد قليل.');
    }, TIMEOUT_MS);
    current = { loader: loaderImg, timer };

    loaderImg.onload = () => {
      cancelCurrent();
      currentUrl = url;
      img.src = url;
      img.style.display = 'block';
      box.classList.add('has-image');
      dl.style.display = 'inline-block';
      setLoading(false);
      img.style.display = 'block';
    };
    loaderImg.onerror = () => {
      cancelCurrent();
      fail('تعذر إنشاء الصورة. تأكدي من الاتصال بالإنترنت أو جربي وصفاً مختلفاً.');
    };
    loaderImg.src = url;
  }

  async function download() {
    if (!currentUrl) return;
    try {
      const res = await fetch(currentUrl);
      if (!res.ok) throw new Error('bad response');
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'image-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch {
      // احتياط: فتح الصورة في تبويب جديد لحفظها يدوياً
      window.open(currentUrl, '_blank', 'noopener');
    }
  }

  btn.addEventListener('click', generate);
  dl.addEventListener('click', download);
  $('modalClose').addEventListener('click', closeAlert);
  modal.addEventListener('click', e => { if (e.target === modal) closeAlert(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAlert(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); generate(); }
  });
  input.addEventListener('input', () => { $('counter').textContent = input.value.length + ' / 500'; });
})();
</script>
</body>
</html>
