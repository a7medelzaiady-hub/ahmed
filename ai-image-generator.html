<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل النص إلى صورة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 14px;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s transform, 0.3s background;
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(90deg, #0369a1, #0284c7);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 20px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #0f172a;
            border: 2px dashed #334155;
            overflow: hidden;
            position: relative;
        }

        .result-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: none;
        }

        .loader {
            display: none;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .placeholder-text {
            color: #64748b;
            font-size: 14px;
        }

        .download-btn {
            margin-top: 15px;
            display: none;
            background: #22c55e;
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #16a34a;
        }

        /* نافذة التنبيه المخصصة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-box p {
            font-size: 15px;
            color: #e2e8f0;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            background: #ef4444;
            color: white;
            padding: 8px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>تحويل النص إلى صورة 🎨</h1>
    <p class="subtitle">اكتبي الوصف بأي لغة وسيقوم الذكاء الاصطناعي بتوليد الصورة تلقائياً</p>

    <div class="input-group">
        <textarea id="promptInput" placeholder="اكتبي وصف الصورة هنا (مثال: سيارة طائرة في مدينة مستقبلية عند الغروب...)"></textarea>
        <button id="generateBtn" onclick="generateImage()">إنشاء الصورة ✨</button>
    </div>

    <div class="result-box" id="resultBox">
        <span class="placeholder-text" id="placeholderText">ستظهر الصورة هنا بعد التوليد</span>
        <div class="loader" id="loader"></div>
        <img id="generatedImage" alt="الصورة المنشأة" onload="imageLoaded()" onerror="imageError()">
    </div>

    <a href="#" id="downloadBtn" class="download-btn" target="_blank">تحميل الصورة 📥</a>
</div>

<!-- نافذة التنبيه المخصصة -->
<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <p id="modalMessage">حدث خطأ. حاول مرة أخرى.</p>
        <button class="modal-btn" onclick="closeCustomAlert()">حسناً</button>
    </div>
</div>

<script>
    function showCustomAlert(message) {
        document.getElementById('modalMessage').innerText = message;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeCustomAlert() {
        document.getElementById('customModal').style.display = 'none';
    }

    function generateImage() {
        const promptInput = document.getElementById('promptInput').value.trim();
        const btn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const img = document.getElementById('generatedImage');
        const placeholder = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!promptInput) {
            showCustomAlert("يرجى كتابة وصف للصورة أولاً!");
            return;
        }

        // تجهيز الواجهة للتحميل
        img.style.display = 'none';
        downloadBtn.style.display = 'none';
        placeholder.style.display = 'none';
        loader.style.display = 'block';
        btn.disabled = true;
        btn.innerText = "جاري إنشاء الصورة...";

        // تجهيز الوصف العشوائي ورابط الصورة المباشر
        const encodedPrompt = encodeURIComponent(promptInput);
        const randomSeed = Math.floor(Math.random() * 1000000);
        
        // استخدام خدمة التوليد مع معالجة حواف التسميات تلقائياً
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&seed=${randomSeed}&nologo=true`;

        img.src = imageUrl;
    }

    function imageLoaded() {
        const btn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const img = document.getElementById('generatedImage');
        const downloadBtn = document.getElementById('downloadBtn');

        loader.style.display = 'none';
        img.style.display = 'block';
        btn.disabled = false;
        btn.innerText = "إنشاء الصورة ✨";

        downloadBtn.href = img.src;
        downloadBtn.style.display = 'inline-block';
    }

    function imageError() {
        showCustomAlert("تعذر إنشاء الصورة. يرجى التحقق من الاتصال بالإنترنت أو محاولة كتابة وصف مختلف.");
        resetUI();
    }

    function resetUI() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('placeholderText').style.display = 'block';
        document.getElementById('generateBtn').disabled = false;
        document.getElementById('generateBtn').innerText = "إنشاء الصورة ✨";
    }
</script>

</body>
</html>
