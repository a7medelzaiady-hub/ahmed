<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف صور الفواتير - الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكاتب فايربيز -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --header-bg: linear-gradient(135deg, #000000, #252525 80%);
            --bg-light: #f5f6f6;
            --border: #dcdcdc;
            --germany-red: #FF0000;
            --germany-gold: #FFCC00;
        }
        
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; padding-bottom: 50px; }
        .header-nav { background: var(--header-bg); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; color: white; border-bottom: 4px solid var(--germany-red); border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; margin-bottom: 20px; }
        .nav-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .control-card { background: white; border-radius: 15px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .invoice-card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; transition: 0.3s; }
        .invoice-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .invoice-img { width: 100%; height: 300px; object-fit: contain; background: #e9ecef; cursor: pointer; }
        .invoice-meta { padding: 12px; text-align: center; border-top: 1px solid var(--border); background: #fafafa; }
        .img-modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .img-modal img { max-width: 95%; max-height: 95%; border-radius: 10px; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: var(--germany-gold); font-size: 40px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="profits.html" class="nav-btn"><i class="fas fa-chevron-right"></i></a> <!-- أو index.html -->
        <h6 class="m-0 fw-bold"><i class="fas fa-photo-video me-1"></i> أرشيف فواتير العملاء</h6>
        <div style="width: 38px;"></div>
    </div>

    <div class="container">
        <div class="control-card">
            <label class="fw-bold mb-2">اختر العميل لاستعراض أرشيف فواتيره السابقة:</label>
            <select id="customerSelect" class="form-select fw-bold" style="border-radius: 10px; border-color: var(--border);" onchange="fetchCustomerImages()">
                <option value="">-- جاري تحميل العملاء --</option>
            </select>
        </div>

        <div id="loadingIndicator" class="text-center mt-5" style="display: none;">
            <i class="fas fa-spinner fa-spin fa-3x text-dark"></i>
            <h5 class="fw-bold mt-3">جاري جلب الفواتير...</h5>
        </div>

        <div id="imagesGrid" class="row"></div>
        
        <div id="emptyState" class="text-center mt-5 text-muted" style="display: none;">
            <i class="fas fa-folder-open fa-4x mb-3"></i>
            <h5 class="fw-bold">لا توجد صور مؤرشفة لهذا العميل حتى الآن</h5>
        </div>
    </div>

    <!-- نافذة تكبير الصورة -->
    <div id="imageModal" class="img-modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="expandedImg">
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
            authDomain: "ahmedelzaiady.firebaseapp.com",
            projectId: "ahmedelzaiady",
            storageBucket: "ahmedelzaiady.firebasestorage.app",
            messagingSenderId: "300306825071",
            appId: "1:300306825071:web:0426ddde56280fa090329a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadCustomers() {
            try {
                const snap = await db.collection("customers").orderBy("name").get();
                const select = document.getElementById("customerSelect");
                select.innerHTML = '<option value="">-- يرجى اختيار عميل --</option>';
                select.innerHTML += '<option value="cash_customer">عملاء نقدي متنوع</option>';
                
                snap.forEach(doc => {
                    select.innerHTML += `<option value="${doc.id}">${doc.data().name}</option>`;
                });
            } catch (err) {
                console.error("خطأ:", err);
                document.getElementById("customerSelect").innerHTML = '<option value="">حدث خطأ في تحميل العملاء</option>';
            }
        }

        async function fetchCustomerImages() {
            const customerId = document.getElementById("customerSelect").value;
            const grid = document.getElementById("imagesGrid");
            const loading = document.getElementById("loadingIndicator");
            const empty = document.getElementById("emptyState");

            grid.innerHTML = ""; empty.style.display = "none";
            if (!customerId) return;
            loading.style.display = "block";

            try {
                // جلب الروابط من قاعدة البيانات الخاصة بالأرشيف
                const snap = await db.collection("customers_image_archive")
                                     .where("customerId", "==", customerId)
                                     .orderBy("timestamp", "desc")
                                     .get();
                
                loading.style.display = "none";

                if (snap.empty) { empty.style.display = "block"; return; }

                snap.forEach(doc => {
                    const data = doc.data();
                    const card = `
                        <div class="col-md-4 col-sm-6">
                            <div class="invoice-card">
                                <img src="${data.imageUrl}" class="invoice-img" onclick="openModal('${data.imageUrl}')" loading="lazy">
                                <div class="invoice-meta">
                                    <h6 class="fw-bold mb-1"><i class="fas fa-calendar-alt text-danger me-1"></i> ${data.date || 'غير محدد'}</h6>
                                    <a href="${data.imageUrl}" download="فاتورة_${data.date}.png" class="btn btn-sm btn-dark w-100 mt-2 fw-bold" target="_blank">
                                        <i class="fas fa-download me-1"></i> حفظ الصورة بالجهاز
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });

            } catch (err) {
                loading.style.display = "none"; console.error(err);
                alert("حدث خطأ. تأكد من عمل Index (فهرس) في الفايربيز إذا طلب ذلك في الـ Console.");
            }
        }

        window.openModal = (imgSrc) => { document.getElementById("imageModal").style.display = "flex"; document.getElementById("expandedImg").src = imgSrc; };
        window.closeModal = () => { document.getElementById("imageModal").style.display = "none"; };

        loadCustomers();
    </script>
</body>
</html>
