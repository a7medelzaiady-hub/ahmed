name: Stock balance unified

on:
  pull_request:
    paths:
      - 'stock-balance.mjs'
      - 'makhzan.html'
      - 'inventory.html'
      - 'car-audit.html'
      - 'scripts/check-stock-unified.mjs'
  push:
    branches: [main]
    paths:
      - 'stock-balance.mjs'
      - 'makhzan.html'
      - 'inventory.html'
      - 'car-audit.html'
      - 'scripts/check-stock-unified.mjs'

permissions:
  contents: read

jobs:
  validate-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-stock-unified.mjs
