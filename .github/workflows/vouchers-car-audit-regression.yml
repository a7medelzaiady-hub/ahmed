name: Vouchers and car audit regression

on:
  pull_request:
    paths:
      - 'vouchers.html'
      - 'car-audit.html'
      - 'scripts/check-vouchers-and-car-audit.mjs'
      - '.github/workflows/vouchers-car-audit-regression.yml'
  push:
    branches: [main]
    paths:
      - 'vouchers.html'
      - 'car-audit.html'
      - 'scripts/check-vouchers-and-car-audit.mjs'
      - '.github/workflows/vouchers-car-audit-regression.yml'

permissions:
  contents: read

jobs:
  validate-vouchers-car-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-vouchers-and-car-audit.mjs
      - run: node scripts/check-vouchers-and-car-audit.mjs
