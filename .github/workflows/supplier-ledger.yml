name: Supplier ledger checks

on:
  pull_request:
    paths:
      - 'supplier-ledger.js'
      - 'accounting.html'
      - 'scripts/check-supplier-ledger.mjs'
      - '.github/workflows/supplier-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'supplier-ledger.js'
      - 'accounting.html'
      - 'scripts/check-supplier-ledger.mjs'
      - '.github/workflows/supplier-ledger.yml'

permissions:
  contents: read

jobs:
  validate-supplier-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check supplier-ledger.js
      - run: node scripts/check-supplier-ledger.mjs
