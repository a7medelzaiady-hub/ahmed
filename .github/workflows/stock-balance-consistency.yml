name: Stock balance consistency

on:
  pull_request:
    paths:
      - 'makhzan.html'
      - 'quotation-history.html'
      - 'stock-balance.mjs'
      - 'sw.js'
      - 'scripts/test-stock-balance.mjs'
      - '.github/workflows/stock-balance-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'makhzan.html'
      - 'quotation-history.html'
      - 'stock-balance.mjs'
      - 'sw.js'
      - 'scripts/test-stock-balance.mjs'
      - '.github/workflows/stock-balance-consistency.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-stock-balance.mjs
