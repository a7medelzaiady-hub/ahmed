name: Truck audit sale-source regression

on:
  pull_request:
    paths:
      - 'quotation-history.html'
      - 'item-car-report.html'
      - 'scripts/check-truck-audit-source.mjs'
      - '.github/workflows/truck-audit-source.yml'
  push:
    branches: [main]
    paths:
      - 'quotation-history.html'
      - 'item-car-report.html'
      - 'scripts/check-truck-audit-source.mjs'
      - '.github/workflows/truck-audit-source.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-truck-audit-source.mjs
