name: Compare prices WhatsApp share

on:
  pull_request:
    paths:
      - 'compare-prices.html'
      - 'scripts/check-compare-prices-share.mjs'
      - '.github/workflows/compare-prices-share.yml'
  push:
    branches: [main]
    paths:
      - 'compare-prices.html'
      - 'scripts/check-compare-prices-share.mjs'
      - '.github/workflows/compare-prices-share.yml'

permissions:
  contents: read

jobs:
  whatsapp-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-compare-prices-share.mjs
