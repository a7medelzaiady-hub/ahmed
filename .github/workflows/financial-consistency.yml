name: Financial consistency
on:
  push:
    paths:
      - 'salaries-advances.html'
      - 'sales-invoice.html'
      - 'sales-history.html'
      - 'sales_transactions.html'
      - 'customer-list.html'
      - 'customer-details.html'
      - 'customer-statement.html'
      - 'account-statement.html'
      - 'daily-sales-summary.html'
      - 'inventory.html'
      - 'inventory-list.html'
      - 'inventory-valuation.html'
      - 'new-purchase-invoice.html'
      - 'scripts/check-financial-consistency.mjs'
      - '.github/workflows/financial-consistency.yml'
  pull_request:
    paths:
      - 'salaries-advances.html'
      - 'sales-invoice.html'
      - 'sales-history.html'
      - 'sales_transactions.html'
      - 'customer-list.html'
      - 'customer-details.html'
      - 'customer-statement.html'
      - 'account-statement.html'
      - 'daily-sales-summary.html'
      - 'inventory.html'
      - 'inventory-list.html'
      - 'inventory-valuation.html'
      - 'new-purchase-invoice.html'
      - 'scripts/check-financial-consistency.mjs'
      - '.github/workflows/financial-consistency.yml'
permissions:
  contents: read
jobs:
  regression:
    name: Integrity checks (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-financial-consistency.mjs
      - run: node scripts/check-financial-consistency.mjs
