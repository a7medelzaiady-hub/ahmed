name: Sales menu regression

on:
  pull_request:
    paths:
      - 'mabiat-menu.html'
      - 'sales-invoice.html'
      - 'sales-history.html'
      - 'scripts/check-sales-menu.mjs'
      - '.github/workflows/sales-menu-regression.yml'
  push:
    branches: [main]
    paths:
      - 'mabiat-menu.html'
      - 'sales-invoice.html'
      - 'sales-history.html'
      - 'scripts/check-sales-menu.mjs'
      - '.github/workflows/sales-menu-regression.yml'

permissions:
  contents: read

jobs:
  validate-sales-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-sales-menu.mjs
