name: Sales commissions page regression
on:
  push:
    paths:
      - 'sales-commissions.html'
      - 'scripts/check-sales-commissions.mjs'
      - '.github/workflows/sales-commissions-regression.yml'
  pull_request:
    paths:
      - 'sales-commissions.html'
      - 'scripts/check-sales-commissions.mjs'
      - '.github/workflows/sales-commissions-regression.yml'
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-sales-commissions.mjs
      - run: node scripts/check-sales-commissions.mjs
