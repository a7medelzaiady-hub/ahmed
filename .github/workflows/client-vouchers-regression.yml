name: Client vouchers regression

on:
  pull_request:
    paths:
      - 'client-vouchers.html'
      - 'scripts/check-client-vouchers.mjs'
      - '.github/workflows/client-vouchers-regression.yml'
  push:
    branches: [main]
    paths:
      - 'client-vouchers.html'
      - 'scripts/check-client-vouchers.mjs'
      - '.github/workflows/client-vouchers-regression.yml'

permissions:
  contents: read

jobs:
  validate-client-vouchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-client-vouchers.mjs
      - run: node scripts/check-client-vouchers.mjs
