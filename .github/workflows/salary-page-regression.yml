name: Salary page regression

on:
  pull_request:
    paths:
      - 'salaries-advances.html'
      - 'scripts/check-salary-page.mjs'
      - '.github/workflows/salary-page-regression.yml'
  push:
    branches: [main]
    paths:
      - 'salaries-advances.html'
      - 'scripts/check-salary-page.mjs'
      - '.github/workflows/salary-page-regression.yml'

permissions:
  contents: read

jobs:
  salary-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-salary-page.mjs
