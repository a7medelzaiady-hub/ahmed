name: Accounting regression

on:
  pull_request:
    paths:
      - 'accounting.html'
      - 'scripts/check-accounting.mjs'
      - '.github/workflows/accounting-regression.yml'
  push:
    branches: [main]
    paths:
      - 'accounting.html'
      - 'scripts/check-accounting.mjs'
      - '.github/workflows/accounting-regression.yml'

permissions:
  contents: read

jobs:
  validate-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-accounting.mjs
      - run: node scripts/check-accounting.mjs
