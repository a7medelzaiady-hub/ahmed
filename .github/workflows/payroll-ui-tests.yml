name: Payroll UI Tests

on:
  pull_request:
    paths:
      - 'salaries-advances.html'
      - 'tests/salaries-advances.test.cjs'
      - '.github/workflows/payroll-ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'salaries-advances.html'
      - 'tests/salaries-advances.test.cjs'
      - '.github/workflows/payroll-ui-tests.yml'

jobs:
  payroll-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/salaries-advances.test.cjs
