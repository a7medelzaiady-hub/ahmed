name: Edited product names in sharing
on:
  push:
    paths:
      - 'compare-prices.html'
      - 'scripts/check-edited-product-share.mjs'
      - '.github/workflows/share-edited-product-names.yml'
  pull_request:
    paths:
      - 'compare-prices.html'
      - 'scripts/check-edited-product-share.mjs'
      - '.github/workflows/share-edited-product-names.yml'
permissions:
  contents: read
jobs:
  share-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-edited-product-share.mjs
      - run: node scripts/check-edited-product-share.mjs
