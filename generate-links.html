<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | إنشاء وإرسال روابط المتجر</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-dark: #075E3D;
            --brand-primary: #0E8F5B;
            --brand-tint: #E6F7EF;
            --purple-store: #7c3aed;
            --purple-gradient: linear-gradient(135deg, #6b21a8, #3b0764);
            --bg-surface: #F3FAF7;
            --text-dark: #0F2A1E;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-dark);
            padding-bottom: 90px;
        }

        .header-bar {
            background: linear-gradient(135deg, var(--brand-dark), var(--brand-primary));
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(7, 94, 61, 0.1);
        }

        .card-custom {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px;
            margin: 14px 12px;
            border: 1px solid #e2efe8;
            box-shadow: 0 4px 15px rgba(7, 94, 61, 0.05);
        }

        .btn-general-send {
            background: var(--purple-gradient);
            color: white !important;
            font-weight: 800;
            border-radius: 14px;
            padding: 12px 16px;
            width: 100%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(107, 33, 168, 0.25);
            transition: transform 0.15s ease;
        }

        .btn-general-send:active {
            transform: scale(0.96);
        }

        .btn-whatsapp {
            background: #25D366;
            color: white !important;
            font-weight: 800;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .search-select-box {
            background: #fcfdfe;
            border: 2px solid #e2efe8;
            border-radius: 14px;
            padding: 10px;
            font-weight: 700;
            width: 100%;
        }

        .search-select-box:focus {
            border-color: var(--brand-primary);
            outline: none;
        }

        .link-preview-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 10px;
            font-size: 0.8rem;
            word-break: break-all;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <button class="btn btn-sm btn-light fw-bold" onclick="history.back()"><i class="fas fa-arrow-right"></i> رجوع</button>
    <h6 class="fw-bold m-0"><i class="fas fa-paper-plane me-1"></i> إرسال رابط المتجر</h6>
    <a href="index1.html" class="text-white fs-5"><i class="fas fa-house"></i></a>
</div>

<div class="container px-2">

    <!-- 1. قسم إرسال رابط لعميل جديد (غير مسجل) -->
    <div class="card-custom border-2" style="border-color: #d8b4fe !important;">
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="badge bg-purple p-2 text-white" style="background:#7c3aed; border-radius:10px;"><i class="fas fa-user-plus fs-6"></i></span>
            <div>
                <h6 class="fw-bold m-0" style="color:#581c87">عميل جديد / غير مسجل</h6>
                <small class="text-muted" style="font-size:0.75rem">إرسال رابط المتجر المباشر دون الحاجة لتسجيله مسبقاً</small>
            </div>
        </div>

        <div class="mt-3">
            <button class="btn-general-send" onclick="sendGeneralShopLink()">
                <i class="fab fa-whatsapp fs-4"></i> إرسال الرابط لعميل جديد عبر الواتساب
            </button>
        </div>
    </div>

    <!-- 2. قسم إرسال رابط مخصص لعميل مسجل (مربوط بالـ CID والرصيد) -->
    <div class="card-custom">
        <div class="d-flex align-items-center gap-2 mb-3">
            <span class="badge bg-success p-2 text-white" style="border-radius:10px;"><i class="fas fa-store fs-6"></i></span>
            <div>
                <h6 class="fw-bold m-0" style="color:var(--brand-dark)">عميل مسجل في النظام</h6>
                <small class="text-muted" style="font-size:0.75rem">إرسال رابط مخصص يعرض للعميل اسمه ورصيده الحالي</small>
            </div>
        </div>

        <label class="fw-bold mb-1" style="font-size:0.85rem">اختر اسم العميل:</label>
        <input type="text" id="customerSearch" class="search-select-box mb-2" placeholder="🔍 ابحث عن العميل بالاسم..." oninput="filterCustomerList()">
        
        <select id="customerSelect" class="form-select fw-bold mb-3" size="5" style="border-radius:14px; border:2px solid #e2efe8;" onchange="updateSelectedCustomerLink()">
            <option value="">جاري تحميل العملاء...</option>
        </select>

        <div id="selectedCustomerBox" style="display:none;">
            <label class="fw-bold mb-1" style="font-size:0.8rem">معاينة الرابط المخصص للعميل:</label>
            <div class="link-preview-box mb-3" id="linkPreview">---</div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary fw-bold rounded-3 flex-grow-1" onclick="copyCustomerLink()"><i class="fas fa-copy me-1"></i> نسخ الرابط</button>
                <button class="btn-whatsapp flex-grow-1" onclick="sendCustomShopLink()"><i class="fab fa-whatsapp fs-5"></i> إرسال بالواتساب</button>
            </div>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
let db;
try {
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
} catch (e) {
    db = getFirestore(app);
}

let customersList = [];
const BASE_STORE_URL = window.location.origin + window.location.pathname.replace("generate-links.html", "shop.html");

// 1. إرسال رابط المتجر العام لعميل جديد
window.sendGeneralShopLink = () => {
    const message = `مرحباً بك في متجر *الزيادي لزيوت السيارات* 🛢️✨\nيمكنك تصفح جميع المنتجات والأسعار وإرسال طلبك المباشر عبر الرابط التالي:\n\n${BASE_STORE_URL}\n\nيسعدنا استقبال طلباتكم لتجهيزها وتحميلها صباحاً 🚀`;
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
};

// 2. تحميل قايمة العملاء
async function loadCustomers() {
    try {
        const snap = await getDocs(collection(db, "customers"));
        customersList = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(c => !c.isDeleted && c.name);
        customersList.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));
        renderCustomerSelect(customersList);
    } catch (e) {
        console.error("خطأ في تحميل العملاء:", e);
    }
}

function renderCustomerSelect(list) {
    const select = document.getElementById("customerSelect");
    if (!list.length) {
        select.innerHTML = `<option value="">لا يوجد عملاء مطابقين للبحث</option>`;
        return;
    }

    select.innerHTML = list.map(c => `<option value="${c.id}" data-phone="${c.phone || ''}">${c.name}</option>`).join('');
}

window.filterCustomerList = () => {
    const term = document.getElementById("customerSearch").value.toLowerCase().trim();
    const filtered = customersList.filter(c => (c.name || "").toLowerCase().includes(term));
    renderCustomerSelect(filtered);
};

window.updateSelectedCustomerLink = () => {
    const select = document.getElementById("customerSelect");
    const cid = select.value;
    if (!cid) return;

    const fullUrl = `${BASE_STORE_URL}?cid=${cid}`;
    document.getElementById("linkPreview").innerText = fullUrl;
    document.getElementById("selectedCustomerBox").style.display = "block";
};

window.copyCustomerLink = () => {
    const link = document.getElementById("linkPreview").innerText;
    navigator.clipboard.writeText(link);
    alert("تم نسخ رابط المتجر المخصص للعميل بنجاح!");
};

window.sendCustomShopLink = () => {
    const select = document.getElementById("customerSelect");
    const cid = select.value;
    const selectedOption = select.options[select.selectedIndex];
    const name = selectedOption.text;
    const phone = selectedOption.getAttribute("data-phone") || "";

    if (!cid) return;

    const fullUrl = `${BASE_STORE_URL}?cid=${cid}`;
    const message = `مرحباً *${name}* 🌸\nيمكنك تصفح منتجات ومخزون *الزيادي لزيوت السيارات* ومتابعة حسابك وإرسال طلبيتك مباشرة عبر رابطك الخاص:\n\n${fullUrl}\n\nنتشرف بخدمتك دائماً 🤝`;

    let waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
    if (phone) {
        let cleanPhone = phone.replace(/[^0-9]/g, '');
        if (cleanPhone.startsWith('01')) cleanPhone = '2' + cleanPhone;
        waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
    }

    window.open(waUrl, '_blank');
};

loadCustomers();
</script>
</body>
</html>
