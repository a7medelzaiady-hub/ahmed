
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | نظام البحث عن العملاء</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

    <style>
        :root {
            --brand-dark: #075E3D;
            --brand-primary: #0E8F5B;
            --brand-tint: #E6F7EF;
            --purple-store: #7c3aed;
            --purple-tint: #f3e8ff;
            --bg-surface: #F3FAF7;
            --text-dark: #0F2A1E;
            --text-muted: #5B6B63;
            --shadow-sm: 0 4px 12px rgba(7, 94, 61, 0.06);
            --shadow-md: 0 8px 24px rgba(7, 94, 61, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 80px;
        }

        .app-header {
            background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-primary) 100%);
            color: #ffffff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header .header-title {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-header-home {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff !important;
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .btn-header-home:active { transform: scale(0.95); }

        .search-section { padding: 14px 16px 8px; }

        .search-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 12px 14px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(7, 94, 61, 0.08);
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i {
            position: absolute;
            right: 14px;
            color: var(--brand-primary);
            font-size: 1.05rem;
        }

        .search-input-wrapper input {
            width: 100%;
            border: 2px solid #e2efe8;
            background: #fcfdfe;
            border-radius: 14px;
            padding: 10px 40px 10px 14px;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input-wrapper input:focus {
            border-color: var(--brand-primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--brand-tint);
        }

        .status-box {
            text-align: center;
            padding: 20px 16px 10px;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 8px 16px;
        }

        .customer-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 12px 14px;
            border: 1px solid #e2efe8;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .customer-name {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0;
            flex-grow: 1;
        }

        .customer-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-act {
            border: none;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 0.78rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.15s ease;
        }

        .btn-act:active { transform: scale(0.94); }
        .btn-statement { background: var(--brand-dark); color: #ffffff !important; }
        .btn-store { background: var(--purple-store); color: #ffffff !important; }
    </style>
</head>
<body>

<header class="app-header">
    <h1 class="header-title">
        <i class="fa-solid fa-users-viewfinder"></i> نظام البحث عن العملاء
    </h1>
    <a href="index1.html" class="btn-header-home">
        <i class="fa-solid fa-house"></i> الرئيسية
    </a>
</header>

<section class="search-section">
    <div class="search-card">
        <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="customerSearchInput" placeholder="اكتب اسم العميل هنا للبحث..." autocomplete="off">
        </div>
    </div>
</section>

<div class="status-box" id="statusMessage">
    <i class="fa-solid fa-spinner fa-spin text-success mb-1 fs-4"></i>
    <div>جاري جلب قائمة العملاء...</div>
</div>

<div class="results-container" id="customersResults"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
let db;
try {
    db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
    });
} catch (e) {
    db = getFirestore(app);
}

let allCustomers = [];

function norm(text) {
    return String(text || "")
        .toLowerCase()
        .replace(/[إأآا]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .replace(/ؤ/g, "و")
        .replace(/ئ/g, "ي")
        .trim();
}

async function loadCustomers() {
    const statusEl = document.getElementById('statusMessage');
    try {
        const snap = await getDocs(collection(db, "customers"));
        allCustomers = snap.docs
            .map(doc => ({ id: doc.id, ...doc.data() }))
            .filter(c => !c.isDeleted && !c.deleted && c.name);

        allCustomers.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));

        statusEl.innerHTML = `<i class="fa-solid fa-circle-check text-success mb-1 fs-4"></i><div>تم تحميل ${allCustomers.length} عميل، ابدأ البحث الآن...</div>`;
        renderResults(allCustomers);
    } catch (err) {
        console.error("خطأ في جلب العملاء:", err);
        statusEl.innerHTML = `<div class="text-danger fw-bold">تعذر جلب العملاء. تأكد من الاتصال بالإنترنت.</div>`;
    }
}

function renderResults(list) {
    const container = document.getElementById('customersResults');
    const statusEl = document.getElementById('statusMessage');

    if (!list.length) {
        container.innerHTML = "";
        statusEl.innerHTML = `<div class="text-muted fw-bold">لا توجد نتائج تطابق كلمة البحث.</div>`;
        return;
    }

    statusEl.innerHTML = `<i class="fa-solid fa-circle-check text-success mb-1 fs-4"></i><div>عرض ${list.length} نتائج</div>`;

    container.innerHTML = list.map(c => `
        <div class="customer-card">
            <h6 class="customer-name">${c.name}</h6>
            <div class="customer-actions">
                <a href="customer-statement.html?cid=${c.id}" class="btn-act btn-statement">
                    <i class="fa-solid fa-share-nodes"></i> كشف الحساب
                </a>
                <a href="shop.html?cid=${c.id}" class="btn-act btn-store">
                    <i class="fa-solid fa-store"></i> المتجر
                </a>
            </div>
        </div>
    `).join('');
}

document.getElementById('customerSearchInput').addEventListener('input', (e) => {
    const term = norm(e.target.value);
    if (!term) {
        renderResults(allCustomers);
        return;
    }

    const filtered = allCustomers.filter(c => norm(c.name).includes(term));
    renderResults(filtered);
});

loadCustomers();
</script>
</body>
</html>
