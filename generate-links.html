<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | إنشاء وإرسال روابط المتجر</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-dark: #075E3D;
            --brand-primary: #0E8F5B;
            --brand-tint: #E6F7EF;
            --purple-store: #7c3aed;
            --purple-gradient: linear-gradient(135deg, #6b21a8, #3b0764);
            --bg-surface: #F3FAF7;
            --text-dark: #0F2A1E;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-dark);
            padding-bottom: 90px;
        }

        .header-bar {
            background: linear-gradient(135deg, var(--brand-dark), var(--brand-primary));
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(7, 94, 61, 0.1);
        }

        .card-custom {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px;
            margin: 14px 12px;
            border: 1px solid #e2efe8;
            box-shadow: 0 4px 15px rgba(7, 94, 61, 0.05);
        }

        .btn-general-send {
            background: var(--purple-gradient);
            color: white !important;
            font-weight: 800;
            border-radius: 14px;
            padding: 12px 16px;
            width: 100%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(107, 33, 168, 0.25);
            transition: transform 0.15s ease;
        }

        .btn-general-send:active {
            transform: scale(0.96);
        }

        .search-select-box {
            background: #fcfdfe;
            border: 2px solid #e2efe8;
            border-radius: 14px;
            padding: 10px;
            font-weight: 700;
            width: 100%;
        }

        .search-select-box:focus {
            border-color: var(--brand-primary);
            outline: none;
        }

        /* تنسيقات قائمة العملاء الجديدة */
        .customers-container {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #e2efe8;
            border-radius: 14px;
            background: #fcfdfe;
        }

        .customer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid #e2efe8;
            transition: background 0.2s;
        }

        .customer-item:last-child {
            border-bottom: none;
        }

        .customer-item:hover {
            background: #f1f8f5;
        }

        .customer-name {
            font-weight: 700;
            color: var(--brand-dark);
            font-size: 0.95rem;
        }

        .btn-wa-small {
            background: #25D366;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.2);
        }
        
        .btn-wa-small:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

<div class="header-bar">
    <button class="btn btn-sm btn-light fw-bold" onclick="history.back()"><i class="fas fa-arrow-right"></i> رجوع</button>
    <h6 class="fw-bold m-0"><i class="fas fa-paper-plane me-1"></i> إرسال رابط المتجر</h6>
    <a href="index1.html" class="text-white fs-5"><i class="fas fa-house"></i></a>
</div>

<div class="container px-2">

    <!-- 1. قسم إرسال رابط لعميل جديد (غير مسجل) -->
    <div class="card-custom border-2" style="border-color: #d8b4fe !important;">
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="badge bg-purple p-2 text-white" style="background:#7c3aed; border-radius:10px;"><i class="fas fa-user-plus fs-6"></i></span>
            <div>
                <h6 class="fw-bold m-0" style="color:#581c87">عميل جديد / غير مسجل</h6>
                <small class="text-muted" style="font-size:0.75rem">إرسال رابط المتجر المباشر دون الحاجة لتسجيله مسبقاً</small>
            </div>
        </div>

        <div class="mt-3">
            <button class="btn-general-send" onclick="sendGeneralShopLink()">
                <i class="fab fa-whatsapp fs-4"></i> إرسال الرابط لعميل جديد
            </button>
        </div>
    </div>

    <!-- 2. قسم إرسال رابط مخصص لعميل مسجل (مربوط بالـ CID والرصيد) -->
    <div class="card-custom">
        <div class="d-flex align-items-center gap-2 mb-3">
            <span class="badge bg-success p-2 text-white" style="border-radius:10px;"><i class="fas fa-store fs-6"></i></span>
            <div>
                <h6 class="fw-bold m-0" style="color:var(--brand-dark)">العملاء المسجلين</h6>
                <small class="text-muted" style="font-size:0.75rem">إرسال رابط مخصص يعرض للعميل اسمه ورصيده</small>
            </div>
        </div>

        <input type="text" id="customerSearch" class="search-select-box mb-3" placeholder="🔍 ابحث عن العميل بالاسم..." oninput="filterCustomerList()">
        
        <!-- قائمة العملاء بديلة للـ Select -->
        <div id="customersListContainer" class="customers-container">
            <div class="p-3 text-center text-muted fw-bold">جاري تحميل العملاء...</div>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
let db;
try {
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
} catch (e) {
    db = getFirestore(app);
}

let customersList = [];
const BASE_STORE_URL = window.location.origin + window.location.pathname.replace("generate-links.html", "shop.html");

// 1. إرسال رابط المتجر العام لعميل جديد
window.sendGeneralShopLink = () => {
    const message = `مرحباً بك في متجر *الزيادي لزيوت السيارات* 🛢️✨\nيمكنك تصفح جميع المنتجات والأسعار وإرسال طلبك المباشر عبر الرابط التالي:\n\n${BASE_STORE_URL}\n\nيسعدنا استقبال طلباتكم لتجهيزها وتحميلها صباحاً 🚀`;
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
};

// 2. تحميل قائمة العملاء وعرضهم في الـ Div
async function loadCustomers() {
    try {
        const snap = await getDocs(collection(db, "customers"));
        customersList = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(c => !c.isDeleted && c.name);
        customersList.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));
        renderCustomerList(customersList);
    } catch (e) {
        console.error("خطأ في تحميل العملاء:", e);
        document.getElementById("customersListContainer").innerHTML = `<div class="p-3 text-center text-danger fw-bold">حدث خطأ في تحميل العملاء</div>`;
    }
}

function renderCustomerList(list) {
    const container = document.getElementById("customersListContainer");
    
    if (!list.length) {
        container.innerHTML = `<div class="p-3 text-center text-muted fw-bold">لا يوجد عملاء مطابقين للبحث</div>`;
        return;
    }

    container.innerHTML = list.map(c => `
        <div class="customer-item">
            <div class="customer-name">${c.name}</div>
            <button class="btn-wa-small" onclick="sendCustomShopLink('${c.id}')">
                <i class="fab fa-whatsapp fs-6"></i> إرسال
            </button>
        </div>
    `).join('');
}

window.filterCustomerList = () => {
    const term = document.getElementById("customerSearch").value.toLowerCase().trim();
    const filtered = customersList.filter(c => (c.name || "").toLowerCase().includes(term));
    renderCustomerList(filtered);
};

// 3. دالة إرسال الرابط المخصص للعميل المختار
window.sendCustomShopLink = (cid) => {
    // جلب بيانات العميل من القائمة بناءً على الـ ID
    const customer = customersList.find(c => c.id === cid);
    if (!customer) return;

    const name = customer.name;
    const phone = customer.phone || "";

    const fullUrl = `${BASE_STORE_URL}?cid=${cid}`;
    const message = `مرحباً *${name}* 🌸\nيمكنك تصفح منتجات ومخزون *الزيادي لزيوت السيارات* ومتابعة حسابك وإرسال طلبيتك مباشرة عبر رابطك الخاص:\n\n${fullUrl}\n\nنتشرف بخدمتك دائماً 🤝`;

    // إذا لم يكن لديه رقم، سيتم فتح الواتساب بشكل عام لتختار أنت العميل
    let waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
    
    // إذا كان لديه رقم هاتف مسجل
    if (phone && phone.trim() !== "") {
        let cleanPhone = phone.replace(/[^0-9]/g, '');
        // إضافة كود مصر إذا كان الرقم يبدأ بـ 01
        if (cleanPhone.startsWith('01')) {
            cleanPhone = '2' + cleanPhone;
        }
        waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
    }

    window.open(waUrl, '_blank');
};

// تشغيل جلب العملاء عند فتح الصفحة
loadCustomers();
</script>
</body>
</html>
