<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | نظام البحث عن العملاء</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

    <style>
        :root {
            --brand-dark: #075E3D;
            --brand-primary: #0E8F5B;
            --brand-tint: #E6F7EF;
            --bg-surface: #F3FAF7;
            --text-dark: #0F2A1E;
            --text-muted: #5B6B63;
            --shadow-sm: 0 4px 12px rgba(7, 94, 61, 0.06);
            --shadow-md: 0 8px 24px rgba(7, 94, 61, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 80px;
        }

        /* الهيدر العلوي بدون تداخل */
        .app-header {
            background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-primary) 100%);
            color: #ffffff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header .header-title {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header-home {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-header-home:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* حاوية البحث الاحترافية */
        .search-section {
            padding: 16px;
        }

        .search-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(7, 94, 61, 0.08);
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i {
            position: absolute;
            right: 14px;
            color: var(--brand-primary);
            font-size: 1.1rem;
        }

        .search-input-wrapper input {
            width: 100%;
            border: 2px solid #e2efe8;
            background: #fcfdfe;
            border-radius: 14px;
            padding: 12px 42px 12px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input-wrapper input:focus {
            border-color: var(--brand-primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--brand-tint);
        }

        /* حالة التحميل أو البحث الفارغ */
        .status-box {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .status-box i {
            font-size: 2rem;
            color: var(--brand-primary);
            margin-bottom: 8px;
            display: block;
        }

        /* كروت نتائج العملاء */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 16px;
        }

        .customer-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #e2efe8;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .customer-info h6 {
            margin: 0 0 4px 0;
            font-weight: 800;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .customer-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-view-customer {
            background: var(--brand-tint);
            color: var(--brand-dark);
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- الهيدر المنظم -->
<header class="app-header">
    <h1 class="header-title">
        <i class="fa-solid fa-users-viewfinder"></i> نظام البحث عن العملاء
    </h1>
    <a href="index1.html" class="btn-header-home">
        <i class="fa-solid fa-house"></i> الرئيسية
    </a>
</header>

<!-- قسم البحث -->
<section class="search-section">
    <div class="search-card">
        <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="customerSearchInput" placeholder="اكتب اسم العميل أو محله للبحث..." oninput="onSearchChange()">
        </div>
    </div>
</section>

<!-- حالة النظام وحاوية النتائج -->
<div class="status-box" id="statusMessage">
    <i class="fa-solid fa-circle-check text-success mb-2"></i>
    <div>تم تحميل البيانات بنجاح، ابدأ البحث الآن...</div>
</div>

<div class="results-container" id="customersResults">
    <!-- تظهر نتائج البحث هنا ديناميكياً -->
</div>

</body>
</html>
