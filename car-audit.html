<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جرد وحمولة السيارة - شركة الزيادي</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --warning: #f59e0b;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 110px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }

        .top-nav .nav-icon { 
            cursor: pointer; 
            font-size: 1.2rem; 
            transition: 0.2s; 
            color: white;
            text-decoration: none;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .search-section {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-wrapper {
            position: relative;
            flex-grow: 1;
        }
        .search-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
        }
        .search-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .stock-card {
            background: white;
            border-radius: 18px;
            margin: 0 15px 15px;
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .item-title {
            font-weight: 800;
            font-size: 0.98rem;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .warehouse-stock-badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: #047857;
            background: #ecfdf5;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #a7f3d0;
            white-space: nowrap;
            display: inline-block;
        }

        .unit-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 3px;
            text-align: center;
        }

        .input-qty {
            width: 100%;
            text-align: center;
            font-weight: 800;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 2px;
            font-size: 0.9rem;
            outline: none;
        }
        .input-qty:focus {
            border-color: var(--accent-green);
            background-color: #f0fdf4;
        }

        .section-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
        }

        .section-box.after-load {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .section-title i { margin-left: 4px; }

        .readonly-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            font-weight: 800;
            font-size: 0.88rem;
            color: var(--text-dark);
        }

        .box-sold {
            background: #fef3c7;
            color: #b45309;
            border-color: #fde68a;
        }

        .box-rem {
            background: #dcfce7;
            color: var(--primary-green);
            border-color: #bbf7d0;
        }

        /* زر تم لكل كارت */
        .btn-card-done {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            border: 1px solid var(--primary-green);
            background: #f0fdf4;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-card-done:active {
            transform: scale(0.98);
        }
        .btn-card-done.saved {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 20px;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-approve {
            background: var(--primary-green);
            color: white;
        }
        .btn-approve:active { background: #0a5234; }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d1d5db;
            display: inline-block;
        }
        .sync-dot.fresh { background: #10b981; }
        .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="nav-icon" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
        <i class="fas fa-sync-alt nav-icon" onclick="window.location.reload(true)" title="تحديث"></i>
    </div>
    <div class="d-flex align-items-center gap-2">
        <span class="fw-bold">حمولة وجرد العربية</span>
        <span class="sync-dot" id="syncDot" title="حالة الربط اللحظي"></span>
    </div>
    <i class="fas fa-chevron-left nav-icon" onclick="history.back()" title="رجوع"></i>
</div>

<div class="search-section">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم المنتج..." oninput="renderAuditCards()">
    </div>
</div>

<div id="cardsContainer">
    <div class="text-center text-muted mt-5 fw-bold">
        <div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري تحميل أصناف المخزن وحمولة العربية...
    </div>
</div>

<div class="bottom-bar">
    <button class="btn-action btn-approve" onclick="approveLoading()">
        <i class="fas fa-check-circle"></i> تم (اعتماد الحمولة وتحديث باقي الأجهزة)
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, doc, setDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

    let inventoryList = [];
    let salesMap = new Map();        // مبيعات كل الفترات (لحساب رصيد المخزن)
    let todaySalesMap = new Map();   // مبيعات فواتير اليوم فقط (للعرض)
    let loadStateMap = new Map();
    let prevAfterMap = new Map();    // آخر رصيد على العربية من آخر جرد محفوظ (قبل اليوم)
    let warehouseReady = false;
    const dirtyIds = new Set();      // أصناف اتعدلت محليًا ولسه ماتحفظتش: لا تُستبدل من تحديثات الأجهزة التانية
    const cardEls = new Map();
    const CACHE_KEY = 'cache_carAudit_v2';

    const pad2 = (n) => String(n).padStart(2, '0');
    function localDateStr(d = new Date()) {
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    // بتوقيت الجهاز: toISOString كان بيرجّع يوم امبارح بعد منتصف الليل بتوقيت مصر
    const todayDocId = localDateStr();

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const emptyState = () => ({ startCarton: '', startPcs: '', afterCarton: '', afterPcs: '', isSaved: false });
    const hasVal = (v) => v !== '' && v != null && !isNaN(Number(v));

    function setSyncState(state) {
        const dot = document.getElementById('syncDot');
        if (!dot) return;
        dot.classList.remove('syncing', 'fresh');
        if (state) dot.classList.add(state);
    }

    // تاريخ الفاتورة كنص YYYY-MM-DD (يدعم date نصي، أو timestamp/createdAt)
    function recordDateStr(d) {
        const v = d.date;
        if (typeof v === 'string' && v.trim()) {
            const t = v.trim();
            let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
            m = t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
            if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
        }
        const ts = d.timestamp || d.createdAt || v;
        let dt = null;
        if (ts && typeof ts.toDate === 'function') dt = ts.toDate();
        else if (ts && ts.seconds) dt = new Date(ts.seconds * 1000);
        return dt && !isNaN(dt) ? localDateStr(dt) : '';
    }

    function effState(id) {
        const st = loadStateMap.get(id) || emptyState();
        // قبل التحميل يتعبّى تلقائيًا من آخر جرد لو المستخدم ماكتبش فيه حاجة
        if (!st.startEdited && !hasVal(st.startCarton) && !hasVal(st.startPcs) && prevAfterMap.has(id)) {
            const p = prevAfterMap.get(id);
            return { ...st, startCarton: p.carton, startPcs: p.pcs, _prefilled: true };
        }
        return st;
    }
    const persistable = (st) => { const c = { ...st }; delete c._prefilled; return c; };

    function saveCache() {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({
                day: todayDocId,
                list: inventoryList,
                today: Array.from(todaySalesMap.entries())
            }));
        } catch (e) { /* الكاش اختياري */ }
    }
    function readCache() {
        try {
            const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
            if (!c || !Array.isArray(c.list)) return false;
            inventoryList = c.list;
            if (c.day === todayDocId && Array.isArray(c.today)) todaySalesMap = new Map(c.today);
            return inventoryList.length > 0;
        } catch (e) { return false; }
    }

    const factorOf = (data) => Math.max(1, Number(data.unitFactor || data.factor || data.pcsPerCarton) || 1);

    // 1) خفيف: الأصناف فقط (قراءة واحدة) فتظهر الكروت فورًا
    async function loadInventoryBase() {
        const snap = await getDocs(collection(db, "inventory"));
        const known = new Map(inventoryList.map(i => [i.id, i.totalWarehousePcs]));
        const list = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.isDeleted) return;
            list.push({
                id: d.id,
                name: data.name || 'بدون اسم',
                factor: factorOf(data),
                totalWarehousePcs: known.has(d.id) ? known.get(d.id) : null,
                _raw: { openingTotalPcs: data.openingTotalPcs, openingQty: data.openingQty }
            });
        });
        inventoryList = list;
        renderAuditCards();
    }

    // 2) آخر رصيد على العربية من آخر جرد محفوظ قبل اليوم (قراءة مستند واحد فقط)
    async function loadPreviousLoading() {
        try {
            const snap = await getDocs(query(
                collection(db, "car_loadings"),
                where("date", "<", todayDocId), orderBy("date", "desc"), limit(1)
            ));
            prevAfterMap = new Map();
            snap.forEach(d => {
                const items = d.data().items || {};
                Object.keys(items).forEach(id => {
                    const it = items[id] || {};
                    const useAfter = hasVal(it.afterCarton) || hasVal(it.afterPcs);
                    const c = useAfter ? it.afterCarton : it.startCarton;
                    const p = useAfter ? it.afterPcs : it.startPcs;
                    if ((Number(c) || 0) > 0 || (Number(p) || 0) > 0) {
                        prevAfterMap.set(id, { carton: Number(c) || 0, pcs: Number(p) || 0 });
                    }
                });
            });
            renderAuditCards();
        } catch (e) {
            console.warn("تعذر جلب رصيد آخر جرد:", e);
        }
    }

    // 3) الثقيل: رصيد المخزن من كل الحركات + مبيعات اليوم (بيتحسب بالخلفية والكروت ظاهرة)
    async function loadWarehouseBalances() {
        const [invoicesSnap, supplierSnap, transSnap] = await Promise.all([
            getDocs(collection(db, "invoices")),
            getDocs(collection(db, "supplier_transactions")),
            getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance")))
        ]);

        const factorsMap = new Map(inventoryList.map(i => [i.id, i.factor]));
        const namesMap = new Map(inventoryList.map(i => [String(i.name).trim(), i.id]));
        const purchasesMap = new Map();
        const openingMap = new Map();
        const newSales = new Map();
        const newToday = new Map();

        transSnap.forEach(docSnap => {
            const data = docSnap.data();
            if (data.productId) openingMap.set(data.productId, (openingMap.get(data.productId) || 0) + (Number(data.quantityPcs) || 0));
        });

        invoicesSnap.forEach(docSnap => {
            const inv = docSnap.data();
            const isToday = recordDateStr(inv) === todayDocId;
            (inv.items || []).forEach(item => {
                const id = item.stockId || namesMap.get(item.name?.trim());
                if (!id) return;
                const factor = factorsMap.get(id) || 1;
                const rawQty = Number(item.qty) || 0;
                const u = String(item.unit || '').trim().toLowerCase();
                const isCarton = item.isCarton === true || u === 'box' || u === 'carton' || u === 'كرتونة' || u === 'كرتونه';
                const pcs = (isCarton ? (rawQty * factor) : rawQty) * (item.isReturn ? -1 : 1);
                newSales.set(id, (newSales.get(id) || 0) + pcs);
                if (isToday) newToday.set(id, (newToday.get(id) || 0) + pcs);
            });
        });

        supplierSnap.forEach(docSnap => {
            (docSnap.data().items || []).forEach(item => {
                const id = item.stockId || namesMap.get(item.name?.trim());
                if (!id) return;
                const factor = factorsMap.get(id) || 1;
                const isReturn = Number(item.returnQty) > 0 || item.isReturn === true;
                const rawQty = isReturn ? Number(item.returnQty || item.qty) : Number(item.qty);
                const u = String(item.unitName || item.unit || '').trim().toLowerCase();
                const isCarton = item.isCarton !== false || u === 'كرتونة' || u === 'box' || u === 'carton';
                const pcs = isCarton ? (rawQty * factor) : rawQty;
                purchasesMap.set(id, (purchasesMap.get(id) || 0) + (isReturn ? -pcs : pcs));
            });
        });

        salesMap = newSales;
        todaySalesMap = newToday;
        inventoryList.forEach(item => {
            const raw = item._raw || {};
            let openingPcs = 0;
            if (raw.openingTotalPcs != null) openingPcs = Number(raw.openingTotalPcs);
            else if (raw.openingQty != null) openingPcs = Math.round(Number(raw.openingQty) * item.factor);
            else if (openingMap.has(item.id)) openingPcs = openingMap.get(item.id);
            item.totalWarehousePcs = openingPcs + (purchasesMap.get(item.id) || 0) - (salesMap.get(item.id) || 0);
        });
        warehouseReady = true;
        saveCache();
        renderAuditCards();
    }

    function listenToTodayLoading() {
        onSnapshot(doc(db, "car_loadings", todayDocId), (docSnap) => {
            if (docSnap.exists()) {
                const items = docSnap.data().items || {};
                Object.keys(items).forEach(id => {
                    if (!dirtyIds.has(id)) loadStateMap.set(id, items[id]);
                });
            }
            renderAuditCards();
            setSyncState('fresh');
        });
    }

    async function loadData() {
        setSyncState('syncing');
        if (readCache()) renderAuditCards(); // عرض فوري من آخر نسخة محفوظة
        listenToTodayLoading();
        try {
            await loadInventoryBase();
            loadPreviousLoading();           // بالتوازي، مستند واحد
            await loadWarehouseBalances();   // الثقيل بالخلفية
            setSyncState('fresh');
        } catch (e) {
            console.error("خطأ في جلب بيانات الصفحة:", e);
            setSyncState(null);
        }
    }

    const fmtCartons = (pcs, factor) => `${Math.floor(pcs / factor)} ك / ${pcs % factor} جـ`;

    function cardNumbers(item, state) {
        const factor = item.factor;
        const startPcsTotal = (Number(state.startCarton) || 0) * factor + (Number(state.startPcs) || 0);
        const afterPcsTotal = (Number(state.afterCarton) || 0) * factor + (Number(state.afterPcs) || 0);
        const addedPcsTotal = Math.max(0, afterPcsTotal - startPcsTotal);
        return {
            added: `+${Math.floor(addedPcsTotal / factor)} ك / ${addedPcsTotal % factor} جـ`,
            sold: fmtCartons(todaySalesMap.get(item.id) || 0, factor)
        };
    }

    function warehouseText(item) {
        if (item.totalWarehousePcs == null) return 'جاري الحساب...';
        const whAbs = Math.abs(item.totalWarehousePcs);
        const sign = item.totalWarehousePcs < 0 ? '-' : '';
        return `${sign}${Math.floor(whAbs / item.factor)} كرتونة و ${whAbs % item.factor} جركن`;
    }

    function setBtnState(btn, isSaved) {
        btn.classList.toggle('saved', isSaved);
        btn.querySelector('i').className = `fas ${isSaved ? 'fa-check-circle' : 'fa-check'}`;
        btn.querySelector('span').textContent = isSaved ? 'تم تسجيل الصنف بنجاح' : 'تم (تسجيل هذا الصنف)';
    }

    function qtyInput(id, field, value) {
        return `<input type="number" inputmode="numeric" class="input-qty" placeholder="0" value="${esc(value)}" data-id="${esc(id)}" data-field="${field}">`;
    }

    window.renderAuditCards = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('cardsContainer');

        // نحفظ مكان المؤشر عشان إعادة الرسم ما تقطعش الكتابة
        const ae = document.activeElement;
        const focus = (ae && container.contains(ae) && ae.dataset && ae.dataset.id)
            ? { id: ae.dataset.id, field: ae.dataset.field, pos: ae.selectionStart } : null;

        const filtered = inventoryList.filter(item => item.name.toLowerCase().includes(term));
        cardEls.clear();

        if (filtered.length === 0) {
            container.innerHTML = `<div class="text-center text-muted mt-5 fw-bold">${inventoryList.length ? 'لا توجد أصناف مطابقة للبحث' : 'لا توجد أصناف'}</div>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            const state = effState(item.id);
            const n = cardNumbers(item, state);
            const isSaved = state.isSaved === true;
            html += `
                <div class="stock-card" data-card="${esc(item.id)}">
                    <div class="item-header">
                        <div>
                            <div class="item-title">${esc(item.name)}</div>
                            <div class="text-muted" style="font-size:0.75rem;">الكرتونة: ${item.factor} قطعة</div>
                        </div>
                        <div class="warehouse-stock-badge">بالمخزن: ${warehouseText(item)}</div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <div class="section-box">
                                <div class="section-title text-muted"><i class="fas fa-history"></i> قبل التحميل${state._prefilled ? ' <small>(من آخر جرد)</small>' : ''}</div>
                                <div class="row g-1">
                                    <div class="col-6"><div class="unit-label">كرتونة</div>${qtyInput(item.id, 'startCarton', state.startCarton)}</div>
                                    <div class="col-6"><div class="unit-label">جركن</div>${qtyInput(item.id, 'startPcs', state.startPcs)}</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="section-box after-load">
                                <div class="section-title text-success"><i class="fas fa-truck-loading"></i> بعد التحميل</div>
                                <div class="row g-1">
                                    <div class="col-6"><div class="unit-label">كرتونة</div>${qtyInput(item.id, 'afterCarton', state.afterCarton)}</div>
                                    <div class="col-6"><div class="unit-label">جركن</div>${qtyInput(item.id, 'afterPcs', state.afterPcs)}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2 pt-1">
                        <div class="col-6">
                            <div class="unit-label">صافي المحمل اليوم</div>
                            <div class="readonly-box box-rem js-added">${n.added}</div>
                        </div>
                        <div class="col-6">
                            <div class="unit-label">مبيعات الفواتير اليوم</div>
                            <div class="readonly-box box-sold js-sold">${n.sold}</div>
                        </div>
                    </div>

                    <button class="btn-card-done ${isSaved ? 'saved' : ''}" data-save="${esc(item.id)}">
                        <i class="fas ${isSaved ? 'fa-check-circle' : 'fa-check'}"></i>
                        <span>${isSaved ? 'تم تسجيل الصنف بنجاح' : 'تم (تسجيل هذا الصنف)'}</span>
                    </button>
                </div>`;
        });
        container.innerHTML = html;
        container.querySelectorAll('.stock-card').forEach(el => cardEls.set(el.dataset.card, el));

        if (focus) {
            const el = Array.from(container.querySelectorAll('input[data-id]'))
                .find(i => i.dataset.id === focus.id && i.dataset.field === focus.field);
            if (el) { el.focus(); try { el.setSelectionRange(focus.pos, focus.pos); } catch (e) { /* number input */ } }
        }
    };

    // تحديث كارت واحد فقط أثناء الكتابة (بدل إعادة رسم كل الأصناف وفقدان المؤشر بعد كل رقم)
    function updateCardInPlace(id) {
        const el = cardEls.get(id);
        const item = inventoryList.find(i => i.id === id);
        if (!el || !item) return;
        const state = effState(id);
        const n = cardNumbers(item, state);
        el.querySelector('.js-added').textContent = n.added;
        setBtnState(el.querySelector('.btn-card-done'), state.isSaved === true);
    }

    window.updateLoadState = function(id, field, value) {
        const st = persistable(effState(id));
        st[field] = value;
        if (field === 'startCarton' || field === 'startPcs') st.startEdited = true;
        st.isSaved = false; // عند التعديل نلغي تم الحفظ حتى يتم الضغط على تم مرة أخرى
        loadStateMap.set(id, st);
        dirtyIds.add(id);
        updateCardInPlace(id);
    };

    document.getElementById('cardsContainer').addEventListener('input', (e) => {
        const t = e.target;
        if (t && t.dataset && t.dataset.field) window.updateLoadState(t.dataset.id, t.dataset.field, t.value);
    });
    document.getElementById('cardsContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-save]');
        if (btn) window.saveSingleItem(btn.dataset.save);
    });

    // حفظ كارت فردي: نكتب الصنف ده بس (من غير ما نمسح تعديلات الأجهزة التانية على باقي الأصناف)
    window.saveSingleItem = async function(id) {
        try {
            const st = persistable(effState(id));
            st.isSaved = true;
            loadStateMap.set(id, st);
            await setDoc(doc(db, "car_loadings", todayDocId), {
                date: todayDocId,
                updatedAt: serverTimestamp(),
                items: { [id]: st }
            }, { merge: true });
            dirtyIds.delete(id);
            updateCardInPlace(id);
        } catch (e) {
            console.error("خطأ أثناء حفظ الصنف:", e);
            alert("حدث خطأ أثناء حفظ الصنف.");
        }
    };

    // حفظ واعتماد كل الأصناف اللي فيها بيانات
    window.approveLoading = async function() {
        try {
            const itemsObj = {};
            loadStateMap.forEach((val, key) => {
                val.isSaved = true;
                itemsObj[key] = persistable(val);
            });
            await setDoc(doc(db, "car_loadings", todayDocId), {
                date: todayDocId,
                updatedAt: serverTimestamp(),
                items: itemsObj
            }, { merge: true });
            dirtyIds.clear();
            renderAuditCards();
            alert("تم اعتماد وتأكيد جميع الأصناف بنجاح، وستظهر فوراً على جميع الأجهزة الأخرى!");
        } catch (e) {
            console.error("خطأ أثناء حفظ الاعتماد:", e);
            alert("حدث خطأ أثناء اعتماد الحمولة.");
        }
    };

    loadData();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch((err) => console.log(err));
}
</script>
</body>
</html>
