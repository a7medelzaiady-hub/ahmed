<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جرد وحمولة السيارة - شركة الزيادي</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --warning: #f59e0b;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 110px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }

        .top-nav .nav-icon { 
            cursor: pointer; 
            font-size: 1.2rem; 
            transition: 0.2s; 
            color: white;
            text-decoration: none;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .search-section {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-wrapper {
            position: relative;
            flex-grow: 1;
        }
        .search-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
        }
        .search-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .stock-card {
            background: white;
            border-radius: 18px;
            margin: 0 15px 15px;
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .item-title {
            font-weight: 800;
            font-size: 0.98rem;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .warehouse-stock-badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: #047857;
            background: #ecfdf5;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #a7f3d0;
            white-space: nowrap;
            display: inline-block;
        }

        .unit-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 3px;
            text-align: center;
        }

        .input-qty {
            width: 100%;
            text-align: center;
            font-weight: 800;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 2px;
            font-size: 0.9rem;
            outline: none;
        }
        .input-qty:focus {
            border-color: var(--accent-green);
            background-color: #f0fdf4;
        }

        .section-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
        }

        .section-box.after-load {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .section-title i { margin-left: 4px; }

        .readonly-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            font-weight: 800;
            font-size: 0.88rem;
            color: var(--text-dark);
        }

        .box-sold {
            background: #fef3c7;
            color: #b45309;
            border-color: #fde68a;
        }

        .box-rem {
            background: #dcfce7;
            color: var(--primary-green);
            border-color: #bbf7d0;
        }

        /* زر تم لكل كارت */
        .btn-card-done {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            border: 1px solid var(--primary-green);
            background: #f0fdf4;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-card-done:active {
            transform: scale(0.98);
        }
        .btn-card-done.saved {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 20px;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-approve {
            background: var(--primary-green);
            color: white;
        }
        .btn-approve:active { background: #0a5234; }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d1d5db;
            display: inline-block;
        }
        .sync-dot.fresh { background: #10b981; }
        .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="nav-icon" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
        <i class="fas fa-sync-alt nav-icon" onclick="window.location.reload(true)" title="تحديث"></i>
    </div>
    <div class="d-flex align-items-center gap-2">
        <span class="fw-bold">حمولة وجرد العربية</span>
        <span class="sync-dot" id="syncDot" title="حالة الربط اللحظي"></span>
    </div>
    <i class="fas fa-chevron-left nav-icon" onclick="history.back()" title="رجوع"></i>
</div>

<div class="search-section">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم المنتج..." oninput="renderAuditCards()">
    </div>
</div>

<div id="cardsContainer">
    <div class="text-center text-muted mt-5 fw-bold">
        <div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري تحميل أصناف المخزن وحمولة العربية...
    </div>
</div>

<div class="bottom-bar">
    <button class="btn-action btn-approve" onclick="approveLoading()">
        <i class="fas fa-check-circle"></i> تم (اعتماد الحمولة وتحديث باقي الأجهزة)
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, doc, setDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

    let inventoryList = [];
    let salesMap = new Map();
    let loadStateMap = new Map();
    const todayDocId = new Date().toISOString().split('T')[0];

    function setSyncState(state) {
        const dot = document.getElementById('syncDot');
        if (!dot) return;
        dot.classList.remove('syncing', 'fresh');
        if (state) dot.classList.add(state);
    }

    // جلب بيانات المخزون والمبيعات والحمولة المعتمدة
    async function loadData() {
        setSyncState('syncing');
        try {
            const [inventorySnap, invoicesSnap, supplierSnap, transSnap] = await Promise.all([
                getDocs(collection(db, "inventory")),
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions")),
                getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance")))
            ]);

            const factorsMap = new Map();
            const namesMap = new Map();
            const purchasesMap = new Map();
            const openingMap = new Map();

            transSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.productId) {
                    openingMap.set(data.productId, (openingMap.get(data.productId) || 0) + (Number(data.quantityPcs) || 0));
                }
            });

            inventorySnap.forEach(docSnap => {
                const data = docSnap.data();
                if (!data.isDeleted) {
                    const factor = Math.max(1, Number(data.unitFactor || data.factor || data.pcsPerCarton) || 1);
                    factorsMap.set(docSnap.id, factor);
                    if (data.name) namesMap.set(data.name.trim(), docSnap.id);
                }
            });

            // المبيعات
            invoicesSnap.forEach(docSnap => {
                const items = docSnap.data().items || [];
                items.forEach(item => {
                    const id = item.stockId || namesMap.get(item.name?.trim());
                    if (id) {
                        const factor = factorsMap.get(id) || 1;
                        const rawQty = Number(item.qty) || 0;
                        const u = String(item.unit || '').trim().toLowerCase();
                        const isCarton = item.isCarton === true || u === 'box' || u === 'carton' || u === 'كرتونة' || u === 'كرتونه';
                        const pcs = isCarton ? (rawQty * factor) : rawQty;
                        
                        salesMap.set(id, (salesMap.get(id) || 0) + (item.isReturn ? -pcs : pcs));
                    }
                });
            });

            // المشتريات
            supplierSnap.forEach(docSnap => {
                const items = docSnap.data().items || [];
                items.forEach(item => {
                    const id = item.stockId || namesMap.get(item.name?.trim());
                    if (id) {
                        const factor = factorsMap.get(id) || 1;
                        const isReturn = Number(item.returnQty) > 0 || item.isReturn === true;
                        const rawQty = isReturn ? Number(item.returnQty || item.qty) : Number(item.qty);
                        const u = String(item.unitName || item.unit || '').trim().toLowerCase();
                        const isCarton = item.isCarton !== false || u === 'كرتونة' || u === 'box' || u === 'carton';
                        const pcs = isCarton ? (rawQty * factor) : rawQty;

                        purchasesMap.set(id, (purchasesMap.get(id) || 0) + (isReturn ? -pcs : pcs));
                    }
                });
            });

            // إعداد أرقام رصيد المخزن الحالي
            inventoryList = [];
            inventorySnap.forEach(docSnap => {
                const data = docSnap.data();
                if (!data.isDeleted) {
                    const factor = Math.max(1, Number(data.unitFactor || data.factor || data.pcsPerCarton) || 1);
                    let openingPcs = 0;
                    if (data.openingTotalPcs != null) openingPcs = Number(data.openingTotalPcs);
                    else if (data.openingQty != null) openingPcs = Math.round(Number(data.openingQty) * factor);
                    else if (openingMap.has(docSnap.id)) openingPcs = openingMap.get(docSnap.id);

                    const sPcs = salesMap.get(docSnap.id) || 0;
                    const pPcs = purchasesMap.get(docSnap.id) || 0;
                    const totalWhPcs = openingPcs + pPcs - sPcs;

                    inventoryList.push({
                        id: docSnap.id,
                        name: data.name || 'بدون اسم',
                        factor: factor,
                        totalWarehousePcs: totalWhPcs
                    });
                }
            });

            // استماع لحظي لتزامن الحمولة عبر باقي الأجهزة
            onSnapshot(doc(db, "car_loadings", todayDocId), (docSnap) => {
                if (docSnap.exists()) {
                    const items = docSnap.data().items || {};
                    Object.keys(items).forEach(id => {
                        loadStateMap.set(id, items[id]);
                    });
                }
                renderAuditCards();
                setSyncState('fresh');
            });

        } catch (e) {
            console.error("خطأ في جلب بيانات الصفحة:", e);
            setSyncState(null);
        }
    }

    window.renderAuditCards = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('cardsContainer');
        
        const filtered = inventoryList.filter(item => item.name.toLowerCase().includes(term));

        if (filtered.length === 0) {
            container.innerHTML = `<div class="text-center text-muted mt-5 fw-bold">لا توجد أصناف مطابقة للبحث</div>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            const factor = item.factor;
            const state = loadStateMap.get(item.id) || { startCarton: '', startPcs: '', afterCarton: '', afterPcs: '', isSaved: false };

            // تحويل رصيد المخزن إلى (كرتونة + جركن)
            const whAbs = Math.abs(item.totalWarehousePcs);
            const whSign = item.totalWarehousePcs < 0 ? '-' : '';
            const whCartons = Math.floor(whAbs / factor);
            const whPcs = whAbs % factor;
            const whText = `${whSign}${whCartons} كرتونة و ${whPcs} جركن`;

            // المبيعات المسجلة بالفواتير
            const soldTotalPcs = salesMap.get(item.id) || 0;
            const soldCartons = Math.floor(soldTotalPcs / factor);
            const soldPcs = soldTotalPcs % factor;

            // إجمالي قطع قبل وبعد التحميل
            const startPcsTotal = (Number(state.startCarton) || 0) * factor + (Number(state.startPcs) || 0);
            const afterPcsTotal = (Number(state.afterCarton) || 0) * factor + (Number(state.afterPcs) || 0);

            // الفرق / المحمل الجديد بالعربية
            const addedPcsTotal = Math.max(0, afterPcsTotal - startPcsTotal);
            const addedCartons = Math.floor(addedPcsTotal / factor);
            const addedPcs = addedPcsTotal % factor;

            const isSaved = state.isSaved === true;

            html += `
                <div class="stock-card">
                    <div class="item-header">
                        <div>
                            <div class="item-title">${item.name}</div>
                            <div class="text-muted" style="font-size:0.75rem;">الكرتونة: ${factor} قطعة</div>
                        </div>
                        <div class="warehouse-stock-badge">
                            بالمخزن: ${whText}
                        </div>
                    </div>

                    <!-- خانات قبل وبعد التحميل جنباً إلى جنب -->
                    <div class="row g-2 mb-2">
                        <!-- قبل التحميل (متبقي اليوم السابق) -->
                        <div class="col-6">
                            <div class="section-box">
                                <div class="section-title text-muted"><i class="fas fa-history"></i> قبل التحميل</div>
                                <div class="row g-1">
                                    <div class="col-6">
                                        <div class="unit-label">كرتونة</div>
                                        <input type="number" class="input-qty" placeholder="0" value="${state.startCarton}" 
                                               oninput="updateLoadState('${item.id}', 'startCarton', this.value)">
                                    </div>
                                    <div class="col-6">
                                        <div class="unit-label">جركن</div>
                                        <input type="number" class="input-qty" placeholder="0" value="${state.startPcs}" 
                                               oninput="updateLoadState('${item.id}', 'startPcs', this.value)">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- بعد التحميل (الإجمالي بالعربية) -->
                        <div class="col-6">
                            <div class="section-box after-load">
                                <div class="section-title text-success"><i class="fas fa-truck-loading"></i> بعد التحميل</div>
                                <div class="row g-1">
                                    <div class="col-6">
                                        <div class="unit-label">كرتونة</div>
                                        <input type="number" class="input-qty" placeholder="0" value="${state.afterCarton}" 
                                               oninput="updateLoadState('${item.id}', 'afterCarton', this.value)">
                                    </div>
                                    <div class="col-6">
                                        <div class="unit-label">جركن</div>
                                        <input type="number" class="input-qty" placeholder="0" value="${state.afterPcs}" 
                                               oninput="updateLoadState('${item.id}', 'afterPcs', this.value)">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- خلاصة الصافي والمبيعات -->
                    <div class="row g-2 pt-1">
                        <div class="col-6">
                            <div class="unit-label">صافي المحمل اليوم</div>
                            <div class="readonly-box box-rem">+${addedCartons} ك / ${addedPcs} جـ</div>
                        </div>
                        <div class="col-6">
                            <div class="unit-label">مبيعات الفواتير اليوم</div>
                            <div class="readonly-box box-sold">${soldCartons} ك / ${soldPcs} جـ</div>
                        </div>
                    </div>

                    <!-- زر تم الخاص بالصنف منفصلاً -->
                    <button class="btn-card-done ${isSaved ? 'saved' : ''}" onclick="saveSingleItem('${item.id}')">
                        <i class="fas ${isSaved ? 'fa-check-circle' : 'fa-check'}"></i>
                        <span>${isSaved ? 'تم تسجيل الصنف بنجاح' : 'تم (تسجيل هذا الصنف)'}</span>
                    </button>
                </div>
            `;
        });

        container.innerHTML = html;
    };

    window.updateLoadState = function(id, field, value) {
        let state = loadStateMap.get(id) || { startCarton: '', startPcs: '', afterCarton: '', afterPcs: '', isSaved: false };
        state[field] = value;
        state.isSaved = false; // عند التعديل نلغي تم الحفظ حتى يتم الضغط على تم مرة أخرى
        loadStateMap.set(id, state);
        renderAuditCards();
    };

    // حفظ كارت فردي واحداً تلو الآخر
    window.saveSingleItem = async function(id) {
        try {
            let state = loadStateMap.get(id) || { startCarton: '', startPcs: '', afterCarton: '', afterPcs: '' };
            state.isSaved = true;
            loadStateMap.set(id, state);

            const itemsObj = {};
            loadStateMap.forEach((val, key) => {
                itemsObj[key] = val;
            });

            await setDoc(doc(db, "car_loadings", todayDocId), {
                date: todayDocId,
                updatedAt: serverTimestamp(),
                items: itemsObj
            }, { merge: true });

            renderAuditCards();
        } catch (e) {
            console.error("خطأ أثناء حفظ الصنف:", e);
            alert("حدث خطأ أثناء حفظ الصنف.");
        }
    };

    // حفظ واعتماد جميع الأصناف
    window.approveLoading = async function() {
        try {
            loadStateMap.forEach((val, key) => {
                val.isSaved = true;
            });

            const itemsObj = {};
            loadStateMap.forEach((val, key) => {
                itemsObj[key] = val;
            });

            await setDoc(doc(db, "car_loadings", todayDocId), {
                date: todayDocId,
                updatedAt: serverTimestamp(),
                items: itemsObj
            }, { merge: true });

            alert("تم اعتماد وتأكيد جميع الأصناف بنجاح، وستظهر فوراً على جميع الأجهزة الأخرى!");
        } catch (e) {
            console.error("خطأ أثناء حفظ الاعتماد:", e);
            alert("حدث خطأ أثناء اعتماد الحمولة.");
        }
    };

    loadData();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch((err) => console.log(err));
}
</script>
</body>
</html>
