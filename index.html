<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول النظام - الزيادى لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    
    <style>
        :root { 
            --bg: #060f0a; 
            --accent: #0b5e3d; 
            --accent-light: #148054;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(11, 94, 61, 0.3);
            --text-muted: #a0aec0;
        }
        
        body { 
            background: radial-gradient(circle at center, #0e2217 0%, var(--bg) 100%);
            font-family: 'Cairo', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            color: #fff;
            padding-top: 0;
            transition: padding-top 0.3s ease;
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.4s ease;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 35px 25px;
            border-radius: 24px;
            width: 92%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 15px rgba(11, 94, 61, 0.1);
            text-align: center;
            opacity: 0; 
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }

        .login-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid var(--border-color) !important;
            color: #fff !important;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent-light) !important;
            box-shadow: 0 0 12px rgba(20, 128, 84, 0.3);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(11, 94, 61, 0.3);
        }

        .btn-login:hover { 
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(11, 94, 61, 0.4);
            filter: brightness(1.1);
        }

        .logo-icon { 
            width: 75px;
            height: 75px;
            background: rgba(11, 94, 61, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #2d6a4f;
            font-size: 2.2rem;
            border: 1px solid var(--border-color);
        }

        #errMsg { font-weight: 700; min-height: 22px; font-size: 0.8rem; }

        /* بوب اب السيستم الموحد */
        .custom-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }  
        .custom-popup-box { background: #ffffff; width: 88%; max-width: 350px; padding: 22px; border-radius: 16px; text-align: center; font-family: 'Cairo'; box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #1b2e26; }  
    </style>
</head>
<body>

<!-- ═══ BANNER OFFLINE ═══ -->
<div id="offlineBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#92400e; color:#fef3c7; padding:8px 16px; text-align:center; font-family:'Cairo',sans-serif; font-size:0.8rem; font-weight:700; align-items:center; justify-content:center; gap:8px;">
  <i class="fas fa-wifi" style="opacity:.7"></i>
  <span>أنت تعمل حالياً بدون إنترنت — سيتم التحقق من الكاش المحلي</span>
</div>

<!-- شاشة التحميل الاستهلالية -->
<div id="loader">
    <div class="spinner-border" style="color: var(--accent-light); width: 2.5rem; height: 2.5rem;"></div>
</div>

<!-- كارت الدخول الزجاجي الموحد -->
<div class="login-card" id="loginContent">
    <div class="logo-icon">
        <i class="fas fa-shield-halved"></i>
    </div>
    <h5 class="fw-bold mb-1" style="font-weight: 800; letter-spacing: 0.5px;">الزيادي لزيوت السيارات</h5>
    <p class="small mb-4" style="color: var(--text-muted); font-weight: 600;">بوابة تسجيل الدخول للنظام</p>
    
    <div>
        <input type="text" id="username" class="form-control" placeholder="اسم المستخدم" autocomplete="off">
    </div>
    <div>
        <input type="password" id="password" class="form-control" placeholder="كلمة المرور">
    </div>
    
    <button class="btn-login" id="btnLogin">
        <i class="fas fa-sign-in-alt me-1"></i> دخول النظام
    </button>
    <div id="errMsg" class="text-danger mt-3"></div>
</div>

<!-- نافذة التنبيهات المنبثقة الخاصة بالسيستم الموحد -->
<div id="customGlobalModal" class="custom-popup-overlay" style="display: none;">  
    <div class="custom-popup-box">  
        <div id="customModalIcon" style="width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;"></div>  
        <h6 class="fw-bold mb-2" id="customModalTitle" style="font-size: 0.95rem;">تنبيه النظام</h6>  
        <div id="customModalBody" style="font-size: 0.82rem; color: #4a5568; margin-bottom: 18px; line-height: 1.6;"></div>  
        <div class="d-flex gap-2 justify-content-center" id="customModalActions"></div>  
    </div>  
</div>  

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

    const loader = document.getElementById('loader');
    const loginContent = document.getElementById('loginContent');
    const CACHE_KEY_USERS = 'zaiady_users_credentials_cache';

    // دالة التنبيهات الموحدة للسيستم
    window.showCustomUi = (options) => {  
        const modal = document.getElementById('customGlobalModal');  
        const title = document.getElementById('customModalTitle');  
        const body = document.getElementById('customModalBody');  
        const iconContainer = document.getElementById('customModalIcon');  
        const actions = document.getElementById('customModalActions');  
  
        title.innerText = options.title || "تنبيه النظام";  
        body.innerHTML = options.message || "";  
  
        if(options.icon === "success") {  
            iconContainer.style.background = "#ebf9eb";  
            iconContainer.innerHTML = `<i class="fas fa-check-circle" style="color: #2d6a4f; font-size: 1.4rem;"></i>`;  
        } else if(options.icon === "danger") {  
            iconContainer.style.background = "#fff5f5";  
            iconContainer.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #d90429; font-size: 1.4rem;"></i>`;  
        } else {  
            iconContainer.style.background = "#eef2f5";  
            iconContainer.innerHTML = `<i class="fas fa-info-circle" style="color: #0b5e3d; font-size: 1.4rem;"></i>`;  
        }  
  
        actions.innerHTML = "";  
        const closeBtn = document.createElement('button');  
        closeBtn.className = "btn btn-sm btn-dark px-5 fw-bold";  
        closeBtn.style.fontFamily = "Cairo";  
        closeBtn.innerText = "موافق";  
        closeBtn.onclick = () => {  
            modal.style.display = 'none';  
            if(options.onConfirm) options.onConfirm();  
        };  
        actions.appendChild(closeBtn);  
        modal.style.display = 'flex';  
    };

    // إدارة شريط الإنذار الخاص بالإنترنت
    function showOfflineBanner(show) {
        const banner = document.getElementById('offlineBanner');
        if (show) {
            banner.style.display = 'flex';
            document.body.style.paddingTop = '38px';
        } else {
            banner.style.display = 'none';
            document.body.style.paddingTop = '0';
        }
    }

    window.addEventListener('online',  () => showOfflineBanner(false));
    window.addEventListener('offline', () => showOfflineBanner(true));

    // تهيئة مستخدم افتراضي باسم "user" وتخزينه محلياً لحالات الطوارئ وبدون إنترنت
    async function autoInitializeUser() {
        // حماية محلية أولية للكاش في حال عدم وجود إنترنت تماماً عند التشغيل الأول
        let localUsers = {};
        try {
            localUsers = JSON.parse(localStorage.getItem(CACHE_KEY_USERS)) || {};
        } catch(_) {}

        if (!localUsers["user"]) {
            localUsers["user"] = { pass: "304201", role: "restricted" };
            localStorage.setItem(CACHE_KEY_USERS, JSON.stringify(localUsers));
        }

        if (navigator.onLine) {
            try {
                const targetRef = doc(db, "users", "user");
                const snap = await getDoc(targetRef);
                if (!snap.exists()) {
                    await setDoc(targetRef, { pass: "304201", role: "restricted" });
                }
            } catch (e) { console.error(e); }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        // فحص حالة الإنترنت عند تحميل الصفحة مباشرة
        if (!navigator.onLine) { showOfflineBanner(true); }
        
        autoInitializeUser(); 
        
        const loggedUser = sessionStorage.getItem('isLoggedIn');
        if (loggedUser === 'true') {
            window.location.href = "index1.html";
        } else {
            setTimeout(() => {
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                    loginContent.classList.add('active');
                }, 300);
            }, 500);
        }
    });

    document.getElementById('btnLogin').onclick = async function() {
        const userVal = document.getElementById('username').value.trim();
        const passVal = document.getElementById('password').value.trim();
        const err = document.getElementById('errMsg');
        const btn = this;

        if(!userVal || !passVal) {
            err.innerText = "⚠️ برجاء ملء الحقول المطلوبة أولاً";
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> جاري التحقق...';
        err.innerText = ""; 

        // ══════ أولاً: المعالجة في وضع عدم وجود إنترنت (Offline Mode) ══════
        if (!navigator.onLine) {
            try {
                const localUsers = JSON.parse(localStorage.getItem(CACHE_KEY_USERS)) || {};
                const cachedUser = localUsers[userVal];

                if (cachedUser) {
                    if (String(cachedUser.pass).trim() === String(passVal).trim()) {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('username', userVal);
                        sessionStorage.setItem('role', cachedUser.role || 'restricted'); 
                        window.location.href = "index1.html";
                    } else {
                        err.innerText = "❌ كلمة المرور غير صحيحة (فحص الكاش المحلي)";
                    }
                } else {
                    err.innerText = "❌ اسم المستخدم غير محفوظ في ذاكرة المتصفح للعمل بدون إنترنت";
                }
            } catch (_) {
                err.innerText = "❌ فشل فحص الكاش المحلي أثناء انقطاع الإنترنت";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> دخول النظام';
            }
            return; // إنهاء الدالة لوجود الجهاز أوفلاين
        }

        // ══════ ثانياً: المعالجة في الوضع الطبيعي المتصل (Online Mode) ══════
        try {
            const userRef = doc(db, "users", userVal);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                const userData = userSnap.data();
                if (String(userData.pass).trim() === String(passVal).trim()) {
                    
                    // تحديث الكاش المحلي فوراً لتأمين عملية الدخول القادمة أوفلاين
                    try {
                        let localUsers = JSON.parse(localStorage.getItem(CACHE_KEY_USERS)) || {};
                        localUsers[userVal] = { pass: String(passVal).trim(), role: userData.role || 'restricted' };
                        localStorage.setItem(CACHE_KEY_USERS, JSON.stringify(localUsers));
                    } catch(_) {}

                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('username', userVal);
                    sessionStorage.setItem('role', userData.role || 'restricted'); 
                    window.location.href = "index1.html";
                } else {
                    err.innerText = "❌ كلمة المرور المدخلة غير صحيحة";
                }
            } else {
                err.innerText = "❌ اسم المستخدم غير مسجل بالنظام";
            }
        } catch (e) {
            console.error(e);
            if (e.message && e.message.includes("permission-denied")) {
                window.showCustomUi({ 
                    title: "صلاحيات مرفوضة", 
                    message: "تم رفض الوصول من السيرفر المباشر.\nيرجى مراجعة قواعد الحماية في الفايربيس.", 
                    icon: "danger" 
                });
            } else {
                err.innerText = "📡 فشل الاتصال بالسيرفر. تم تحويلك للتحقق عبر الكاش";
            }
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> دخول النظام';
        }
    }
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
</html>
