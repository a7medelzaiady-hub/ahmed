<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الجرد - شركة الزيادي</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #0b5e3d;
            --accent-light: #0e7a4f;
            --accent-deep: #073e29;
            --header-bg: linear-gradient(135deg, #073e29, #0b5e3d 80%);
            --bg-light: #f8faf9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
            --danger: #e11d48;
            --danger-bg: #fff1f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --warning: #ca8a04;
            --warning-bg: #fef9c3;
            --purple: #7c3aed;
            --purple-bg: #f5f3ff;
            --gold: #b6892f;
            --card-radius: 20px;
            --input-radius: 14px;
            --shadow-sm: 0 4px 12px rgba(11,40,28, 0.03);
            --shadow-md: 0 10px 25px rgba(11,40,28, 0.08);
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            padding-bottom: 80px;
            font-size: 0.88rem;
            -webkit-font-smoothing: antialiased;
        }
        
        .num { 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
            letter-spacing: -0.5px;
        }

        .top-navbar {
            background: var(--header-bg);
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(7, 62, 41, 0.15);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .header-nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .header-actions-group {
            display: flex;
            gap: 8px;
        }
        .header-actions-group .btn, .header-actions-group .nav-link-btn {
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 0.78rem;
            border-radius: 12px;
            padding: 6px 12px;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 38px;
            transition: all 0.2s ease;
        }
        .header-actions-group .btn:active { transform: scale(0.92); }
        .nav-link-btn-home { 
            background: rgba(255, 255, 255, 0.15); 
            color: #fff; 
            width: 38px; 
            height: 38px; 
            padding: 0 !important; 
            font-size: 0.95rem; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
        }
        .nav-link-btn-home:hover { background: rgba(255, 255, 255, 0.25); color: #fff; }
        .nav-link-btn-light { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .nav-link-btn-light:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .nav-link-btn-danger { background: rgba(225, 29, 72, 0.6) !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.2) !important; }
        .nav-link-btn-danger:hover { background: rgba(225, 29, 72, 0.8) !important; }

        .stat-card { 
            background: var(--white); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 14px 8px; 
            text-align: center; 
            height: 100%;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .stat-value { font-size: 1.15rem; font-weight: 800; display: block; margin-top: 4px; }
        .stat-card small { color: var(--text-secondary); font-weight: 800; font-size: 0.72rem; }

        .search-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search-box { 
            background: var(--white) !important; 
            border: 1px solid var(--border) !important; 
            color: var(--text-primary) !important; 
            border-radius: var(--input-radius); 
            padding: 12px 14px;
            font-weight: 700;
            font-size: 0.85rem;
            width: 100%;
        }
        .search-box:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(11, 94, 61, 0.08) !important;
        }
        .btn-add-fast {
            background: var(--gold);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: var(--input-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }
        .btn-add-fast:active { transform: scale(0.92); }
        .btn-add-fast:hover { background: #9e7525; }

        .stock-mobile-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            box-shadow: var(--shadow-sm);
            border-right: 5px solid var(--border);
        }
        .stock-mobile-card.low-stock {
            border-right-color: var(--danger);
            background: linear-gradient(to left, var(--danger-bg), var(--white));
        }
        .stock-mobile-card.in-stock {
            border-right-color: var(--success);
        }
        .stock-mobile-card.zero-stock {
            border-right-color: #94a3b8;
        }
        .card-row-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 8px;
        }
        .card-item-name { font-weight: 800; font-size: 0.95rem; color: var(--text-primary); line-height: 1.4; }
        .card-row-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.78rem;
        }
        .info-box {
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .info-box-full {
            grid-column: span 2;
        }
        .info-box span { display: block; font-weight: 800; margin-top: 2px; }
        
        .qty-badge { 
            background: #f1f5f9; 
            padding: 4px 10px; 
            border-radius: 8px; 
            font-size: 0.74rem; 
            font-weight: 700;
            display: inline-block;
            color: #475569;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .action-touch-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .action-touch-btn:active { transform: scale(0.95); }
        .touch-btn-edit { background: #f0fdf4; color: var(--success); border-color: rgba(22, 163, 74, 0.2); }
        .touch-btn-delete { background: var(--danger-bg); color: var(--danger); border-color: rgba(225, 29, 72, 0.2); }

        .load-more-btn { 
            background: var(--accent); 
            color: white; 
            border: none; 
            font-weight: 800; 
            border-radius: 14px; 
            padding: 12px 30px; 
            font-size: 0.85rem;
            width: 100%;
            transition: all 0.2s ease; 
        }
        .load-more-btn:active { transform: scale(0.98); }
        .load-more-btn:hover { background: var(--accent-light); }

        .desktop-table-container { display: none; }

        @media (min-width: 768px) {
            .desktop-table-container { display: block; }
            .mobile-cards-container { display: none; }
            .load-more-btn { width: auto; }
        }
    </style>
</head>
<body>

<div class="top-navbar">
    <div class="container px-2">
        <div class="header-nav-wrapper">
            <a href="index.html" class="nav-link-btn nav-link-btn-home" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
            
            <h5 class="fw-bold m-0 text-white flex-grow-1 ms-2" style="font-size: 1.05rem;"><i class="fas fa-boxes me-1"></i> قائمة الجرد</h5>
            
            <div class="header-actions-group">
                <button onclick="clearAllInventory()" class="btn btn-danger btn-sm" style="background: rgba(225, 29, 72, 0.6) !important;"><i class="fas fa-exclamation-triangle"></i> تصفير</button>
                <a href="trash.html" class="nav-link-btn nav-link-btn-danger"><i class="fas fa-trash-restore"></i> السلة</a>
                <a href="inventory-menu.html" class="nav-link-btn nav-link-btn-light">رجوع</a>
            </div>
        </div>
    </div>
</div>

<div class="container py-3">
    <div class="row g-2 mb-3">
        <div class="col-12">
            <div class="stat-card">
                <div class="stat-bar" style="background: var(--success);"></div>
                <span class="stat-value text-success num" id="totalValue">0</span>
                <small>إجمالي قيمة بضاعة المخزن (بسعر الشراء)</small>
            </div>
        </div>
        <div class="col-6">
            <div class="stat-card">
                <div class="stat-bar" style="background: var(--accent);"></div>
                <span class="stat-value text-dark num" id="totalItems">0</span>
                <small>عدد الأصناف</small>
            </div>
        </div>
        <div class="col-6">
            <div class="stat-card">
                <div class="stat-bar" style="background: var(--danger);"></div>
                <span class="stat-value text-danger num" id="lowStockCount">0</span>
                <small>أصناف تحت حد الطلب</small>
            </div>
        </div>
    </div>

    <div class="search-wrapper">
        <input type="text" id="searchStock" class="form-control search-box" placeholder="بحث سريع باسم الصنف أو الباركود..." oninput="renderStock()">
        <button class="btn-add-fast" onclick="location.href='add-product.html'" title="إضافة صنف جديد"><i class="fas fa-plus"></i></button>
    </div>

    <div id="mobileCardsContainer" class="mobile-cards-container"></div>

    <div class="desktop-table-container">
        <div style="background: var(--white); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm);">
            <div class="table-responsive">
                <table class="table text-center align-middle m-0" style="color: var(--text-primary);">
                    <thead style="background: #f1f5f9;">
                        <tr>
                            <th class="text-start" style="color: var(--accent-deep); padding: 15px; font-weight: 800;">المنتج</th>
                            <th style="color: var(--accent-deep); font-weight: 800;">الفئة</th>
                            <th style="color: var(--accent-deep); font-weight: 800;">الكمية (كرتونة وقطع)</th>
                            <th style="color: var(--accent-deep); font-weight: 800;">سعر البيع</th>
                            <th style="color: var(--accent-deep); font-weight: 800;">الحالة</th>
                            <th style="color: var(--accent-deep); font-weight: 800;">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="stockTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="loadMoreContainer" class="text-center mt-3 d-none">
        <button class="load-more-btn" onclick="loadMore()">عرض المزيد (+)</button>
        <p class="text-muted mt-2 small" id="loadMoreCounter">يتم عرض 0 من أصل 0 صنف</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, updateDoc, doc, onSnapshot, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }
    let inventoryData = [];
    let displayLimit = 50;

    window.clearAllInventory = async () => {
        const firstConfirm = confirm("⚠️ تحذير: أنت على وشك حذف جميع الأصناف الموجودة في المخزن حالياً ونقلها للسلة. هل أنت متأكد؟");
        if (!firstConfirm) return;

        const secondConfirm = confirm("استنى! هل أنت متأكد فعلاً؟ سيتم مسح " + inventoryData.length + " صنف.");
        if (!secondConfirm) return;

        try {
            const batch = writeBatch(db);
            inventoryData.forEach(item => {
                const itemRef = doc(db, "inventory", item.id);
                batch.update(itemRef, { 
                    isDeleted: true, 
                    deletedAt: serverTimestamp() 
                });
            });

            await batch.commit();
            alert("تم تصفير المخزن بنجاح ونقل جميع الأصناف للسلة.");
        } catch (e) {
            console.error(e);
            alert("حدث خطأ أثناء محاولة التصفير.");
        }
    };

    function listenToInventory() {
        onSnapshot(collection(db, "inventory"), (snap) => {
            inventoryData = [];
            snap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isDeleted !== true) {
                    inventoryData.push({ id: docSnap.id, ...data });
                }
            });
            updateStats();
            renderStock();
        });
    }

    function updateStats() {
        document.getElementById('totalItems').innerText = inventoryData.length;
        let totalVal = 0;
        let low = 0;

        inventoryData.forEach(i => {
            const factor = Number(i.unitFactor) || 1;
            // قراءة مزدوجة لضمان جلب الرصيد سواء كان في totalPcs أو qty
            const currentTotalPcs = Number(i.totalPcs !== undefined && i.totalPcs !== null ? i.totalPcs : (i.qty || 0));
            const minTotalPcs = (Number(i.min) || 0) * factor;

            if (currentTotalPcs <= minTotalPcs) low++;
            totalVal += (currentTotalPcs / factor) * (Number(i.buy) || 0);
        });

        document.getElementById('lowStockCount').innerText = low;
        document.getElementById('totalValue').innerText = Math.round(totalVal).toLocaleString() + " EGP";
    }

    window.renderStock = function(isMore = false) {
        if (!isMore) displayLimit = 50; 
        const term = document.getElementById('searchStock').value.toLowerCase().trim();
        const tbody = document.getElementById('stockTable');
        const mobileContainer = document.getElementById('mobileCardsContainer');
        
        const filtered = inventoryData.filter(i => 
            (i.name && i.name.toLowerCase().includes(term)) || 
            (i.barcode && i.barcode.includes(term))
        );

        filtered.sort((a, b) => {
            const qtyA = Number(a.totalPcs !== undefined && a.totalPcs !== null ? a.totalPcs : (a.qty || 0));
            const qtyB = Number(b.totalPcs !== undefined && b.totalPcs !== null ? b.totalPcs : (b.qty || 0));

            const getGroup = (qty) => {
                if (qty > 0) return 1;
                if (qty < 0) return 2;
                return 3;
            };

            const groupA = getGroup(qtyA);
            const groupB = getGroup(qtyB);

            if (groupA !== groupB) {
                return groupA - groupB; 
            }
            
            return qtyB - qtyA;
        });

        const dataToShow = (term === "") ? filtered.slice(0, displayLimit) : filtered;

        let tableRowsHtml = ''; 
        let mobileCardsHtml = '';

        dataToShow.forEach(item => {
            const factor = Number(item.unitFactor) || 1;
            const totalPcs = Number(item.totalPcs !== undefined && item.totalPcs !== null ? item.totalPcs : (item.qty || 0));
            const boxes = Math.floor(totalPcs / factor);
            const pieces = totalPcs % factor;
            const isLow = totalPcs <= ((Number(item.min) || 0) * factor);
            
            let qtyTextDesktop = '';
            let qtyTextMobile = '';
            
            if (factor > 1) {
                qtyTextDesktop = `<span class="qty-badge">${boxes} كرتونة</span> <span class="qty-badge text-success">${pieces} قطعة</span>`;
                qtyTextMobile = `${boxes} كرتونة | ${pieces} قطعة`;
            } else {
                qtyTextDesktop = `<span class="qty-badge text-success">${totalPcs} قطعة</span>`;
                qtyTextMobile = `${totalPcs} قطعة`;
            }

            let statusBadge = '';
            let borderStyle = '';
            let borderClassMobile = 'zero-stock';

            if (totalPcs > 0) {
                statusBadge = isLow ? '<span class="badge bg-warning text-dark">ناقص (تحت الطلب)</span>' : '<span class="badge bg-success">متوفر</span>';
                borderStyle = isLow ? 'background: rgba(202, 138, 4, 0.05) !important; border-right: 4px solid var(--warning);' : 'border-right: 4px solid var(--success);';
                borderClassMobile = isLow ? 'low-stock' : 'in-stock';
            } else if (totalPcs < 0) {
                statusBadge = '<span class="badge bg-danger">سالب (عجز)</span>';
                borderStyle = 'background: rgba(225, 29, 72, 0.05) !important; border-right: 4px solid var(--danger);';
                borderClassMobile = 'low-stock';
            } else {
                statusBadge = '<span class="badge bg-secondary">منتهي (0)</span>';
                borderStyle = 'background: #f1f5f9 !important; border-right: 4px solid #94a3b8;';
                borderClassMobile = 'zero-stock';
            }

            tableRowsHtml += `
                <tr style="${borderStyle}">
                    <td class="text-start" style="padding: 14px;">
                        <div class="fw-bold text-dark">${item.name}</div>
                        <small class="text-muted" style="font-size:0.72rem">${item.barcode || '---'}</small>
                    </td>
                    <td><span class="badge bg-secondary opacity-75">${item.category || 'عام'}</span></td>
                    <td><div class="d-flex justify-content-center gap-1">${qtyTextDesktop}</div></td>
                    <td class="num" style="color: var(--accent); font-weight:700;">${Number(item.sell).toLocaleString()} EGP</td>
                    <td>${statusBadge}</td>
                    <td>
                        <div class="d-flex gap-2 justify-content-center">
                            <a href="add-product.html?edit=${item.id}" class="btn btn-sm btn-outline-success" style="border-radius:6px;"><i class="fas fa-edit"></i></a>
                            <button onclick="softDeleteItem('${item.id}', '${item.name}')" class="btn btn-sm btn-outline-danger" style="border-radius:6px;"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `;

            mobileCardsHtml += `
                <div class="stock-mobile-card ${borderClassMobile}">
                    <div class="card-row-header">
                        <div>
                            <div class="card-item-name">${item.name}</div>
                            <small class="text-muted num" style="font-size:0.7rem">باركود: ${item.barcode || '---'}</small>
                        </div>
                        <div>
                            ${statusBadge}
                        </div>
                    </div>
                    <div class="card-row-details">
                        <div class="info-box info-box-full">
                            <small class="text-muted d-block" style="font-size:0.65rem">الكمية الحالية في المخزن:</small>
                            <span style="color: var(--accent-light); font-size:0.85rem;">${qtyTextMobile}</span>
                        </div>
                        <div class="info-box">
                            <small class="text-muted d-block" style="font-size:0.65rem">سعر البيع:</small>
                            <span class="num" style="color: var(--accent);">${Number(item.sell).toLocaleString()} EGP</span>
                        </div>
                        <div class="info-box">
                            <small class="text-muted d-block" style="font-size:0.65rem">الفئة:</small>
                            <span style="color: var(--text-secondary);">${item.category || 'عام'}</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <a href="add-product.html?edit=${item.id}" class="action-touch-btn touch-btn-edit"><i class="fas fa-edit"></i> تعديل الصنف</a>
                        <button onclick="softDeleteItem('${item.id}', '${item.name}')" class="action-touch-btn touch-btn-delete"><i class="fas fa-trash"></i> نقل للسلة</button>
                    </div>
                </div>
            `;
        });

        tbody.innerHTML = tableRowsHtml;
        mobileContainer.innerHTML = mobileCardsHtml;

        const loadMoreEl = document.getElementById('loadMoreContainer');
        if (filtered.length > displayLimit && term === "") {
            loadMoreEl.classList.remove('d-none');
            document.getElementById('loadMoreCounter').innerText = `يتم عرض ${displayLimit} من أصل ${filtered.length} صنف`;
        } else {
            loadMoreEl.classList.add('d-none');
        }
    };

    window.loadMore = () => {
        displayLimit += 100;
        renderStock(true);
    };

    window.softDeleteItem = async (id, name) => {
        if(confirm(`هل أنت متأكد من نقل "${name}" إلى سلة المحذوفات؟`)) { 
            try {
                await updateDoc(doc(db, "inventory", id), { 
                    isDeleted: true,
                    deletedAt: serverTimestamp() 
                });
            } catch (e) {
                alert("حدث خطأ أثناء الحذف");
            }
        }
    }

    listenToInventory();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
</html>
