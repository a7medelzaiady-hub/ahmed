<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث كميات المخزن تلقائياً</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2 family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; padding: 30px; }
        .log-container { background: white; border-radius: 15px; padding: 20px; max-height: 400px; overflow-y: auto; border: 1px solid #e2e8f0; }
        .log-item { font-size: 0.9rem; padding: 5px 10px; border-bottom: 1px solid #f1f5f9; }
        .success { color: #10b981; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>

<div class="container max-width-700">
    <div class="card shadow-sm p-4 text-center border-0 style alert-success mb-4" style="border-radius: 20px;">
        <h2 class="fw-bold text-success mb-3">أداة تحديث مخزون الأصناف التلقائية</h2>
        <p class="text-muted">يقوم هذا السكريبت بقراءة الأصناف المستخرجة من الصورة وتحديث كمياتها (`totalPcs`) في الفايربيس بناءً على الـ `unitFactor` الحالي لكل صنف.</p>
        <button id="startBtn" class="btn btn-success btn-lg px-5 fw-bold" style="border-radius: 12px;">ابدأ تحديث قاعدة البيانات الآن</button>
    </div>

    <h5 class="fw-bold mb-2">سجل العمليات المباشر:</h5>
    <div id="log" class="log-container">
        <div class="text-muted text-center">اضغط على الزر بالأعلى لبدء العملية...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // إعدادات الفايربيس الخاصة ببرنامجك
    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

    // البيانات المستخرجة بدقة من جدول الصورة الخاص بك
    const imageData = [
        { name: "باكم صاج", cartons: 0, jerrycans: 25 },
        { name: "بترومين توكتوك", cartons: 7, jerrycans: 7 },
        { name: "شل 1لتر درجه", cartons: 3, jerrycans: 0 },
        { name: "ليبى توك توك", cartons: 1, jerrycans: 4 },
        { name: "بترومين 1 لتر", cartons: 5, jerrycans: 0 },
        { name: "شحم بريفيكس", cartons: 5, jerrycans: 0 },
        { name: "شحم الاهليه 1/2ك اصفر", cartons: 2, jerrycans: 0 },
        { name: "شحم روكت 1/2 كيلو", cartons: 2, jerrycans: 0 },
        { name: "مصر 4 اصلى", cartons: 1, jerrycans: 0 },
        { name: "زيت تروس عادى", cartons: 9, jerrycans: 0 },
        { name: "شحم نفرتيتى", cartons: 14, jerrycans: 0 },
        { name: "صفيحه شحم روكت", cartons: 13, jerrycans: 0 },
        { name: "ديلفاك 5 لتر", cartons: 1, jerrycans: 0 },
        { name: "موبيل 20 اصلى", cartons: 4, jerrycans: 0 },
        { name: "موبيل 5لتر mx", cartons: -1, jerrycans: 0 },
        { name: "موبيل ابيض 4 اصلى", cartons: -1, jerrycans: 3 },
        { name: "موبيل 1 لتر درجه", cartons: 13, jerrycans: 8 },
        { name: "مصر 16 درجه", cartons: 2, jerrycans: 0 },
        { name: "فرامل شعبى", cartons: 26, jerrycans: 3 },
        { name: "فورما كبير", cartons: 1, jerrycans: 0 },
        { name: "موديل 1 لتر", cartons: 1, jerrycans: 3 },
        { name: "براند تروس 140", cartons: 1, jerrycans: 0 },
        { name: "فورا صغير", cartons: 5, jerrycans: 12 },
        { name: "شيكارتون كبير", cartons: 10, jerrycans: 0 },
        { name: "برينت 20 لتر", cartons: 93, jerrycans: 0 },
        { name: "شيكارتون صغير", cartons: 5, jerrycans: 0 },
        { name: "فالى توك توك", cartons: 5, jerrycans: 0 },
        { name: "واير دبرياج", cartons: 200, jerrycans: 0 },
        { name: "واير نقل", cartons: 101, jerrycans: 0 },
        { name: "جوان فلتر زيت", cartons: 100, jerrycans: 0 },
        { name: "فلتر زيت 2007", cartons: 10, jerrycans: 0 },
        { name: "بنز كوبلن", cartons: 40, jerrycans: 0 },
        { name: "حوايه شكمان صغيره", cartons: 2, jerrycans: 0 },
        { name: "قطاش بطاريه صغير", cartons: 20, jerrycans: 0 },
        { name: "جلد صداد", cartons: 4, jerrycans: 0 },
        { name: "اكس امامى فروك", cartons: 4, jerrycans: 0 },
        { name: "كيس افيز 30سم", cartons: 8, jerrycans: 0 },
        { name: "امير", cartons: 9, jerrycans: 0 },
        { name: "اكس خلفى 2011", cartons: 1, jerrycans: 0 },
        { name: "اولسيل كارونه", cartons: 1, jerrycans: 0 },
        { name: "جلد خزنه عمومى", cartons: 16, jerrycans: 0 },
        { name: "جلد خزنه خلفى", cartons: 8, jerrycans: 0 },
        { name: "لجلاش فرامل", cartons: 5, jerrycans: 0 },
        { name: "جراب نقل 2011", cartons: 4, jerrycans: 0 },
        { name: "كوبايه 2014", cartons: 7, jerrycans: 0 },
        { name: "نص كتله", cartons: 2, jerrycans: 0 },
        { name: "بوجيه صينى 2007", cartons: 4, jerrycans: 0.8 },
        { name: "كتله كامله", cartons: 3, jerrycans: 0 },
        { name: "بليه 6204 صينى", cartons: 10, jerrycans: 0 },
        { name: "فلتر تويوتا 101", cartons: 4, jerrycans: 0 },
        { name: "فلتر زيت ديمكس تايلاندى", cartons: 9, jerrycans: 0 },
        { name: "فلتر هيونداى", cartons: 9, jerrycans: 0 },
        { name: "فلتر 208", cartons: 2, jerrycans: 0 },
        { name: "فلتر زيت ديمكس الفيل", cartons: 1, jerrycans: 0 },
        { name: "مسامير", cartons: 67, jerrycans: 0.44 },
        { name: "مسمار 8", cartons: -2, jerrycans: 0 },
        { name: "ورد", cartons: 26, jerrycans: 0.2 }
    ];

    document.getElementById('startBtn').addEventListener('click', async () => {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = '';
        document.getElementById('startBtn').disabled = true;

        for (const item of imageData) {
            try {
                // البحث عن الصنف بالاسم داخل مجموعة inventory
                const q = query(collection(db, "inventory"), where("name", "==", item.name));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    // الصنف موجود بالفعل -> نقوم بتحديث كميته بالتناسب مع الـ unitFactor الخاص به لكي تظهر الكراتين والجراكن صحيحة
                    querySnapshot.forEach(async (itemDoc) => {
                        const docData = itemDoc.data();
                        const factor = Number(docData.unitFactor) || 1;
                        
                        // معادلة حساب إجمالي القطع ليتوافق مع برنامجك الحالي
                        const calculatedTotal = (Number(item.cartons) * factor) + Number(item.jerrycans);

                        await updateDoc(doc(db, "inventory", itemDoc.id), {
                            totalPcs: calculatedTotal,
                            isDeleted: false
                        });

                        logDiv.innerHTML += `<div class="log-item success">✔ تم تحديث الصنف <b>[${item.name}]</b> -> إجمالي القطع الجديد: ${calculatedTotal} (بناءً على معامل تحويل ${factor})</div>`;
                        logDiv.scrollTop = logDiv.scrollHeight;
                    });
                } else {
                    // الصنف غير موجود في البرنامج -> نقوم بإنشائه كصنف جديد بمعامل افتراضي = 1
                    const defaultFactor = 1; 
                    const calculatedTotal = (Number(item.cartons) * defaultFactor) + Number(item.jerrycans);
                    
                    await addDoc(collection(db, "inventory"), {
                        name: item.name,
                        barcode: "",
                        sell: 0,
                        cost: 0,
                        unitFactor: defaultFactor,
                        totalPcs: calculatedTotal,
                        min: 0,
                        isDeleted: false
                    });

                    logDiv.innerHTML += `<div class="log-item info">➕ الصنف <b>[${item.name}]</b> غير موجود، تم إنشاؤه جديداً بالكمية المطلوبة.</div>`;
                    logDiv.scrollTop = logDiv.scrollHeight;
                }
            } catch (err) {
                logDiv.innerHTML += `<div class="log-item text-danger">❌ خطأ أثناء معالجة الصنف [${item.name}]: ${err.message}</div>`;
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        }

        logDiv.innerHTML += `<div class="text-center fw-bold text-primary mt-3">🎉 اكتملت عملية التحديث بنجاح! يمكنك الآن فتح برنامجك الرئيسي ومراجعة الأرصدة.</div>`;
        document.getElementById('startBtn').disabled = false;
    });
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
</html>
