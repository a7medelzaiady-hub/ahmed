<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
let db;
try {
    db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
    });
} catch (e) {
    db = getFirestore(app);
}

let groupedItems = [];

const today = new Date();
const offset = today.getTimezoneOffset();
const localToday = new Date(today.getTime() - (offset * 60 * 1000));
const defaultDateStr = localToday.toISOString().split('T')[0];
document.getElementById('selectedDate').value = defaultDateStr;

function getUnitName(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('قطعة') || n.includes('قطعه')) return 'قطعة';
  if (n.includes('كرتونة') || n.includes('كرتونه')) return 'كرتونة';
  return 'جركن';
}

function cleanItemName(str) {
  if (!str) return "";
  return str.trim()
            .toLowerCase()
            .replace(/[\u064B-\u0652]/g, '') // إزالة التشكيل
            .replace(/\s+/g, ' ')
            .replace(/[أإآ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي');
}

function isCarton(item) {
  const u = (item.unit || "").trim().toLowerCase();
  if (u === "box" || u === "carton" || u === "كرتونة" || u === "كرتونه") return true;
  if (u === "pcs" || u === "قطعة" || u === "جركن") return false;
  const un = (item.unitName || "").trim().toLowerCase();
  return un === "كرتونة" || un === "كرتونه";
}

function formatQuantityDetailed(totalPcs, capacity, unit) {
  totalPcs = parseInt(totalPcs) || 0;
  capacity = parseInt(capacity) || 1;
  
  if (totalPcs === 0) return `0 ${unit}`;
  
  const isNegative = totalPcs < 0;
  const absPcs = Math.abs(totalPcs);
  
  let result = '';
  if (capacity <= 1) { 
    result = `${absPcs} ${unit}`; 
  } else {
    const cartons = Math.floor(absPcs / capacity);
    const loose = absPcs % capacity;
    
    if (cartons > 0 && loose > 0) { 
      result = `${cartons} كرتونة و ${loose} ${unit}`; 
    } else if (cartons > 0) { 
      result = `${cartons} كرتونة`; 
    } else { 
      result = `${loose} ${unit}`; 
    }
  }
  
  return isNegative ? `-${result}` : result;
}

function formatOrderDateRelativeOnly(dateVal) {
  if (!dateVal) return '';
  try {
    let d;
    if (typeof dateVal.toDate === 'function') {
      d = dateVal.toDate();
    } else if (dateVal.seconds) {
      d = new Date(dateVal.seconds * 1000);
    } else {
      d = new Date(dateVal);
    }
    if (isNaN(d.getTime())) return String(dateVal);

    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const targetStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    
    const diffTime = todayStart.getTime() - targetStart.getTime();
    const diffDays = Math.round(diffTime / (1000 * 3600 * 24));

    if (diffDays === 0) return 'اليوم';
    if (diffDays === 1) return 'أمس';
    if (diffDays === 2) return 'منذ يومين';
    if (diffDays > 2 && diffDays <= 10) return `منذ ${diffDays} أيام`;
    if (diffDays > 10) return `منذ ${diffDays} يوم`;
    if (diffDays < 0) return 'غداً';
    return '';
  } catch(e) {
    return String(dateVal);
  }
}

async function loadAndCalculateData() {
  const container = document.getElementById('summaryList');
  container.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="color: #94a3b8; font-size: 0.78rem; font-weight: 700;">جاري احتساب أرصدة المخزن الحية والمطابقة...</p>
    </div>`;

  try {
    const targetDate = document.getElementById('selectedDate').value || defaultDateStr;

    // 1. حمولة العربية المخزنة محلياً
    const loadedInSession = JSON.parse(localStorage.getItem('loadedInSession_' + targetDate) || '{}');
    const cartItems = JSON.parse(localStorage.getItem('cartItems_' + targetDate) || '{}');

    // 2. تطبيق نفس آلية جلب رصيد المخزن المباشر والحقيقي من ملف inventory.html
    const [invoicesSnap, supplierSnap, inventorySnap, transSnap] = await Promise.all([
        getDocs(collection(db, "invoices")),
        getDocs(collection(db, "supplier_transactions")),
        getDocs(collection(db, "inventory")),
        getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance")))
    ]);

    let factorsMap = {};
    let namesMap = {};
    const inventoryMap = {};
    const nameToInventoryMap = {};

    inventorySnap.forEach(d => {
        const data = d.data();
        if (!data.isDeleted) {
            const rawName = (data.name || '').trim();
            const cleanedKey = cleanItemName(rawName);
            const factor = Math.max(1, Number(data.unitFactor || data.pcsPerCarton || data.factor || data.cartonSize) || 1);
            
            factorsMap[d.id] = factor;
            if (rawName) namesMap[rawName] = d.id;

            const itemObj = {
                id: d.id,
                name: rawName,
                capacity: factor,
                unit: data.unit || '',
                openingTotalPcs: data.openingTotalPcs,
                openingQty: data.openingQty,
                calculatedRealPcs: 0
            };

            inventoryMap[d.id] = itemObj;
            nameToInventoryMap[cleanedKey] = itemObj;
        }
    });

    let salesMap = {};
    let purchasesMap = {};
    let openingMap = {};

    transSnap.forEach(docSnap => {
        const data = docSnap.data();
        if (data.productId) {
            openingMap[data.productId] = (openingMap[data.productId] || 0) + (Number(data.quantityPcs) || 0);
        }
    });

    // احتساب حركة المبيعات بالقطع
    invoicesSnap.forEach(docSnap => {
        const data = docSnap.data();
        data.items?.forEach(item => {
            const id = item.stockId || namesMap[item.name?.trim()];
            if (id) {
                if (!salesMap[id]) salesMap[id] = 0;
                const factor = factorsMap[id] || 1;
                let rawQty = Number(item.qty) || 0;
                let pcs = (item.unit === 'box' || item.isCarton === true) ? (rawQty * factor) : rawQty;
                
                if (item.isReturn) {
                    salesMap[id] -= pcs;
                } else {
                    salesMap[id] += pcs;
                }
            }
        });
    });

    // احتساب حركة المشتريات بالقطع
    supplierSnap.forEach(docSnap => {
        const data = docSnap.data();
        data.items?.forEach(item => {
            const id = item.stockId || namesMap[item.name?.trim()];
            if (id) {
                if (!purchasesMap[id]) purchasesMap[id] = 0;
                const factor = factorsMap[id] || 1;
                const isReturn = Number(item.returnQty) > 0 || item.isReturn === true;
                let rawQty = isReturn ? Number(item.returnQty || item.qty) : Number(item.qty);
                let pcs = (item.unitName === 'كرتونة' || item.isCarton !== false) ? (rawQty * factor) : rawQty;

                if (isReturn) {
                    purchasesMap[id] -= pcs;
                } else {
                    purchasesMap[id] += pcs;
                }
            }
        });
    });

    // بناء الأرصدة الحقيقية الصريحة للأصناف
    Object.keys(inventoryMap).forEach(id => {
        const item = inventoryMap[id];
        const factor = item.capacity;
        
        let openingTotalPcs = 0;
        if (item.openingTotalPcs !== undefined && item.openingTotalPcs !== null) {
            openingTotalPcs = Number(item.openingTotalPcs);
        } else if (item.openingQty !== undefined && item.openingQty !== null) {
            openingTotalPcs = Math.round(Number(item.openingQty) * factor);
        } else if (openingMap[id]) {
            openingTotalPcs = openingMap[id];
        }

        const salesPcs = salesMap[id] || 0;
        const purchasesPcs = purchasesMap[id] || 0;
        
        // المعادلة الرسمية لرصيد المخزن المباشر
        item.calculatedRealPcs = openingTotalPcs + purchasesPcs - salesPcs;
    });

    // 3. جلب طلبات العملاء المعلقة ومقاطعتها مع المخزن
    const ordersSnap = await getDocs(query(collection(db, "orders"), where("status", "==", "pending")));

    const requiredMap = {};
    ordersSnap.forEach(docSnap => {
      const order = docSnap.data();
      const clientName = order.clientName || order.customerName || 'عميل غير محدد';
      const orderNum = order.orderNo || order.id || docSnap.id;
      const orderDateRelative = formatOrderDateRelativeOnly(order.createdAt || order.date || order.timestamp);

      if (order.items && Array.isArray(order.items)) {
        order.items.forEach(item => {
          const rawName = (item.name || 'صنف غير معروف').trim();
          const cleanedKey = cleanItemName(rawName);
          const rawQty = Number(item.quantity || item.qty || 0);

          const invMatch = nameToInventoryMap[cleanedKey];
          const cap = invMatch ? invMatch.capacity : (Number(item.unitFactor) || 1);
          const isItemCarton = isCarton(item);

          const totalPcs = isItemCarton ? (rawQty * cap) : rawQty;

          if (!requiredMap[cleanedKey]) {
            requiredMap[cleanedKey] = {
              displayName: rawName,
              requiredPcs: 0,
              clientDetails: []
            };
          }
          requiredMap[cleanedKey].requiredPcs += totalPcs;
          requiredMap[cleanedKey].clientDetails.push({
            clientName: clientName,
            orderNum: orderNum,
            orderDate: orderDateRelative,
            pcs: totalPcs
          });
        });
      }
    });

    // 4. تجميع المفاتيح وعرض النتائج
    const itemKeys = new Set();
    Object.keys(loadedInSession).forEach(id => itemKeys.add(id));

    Object.keys(requiredMap).forEach(cleanedKey => {
      const matched = nameToInventoryMap[cleanedKey];
      if (matched) {
        itemKeys.add(matched.id);
      }
    });

    groupedItems = Array.from(itemKeys).map(id => {
      const invItem = inventoryMap[id] || { 
        name: cartItems[id]?.name || 'صنف غير معروف', 
        capacity: cartItems[id]?.capacity || 1,
        calculatedRealPcs: 0
      };
      const sess = loadedInSession[id] || { cartons: 0, loose: 0 };
      
      const loadedPcs = (parseFloat(sess.cartons || 0) * invItem.capacity) + parseInt(sess.loose || 0);
      const cleanedKey = cleanItemName(invItem.name);
      const reqObj = requiredMap[cleanedKey];
      const requiredPcs = reqObj ? reqObj.requiredPcs : 0;
      const clientDetails = reqObj ? reqObj.clientDetails : [];
      const stockPcs = invItem.calculatedRealPcs;
      
      return {
        id: id,
        name: invItem.name,
        capacity: invItem.capacity,
        unit: getUnitName(invItem.name),
        loadedPcs: loadedPcs,
        stockPcs: stockPcs,
        requiredPcs: requiredPcs,
        carDiffPcs: loadedPcs - requiredPcs,
        stockDiffPcs: stockPcs - requiredPcs,
        clientDetails: clientDetails
      };
    });

    groupedItems.sort((a, b) => a.carDiffPcs - b.carDiffPcs);

    document.getElementById('totalTypesBadge').innerText = groupedItems.length;
    renderSummary();

  } catch (e) {
    console.error("خطأ أثناء المطابقة والجلب:", e);
    container.innerHTML = `<div class="empty-state"><h6>حدث خطأ أثناء تحميل حسابات المخزن</h6></div>`;
  }
}

window.loadAndCalculateData = loadAndCalculateData;
window.filterSummary = () => renderSummary();

function renderSummary() {
  const term = cleanItemName(document.getElementById('searchInput').value || '');
  const container = document.getElementById('summaryList');

  let filtered = groupedItems.filter(item => cleanItemName(item.name).includes(term));

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><h6>لا توجد أصناف مطابقة</h6></div>`;
    return;
  }

  let html = '';
  filtered.forEach(item => {
    const requiredText = formatQuantityDetailed(item.requiredPcs, item.capacity, item.unit);
    
    const loadedText = formatQuantityDetailed(item.loadedPcs, item.capacity, item.unit);
    const carDiffText = formatQuantityDetailed(Math.abs(item.carDiffPcs), item.capacity, item.unit);
    let carStatusTag = '';
    if (item.carDiffPcs > 0) {
      carStatusTag = `<span class="status-tag surplus"><i class="fas fa-plus-circle"></i> فائض بالعربية: ${carDiffText}</span>`;
    } else if (item.carDiffPcs < 0) {
      carStatusTag = `<span class="status-tag deficit"><i class="fas fa-minus-circle"></i> عجز بالعربية: ${carDiffText}</span>`;
    } else {
      carStatusTag = `<span class="status-tag exact"><i class="fas fa-check"></i> مطابقة بالعربية</span>`;
    }

    const stockText = formatQuantityDetailed(item.stockPcs, item.capacity, item.unit);
    const stockDiffText = formatQuantityDetailed(Math.abs(item.stockDiffPcs), item.capacity, item.unit);
    let stockStatusTag = '';
    if (item.stockDiffPcs > 0) {
      stockStatusTag = `<span class="status-tag surplus"><i class="fas fa-plus-circle"></i> فائض بالمخزن: ${stockDiffText}</span>`;
    } else if (item.stockDiffPcs < 0) {
      stockStatusTag = `<span class="status-tag deficit"><i class="fas fa-minus-circle"></i> عجز بالمخزن: ${stockDiffText}</span>`;
    } else {
      stockStatusTag = `<span class="status-tag exact"><i class="fas fa-check"></i> مطابقة بالمخزن</span>`;
    }

    html += `
      <div class="item-summary-card" onclick="openClientModal('${item.id}')">
        <div class="item-header">
          <div class="item-title">
            <i class="fas fa-box-archive" style="color: var(--brand);"></i>
            <span>${item.name}</span>
          </div>
          <div class="total-required-badge">
            مطلوب: ${requiredText}
          </div>
        </div>
        
        <div class="stock-comparison-block">
          <div class="comparison-box">
            <div class="label-val">
              <span>🚚 المحمل:</span>
              <b>${loadedText}</b>
            </div>
            ${carStatusTag}
          </div>

          <div class="comparison-box">
            <div class="label-val">
              <span>🏭 المخزن:</span>
              <b>${stockText}</b>
            </div>
            ${stockStatusTag}
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

window.openClientModal = function(itemId) {
  const item = groupedItems.find(i => i.id === itemId);
  if (!item) return;

  document.getElementById('modalItemTitle').innerHTML = `<i class="fas fa-users" style="color: var(--brand);"></i> طلبات: ${item.name}`;
  const listContainer = document.getElementById('modalClientsList');

  if (!item.clientDetails || !item.clientDetails.length) {
    listContainer.innerHTML = `<div style="text-align:center; padding:30px 10px; color:#94a3b8; font-size:0.8rem; font-weight:700;">لا توجد طلبات معلقة لهذا الصنف</div>`;
  } else {
    let clientsHTML = '';
    item.clientDetails.forEach(c => {
      const qtyTxt = formatQuantityDetailed(c.pcs, item.capacity, item.unit);
      clientsHTML += `
        <div class="client-item-row">
          <div class="client-info">
            <div class="client-name-wrap">
              <span class="client-name">${c.clientName}</span>
              ${c.orderDate ? `<span class="date-badge-inline">${c.orderDate}</span>` : ''}
            </div>
            ${c.orderNum ? `<div class="client-order-num">رقم الطلب: #${c.orderNum}</div>` : ''}
          </div>
          <div class="client-qty-badge">${qtyTxt}</div>
        </div>
      `;
    });
    listContainer.innerHTML = clientsHTML;
  }

  document.getElementById('clientDetailsModal').classList.add('open');
};

window.closeClientModal = function() {
  document.getElementById('clientDetailsModal').classList.remove('open');
};

loadAndCalculateData();
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
