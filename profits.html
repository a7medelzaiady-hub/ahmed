<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرباح الأصناف - شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641;
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 90px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }

        .top-nav .nav-icon {
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            color: white;
            text-decoration: none;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .filter-section {
            padding: 18px 20px 5px;
        }
        .filter-card {
            background: white;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        .filter-row { display: flex; gap: 10px; align-items: center; }
        .filter-row .form-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .filter-row input[type="date"] {
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            width: 100%;
        }
        .filter-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-apply {
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
            flex: 1;
        }
        .btn-clear {
            background: #f1f5f9;
            color: var(--text-muted);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .search-section {
            padding: 15px 20px 5px;
        }
        .search-wrapper { position: relative; }
        .search-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
        }
        .search-input {
            width: 100%;
            padding: 14px 40px 14px 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .search-input:focus { border-color: var(--accent-green); }

        .summary-strip {
            margin: 15px 15px 5px;
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            border-radius: 18px;
            padding: 16px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 16px rgba(11,102,65,0.2);
        }
        .summary-strip .label { font-size: 0.75rem; opacity: 0.85; }
        .summary-strip .value { font-size: 1.15rem; font-weight: 800; }
        .summary-strip .sub-val { font-size: 0.85rem; opacity: 0.9; margin-top: 2px; }

        .item-card {
            padding: 16px 20px;
            background: white;
            border-radius: 20px;
            margin: 0 15px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .item-name { font-weight: 800; font-size: 0.95rem; margin-bottom: 3px; color: var(--text-dark); line-height: 1.3; }
        .item-barcode { font-size: 0.75rem; color: var(--text-muted); }
        .item-qty-sold { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

        .profit-box { text-align: right; }
        .profit-value {
            font-weight: 800;
            font-size: 1.02rem;
            color: var(--primary-green);
        }
        .profit-current {
            font-weight: 700;
            font-size: 0.82rem;
            color: #0284c7;
            margin-top: 2px;
        }
        .profit-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; }
        .unit-profit-tag { font-size: 0.68rem; color: var(--accent-green); font-weight: 700; display: inline-block; margin-right: 4px; }

        .btn-details {
            background: #f0fdf4;
            color: var(--primary-green);
            border: 1px solid #dcfce7;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 0.8rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-details:active { transform: scale(0.95); }

        .bottom-summary {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 18px 20px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border-color);
            color: var(--primary-green);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="nav-icon" title="الصفحة الرئيسية">
            <i class="fas fa-home"></i>
        </a>
        <i class="fas fa-sync-alt nav-icon" onclick="forceRefreshData()" title="تحديث البيانات"></i>
    </div>
    <span class="fw-bold">أرباح الأصناف</span>
    <i class="fas fa-chevron-left nav-icon" onclick="history.back()" title="رجوع"></i>
</div>

<div class="filter-section">
    <div class="filter-card">
        <div class="filter-row">
            <div style="flex:1">
                <div class="form-label">من تاريخ</div>
                <input type="date" id="fromDate">
            </div>
            <div style="flex:1">
                <div class="form-label">إلى تاريخ</div>
                <input type="date" id="toDate">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn-apply" onclick="renderItems()"><i class="fas fa-filter me-1"></i> تطبيق الفلتر</button>
            <button class="btn-clear" onclick="clearFilter()">مسح</button>
        </div>
    </div>
</div>

<div class="search-section">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج أو باركود..." oninput="renderItems()">
    </div>
</div>

<div class="summary-strip">
    <div>
        <div class="label">إجمالي الأرباح (متوسط التكلفة المتحرك)</div>
        <div class="value" id="grandTotalProfit">0.00</div>
        <div class="sub-val" id="grandTotalProfitCurrent">إجمالي الأرباح (سعر الشراء الحالي): 0.00</div>
    </div>
    <i class="fas fa-chart-line fa-lg"></i>
</div>

<div id="itemsContainer">
    <div class="text-center text-muted mt-5 fw-bold">
        <div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري جلب البيانات السريعة...
    </div>
</div>

<div class="bottom-summary">
    <i class="fas fa-boxes me-2"></i> عدد الأصناف المباعة: <span id="totalCount" class="ms-2">0</span>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
    });

    function getDocDate(data) {
        if (data.timestamp && data.timestamp.toDate) return data.timestamp.toDate();
        if (data.timestamp) {
            const d = new Date(data.timestamp);
            if (!isNaN(d)) return d;
        }
        return new Date(0);
    }

    let productsMap = {}; 
    let namesMap = {};
    let saleLines = {}; 

    window.forceRefreshData = function() {
        localStorage.removeItem("cache_profits_inventory");
        window.location.reload(true);
    };

    async function loadData() {
        try {
            // 1. استخدام التخزين المحلي للأصناف للحد من استهلاك البيانات
            let cachedInventory = localStorage.getItem("cache_profits_inventory");
            if (cachedInventory) {
                const parsed = JSON.parse(cachedInventory);
                parsed.forEach(p => {
                    productsMap[p.id] = p;
                    if (p.name) namesMap[p.name.trim()] = p.id;
                });
            } else {
                const inventorySnap = await getDocs(collection(db, "inventory"));
                let listToCache = [];
                inventorySnap.forEach(d => {
                    const data = d.data();
                    if (data.isDeleted) return;
                    const factor = Math.max(1, Number(data.unitFactor || data.factor || data.pcsPerCarton) || 1);
                    const rawBuy = Number(data.buy) || 0;
                    const currentBuyUnit = rawBuy > 0 ? (rawBuy / factor) : 0;

                    const pObj = {
                        id: d.id,
                        name: data.name || 'بدون اسم',
                        barcode: data.barcode || '---',
                        factor,
                        fallbackBuy: currentBuyUnit,
                        currentBuy: currentBuyUnit,
                        raw: data
                    };
                    productsMap[d.id] = pObj;
                    listToCache.push(pObj);
                    if (data.name) namesMap[data.name.trim()] = d.id;
                });
                try { localStorage.setItem("cache_profits_inventory", JSON.stringify(listToCache)); } catch(e){}
            }

            // 2. تحميل الفواتير والمعاملات بسرعة بالتوازي
            const [invoicesSnap, supplierSnap, openingSnap] = await Promise.all([
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions")),
                getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance")))
            ]);

            let openingQtyMap = {};
            let openingValueMap = {};
            openingSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (!data.productId) return;
                const qty = Number(data.quantityPcs) || 0;
                let value = (data.totalAmount !== undefined && data.totalAmount !== null) ? Number(data.totalAmount) || 0 : (Number(data.unitPrice) || 0) * qty;
                openingQtyMap[data.productId] = (openingQtyMap[data.productId] || 0) + qty;
                openingValueMap[data.productId] = (openingValueMap[data.productId] || 0) + value;
            });

            let events = {};
            function pushEvent(id, ev) {
                if (!events[id]) events[id] = [];
                events[id].push(ev);
            }

            // الرصيد الافتتاحي
            Object.values(productsMap).forEach(p => {
                let openingPcs = 0;
                let openingPrice = p.currentBuy;

                if (openingQtyMap[p.id]) {
                    openingPcs = openingQtyMap[p.id];
                    if (openingQtyMap[p.id] > 0 && openingValueMap[p.id] > 0) {
                        openingPrice = openingValueMap[p.id] / openingQtyMap[p.id];
                    }
                } else if (p.raw && p.raw.openingTotalPcs !== undefined && p.raw.openingTotalPcs !== null) {
                    openingPcs = Number(p.raw.openingTotalPcs);
                } else if (p.raw && p.raw.openingQty !== undefined && p.raw.openingQty !== null) {
                    openingPcs = Math.round(Number(p.raw.openingQty) * p.factor);
                }

                if (openingPcs) {
                    pushEvent(p.id, { type: 'purchase', date: new Date(0), qty: openingPcs, price: openingPrice });
                }
            });

            // مشتريات التوريد
            supplierSnap.forEach(docSnap => {
                const data = docSnap.data();
                const date = getDocDate(data);
                data.items?.forEach(item => {
                    const id = item.stockId || namesMap[item.name?.trim()];
                    if (!id || !productsMap[id]) return;
                    const factor = Math.max(1, Number(item.unitFactor) || 1);
                    let pcs = item.totalPcs !== undefined && item.totalPcs !== null ? Number(item.totalPcs) : (Number(item.qty) || 0) * factor;
                    
                    let itemBuy = Number(item.buy) || 0;
                    let buyPrice = itemBuy > 0 ? (itemBuy / factor) : productsMap[id].currentBuy;

                    const isReturn = item.isReturn === true || Number(item.returnQty) > 0;
                    if (isReturn) pcs = -Math.abs(pcs);
                    pushEvent(id, { type: 'purchase', date, qty: pcs, price: buyPrice });
                });
            });

            // مبيعات
            invoicesSnap.forEach(docSnap => {
                const data = docSnap.data();
                const date = getDocDate(data);
                data.items?.forEach(item => {
                    const id = item.stockId || namesMap[item.name?.trim()];
                    if (!id || !productsMap[id]) return;
                    const factor = Math.max(1, Number(item.unitFactor) || 1);
                    let pcs = item.totalPcs !== undefined && item.totalPcs !== null ? Number(item.totalPcs) : (Number(item.qty) || 0) * factor;
                    let revenue = (Number(item.price) || 0) * (Number(item.qty) || 0);
                    if (item.isReturn) { pcs = -pcs; revenue = -revenue; }
                    pushEvent(id, { type: 'sale', date, qty: pcs, revenue });
                });
            });

            // محاكاة حساب المتوسط والأرباح
            Object.keys(events).forEach(id => {
                const list = events[id].slice().sort((a, b) => {
                    const timeA = a.date ? a.date.getTime() : 0;
                    const timeB = b.date ? b.date.getTime() : 0;
                    const dateA_str = a.date ? a.date.toISOString().slice(0, 10) : '';
                    const dateB_str = b.date ? b.date.toISOString().slice(0, 10) : '';

                    if (dateA_str === dateB_str && a.type !== b.type) {
                        return a.type === 'purchase' ? -1 : 1;
                    }
                    return timeA - timeB;
                });

                let runQty = 0, runAvg = 0;
                saleLines[id] = [];
                
                let lastP = list.filter(e => e.type === 'purchase' && e.price > 0).slice(-1)[0];
                let currentBuy = (productsMap[id].currentBuy > 0) ? productsMap[id].currentBuy : (lastP ? lastP.price : 0);

                list.forEach(ev => {
                    if (ev.type === 'purchase') {
                        if (ev.qty > 0) {
                            const newQty = runQty + ev.qty;
                            runAvg = newQty > 0 ? (runQty * runAvg + ev.qty * ev.price) / newQty : 0;
                            runQty = newQty;
                        } else {
                            runQty = Math.max(0, runQty + ev.qty);
                        }
                    } else {
                        let effectiveCostUnit = runAvg > 0 ? runAvg : currentBuy;

                        const costAvg = effectiveCostUnit * ev.qty;
                        const profitAvg = ev.revenue - costAvg;

                        const costCurrent = currentBuy * ev.qty;
                        const profitCurrent = ev.revenue - costCurrent;

                        runQty -= ev.qty;
                        saleLines[id].push({ 
                            date: ev.date, 
                            qty: ev.qty, 
                            revenue: ev.revenue, 
                            costAvg, 
                            profitAvg, 
                            costCurrent, 
                            profitCurrent 
                        });
                    }
                });
            });

            renderItems();
        } catch (e) {
            console.error("خطأ في تجميع بيانات الأرباح:", e);
            document.getElementById('itemsContainer').innerHTML = '<div class="text-center text-danger mt-5 fw-bold">حدث خطأ أثناء تحميل البيانات</div>';
        }
    }

    window.clearFilter = function() {
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        renderItems();
    };

    window.renderItems = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const fromVal = document.getElementById('fromDate').value;
        const toVal = document.getElementById('toDate').value;
        const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
        const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

        let profitAvgMap = {};
        let profitCurrentMap = {};
        let qtyByProduct = {};

        Object.keys(saleLines).forEach(productId => {
            saleLines[productId].forEach(line => {
                if (fromDate && (!line.date || line.date < fromDate)) return;
                if (toDate && (!line.date || line.date > toDate)) return;
                profitAvgMap[productId] = (profitAvgMap[productId] || 0) + line.profitAvg;
                profitCurrentMap[productId] = (profitCurrentMap[productId] || 0) + line.profitCurrent;
                qtyByProduct[productId] = (qtyByProduct[productId] || 0) + line.qty;
            });
        });

        let list = Object.keys(productsMap).map(id => ({
            ...productsMap[id],
            profitAvg: profitAvgMap[id] || 0,
            profitCurrent: profitCurrentMap[id] || 0,
            qtySold: qtyByProduct[id] || 0
        }));

        if (term) {
            list = list.filter(p => p.name.toLowerCase().includes(term) || String(p.barcode).includes(term));
        }

        list = list.filter(p => qtyByProduct[p.id] !== undefined);
        list.sort((a, b) => b.profitAvg - a.profitAvg);

        const container = document.getElementById('itemsContainer');
        let grandAvg = 0;
        let grandCurrent = 0;
        let html = '';

        list.forEach(p => {
            grandAvg += p.profitAvg;
            grandCurrent += p.profitCurrent;

            // حساب ربح القطعة الواحدة
            const unitProfitAvg = p.qtySold > 0 ? (p.profitAvg / p.qtySold) : 0;
            const unitProfitCurr = p.qtySold > 0 ? (p.profitCurrent / p.qtySold) : 0;

            html += `
                <div class="item-card">
                    <div>
                        <div class="item-name">${p.name}</div>
                        <div class="item-barcode">باركود: ${p.barcode}</div>
                        <div class="item-qty-sold">إجمالي المباع: ${p.qtySold} قطعة</div>
                        
                        <div class="profit-label mt-2">الربح بالمتوسط:</div>
                        <div class="profit-value">
                            ${p.profitAvg.toLocaleString('en-US', {minimumFractionDigits: 2})} ج.م
                            <span class="unit-profit-tag">(للقطعة: ${unitProfitAvg.toFixed(2)})</span>
                        </div>

                        <div class="profit-label mt-1">الربح بالسعر الحالي:</div>
                        <div class="profit-current">
                            ${p.profitCurrent.toLocaleString('en-US', {minimumFractionDigits: 2})} ج.م
                            <span class="unit-profit-tag" style="color:#0284c7;">(للقطعة: ${unitProfitCurr.toFixed(2)})</span>
                        </div>
                    </div>
                    <div>
                        <button class="btn-details" onclick="goToDetails('${p.id}')">
                            تفاصيل <i class="fas fa-chevron-left"></i>
                        </button>
                    </div>
                </div>
            `;
        });

        if (list.length === 0) {
            html = `<div class="text-center text-muted mt-5 fw-bold"><i class="fas fa-search fa-2x mb-2"></i><br>لا توجد بيانات مطابقة</div>`;
        }

        container.innerHTML = html;
        document.getElementById('totalCount').innerText = list.length;
        document.getElementById('grandTotalProfit').innerText = grandAvg.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('grandTotalProfitCurrent').innerText = `إجمالي الأرباح (سعر الشراء الحالي): ${grandCurrent.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    };

    window.goToDetails = function(id) {
        const fromVal = document.getElementById('fromDate').value;
        const toVal = document.getElementById('toDate').value;
        let url = `profit-details.html?id=${id}`;
        if (fromVal) url += `&from=${fromVal}`;
        if (toVal) url += `&to=${toVal}`;
        window.location.href = url;
    };

    loadData();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch((err) => console.log(err));
}
</script>
</body>
</html>
