<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة الصندوق - شركة الزيادي</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;850;900&family=Montserrat:wght@500;750;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d; 
            --accent-gradient: linear-gradient(135deg, #064e3b, #0b5e3d, #14532d);
            --bg: #f4f6f8; 
            --success: #10b981; 
            --danger: #ef4444; 
            --danger-light: #fee2e2;
            --panel: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius-md: 16px;
            --radius-lg: 24px;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #e2e8f0; 
            font-family: 'Cairo', sans-serif; 
            padding-bottom: 30px; 
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg);
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            padding-bottom: 40px;
        }

        .num { 
            font-family: 'Montserrat', 'Cairo', sans-serif !important; 
            font-weight: 800; 
        }

        /* ===== Header ===== */
        .header-nav { 
            background: var(--accent-gradient); 
            color: white; 
            padding: 20px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            box-shadow: 0 10px 25px rgba(6, 78, 59, 0.15);
        }

        .back-btn {
            color: white;
            background: rgba(255,255,255,0.12);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none !important;
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
        
        .header-title { text-align: center; }
        .header-title span { font-size: 0.65rem; letter-spacing: 1.5px; opacity: 0.85; font-weight: 850; color: #fcd34d; display: block; }
        .header-title h1 { font-size: 1.15rem; font-weight: 900; margin: 3px 0 0; }

        /* ===== Balance Card ===== */
        .balance-card { 
            background: var(--panel); 
            border-radius: var(--radius-lg); 
            margin: 20px 16px; 
            padding: 20px 16px; 
            text-align: center; 
            box-shadow: var(--card-shadow); 
            border: 1px solid rgba(0,0,0,0.02); 
        }
        .balance-amount { 
            color: var(--accent); 
            font-size: 1.8rem; 
            font-weight: 900; 
            margin-top: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        /* ===== Inputs & Actions ===== */
        .action-card { 
            background: var(--panel); 
            border-radius: var(--radius-lg); 
            margin: 0 16px; 
            padding: 20px; 
            box-shadow: var(--card-shadow); 
            border: 1px solid rgba(0,0,0,0.02);
        }
        .btn-group-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
        .type-btn { 
            flex: 1; 
            border-radius: var(--radius-md); 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            font-weight: 850; 
            background: #f8fafc; 
            color: var(--text-muted); 
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .type-btn.active-plus { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px rgba(11, 94, 61, 0.2); }
        .type-btn:active { transform: scale(0.96); }

        .input-box { background: #f8fafc; border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .input-field { border: none; background: transparent; width: 100%; font-size: 0.95rem; font-weight: 800; text-align: center; outline: none; font-family: 'Cairo'; color: var(--text-dark); }
        .input-field::placeholder { color: #cbd5e1; font-weight: 600; }
        
        .btn-confirm { 
            background: var(--success); 
            color: white; 
            width: 100%; 
            border: none; 
            padding: 14px; 
            border-radius: var(--radius-md); 
            font-weight: 850; 
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25); 
            transition: 0.2s;
        }
        .btn-confirm:active { transform: scale(0.97); }
        
        /* ===== Logs History Toolbar ===== */
        .history-toolbar { 
            margin: 24px 20px 12px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-title { font-weight: 850; color: var(--text-dark); font-size: 0.95rem; margin: 0; }
        
        .btn-clear-all-logs {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-clear-all-logs:active { transform: scale(0.92); background-color: rgba(239, 68, 68, 0.25); }

        .log-item { 
            background: var(--panel); 
            border-radius: var(--radius-md); 
            margin: 0 16px 10px; 
            padding: 14px; 
            display: flex; 
            align-items: center; 
            box-shadow: var(--card-shadow); 
            border: 1px solid rgba(0,0,0,0.01);
        }
        .log-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: 12px; flex-shrink: 0; }
        .icon-in { background: #eefdf6; color: var(--success); }
        .icon-out { background: #fff1f2; color: var(--danger); }
        .log-info { flex-grow: 1; min-width: 0; }
        .log-name { font-weight: 800; font-size: 0.85rem; color: var(--text-dark); margin: 0; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-time { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; display: block; margin-top: 2px; }
        
        .log-action-zone {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .log-val { text-align: left; font-weight: 850; font-size: 0.95rem; min-width: 80px; }
        
        .btn-delete-log {
            background: var(--danger-light);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: var(--danger);
            width: 30px;
            height: 30px;
            border-radius: 10px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .btn-delete-log:active { transform: scale(0.9); }
        
        .badge-sale { display: inline-block; font-size: 0.6rem; background: #e0f2f1; color: #00796b; padding: 2px 6px; border-radius: 6px; margin-left: 6px; font-weight: 900; vertical-align: middle; }
        .badge-method { display: inline-block; font-size: 0.6rem; padding: 2px 6px; border-radius: 6px; margin-left: 6px; font-weight: 900; vertical-align: middle; }
        .badge-method.cash { background: #fef3c7; color: #d97706; }
        .badge-method.wallet { background: #e0e7ff; color: #4f46e5; }

    </style>
</head>
<body>

<div class="app-container">
    <div class="header-nav">
        <div style="width: 36px;"></div>
        <div class="header-title">
            <span>شركة الزيادي للتجارة</span>
            <h1>إدارة الصندوق النقدي</h1>
        </div>
        <a href="index1.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    </div>

    <!-- كارت الأرصدة المحدث (مفصول نقدي/محفظة) -->
    <div class="balance-card">
        <div class="row text-center">
            <div class="col-6" style="border-left: 1px solid var(--border-color);">
                <p class="text-muted small mb-1 fw-bold">الخزنة (نقدي)</p>
                <div class="balance-amount">
                    <span class="num" id="currentCash">0.00</span>
                </div>
            </div>
            <div class="col-6">
                <p class="text-muted small mb-1 fw-bold">المحفظة الإلكترونية</p>
                <div class="balance-amount" style="color: #4f46e5;">
                    <span class="num" id="currentWallet">0.00</span>
                </div>
            </div>
        </div>
        <p class="today-date small text-muted mt-3 mb-0 fw-bold" id="todayDate"></p>
    </div>

    <!-- كارت الإدخال الجديد -->
    <div class="action-card">
        <div class="btn-group-toggle">
            <button class="type-btn active-plus" id="btnIn" onclick="setType('in')">إيداع (+)</button>
            <button class="type-btn" id="btnOut" onclick="setType('out')">سحب (-)</button>
        </div>
        
        <div class="row">
            <div class="col-6">
                <div class="input-box text-center">
                    <span class="small text-muted d-block mb-1 fw-bold">طريقة الدفع</span>
                    <select id="paymentMethod" class="input-field num" style="padding: 0; appearance: auto; cursor: pointer;">
                        <option value="نقدي">نقدي (درج)</option>
                        <option value="محفظة">محفظة إلكترونية</option>
                    </select>
                </div>
            </div>
            <div class="col-6">
                <div class="input-box text-center">
                    <span class="small text-muted d-block mb-1 fw-bold">المبلغ المطلوب</span>
                    <input type="number" id="amount" class="input-field num" placeholder="0.00" style="padding: 0;">
                </div>
            </div>
        </div>
        
        <div class="input-box">
            <span class="small text-muted d-block mb-1 fw-bold">البيان / ملاحظات توضيحية</span>
            <input type="text" id="note" class="input-field" placeholder="اكتب تفاصيل المعاملة..." style="padding: 0;">
        </div>
        <button class="btn-confirm" id="btnConfirm" onclick="saveTransaction()">تأكيد العملية</button>
    </div>

    <div class="history-toolbar">
        <h6 class="history-title">آخر 20 عملية مسجلة</h6>
        <!-- زر التصفير والمسح الشامل من Firebase -->
        <button class="btn-clear-all-logs" onclick="clearAllCashLogs()">
            <i class="fas fa-trash-can"></i> مسح الدفتر
        </button>
    </div>
    
    <div id="logsList">
        <div class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted small fw-bold">جاري تحميل المعاملات النقدية والـ Live Match...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, addDoc, getDocs, query, limit, serverTimestamp, doc, getDoc, updateDoc, orderBy, increment, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

    let currentType = 'in';
    document.getElementById('todayDate').innerText = 'بتاريخ اليوم: ' + new Date().toLocaleDateString('ar-EG');

    window.setType = (t) => {
        currentType = t;
        document.getElementById('btnIn').classList.toggle('active-plus', t==='in');
        document.getElementById('btnOut').classList.toggle('active-plus', t==='out');
        document.getElementById('btnConfirm').style.background = t==='in' ? '#10b981' : '#ef4444';
        document.getElementById('btnConfirm').innerText = t==='in' ? 'تأكيد عملية الإيداع' : 'تأكيد عملية السحب';
    };

    function parseSignedNumber(val) {
        if (val === null || val === undefined || val === '') return 0;
        if (typeof val === 'number') return val;
        let s = String(val).trim().replace(/,/g, '');
        let negative = false;
        if (s.startsWith('(') && s.endsWith(')')) { negative = true; s = s.slice(1, -1); }
        if (s.endsWith('-')) { negative = true; s = s.slice(0, -1); }
        if (s.startsWith('-')) { negative = true; s = s.slice(1); }
        const n = parseFloat(s);
        return isNaN(n) ? 0 : (negative ? -n : n);
    }

    async function loadData() {
        try {
            const cashLogsSnap = await getDocs(collection(db, "cash_logs"));
            let actualCash = 0;
            let actualWallet = 0;

            cashLogsSnap.forEach(doc => {
                const data = doc.data();
                const amt = parseSignedNumber(data.amount);
                const method = data.method || data.paymentMethod || 'نقدي'; // للعمليات القديمة الافتراضي نقدي

                if (data.type === 'in' || data.type === 'قبض') {
                    if (method === 'محفظة') actualWallet += amt; else actualCash += amt;
                } else if (data.type === 'out' || data.type === 'صرف') {
                    if (method === 'محفظة') actualWallet -= amt; else actualCash -= amt;
                }
            });

            document.getElementById('currentCash').innerText = actualCash.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('currentWallet').innerText = actualWallet.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const logsQuery = query(collection(db, "cash_logs"), orderBy("timestamp", "desc"), limit(20));
            const logsSnap = await getDocs(logsQuery);
            
            const invQuery = query(collection(db, "invoices"), orderBy("timestamp", "desc"), limit(10));
            const invSnap = await getDocs(invQuery);

            let combinedLogs = [];

            invSnap.forEach(d => {
                const data = d.data();
                const paid = Math.round(Number(data.total || 0) - Number(data.remaining || 0));
                if(paid > 0) {
                    combinedLogs.push({
                        id: d.id,
                        name: data.customerName || 'عميل نقدي',
                        amount: paid,
                        type: 'in',
                        method: data.paymentMethod || data.method || 'نقدي',
                        time: data.time || '',
                        isSale: true,
                        ts: data.timestamp?.seconds || 0
                    });
                }
            });

            logsSnap.forEach(d => {
                const data = d.data();
                combinedLogs.push({
                    id: d.id,
                    name: data.note || (data.type === 'in' ? 'إيداع إضافي' : 'سحب مصروفات'),
                    amount: data.amount,
                    type: data.type,
                    method: data.method || data.paymentMethod || 'نقدي',
                    time: data.date || '',
                    isSale: false,
                    ts: data.timestamp?.seconds || 0
                });
            });

            combinedLogs.sort((a, b) => b.ts - a.ts);

            const logsList = document.getElementById('logsList');
            if(combinedLogs.length === 0) {
                logsList.innerHTML = '<div class="text-center py-5 text-muted small fw-bold">لا توجد عمليات مسجلة بالصندوق</div>';
            } else {
                logsList.innerHTML = combinedLogs.slice(0, 20).map(log => `
                    <div class="log-item">
                        <div class="log-icon ${log.type === 'in' ? 'icon-in' : 'icon-out'}">
                            <i class="fas fa-${log.type === 'in' ? 'plus' : 'minus'}"></i>
                        </div>
                        <div class="log-info">
                            <p class="log-name">
                                ${log.isSale ? '<span class="badge-sale">مبيعات</span>' : ''}
                                <span class="badge-method ${log.method === 'محفظة' ? 'wallet' : 'cash'}">${log.method}</span>
                                ${log.name}
                            </p>
                            <span class="log-time">${log.time}</span>
                        </div>
                        <div class="log-action-zone">
                            <div class="log-val num" style="color: ${log.type === 'in' ? '#10b981' : '#ef4444'}">
                                ${log.type === 'in' ? '+' : '-'}${Math.round(log.amount).toLocaleString('en-US')}
                            </div>
                            ${!log.isSale ? `
                                <button class="btn-delete-log" onclick="deleteTransaction('${log.id}', ${log.amount}, '${log.type}')" title="حذف العملية">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            ` : '<div style="width: 30px;"></div>'}
                        </div>
                    </div>
                `).join('');
            }
        } catch (e) {
            console.error(e);
            document.getElementById('logsList').innerHTML = '<div class="alert alert-danger mx-3 small">خطأ في مزامنة الحسابات النقدية</div>';
        }
    }

    window.deleteTransaction = async (id, amount, type) => {
        if (!confirm("⚠️ هل أنت متأكد من حذف هذه المعاملة نهائياً من الصندوق؟ سيتم تحديث الرصيد الفوري فوراً.")) return;

        try {
            await deleteDoc(doc(db, "cash_logs", id));

            const change = type === 'in' ? -amount : amount;
            const metaRef = doc(db, "settings", "cash_meta");
            await updateDoc(metaRef, { balance: increment(change) });

            alert("تم حذف العملية بنجاح وإعادة تسوية الحسابات النقدية للصندوق! ✅");
            loadData();
        } catch (error) {
            console.error(error);
            alert("خطأ أثناء الاتصال بقاعدة البيانات لحذف السجل!");
        }
    };

    window.clearAllCashLogs = async () => {
        const confirm1 = confirm("🚨 تحذير أمان هام للغاية!\nهل أنت متأكد من مسح جميع سجلات حركات الصندوق (cash_logs) من الـ Firebase؟ لا يمكن التراجع عن هذا الإجراء.");
        if (!confirm1) return;

        const deleteInvoices = confirm("❓ هل ترغب في مسح فواتير المبيعات (invoices) أيضاً لتصفير الصفحة بالكامل بنسبة 100%؟\n(ملاحظة: مسح الفواتير سيحذفها من لوحة المبيعات أيضاً).");

        const confirmFinal = confirm("⚡ تأكيد أخير وحتمي: سيتم الآن تصفير رصيد الخزنة إلى 0.00 ج.م والبدء من جديد. هل أنت متأكد؟");
        if (!confirmFinal) return;

        try {
            const logsSnap = await getDocs(collection(db, "cash_logs"));
            const logPromises = logsSnap.docs.map(lDoc => deleteDoc(doc(db, "cash_logs", lDoc.id)));
            await Promise.all(logPromises);

            await setDoc(doc(db, "settings", "cash_meta"), { balance: 0 });

            if (deleteInvoices) {
                const invSnap = await getDocs(collection(db, "invoices"));
                const invPromises = invSnap.docs.map(iDoc => deleteDoc(doc(db, "invoices", iDoc.id)));
                await Promise.all(invPromises);
                alert("تم تصفير الصندوق وحذف الفواتير بالكامل بنجاح! ✅");
            } else {
                alert("تم تفريغ الصندوق وتصفير الرصيد اليدوي بنجاح! (تم الاحتفاظ بالفواتير لتظل حساباتك دقيقة) ✅");
            }

            loadData();
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء مسح البيانات من Firebase: " + error.message);
        }
    };

    window.saveTransaction = async () => {
        const amtInput = document.getElementById('amount');
        const amt = Math.round(Number(amtInput.value));
        const method = document.getElementById('paymentMethod').value;
        const nt = document.getElementById('note').value;
        
        if(!amt || amt <= 0) return alert('برجاء إدخال مبلغ صحيح');

        const btn = document.getElementById('btnConfirm');
        btn.disabled = true; btn.innerText = 'جاري تسجيل العملية...';

        try {
            await addDoc(collection(db, "cash_logs"), {
                amount: amt,
                note: nt,
                type: currentType,
                method: method,
                paymentMethod: method,
                timestamp: serverTimestamp(),
                date: new Date().toLocaleString('ar-EG')
            });

            // هذا المتغير يُستخدم لضبط إجمالي الدرج الشامل بغض النظر عن النوع
            const change = currentType === 'in' ? amt : -amt;
            const metaRef = doc(db, "settings", "cash_meta");
            await updateDoc(metaRef, { balance: increment(change) });

            amtInput.value = '';
            document.getElementById('note').value = '';
            loadData();
        } catch (e) { 
            console.error(e);
            alert("فشل تحديث المعاملة!"); 
        }
        btn.disabled = false;
        setType(currentType);
    };

    loadData();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
</html>
