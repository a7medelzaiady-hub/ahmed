<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --accent: #000000;
            --accent-light: #252525;
            --accent-deep: #000000;
            --header-bg: linear-gradient(135deg, #000000, #252525 80%);
            --bg-light: #f5f6f6;
            --text-primary: #000000;
            --text-secondary: #4a4a4a;
            --border: #dcdcdc;
            --white: #ffffff;
            
            --germany-black: #000000;
            --germany-red: #FF0000;
            --germany-gold: #FFCC00;
            
            --danger: #FF0000;
            --danger-bg: #fff1f1;
            --success: #000000;
            --success-bg: #f5f6f6;
            --warning: #000000;
            --warning-bg: #fffdf2;
            --purple: #5b21b6;
            --purple-bg: #f5f3ff;
            --gold: #FFCC00;
            --card-radius: 20px;
            --input-radius: 14px;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
        }
        
        * { box-sizing: border-box; }
        
        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 80px;
            font-size: 0.88rem;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        .num { 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }

        .header-nav {
            background: var(--header-bg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom: 4px solid var(--germany-red);
        }
        .header-nav h6 { 
            font-weight: 900; 
            font-size: 1.05rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions { display: flex; gap: 8px; }
        .add-btn {
            background: rgba(255, 255, 255, 0.15);
            width: 38px; 
            height: 38px;
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: white; 
            text-decoration: none; 
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2); 
            transition: all 0.2s ease;
        }
        .add-btn:active { transform: scale(0.92); }
        .add-btn:hover { background: rgba(255, 255, 255, 0.25); color: white; }
        .trash-nav-btn { background: var(--germany-red) !important; border-color: rgba(255, 255, 255, 0.2) !important; }
        .add-nav-btn { background: var(--germany-gold) !important; border-color: rgba(255, 255, 255, 0.2) !important; color: #000000 !important; }

        .control-panel-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius); 
            padding: 14px;
            margin-bottom: 16px; 
            box-shadow: var(--shadow-sm);
            display: flex; 
            flex-direction: column; 
            gap: 10px;
        }
        .panel-btn-group {
            display: flex; 
            gap: 10px; 
            width: 100%;
        }
        .panel-btn {
            flex: 1;
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            padding: 12px; 
            font-size: 0.82rem; 
            font-weight: 800;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif; 
            white-space: nowrap;
            border: 1.5px solid transparent; 
            transition: all 0.2s ease; 
            cursor: pointer;
        }
        .panel-btn:active { transform: scale(0.97); }
        .btn-fetch-all { background: #fffdf2; color: #000000; border-color: var(--germany-gold); }
        .btn-refresh-panel { background: #f1f5f9; color: #475569; border-color: var(--border); }
        .btn-reset-danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(255, 0, 0, 0.2); width: 100%; }

        .stats-section-title {
            font-size: 0.82rem;
            font-weight: 900; 
            color: var(--accent-deep);
            margin: 8px 4px 12px; 
            display: flex; 
            align-items: center; 
            gap: 6px;
        }
        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px; 
            padding: 10px 4px; 
            box-shadow: var(--shadow-sm); 
            text-align: center;
            position: relative; 
            overflow: hidden; 
            cursor: pointer;
            transition: all 0.2s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-card:active { transform: scale(0.95); }
        .stat-card.active-filter { border: 2px solid var(--germany-black) !important; background: #fffdf2; }
        .stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .stat-label { 
            font-size: 0.68rem; 
            color: var(--text-secondary); 
            font-weight: 800; 
            white-space: nowrap;
        }
        .stat-value { 
            font-size: 0.92rem; 
            margin-top: 4px; 
            font-weight: 800; 
            white-space: nowrap;
        }

        .recon-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius); 
            padding: 16px;
            margin-bottom: 16px; 
            box-shadow: var(--shadow-sm);
        }
        .recon-title { 
            font-size: 0.85rem; 
            font-weight: 900; 
            color: var(--accent); 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .invoice-item {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px; 
            padding: 18px; 
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm); 
            transition: all 0.2s ease;
            border-right: 5px solid var(--border);
        }
        .invoice-item:hover { box-shadow: var(--shadow-md); }
        .invoice-item.no-date { border-right-color: var(--germany-red); }
        .invoice-item.voucher-item { border-right-color: var(--purple); background: #fcfbfe; }
        
        .vouchers-divider {
            display: flex;
            align-items: center; 
            gap: 10px; 
            margin: 22px 4px 14px;
            font-size: 0.82rem; 
            font-weight: 900; 
            color: var(--purple);
        }
        .vouchers-divider::after { content: ""; flex: 1; height: 1.5px; background: var(--border); }

        .meta-container { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .detail-badge {
            font-size: 0.74rem;
            padding: 5px 10px; 
            border-radius: 8px; 
            font-weight: 700;
            background: #f1f5f9; 
            color: #475569;
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            direction: ltr;
        }
        .pay-badge { font-size: 0.7rem; font-weight: 800; padding: 5px 11px; border-radius: 8px; color: white !important; }

        .modification-log-box {
            background: #fffdf5;
            border: 1px solid var(--germany-gold);
            color: #495057;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.5;
            display: none; 
        }

        .financial-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px;
            background: #f8fafc; 
            padding: 12px; 
            border-radius: 14px;
            margin-top: 14px; 
            border: 1px dashed var(--border);
        }
        .fin-box { font-size: 0.76rem; font-weight: 800; color: var(--text-secondary); }
        .fin-box span { display: block; font-size: 1rem; margin-top: 4px; font-weight: 800; color: var(--text-primary); }

        .search-box, input[type="date"], .recon-input {
            border: 1px solid var(--border);
            border-radius: var(--input-radius);
            padding: 12px 14px; 
            font-weight: 700; 
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif; 
            background: var(--white);
            transition: all 0.2s ease;
            width: 100%;
        }
        .search-box:focus, input[type="date"]:focus, .recon-input:focus {
            border-color: var(--germany-black);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.12); 
            outline: none;
        }

        .filter-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .filter-row .search-date-group { display: flex; gap: 10px; }
        .filter-row .search-date-group > div { flex: 1; }
        .filter-row .action-buttons-group { display: flex; gap: 10px; }
        .filter-row .action-buttons-group .btn {
            flex: 1;
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 0.8rem;
            border-radius: 12px;
            padding: 12px;
            white-space: nowrap;
        }

        .items-preview-table { width: 100%; margin-top: 14px; font-size: 0.8rem; border-collapse: collapse; border-radius: 12px; overflow: hidden; }
        .items-preview-table th { background: #f1f5f9; padding: 10px; border: 1px solid var(--border); font-weight: 800; text-align: center; color: #475569; }
        .items-preview-table td { padding: 10px; border: 1px solid var(--border); text-align: center; font-weight: 700; }

        .filter-status-bar {
            display: flex;
            background: #e2e8f0; 
            padding: 10px 16px; 
            border-radius: 14px;
            font-size: 0.82rem; 
            font-weight: 800; 
            align-items: center; 
            justify-content: space-between;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .custom-popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); 
            z-index: 10000; 
            display: flex;
            align-items: center;  
            justify-content: center; 
            backdrop-filter: blur(4px);
        }
        .custom-popup-box {
            background: white;
            width: 90%; 
            max-width: 400px; 
            padding: 26px;
            border-radius: 24px; 
            text-align: center; 
            font-family: 'Cairo';
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .invoice-actions-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            justify-content: flex-end; 
            align-items: center; 
            margin-top: 14px; 
        }
        .invoice-actions-group .btn {
            font-family: 'Cairo', sans-serif;
            font-size: 0.74rem; 
            font-weight: 800;
            padding: 6px 10px; 
            border-radius: 10px; 
            display: inline-flex;
            align-items: center; 
            gap: 4px; 
            white-space: nowrap; 
            height: 34px;
            transition: all 0.2s ease;
        }
        .invoice-actions-group .btn:active { transform: scale(0.94); }

        .empty-state { text-align: center; padding: 60px 10px; color: var(--text-secondary); }
        .empty-state i { color: #cbd5e1; }

        #thermalPrintSection { display: none; }
        @media print {
            body { background: white; color: black; padding: 0; margin: 0; }
            #content-to-export, .header-nav, .control-panel-card, .stats-section-title, .row, .filter-status-bar, #customGlobalModal, .invoice-item, .recon-card { display: none !important; }
            #thermalPrintSection { display: block !important; width: 80mm; max-width: 80mm; padding: 4mm 2mm; margin: 0 auto; direction: rtl; font-family: 'Cairo', sans-serif; }
        }
    </style>
</head>
<body>

<div id="content-to-export">
    <div class="header-nav">
        <a href="index.html" class="add-btn" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
        <h6 class="m-0"><i class="fas fa-history me-1"></i> سجل المبيعات</h6>
        <div class="header-actions">
            <a href="trashi.html" class="add-btn trash-nav-btn" title="فتح سلة المحذوفات" style="display:none;"><i class="fas fa-trash-alt"></i></a>
            <button class="add-btn" id="exportExcelBtn" title="تصدير كل الأرشيف إكسيل"><i class="fas fa-file-excel"></i></button>
            <a href="sales-invoice.html" class="add-btn add-nav-btn" title="فاتورة جديدة"><i class="fas fa-plus"></i></a>
        </div>
    </div>

    <div class="container px-2 mt-3">
        <div class="control-panel-card">
            <div class="panel-btn-group">
                <button id="loadAllArchiveBtn" class="panel-btn btn-fetch-all">
                    <i class="fas fa-cloud-download-alt"></i> جلب كل الفواتير السابقة
                </button>
                <button id="refreshBtn" class="panel-btn btn-refresh-panel">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
            </div>
            <button class="panel-btn btn-reset-danger" id="deleteAllCustomersBtn" style="display:none;">
                <i class="fas fa-trash-can"></i> تصفير النظام للسلة
            </button>
        </div>

        <div class="stats-section-title" id="todayStatsTitle"><i class="fas fa-calendar-day"></i> إحصائيات اليوم</div>

        <div class="row g-1 mb-3">
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-cash', this)">
                    <div class="stat-bar" style="background: var(--germany-black);"></div>
                    <div class="stat-label text-truncate">نقدى اليوم (شامل السندات)</div>
                    <div class="stat-value num text-truncate" style="color: var(--germany-black);" id="todayCash">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-wallet', this)">
                    <div class="stat-bar" style="background: var(--purple);"></div>
                    <div class="stat-label text-truncate">محفظه اليوم (شامل السندات)</div>
                    <div class="stat-value num text-truncate" style="color: var(--purple);" id="todayWallet">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-remaining', this)">
                    <div class="stat-bar" style="background: var(--germany-red);"></div>
                    <div class="stat-label text-truncate">آجل اليوم</div>
                    <div class="stat-value num text-truncate" style="color: var(--germany-red);" id="todayRemaining">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-total', this)">
                    <div class="stat-bar" style="background: var(--germany-gold);"></div>
                    <div class="stat-label text-truncate">م. اليوم</div>
                    <div class="stat-value num text-truncate" style="color: var(--germany-black);" id="todayTotalSales">0.0</div>
                </div>
            </div>
        </div>

        <div class="recon-card">
            <div class="recon-title"><i class="fas fa-scale-balanced" style="color:var(--germany-red);"></i> مطابقة النقدية (الكاش)</div>
            <div class="row g-2 align-items-center">
                <div class="col-6">
                    <label class="stat-label mb-1 fw-bold text-dark d-block">النقدية الموجودة معك حالياً:</label>
                    <input type="text" id="actualCashInput" class="form-control text-center recon-input fw-bold num" placeholder="مثال: 30000 5400 470" oninput="window.calculateCashReconciliation()">
                </div>
                <div class="col-6">
                    <label class="stat-label mb-1 fw-bold text-dark d-block">حالة المطابقة والفارق:</label>
                    <div id="reconResultBox" class="text-center fw-bold text-muted p-2" style="border-radius: var(--input-radius); font-size: 0.8rem; background: #f8fafc; border: 1px dashed var(--border); height: 44px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                        بانتظار جردك الفعلي...
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-status-bar" id="filterStatusBar" style="display: none;">
            <span id="filterStatusText">عرض فلاتر مخصصة</span>
            <button class="btn btn-sm btn-dark py-0" onclick="resetStatFilter()" style="font-size:0.75rem; font-family: 'Cairo'; border-radius: 8px;">عرض الكل</button>
        </div>

        <div class="filter-row">
            <div class="search-date-group">
                <div>
                    <input type="text" id="searchInput" class="form-control search-box" placeholder="بحث باسم العميل..." oninput="filterInvoices()">
                </div>
                <div>
                    <input type="date" id="dateFilterInput" class="form-control" onchange="window.handleDateFilterChange()">
                </div>
            </div>
            <div class="action-buttons-group">
                <button class="btn btn-outline-dark" onclick="downloadInvoicesImagesByDate()" title="تحميل الفواتير وملحوظاتها">
                    <i class="fas fa-images"></i> صور الفواتير ZIP
                </button>
                <button class="btn btn-dark text-white" onclick="printDailyComprehensiveReport()" title="تقرير مالي للمبيعات والمخزن اليومي">
                    <i class="fas fa-file-invoice"></i> تقرير اليوم
                </button>
            </div>
        </div>

        <div id="invoicesList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p class="mt-3 fw-bold">برجاء الانتظار جاري التحميل...</p>
            </div>
        </div>
    </div>
</div>

<div id="thermalPrintSection"></div>

<div id="customGlobalModal" class="custom-popup-overlay" style="display: none;">
    <div class="custom-popup-box">
        <div id="customModalIcon" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;"></div>
        <h6 class="fw-bold mb-2" id="customModalTitle" style="font-size: 1.05rem;">تنبيه النظام</h6>
        <div id="customModalBody" style="font-size: 0.85rem; color: #475569; margin-bottom: 20px; text-align: right; white-space: pre-line; line-height: 1.7; max-height: 300px; overflow-y: auto; padding: 5px;"></div>
        <input type="text" id="customModalInput" class="form-control text-center mb-3 fw-bold" style="display:none; font-family:'Cairo'; font-size:0.95rem; border-radius: 12px; padding: 10px;" placeholder="اكتب كلمة التأكيد هنا...">
        <div class="d-flex gap-2 justify-content-center" id="customModalActions"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allInvoices = [];
    let customersData = {};
    let currentFilterType = null;
    let currentRenderedInvoices = [];
    let allReceiptVouchers = [];
    let rawTransactionsList = [];
    let loadedScope = null;

    window.globalExpectedTodayCash = 0;

    function normalizeName(str) {
        return String(str || '')
            .trim()
            .replace(/\s+/g, ' ')
            .replace(/[\u064B-\u0652]/g, '')
            .replace(/[إأآا]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ة/g, 'ه')
            .toLowerCase();
    }

    window.showCustomUi = (options) => {
        const modal = document.getElementById('customGlobalModal');
        const title = document.getElementById('customModalTitle');
        const body = document.getElementById('customModalBody');
        const iconContainer = document.getElementById('customModalIcon');
        const inputField = document.getElementById('customModalInput');
        const actions = document.getElementById('customModalActions');

        title.innerText = options.title || "تنبيه النظام";
        body.innerHTML = options.message || "";
        inputField.value = "";
        inputField.style.display = options.type === "prompt" ? "block" : "none";

        if (options.icon === "success") {
            iconContainer.style.background = "#f0fdf4";
            iconContainer.innerHTML = `<i class="fas fa-check-circle" style="color: #000000; font-size: 1.7rem;"></i>`;
        } else if (options.icon === "danger") {
            iconContainer.style.background = "#fff1f2";
            iconContainer.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: var(--germany-red); font-size: 1.7rem;"></i>`;
        } else {
            iconContainer.style.background = "#f1f5f9";
            iconContainer.innerHTML = `<i class="fas fa-info-circle" style="color: var(--accent); font-size: 1.7rem;"></i>`;
        }

        actions.innerHTML = "";

        if (options.type === "confirm" || options.type === "prompt") {
            const confirmBtn = document.createElement('button');
            confirmBtn.className = "btn btn-sm btn-dark px-4 fw-bold";
            confirmBtn.style.fontFamily = "Cairo";
            confirmBtn.style.borderRadius = "10px";
            confirmBtn.innerText = options.confirmText || "تأكيد";
            confirmBtn.onclick = () => {
                modal.style.display = 'none';
                if (options.onConfirm) options.onConfirm(options.type === "prompt" ? inputField.value : true);
            };

            const cancelBtn = document.createElement('button');
            cancelBtn.className = "btn btn-sm btn-light text-danger px-4 fw-bold";
            cancelBtn.style.fontFamily = "Cairo";
            cancelBtn.style.borderRadius = "10px";
            cancelBtn.innerText = "إلغاء";
            cancelBtn.onclick = () => {
                modal.style.display = 'none';
                if (options.onCancel) options.onCancel();
            };

            actions.appendChild(cancelBtn);
        } else {

            };

    function convertToEnglishNumbers(str) {
        if (!str) return "";
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let res = str.toString();
        for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
        return res;
    }

    function parseArabicDateToMs(dateStr) {
        if (!dateStr) return 0;
        try {
            let cleanStr = convertToEnglishNumbers(String(dateStr));
            cleanStr = cleanStr.replace(/ص/g, 'AM').replace(/م/g, 'PM');
            const parsed = Date.parse(cleanStr);
            if (!isNaN(parsed)) return parsed;

            const parts = cleanStr.match(/(\d+)/g);
            if (parts && parts.length >= 3) {
                let year = parseInt(parts[0]);
                let month = parseInt(parts[1]) - 1;
                let day = parseInt(parts[2]);

                if (year < 1000) {
                    day = parseInt(parts[0]);
                    month = parseInt(parts[1]) - 1;
                    year = parseInt(parts[2]);
                }

                let hour = parts[3] ? parseInt(parts[3]) : 0;
                const minute = parts[4] ? parseInt(parts[4]) : 0;
                if (cleanStr.includes('PM') && hour < 12) hour += 12;
                if (cleanStr.includes('AM') && hour === 12) hour = 0;

                return new Date(year, month, day, hour, minute).getTime();
            }
        } catch (e) { }
        return 0;
    }

    function cleanDateString(dateStr) {
        if (!dateStr) return "";
        dateStr = convertToEnglishNumbers(dateStr);
        const match = dateStr.match(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/) || dateStr.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/);
        return match ? match[0] : dateStr;
    }

    function parseInvoiceDate(inv) {
        let dateStr = "";
        if (inv.date) { dateStr = cleanDateString(inv.date); }
        else if (inv.timestamp?.seconds) {
            const d = new Date(inv.timestamp.seconds * 1000);
            return d.toLocaleDateString('en-CA');
        }
        if (!dateStr) return "";
        dateStr = convertToEnglishNumbers(dateStr);
        let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return dateStr;
    }

    function parseVoucherDate(tr) {
        if (!tr) return "";
        if (tr.date) {
            let dateStr = convertToEnglishNumbers(tr.date);
            let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            if (dateStr) return dateStr;
        }
        if (tr.timestamp?.seconds) {
            const d = new Date(tr.timestamp.seconds * 1000);
            return d.toLocaleDateString('en-CA');
        }
        return "";
    }

    function formatInvoiceTime(timeStr, dateStr) {
        let raw = convertToEnglishNumbers(timeStr || dateStr || "");
        let timePattern = /(\d{1,2}):(\d{1,2})/;
        let match = raw.match(timePattern);
        if (match) {
            let hour = match[1];
            let min = match[2]; let period = "م";
            if (raw.includes("ص") || raw.toLowerCase().includes("am")) { period = "ص"; }
            return `${hour}:${min} ${period}`;
        }
        return "00:00 م";
    }

    function calculateCumulativeBalances() {
        if (!allInvoices || allInvoices.length === 0) return;

        const customerInvoicesMap = {};

        allInvoices.forEach(inv => {
            if (!inv.customerId) return;
            if (!customerInvoicesMap[inv.customerId]) {
                customerInvoicesMap[inv.customerId] = [];
            }
            
            let timeMs = inv.timestamp?.seconds ? (inv.timestamp.seconds * 1000) : parseArabicDateToMs(inv.time || inv.date);
            customerInvoicesMap[inv.customerId].push({ inv, timeMs });
        });

        Object.keys(customerInvoicesMap).forEach(custId => {
            const list = customerInvoicesMap[custId];
            list.sort((a, b) => a.timeMs - b.timeMs);

            const custObj = customersData[custId];
            const baseBalance = custObj ? Number(custObj.initialBalance || 0) : 0;

            const custTrans = rawTransactionsList.filter(t => t.partyId === custId);

            list.forEach(item => {
                const targetTimeMs = item.timeMs;
                let prevInvoiceDebt = 0;

                for (const prior of list) {
                    if (prior.inv.id === item.inv.id) continue;
                    if (prior.timeMs < targetTimeMs) {
                        const total = Number(prior.inv.total) || 0;
                        const paid = Number(prior.inv.calculatedCash + prior.inv.calculatedWallet) || 0;
                        const rem = prior.inv.remaining !== undefined ? Number(prior.inv.remaining) : (total - paid);
                        prevInvoiceDebt += rem;
                    }
                }

                let prevTransEffect = 0;
                custTrans.forEach(tr => {
                    const trTimeMs = tr.timestamp?.seconds ? (tr.timestamp.seconds * 1000) : parseArabicDateToMs(tr.date || tr.time);
                    if (trTimeMs < targetTimeMs) {
                        const amt = Number(tr.amount) || 0;
                        if (tr.type === 'قبض') prevTransEffect -= amt;
                        else if (tr.type === 'صرف') prevTransEffect += amt;
                    }
                });

                item.inv.previousBalance = baseBalance + prevInvoiceDebt + prevTransEffect;
            });
        });
    }

    function calculateStats() {
        let invoiceCash = 0, voucherCash = 0;
        let invoiceWallet = 0, voucherWallet = 0;
        let todayRemaining = 0, todaySales = 0;

        const filterInput = document.getElementById('dateFilterInput')?.value;
        const targetDateStr = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
        const statsTitle = document.getElementById('todayStatsTitle');
        if (statsTitle) { statsTitle.innerHTML = `<i class="fas fa-calendar-day"></i> إحصائيات يوم (${targetDateStr})`; }
        
        allInvoices.forEach(inv => {
            const invDateStr = parseInvoiceDate(inv);
            if (invDateStr === targetDateStr) {
                invoiceCash += Number(inv.calculatedCash) || 0;
                invoiceWallet += Number(inv.calculatedWallet) || 0;
                todaySales += (Number(inv.total) || 0);
                let rawRemaining = Number(inv.remaining) || 0;
                if (rawRemaining > 0) { todayRemaining += rawRemaining; }
            }
        });

        allReceiptVouchers.forEach(v => {
            const vDateStr = parseVoucherDate(v);
            if (vDateStr === targetDateStr) {
                voucherCash += Number(v.cashAmount) || 0;
                voucherWallet += Number(v.walletAmount) || 0;
            }
        });

        const totalCash = invoiceCash + voucherCash;
        const totalWallet = invoiceWallet + voucherWallet;

        const todayCashElem = document.getElementById('todayCash');
        if (todayCashElem) {
            todayCashElem.innerText = totalCash.toFixed(1);
            todayCashElem.title = `مبيعات: ${invoiceCash.toFixed(1)} | سندات: ${voucherCash.toFixed(1)}`;
        }

        const todayWalletElem = document.getElementById('todayWallet');
        if (todayWalletElem) {
            todayWalletElem.innerText = totalWallet.toFixed(1);
            todayWalletElem.title = `مبيعات: ${invoiceWallet.toFixed(1)} | سندات: ${voucherWallet.toFixed(1)}`;
        }

        document.getElementById('todayRemaining').innerText = todayRemaining.toFixed(1);
        document.getElementById('todayTotalSales').innerText = todaySales.toFixed(1);

        window.globalExpectedTodayCash = totalCash;
        window.calculateCashReconciliation();
    }

    window.calculateCashReconciliation = () => {
        const inputField = document.getElementById('actualCashInput');
        const resultBox = document.getElementById('reconResultBox');
        if (!inputField || !resultBox) return;

        const inputVal = inputField.value.trim();
        if (inputVal === "") {
            resultBox.className = "text-center fw-bold text-muted p-2";
            resultBox.style.background = "#f8fafc";
            resultBox.style.border = "1px dashed var(--border)";
            resultBox.innerHTML = "بانتظار جردك الفعلي...";
            return;
        }

        let sanitizedVal = convertToEnglishNumbers(inputVal);
        sanitizedVal = sanitizedVal.replace(/\+/g, ' ');
        const amountParts = sanitizedVal.split(/\s+/); 
        let actual = 0;
        
        amountParts.forEach(part => {
            const parsedNum = parseFloat(part.trim());
            if (!isNaN(parsedNum)) { actual += parsedNum; }
        });

        const expected = window.globalExpectedTodayCash || 0;
        const diff = actual - expected;
        let totalEnteredStr = amountParts.length > 1 ? `[جردك: ${actual.toFixed(1)}] ` : '';

        if (Math.abs(diff) < 0.1) {
            resultBox.className = "text-center fw-bold text-dark p-2";
            resultBox.style.background = "#f0fdf4";
            resultBox.style.border = "1px solid var(--germany-black)";
            resultBox.innerHTML = `<i class="fas fa-check-circle"></i> ${totalEnteredStr} مطابق تماماً (0.00)`;
        } else if (diff > 0) {
            resultBox.className = "text-center fw-bold text-primary p-2";
            resultBox.style.background = "#eff6ff";
            resultBox.style.border = "1px solid #3b82f6";
            resultBox.innerHTML = `<i class="fas fa-circle-plus"></i> ${totalEnteredStr} زيادة (+${diff.toFixed(1)})`;
        } else {
            resultBox.className = "text-center fw-bold text-danger p-2";
            resultBox.style.background = "#fff1f2";
            resultBox.style.border = "1px solid var(--germany-red)";
            resultBox.innerHTML = `<i class="fas fa-circle-minus"></i> ${totalEnteredStr} عجز (${diff.toFixed(1)})`;
        }
    };

    async function loadData(showSpinner = true, loadAllArchive = false, targetDateOverride = null) {
        const container = document.getElementById('invoicesList');
        if (showSpinner) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-3 fw-bold">${loadAllArchive ? 'جاري جلب كل الفواتير السابقة...' : 'جاري جلب بيانات اليوم/التاريخ المحدد فقط...'}</p>
                </div>`;
        }

        try {
            const filterInput = targetDateOverride || document.getElementById('dateFilterInput')?.value;
            const targetDate = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');

            let invQuery = db.collection("invoices");
            let transQuery = db.collection("transactions");

            if (!loadAllArchive) {
                const dayStart = new Date(`${targetDate}T00:00:00`);
                const dayEnd = new Date(dayStart);
                dayEnd.setDate(dayEnd.getDate() + 1);

                const startTS = firebase.firestore.Timestamp.fromDate(dayStart);
                const endTS = firebase.firestore.Timestamp.fromDate(dayEnd);

                invQuery = invQuery.where("timestamp", ">=", startTS).where("timestamp", "<", endTS).orderBy("timestamp", "desc");
            } else {
                invQuery = invQuery.orderBy("timestamp", "desc");
            }

            const [custSnap, transSnap, invSnap] = await Promise.all([
                db.collection("customers").get().catch(() => null),
                transQuery.get().catch(() => null),
                invQuery.get().catch(async () => {
                    return await db.collection("invoices").orderBy("timestamp", "desc").limit(100).get();
                })
            ]);

            customersData = {};
            const customersNameIndex = {};
            if (custSnap) {
                custSnap.forEach(d => {
                    const cData = d.data();
                    customersData[d.id] = { id: d.id, name: cData.name, initialBalance: Number(cData.initialBalance) || 0 };
                    if (cData.name) {
                        customersNameIndex[normalizeName(cData.name)] = d.id;
                    }
                });
            }

            allReceiptVouchers = [];
            rawTransactionsList = [];
            if (transSnap) {
                transSnap.forEach(d => {
                    const tr = d.data();
                    if (tr.isDeleted === true) return;
                    rawTransactionsList.push({ id: d.id, ...tr });

                    const isInvoicePayment = tr.invoiceId || tr.purchaseId || tr.billId || tr.isInvoicePayment || 
                                             (tr.note && (tr.note.includes('فاتورة') || tr.note.includes('فواتير')));

                    if (tr.type === 'قبض' && !isInvoicePayment) {
                        let partyId = tr.partyId || tr.customerId || tr.supplierId || "";
                        let partyName = tr.customerName || tr.partyName || tr.supplierName || tr.name || "";

                        if (!partyId && partyName) {
                            const norm = normalizeName(partyName);
                            if (customersNameIndex[norm]) {
                                partyId = customersNameIndex[norm];
                            }
                        }

                        const partyType = tr.partyType || (partyId && customersData[partyId] ? 'عميل' : 'عميل');
                        
                        if (partyType === 'عميل' || customersData[partyId] || partyName) {
                            const amt = Number(tr.amount || tr.total || 0);
                            const method = tr.method || tr.paymentMethod || 'نقدى';
                            
                            let cashAmount = 0;
                            let walletAmount = 0;

                            if (method === 'محفظة' || method === 'محفظه') {
                                walletAmount = amt;
                            } else {
                                cashAmount = amt;
                            }

                            if (tr.cashPaid !== undefined || tr.cashAmount !== undefined) {
                                cashAmount = Number(tr.cashPaid ?? tr.cashAmount) || 0;
                            }
                            if (tr.walletPaid !== undefined || tr.walletAmount !== undefined) {
                                walletAmount = Number(tr.walletPaid ?? tr.walletAmount) || 0;
                            }

                            const resolvedCustomerName = (customersData[partyId] && customersData[partyId].name) || partyName || 'عميل غير معروف';
                            const vDate = parseVoucherDate(tr);

                            if (loadAllArchive || vDate === targetDate) {
                                allReceiptVouchers.push({
                                    id: d.id,
                                    date: vDate,
                                    cashAmount,
                                    walletAmount,
                                    method,
                                    customerName: resolvedCustomerName,
                                    note: tr.note || tr.notes || ''
                                });
                            }
                        }
                    }
                });
            }

            let tempInvoices = [];
            invSnap.forEach(d => {
                const data = d.data();
                if (data.isDeleted === true) return;

                let cPaid = Number(data.cashAmount ?? data.cashPaid ?? data.paid) || 0;
                let wPaid = Number(data.walletAmount ?? data.walletPaid) || 0;

                const invObj = {
                    id: d.id,
                    ...data,
                    calculatedCash: cPaid,
                    calculatedWallet: wPaid,
                    previousBalance: customersData[data.customerId]?.initialBalance || 0
                };

                if (loadAllArchive || parseInvoiceDate(invObj) === targetDate) {
                    tempInvoices.push(invObj);
                }
            });

            allInvoices = tempInvoices.sort((a, b) => {
                const timeA = a.timestamp?.seconds || 0;
                const timeB = b.timestamp?.seconds || 0;
                return timeB - timeA;
            });

            calculateCumulativeBalances();

            loadedScope = loadAllArchive ? 'ARCHIVE' : targetDate;
            applyCurrentView();

        } catch (e) {
            console.error("خطأ جلب البيانات:", e);
            container.innerHTML = `

            shareContainer.style.top = '0';
            shareContainer.style.width = '340px';

    function executeFilterLogic(type, dateStr) {
        let filtered = []; let statusLabel = "";
        filtered = allInvoices.filter(inv => {
            const invDateStr = parseInvoiceDate(inv);
            const isToday = (invDateStr === dateStr);
            switch (type) {
                case 'today-cash': statusLabel = `نقدى يوم (${dateStr})`; return isToday && inv.calculatedCash > 0;
                case 'today-wallet': statusLabel = `محفظه يوم (${dateStr})`; return isToday && inv.calculatedWallet > 0;
                case 'today-remaining': statusLabel = `آجل يوم (${dateStr})`; return isToday && Number(inv.remaining) > 0;
                case 'today-total': statusLabel = `مبيعات يوم (${dateStr})`; return isToday;
                default: return true;
            }
        });

        let matchingVouchers = [];
        if (type === 'today-cash' || type === 'today-wallet') {
            matchingVouchers = allReceiptVouchers.filter(v => {
                const vDateStr = parseVoucherDate(v);
                return (vDateStr === dateStr) && (type === 'today-cash' ? v.cashAmount > 0 : v.walletAmount > 0);
            });
        }

        const vouchersCountLabel = matchingVouchers.length > 0 ? ` + ${matchingVouchers.length} سند قبض` : '';
        document.getElementById('filterStatusText').innerText = `${statusLabel} (${filtered.length} فاتورة${vouchersCountLabel})`;
        document.getElementById('filterStatusBar').style.display = "flex";
        window.renderInvoices(filtered, matchingVouchers);
    }

    window.deleteInvoice = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        const nameDisplay = inv ? (inv.customerName || 'عميل نقدى') : '';

        window.showCustomUi({
            title: "نقل الفاتورة إلى السلة",
            message: `هل أنت متأكد من نقل فاتورة "${nameDisplay}" إلى سلة المحذوفات وإعادة كمياتها للمخزن؟`,
            type: "confirm",
            icon: "danger",
            onConfirm: async () => {
                try {
                    // 1. جلب المعاملات المرتبطة بالفاتورة
                    const txSnapshot = await db.collection("transactions").where("invoiceId", "==", id).get();

                    // 2. تجميع معرفات المنتجات الفريدة
                    const items = inv ? (inv.items || []) : [];
                    const stockIds = [...new Set(items.map(item => item.stockId).filter(Boolean))];

                    // 3. جلب بيانات المنتجات بالتوازي للتوفير في الكوتا
                    const inventoryDocs = {};
                    if (stockIds.length > 0) {
                        const docSnaps = await Promise.all(
                            stockIds.map(sId => db.collection("inventory").doc(sId).get())
                        );
                        docSnaps.forEach(snap => {
                            if (snap.exists) inventoryDocs[snap.id] = snap.data();
                        });
                    }

                    // 4. استخدام WriteBatch بدلاً من Transaction لتوفير عمليات القراءة/الكتابة
                    const batch = db.batch();

                    // تعديل كميات الأصناف في المخزن
                    items.forEach(item => {
                        if (!item.stockId || !inventoryDocs[item.stockId]) return;

                        const ref = db.collection("inventory").doc(item.stockId);
                        const prodData = inventoryDocs[item.stockId];

                        const qty = Number(item.qty || 0);
                        const rawUnit = (item.unit || "").trim().toLowerCase();
                        const itemName = (item.name || "").toLowerCase();

                        const isCarton = (rawUnit === 'box' || rawUnit === 'carton' || rawUnit === 'كرتونة' || rawUnit === 'كرتونه' || itemName.includes('شحم بريفيكس'));
                        const isReturn = item.isReturn === true;

                        const pcsPerCarton = Number(prodData.pcsPerCarton || prodData.cartonSize || prodData.unitFactor) || 1;
                        let piecesToModify = qty;
                        if (isCarton && pcsPerCarton > 1) {
                            piecesToModify = qty * pcsPerCarton;
                        }

                        const multiplier = isReturn ? -1 : 1;
                        const currentTotalPcs = Number(prodData.totalPcs) || 0;
                        const newTotalPcs = Math.max(0, currentTotalPcs + (piecesToModify * multiplier));

                        batch.update(ref, { totalPcs: newTotalPcs });
                    });

                    // نقل المعاملات المالية للسلة
                    txSnapshot.forEach(txDoc => {
                        batch.update(db.collection("transactions").doc(txDoc.id), {
                            isDeleted: true,
                            deletedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    // نقل الفاتورة نفسها للسلة
                    batch.update(db.collection("invoices").doc(id), {
                        isDeleted: true,
                        deletedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // تنفيذ التغييرات بطلب واحد
                    await batch.commit();

                    await loadData(false, loadedScope === 'ARCHIVE');
                    window.showCustomUi({ title: "تم النقل", message: "تم نقل الفاتورة إلى السلة بنجاح وتعديل كميات المخزن بدقة.", icon: "success" });
                } catch (err) {
                    console.error("خطأ أثناء الحذف وإرجاع المخزون:", err);
                    let errorMsg = err.message || "";
                    if (errorMsg.includes("Quota exceeded") || err.code === "resource-exhausted") {
                        errorMsg = "تم تجاوز الحد اليومي المجاني لقاعدة البيانات (Quota Exceeded). يمكنك الانتظار لتجديد الكوتا أو الترقية لخطة Blaze.";
                    }
                    window.showCustomUi({ title: "خطأ في النقل", message: errorMsg, icon: "danger" });
                }
            }
        });
    };

    document.getElementById('exportExcelBtn').onclick = async () => {
        const btn = document.getElementById('exportExcelBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const snap = await db.collection("invoices").get();
            let excelRows = [];

            snap.forEach(d => {
                const data = d.data();
                if (data.isDeleted === true) return;

                const invObj = { id: d.id, ...data };
                const invDate = parseInvoiceDate(invObj);
                const invTime = formatInvoiceTime(invObj.time, invObj.date);
                const invDateWithTime = `${invDate} | ${invTime}`;
                const customerName = invObj.customerName || 'النقدى';

                if (invObj.items && invObj.items.length > 0) {
                    invObj.items.forEach(itm => {
                        let qtyCarton = 0; let qtyJarkan = 0;
                        let priceCarton = 0; let priceJarkan = 0;
                        const isRet = itm.isReturn === true;
                        const movementType = isRet ? "مرتجع" : "بيع";

                        const itemName = (itm.name || "");
                        const rawUnit = (itm.unit || "").trim().toLowerCase();
                        const rawQty = Number(itm.qty) || 0;
                        const rawPrice = Number(itm.price) || 0;

                        let isCarton = (rawUnit === 'box' || rawUnit === 'carton' || rawUnit === 'كرتونة' || rawUnit === 'كرتونه' || itemName.includes('شحم بريفيكس'));

                        if (isCarton) { qtyCarton = rawQty; priceCarton = rawPrice; }
                        else { qtyJarkan = rawQty; priceJarkan = rawPrice; }

                        excelRows.push({
                            "التاريخ": invDateWithTime, "الحركة": movementType, "اسم العميل": customerName,
                            "الصنف": itemName, "عدد الجركن": qtyJarkan, "عدد الكرتونة": qtyCarton,
                            "سعر الجركن": priceJarkan, "سعر الكرتونة": priceCarton
                        });
                    });
                }
            });

            if (!excelRows.length) {
                window.showCustomUi({ title: "تنبيه", message: "لا توجد بيانات لتصديرها بعد.", icon: "info" });
                return;
            }

            const ws = XLSX.utils.json_to_sheet(excelRows);
            ws['!dir'] = "rtl";
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "المبيعات والأرشيف");
            XLSX.writeFile(wb, "سجل_المبيعات_التفصيلي.xlsx");
        } catch (e) {
            console.error(e);
            window.showCustomUi({ title: "خطأ", message: "حدث خطأ أثناء تصدير البيانات.", icon: "danger" });
        } finally {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    };
    
    loadData(true, false);
</script>
</body>
</html>
