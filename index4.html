<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الأرقام للأبطال</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@600;800&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #FFEDD5 0%, #FED7AA 50%, #FDBA74 100%);
            font-family: 'Changa', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow-x: hidden;
        }

        /* شريط أعلى الشاشة */
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .score-pill {
            background: #FFFFFF;
            border: 3px solid #F59E0B;
            color: #D97706;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sound-btn {
            background: #10B981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 800;
            box-shadow: 0 4px 0 #059669;
            cursor: pointer;
            font-family: 'Changa', sans-serif;
        }

        /* بطاقة السؤال الرئيسية */
        .question-card {
            width: 100%;
            max-width: 450px;
            background: #FFFFFF;
            border-radius: 25px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            border: 4px solid #3B82F6;
            margin-bottom: 15px;
        }

        .question-title {
            font-size: 1.3rem;
            color: #1E40AF;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .target-number-box {
            background: #EFF6FF;
            border-radius: 20px;
            padding: 10px;
            display: inline-block;
            min-width: 110px;
            border: 3px dashed #93C5FD;
        }

        .target-number {
            font-size: 4rem;
            color: #EF4444;
            line-height: 1;
            font-weight: 800;
        }

        /* منطقة الخيارات (الكروت العائمة) */
        .options-grid {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-evenly;
            gap: 12px;
            margin-top: 10px;
        }

        .card-3d {
            flex: 1;
            height: 110px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            color: white;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 12px 20px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            position: relative;
            top: 0;
        }

        /* ألوان الكروت الجذابة */
        .card-3d:nth-child(1) { background: #EC4899; border: 3px solid #F472B6; }
        .card-3d:nth-child(2) { background: #8B5CF6; border: 3px solid #A78BFA; }
        .card-3d:nth-child(3) { background: #06B6D4; border: 3px solid #22D3EE; }

        .card-3d:active {
            top: 6px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        /* رسالة التشجيع */
        .feedback-msg {
            font-size: 1.3rem;
            font-weight: 800;
            color: #065F46;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-top: 10px;
        }

        /* اهتزاز عند الإجابة الخاطئة */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        footer {
            font-size: 0.95rem;
            color: #7C2D12;
            font-weight: 800;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="score-pill">
            <span>⭐ النجوم:</span>
            <span id="score">٠</span>
        </div>
        <button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔊 الصوت</button>
    </div>

    <div class="question-card">
        <div class="question-title" id="question-text">إيه الرقم اللي بيجي أبل؟ 👈</div>
        <div class="target-number-box">
            <div class="target-number" id="target-num">٥</div>
        </div>
    </div>

    <div class="options-grid" id="options-box">
        <!-- الكروت هتتولد هنا -->
    </div>

    <div class="feedback-msg" id="feedback-text"></div>

    <footer>شاطر يا بطل! كمل لعب 🎉</footer>

    <script>
        // الأرقام العربية الفصحى الواضحة
        const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '١٠'];
        const praises = ["الله عليك يا بطل! 🌟", "ممتاز يا عبقري! 🎈", "شاطر أوي! 👏", "فنان يا وحش! 🦁", "إجابة صح! 🎯"];

        let score = 0;
        let currentTarget = 0;
        let isBefore = true;
        let isSoundOn = true;
        let audioCtx = null;

        function playSound(type) {
            if (!isSoundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'wrong') {
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch(e) {}
        }

        function generateQuestion() {
            document.getElementById('feedback-text').innerText = "";
            
            // 75% تركيز على "السابق" (اللي قبل)
            isBefore = Math.random() < 0.75;

            if (isBefore) {
                currentTarget = Math.floor(Math.random() * 10) + 1; // من 1 لـ 10
                document.getElementById('question-text').innerText = "إيه الرقم اللي بيجي أبل (السابق)؟ 👈";
            } else {
                currentTarget = Math.floor(Math.random() * 10); // من 0 لـ 9
                document.getElementById('question-text').innerText = "إيه الرقم اللي بيجي بعد (اللاحق)؟ 👉";
            }

            document.getElementById('target-num').innerText = arabicNumbers[currentTarget];

            const correctAnswer = isBefore ? currentTarget - 1 : currentTarget + 1;

            let options = [correctAnswer];
            while (options.length < 3) {
                let rand = Math.floor(Math.random() * 11);
                if (!options.includes(rand)) {
                    options.push(rand);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            options.forEach(num => {
                const card = document.createElement('div');
                card.className = 'card-3d';
                card.innerText = arabicNumbers[num];
                
                card.onclick = () => checkAnswer(num, correctAnswer, card);

                optionsBox.appendChild(card);
            });
        }

        function checkAnswer(selected, correct, cardElement) {
            if (selected === correct) {
                playSound('correct');
                score += 10;
                
                // تحويل النتيجة لرقم عربي
                let scoreText = score.toString().split('').map(d => arabicNumbers[parseInt(d)]).join('');
                document.getElementById('score').innerText = scoreText;

                confetti({
                    particleCount: 50,
                    spread: 50,
                    origin: { y: 0.8 }
                });

                const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                document.getElementById('feedback-text').innerText = randomPraise;
                document.getElementById('feedback-text').style.color = "#065F46";

                setTimeout(generateQuestion, 1200);
            } else {
                playSound('wrong');
                document.getElementById('feedback-text').innerText = "فكر تاني كده يا بطل! 🤔";
                document.getElementById('feedback-text').style.color = "#B91C1C";
                
                cardElement.classList.add('shake-effect');
                setTimeout(() => cardElement.classList.remove('shake-effect'), 400);
            }
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('sound-btn').innerText = isSoundOn ? "🔊 الصوت" : "🔇 مكتوم";
        }

        generateQuestion();
    </script>
</body>
</html>
