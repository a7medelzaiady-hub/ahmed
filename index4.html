<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة قطار الأرقام العجيب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #80deea 0%, #b2ebf2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 550px;
            width: 100%;
            border-bottom: 8px solid #00acc1;
        }
        h1 {
            color: #00838f;
            margin-bottom: 5px;
            font-size: 2rem;
        }
        .subtitle {
            color: #555;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .score-board {
            font-size: 1.3rem;
            color: #ff8f00;
            font-weight: 900;
            margin-bottom: 20px;
            background: #fff8e1;
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-block;
        }
        .train-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
        }
        .wagon {
            width: 95px;
            height: 110px;
            border: 4px dashed #00838f;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            background-color: #f1f8e9;
            position: relative;
        }
        .wagon.center {
            border: 4px solid #ff9800;
            background-color: #ffe0b2;
            color: #e65100;
        }
        .wagon-label {
            position: absolute;
            top: -28px;
            font-size: 0.85rem;
            color: #333;
            font-weight: 900;
            background: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            border: 2px solid #ccc;
            white-space: nowrap;
        }
        .options-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
        }
        .option-btn:active {
            transform: scale(0.9);
        }
        .active-slot {
            border-color: #e91e63;
            background-color: #fce4ec;
            box-shadow: 0 0 15px rgba(233, 30, 99, 0.4);
        }
        .message {
            font-size: 1.3rem;
            font-weight: 900;
            margin-top: 15px;
            height: 35px;
        }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .instruction-box {
            background: #e0f7fa;
            color: #006064;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .reset-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #00838f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚂 قطار الأرقام العجيب</h1>
    <div class="subtitle">تعلم "القَبْل" و"البَعْد" باللعب للابطال الصغار</div>
    
    <div class="score-board">⭐ النجوم: <span id="score">٠</span></div>

    <div class="instruction-box" id="instruction">يلا نساعد القطار ونختار العدد اللي بيجي الأول!</div>

    <div class="train-container">
        <!-- عربة السابق -->
        <div class="wagon active-slot" id="prev-wagon" onclick="selectSlot('prev')">
            <span class="wagon-label">اللي قبله ⬅️</span>
            <span id="prev-val">؟</span>
        </div>

        <!-- العربة الوسطى -->
        <div class="wagon center">
            <span class="wagon-label">مكان الوقوف</span>
            <span id="current-val">٥</span>
        </div>

        <!-- عربة اللاحق -->
        <div class="wagon" id="next-wagon" onclick="selectSlot('next')">
            <span class="wagon-label">➡️ اللي بعده</span>
            <span id="next-val">؟</span>
        </div>
    </div>

    <!-- خيارات الأرقام -->
    <div class="options-container" id="options"></div>

    <div class="message" id="message"></div>

    <button class="reset-btn" onclick="generateNewQuestion()">سؤال تاني 🔄</button>
</div>

<script>
    // الأرقام العربية المشرقية
    const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '١٠', '١١', '١٢', '١٣', '١٤', '١٥'];

    let currentNum = 5;
    let score = 0;
    let activeSlot = 'prev'; 
    let selectedPrev = null;
    let selectedNext = null;

    function generateNewQuestion() {
        // نختار رقم عشوائي بين 2 و 9 عشان يناسب سن 5 سنوات ويسهل العد
        currentNum = Math.floor(Math.random() * 8) + 2;
        
        document.getElementById('current-val').innerText = arabicNumbers[currentNum];
        document.getElementById('prev-val').innerText = '؟';
        document.getElementById('next-val').innerText = '؟';
        document.getElementById('message').innerText = '';
        
        selectedPrev = null;
        selectedNext = null;
        
        selectSlot('prev');
        generateOptions();
    }

    function selectSlot(slot) {
        activeSlot = slot;
        document.getElementById('prev-wagon').classList.remove('active-slot');
        document.getElementById('next-wagon').classList.remove('active-slot');

        if (slot === 'prev') {
            document.getElementById('prev-wagon').classList.add('active-slot');
            document.getElementById('instruction').innerHTML = `🔍 مين الرقم اللي بيجي <b>قَبْل</b> (${arabicNumbers[currentNum]}) مباشرة؟`;
        } else {
            document.getElementById('next-wagon').classList.add('active-slot');
            document.getElementById('instruction').innerHTML = `🔍 مين الرقم اللي بيجي <b>بَعْد</b> (${arabicNumbers[currentNum]}) مباشرة؟`;
        }
    }

    function generateOptions() {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        const correctPrev = currentNum - 1;
        const correctNext = currentNum + 1;
        
        let numbers = new Set([correctPrev, correctNext]);
        while(numbers.size < 4) {
            let randomNum = Math.floor(Math.random() * 11) + 1;
            if(randomNum !== currentNum) {
                numbers.add(randomNum);
            }
        }

        let shuffled = Array.from(numbers).sort(() => Math.random() - 0.5);

        shuffled.forEach(num => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = arabicNumbers[num];
            btn.onclick = () => checkAnswer(num);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(num) {
        const msgDiv = document.getElementById('message');

        if (activeSlot === 'prev') {
            if (num === currentNum - 1) {
                selectedPrev = num;
                document.getElementById('prev-val').innerText = arabicNumbers[num];
                msgDiv.className = 'message success';
                msgDiv.innerText = 'بطل ممتاز! جبنا اللي قبله صح 👏';
                setTimeout(() => {
                    selectSlot('next');
                    msgDiv.innerText = '';
                }, 1200);
            } else {
                msgDiv.className = 'message error';
                msgDiv.innerText = 'فكر تاني يا بطل! ❌';
            }
        } else if (activeSlot === 'next') {
            if (num === currentNum + 1) {
                selectedNext = num;
                document.getElementById('next-val').innerText = arabicNumbers[num];
                msgDiv.className = 'message success';
                msgDiv.innerText = 'رائع! أكملت القطار بنجاح 🥳🎉';
                
                score += 1;
                document.getElementById('score').innerText = arabicNumbers[score] || score;

                setTimeout(() => {
                    generateNewQuestion();
                }, 1800);
            } else {
                msgDiv.className = 'message error';
                msgDiv.innerText = 'فكر تاني يا بطل! ❌';
            }
        }
    }

    generateNewQuestion();
</script>

</body>
</html>
