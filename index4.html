<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة بيوت الأرقام والحيوانات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #a8e6cf 0%, #dbede3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .card {
            background: white;
            padding: 20px 15px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border-bottom: 8px solid #4caf50;
        }
        h1 {
            color: #2e7d32;
            margin: 0 0 5px 0;
            font-size: 1.6rem;
            font-weight: 900;
        }
        .score-board {
            font-size: 1.2rem;
            color: #ff8f00;
            font-weight: 900;
            margin-bottom: 15px;
            background: #fff8e1;
            padding: 4px 18px;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid #ffe082;
        }
        .instruction-box {
            background: #e8f5e9;
            color: #1b5e20;
            padding: 12px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 2px dashed #81c784;
            line-height: 1.4;
        }

        /* ==================== بيوت الأرقام الثلاثة ==================== */
        .houses-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin: 15px 0 25px 0;
            gap: 8px;
        }
        .house {
            flex: 1;
            background: #f1f8e9;
            border: 4px dashed #81c784;
            border-radius: 20px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.3s;
        }
        .house.center {
            background: #fff3e0;
            border: 4px solid #ff9800;
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(255,152,0,0.2);
        }
        .house-roof {
            font-size: 0.85rem;
            font-weight: 900;
            color: #555;
            background: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 5px;
            white-space: nowrap;
        }
        .animal {
            font-size: 2.8rem;
            height: 50px;
            line-height: 50px;
            transition: transform 0.3s;
        }
        .house-num {
            font-size: 2.2rem;
            font-weight: 900;
            color: #2e7d32;
            margin-top: 5px;
        }
        .house.center .house-num {
            color: #e65100;
            font-size: 2.6rem;
        }

        /* النشاط البصري للبيت المستهدف */
        .target-house {
            border-color: #e91e63 !important;
            background: #fce4ec !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(233, 30, 99, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(233, 30, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(233, 30, 99, 0); }
        }

        /* أنيميشن الإجابة */
        .run-away {
            animation: runAndHide 0.8s forwards ease-in;
        }
        @keyframes runAndHide {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-30px) scale(1.3); }
            100% { transform: translateY(-80px) scale(0); opacity: 0; }
        }

        .yell-anim {
            animation: yellShake 0.5s ease-in-out;
        }
        @keyframes yellShake {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20%, 60% { transform: scale(1.3) rotate(-15deg); }
            40%, 80% { transform: scale(1.3) rotate(15deg); }
        }

        /* ==================== أزرار الخيارات ==================== */
        .options-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .option-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 22px;
            font-size: 2.3rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #e65100;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #e65100;
        }

        .message {
            font-size: 1.2rem;
            font-weight: 900;
            margin-top: 15px;
            min-height: 35px;
        }
        .success { color: #2e7d32; }
        .error { color: #c62828; }

        .next-btn {
            margin-top: 10px;
            padding: 10px 25px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🏡 بيوت الأرقام والحيوانات 🐱</h1>
    <div class="score-board">⭐ النجوم: <span id="score">٠</span></div>

    <div class="instruction-box" id="instruction">جاري التحميل...</div>

    <!-- البيوت الثلاثة -->
    <div class="houses-container">
        <!-- بيت السابق -->
        <div class="house" id="house-prev">
            <span class="house-roof">اللي قَبْله ⬅️</span>
            <div class="animal" id="animal-prev">❓</div>
            <div class="house-num" id="num-prev">؟</div>
        </div>

        <!-- البيت الحالي -->
        <div class="house center">
            <span class="house-roof">الرقم الأساسي</span>
            <div class="animal" id="animal-curr">🦁</div>
            <div class="house-num" id="num-curr">٥</div>
        </div>

        <!-- بيت اللاحق -->
        <div class="house" id="house-next">
            <span class="house-roof">➡️ اللي بَعْده</span>
            <div class="animal" id="animal-next">❓</div>
            <div class="house-num" id="num-next">؟</div>
        </div>
    </div>

    <!-- الخيارات -->
    <div class="options-container" id="options"></div>

    <div class="message" id="message"></div>

    <button class="next-btn" onclick="generateNewQuestion()">سؤال جديد 🔄</button>
</div>

<script>
    const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '١٠'];
    const animalIcons = ['🐱', '🐰', '🦊', '🐼', '🐘', '🐶', '🐵', '🐸', '🐻', '🐯'];

    let currentNum = 5;
    let score = 0;
    let activeSlot = 'prev'; // 'prev' أو 'next'
    let currentAnimal = '🐱';

    // ==================== نظام الصوتيات Web Audio API ====================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Do
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // Mi
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // Sol
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

    // ==================== منطق اللعبة ====================
    function generateNewQuestion() {
        // نختار رقم بسيط بين 2 و 8 يناسب سن 5 سنوات
        currentNum = Math.floor(Math.random() * 7) + 2;
        currentAnimal = animalIcons[Math.floor(Math.random() * animalIcons.length)];
        activeSlot = 'prev';

        // ضبط الواجهة
        document.getElementById('num-curr').innerText = arabicNumbers[currentNum];
        document.getElementById('animal-curr').innerText = currentAnimal;

        document.getElementById('num-prev').innerText = '؟';
        document.getElementById('animal-prev').innerText = '❓';
        
        document.getElementById('num-next').innerText = '؟';
        document.getElementById('animal-next').innerText = '❓';

        document.getElementById('message').innerText = '';

        updateActiveHouse();
        updateInstruction();
        generateOptions();
    }

    function updateActiveHouse() {
        document.getElementById('house-prev').classList.remove('target-house');
        document.getElementById('house-next').classList.remove('target-house');

        if (activeSlot === 'prev') {
            document.getElementById('house-prev').classList.add('target-house');
        } else {
            document.getElementById('house-next').classList.add('target-house');
        }
    }

    function updateInstruction() {
        const inst = document.getElementById('instruction');
        if (activeSlot === 'prev') {
            inst.innerHTML = `مين الرقم اللي ساكن في البيت <b>اللي قَبْل</b> الرقم (${arabicNumbers[currentNum]})؟ ⬅️`;
        } else {
            inst.innerHTML = `بطل! ومين الرقم اللي ساكن في البيت <b>اللي بَعْد</b> الرقم (${arabicNumbers[currentNum]})؟ ➡️`;
        }
    }

    function generateOptions() {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        const targetNum = activeSlot === 'prev' ? currentNum - 1 : currentNum + 1;

        let numbers = new Set([targetNum]);
        while(numbers.size < 3) { // 3 خيارات فقط لتسهيل الإجابة وعدم التشتيت
            let rand = Math.floor(Math.random() * 9) + 1;
            if(rand !== currentNum) {
                numbers.add(rand);
            }
        }

        let shuffled = Array.from(numbers).sort(() => Math.random() - 0.5);

        shuffled.forEach(num => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = arabicNumbers[num];
            btn.onclick = () => {
                initAudio();
                checkAnswer(num);
            };
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(chosenNum) {
        const targetNum = activeSlot === 'prev' ? currentNum - 1 : currentNum + 1;
        const msgDiv = document.getElementById('message');

        if (chosenNum === targetNum) {
            playSound('correct');

            if (activeSlot === 'prev') {
                document.getElementById('num-prev').innerText = arabicNumbers[chosenNum];
                document.getElementById('animal-prev').innerText = '🎉';
                msgDiv.className = 'message success';
                msgDiv.innerText = 'شاطر جداً! اخترت الرقم اللي قبله صح 👏';

                setTimeout(() => {
                    activeSlot = 'next';
                    updateActiveHouse();
                    updateInstruction();
                    generateOptions();
                    msgDiv.innerText = '';
                }, 1200);
            } else {
                document.getElementById('num-next').innerText = arabicNumbers[chosenNum];
                document.getElementById('animal-next').innerText = '🎉';
                msgDiv.className = 'message success';
                msgDiv.innerText = 'ممتاز! أكملت البيوت بنجاح 🥳🎉';

                score++;
                document.getElementById('score').innerText = arabicNumbers[score] || score;

                setTimeout(() => {
                    generateNewQuestion();
                }, 1600);
            }

        } else {
            playSound('wrong');
            const targetHouse = activeSlot === 'prev' ? document.getElementById('house-prev') : document.getElementById('house-next');
            
            targetHouse.classList.remove('yell-anim');
            void targetHouse.offsetWidth;
            targetHouse.classList.add('yell-anim');

            msgDiv.className = 'message error';
            msgDiv.innerText = `فكر تاني يا بطل! ❌`;
        }
    }

    window.addEventListener('click', initAudio, { once: true });
    generateNewQuestion();
</script>

</body>
</html>
