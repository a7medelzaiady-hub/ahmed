<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة قطار الأرقام العجيب</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #00838f;
            margin-bottom: 10px;
        }
        .score-board {
            font-size: 1.2rem;
            color: #006064;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .train-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
        }
        .wagon {
            width: 90px;
            height: 100px;
            border: 4px dashed #00838f;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            background-color: #f1f8e9;
            position: relative;
        }
        .wagon.center {
            border: 4px solid #ff9800;
            background-color: #ffe0b2;
            color: #e65100;
        }
        .wagon-label {
            position: absolute;
            top: -25px;
            font-size: 0.8rem;
            color: #555;
            font-weight: bold;
        }
        .options-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .option-btn:hover {
            transform: scale(1.1);
            background-color: #388e3c;
        }
        .active-slot {
            border-color: #ff4081;
            box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
        }
        .message {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            height: 30px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #00838f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚂 قطار الأرقام العجيب</h1>
    <p>ساعد القطار على معرفة العدد **السابق** والعدد **اللاحق**!</p>
    
    <div class="score-board">⭐ النقاط: <span id="score">0</span></div>

    <div class="train-container">
        <!-- عربة السابق -->
        <div class="wagon active-slot" id="prev-wagon" onclick="selectSlot('prev')">
            <span class="wagon-label">العدد السابق (-1)</span>
            <span id="prev-val">؟</span>
        </div>

        <!-- العربة الوسطى -->
        <div class="wagon center">
            <span class="wagon-label">العدد الحالي</span>
            <span id="current-val">5</span>
        </div>

        <!-- عربة اللاحق -->
        <div class="wagon" id="next-wagon" onclick="selectSlot('next')">
            <span class="wagon-label">العدد اللاحق (+1)</span>
            <span id="next-val">؟</span>
        </div>
    </div>

    <p id="instruction">اختر الرقم المناسب للخانة المحددة باللون الوردي!</p>

    <!-- خيارات الأرقام -->
    <div class="options-container" id="options"></div>

    <div class="message" id="message"></div>

    <button class="reset-btn" onclick="generateNewQuestion()">سؤال جديد 🔄</button>
</div>

<script>
    let currentNum = 5;
    let score = 0;
    let activeSlot = 'prev';
    let selectedPrev = null;
    let selectedNext = null;

    function generateNewQuestion() {
        currentNum = Math.floor(Math.random() * 17) + 2;
        
        document.getElementById('current-val').innerText = currentNum;
        document.getElementById('prev-val').innerText = '؟';
        document.getElementById('next-val').innerText = '؟';
        document.getElementById('message').innerText = '';
        
        selectedPrev = null;
        selectedNext = null;
        
        selectSlot('prev');
        generateOptions();
    }

    function selectSlot(slot) {
        activeSlot = slot;
        document.getElementById('prev-wagon').classList.remove('active-slot');
        document.getElementById('next-wagon').classList.remove('active-slot');

        if (slot === 'prev') {
            document.getElementById('prev-wagon').classList.add('active-slot');
            document.getElementById('instruction').innerText = `ما هو العدد الذي يقع قَبْل الرقم (${currentNum})؟`;
        } else {
            document.getElementById('next-wagon').classList.add('active-slot');
            document.getElementById('instruction').innerText = `ما هو العدد الذي يقع بَعْد الرقم (${currentNum})؟`;
        }
    }

    function generateOptions() {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        const correctPrev = currentNum - 1;
        const correctNext = currentNum + 1;
        
        let numbers = new Set([correctPrev, correctNext]);
        while(numbers.size < 6) {
            let randomNum = currentNum + Math.floor(Math.random() * 7) - 3;
            if(randomNum > 0 && randomNum !== currentNum) {
                numbers.add(randomNum);
            }
        }

        let shuffled = Array.from(numbers).sort(() => Math.random() - 0.5);

        shuffled.forEach(num => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = num;
            btn.onclick = () => checkAnswer(num);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(num) {
        const msgDiv = document.getElementById('message');

        if (activeSlot === 'prev') {
            if (num === currentNum - 1) {
                selectedPrev = num;
                document.getElementById('prev-val').innerText = num;
                msgDiv.className = 'message success';
                msgDiv.innerText = 'ممتاز! إجابة صحيحة 👏';
                setTimeout(() => {
                    selectSlot('next');
                    msgDiv.innerText = '';
                }, 1000);
            } else {
                msgDiv.className = 'message error';
                msgDiv.innerText = 'حاول مرة أخرى! ❌';
            }
        } else if (activeSlot === 'next') {
            if (num === currentNum + 1) {
                selectedNext = num;
                document.getElementById('next-val').innerText = num;
                msgDiv.className = 'message success';
                msgDiv.innerText = 'بطل! أكملت القطار بنجاح 🥳🎉';
                
                score += 10;
                document.getElementById('score').innerText = score;

                setTimeout(() => {
                    generateNewQuestion();
                }, 1500);
            } else {
                msgDiv.className = 'message error';
                msgDiv.innerText = 'حاول مرة أخرى! ❌';
            }
        }
    }

    generateNewQuestion();
</script>

</body>
</html>
