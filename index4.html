<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة خط الأعداد والحيوانات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #a8e6cf 0%, #dbede3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }
        .card {
            background: white;
            padding: 25px 15px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 750px;
            width: 100%;
            border-bottom: 8px solid #4caf50;
        }
        h1 {
            color: #2e7d32;
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }
        .score-board {
            font-size: 1.2rem;
            color: #ff8f00;
            font-weight: 900;
            margin-bottom: 15px;
            background: #fff8e1;
            padding: 6px 15px;
            border-radius: 50px;
            display: inline-block;
        }
        .instruction-box {
            background: #e8f5e9;
            color: #1b5e20;
            padding: 12px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 2px dashed #81c784;
        }

        /* ==================== خط الأعداد والحيوانات ==================== */
        .number-line-container {
            position: relative;
            margin: 60px 10px 40px 10px;
            padding-top: 40px;
        }
        .animals-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: absolute;
            top: -45px;
            left: 0;
            right: 0;
            padding: 0 5px;
        }
        .animal-spot {
            width: 35px;
            font-size: 2rem;
            text-align: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
            cursor: pointer;
        }
        /* أنيميشن الجري والإختفاء */
        .run-away {
            animation: runAndHide 0.8s forwards ease-in;
        }
        @keyframes runAndHide {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-30px) scale(1.3) rotate(20deg); }
            100% { transform: translateX(200px) scale(0) rotate(45deg); opacity: 0; }
        }
        /* أنيميشن الزعيق / الاهتزاز عند الخطأ */
        .yell-anim {
            animation: yellShake 0.5s ease-in-out;
        }
        @keyframes yellShake {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.4) rotate(-15deg); }
            40% { transform: scale(1.4) rotate(15deg); }
            60% { transform: scale(1.4) rotate(-15deg); }
            80% { transform: scale(1.4) rotate(15deg); }
        }

        .line-bar {
            height: 8px;
            background: #4caf50;
            border-radius: 4px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .line-bar::before, .line-bar::after {
            content: '';
            position: absolute;
            top: -6px;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }
        .line-bar::before { right: -8px; border-left: 12px solid #4caf50; }
        .line-bar::after { left: -8px; border-right: 12px solid #4caf50; }

        .tick-mark {
            width: 4px;
            height: 20px;
            background: #2e7d32;
            position: relative;
        }
        .number-label {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            font-weight: 900;
            color: #1b5e20;
        }
        .highlight-num {
            color: #e91e63;
            font-size: 1.5rem;
        }

        /* ==================== خيارات الأرقام ==================== */
        .options-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .option-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #e65100;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #e65100;
        }

        .message {
            font-size: 1.3rem;
            font-weight: 900;
            margin-top: 15px;
            height: 35px;
        }
        .success { color: #2e7d32; }
        .error { color: #c62828; }

        .next-btn {
            margin-top: 15px;
            padding: 10px 25px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🦁 لعبة خط الأعداد والحيوانات 🐰</h1>
    <div class="score-board">⭐ النجوم: <span id="score">٠</span></div>

    <div class="instruction-box" id="instruction">جاري التحميل...</div>

    <!-- خط الأعداد والتفاعل -->
    <div class="number-line-container">
        <!-- صف الحيوانات فوق الخط -->
        <div class="animals-row" id="animals-row"></div>
        <!-- الخط المستقيم والتشريرات -->
        <div class="line-bar" id="line-ticks"></div>
    </div>

    <!-- زر الخيارات -->
    <div class="options-container" id="options"></div>

    <div class="message" id="message"></div>

    <button class="next-btn" onclick="generateNewQuestion()">سؤال جديد 🔄</button>
</div>

<script>
    const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '١٠'];
    const animalIcons = ['🦁', '🐰', '🦊', '🐼', '🐘', '🐱', '🐶', '🐵', '🐸', '🐻', '🐯'];
    
    let currentNum = 5;
    let score = 0;
    let activeSlot = 'prev'; // 'prev' أو 'next'
    let currentAnimals = [...animalIcons];

    function buildNumberLine() {
        const ticksContainer = document.getElementById('line-ticks');
        const animalsRow = document.getElementById('animals-row');
        ticksContainer.innerHTML = '';
        animalsRow.innerHTML = '';

        for (let i = 0; i <= 10; i++) {
            // إضافة العلامات والأرقام على الخط
            const tick = document.createElement('div');
            tick.className = 'tick-mark';
            
            const label = document.createElement('div');
            label.className = 'number-label';
            label.id = `label-${i}`;
            label.innerText = arabicNumbers[i];
            tick.appendChild(label);
            
            ticksContainer.appendChild(tick);

            // إضافة الحيوان فوق الرقم
            const animalSpot = document.createElement('div');
            animalSpot.className = 'animal-spot';
            animalSpot.id = `animal-${i}`;
            animalSpot.innerText = currentAnimals[i];
            animalsRow.appendChild(animalSpot);
        }
    }

    function generateNewQuestion() {
        // اختيارات عشوائية للحيوانات وتمرير الأرقام
        currentNum = Math.floor(Math.random() * 8) + 1; // من 1 إلى 8 لضمان وجود سابق ولاحق
        activeSlot = 'prev';
        
        buildNumberLine();
        
        document.getElementById(`label-${currentNum}`).classList.add('highlight-num');
        document.getElementById('message').innerText = '';
        
        updateInstruction();
        generateOptions();
    }

    function updateInstruction() {
        const inst = document.getElementById('instruction');
        if (activeSlot === 'prev') {
            inst.innerHTML = `مين الحيوان اللي وافق على الرقم <b>اللي قَبْل</b> (${arabicNumbers[currentNum]})؟ ⬅️`;
        } else {
            inst.innerHTML = `ممتاز! طب مين الحيوان اللي على الرقم <b>اللي بَعْد</b> (${arabicNumbers[currentNum]})؟ ➡️`;
        }
    }

    function generateOptions() {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        const targetNum = activeSlot === 'prev' ? currentNum - 1 : currentNum + 1;
        
        let numbers = new Set([targetNum]);
        while(numbers.size < 4) {
            let rand = Math.floor(Math.random() * 11);
            if(rand !== currentNum) {
                numbers.add(rand);
            }
        }

        let shuffled = Array.from(numbers).sort(() => Math.random() - 0.5);

        shuffled.forEach(num => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = arabicNumbers[num];
            btn.onclick = () => checkAnswer(num);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(chosenNum) {
        const targetNum = activeSlot === 'prev' ? currentNum - 1 : currentNum + 1;
        const animalEl = document.getElementById(`animal-${chosenNum}`);
        const msgDiv = document.getElementById('message');

        if (chosenNum === targetNum) {
            // إجابة صحيحة: الحيوان يجري ويختفي!
            animalEl.classList.remove('yell-anim');
            animalEl.classList.add('run-away');
            
            msgDiv.className = 'message success';
            msgDiv.innerText = 'صح! الحيوان جرى وفرح بيك! 🏃‍♂️💨';

            if (activeSlot === 'prev') {
                setTimeout(() => {
                    activeSlot = 'next';
                    updateInstruction();
                    generateOptions();
                    msgDiv.innerText = '';
                }, 1200);
            } else {
                score++;
                document.getElementById('score').innerText = arabicNumbers[score] || score;
                setTimeout(() => {
                    generateNewQuestion();
                }, 1500);
            }

        } else {
            // إجابة خاطئة: الحيوان يزعق ويهتز!
            animalEl.classList.remove('yell-anim');
            // إجبار إعادة الأنيميشن
            void animalEl.offsetWidth; 
            animalEl.classList.add('yell-anim');
            
            msgDiv.className = 'message error';
            msgDiv.innerText = `😡 الحيوان بيزعق وبيقولك: لا أنا مش الرقم الصحيح!`;
        }
    }

    // تشغيل اللعبة لأول مرة
    generateNewQuestion();
</script>

</body>
</html>
