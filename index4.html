<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأرقام الذكية - السابق واللاحق</title>
    <!-- مكتبة الألعاب النارية احتفالاً بالطفل -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            perspective: 1000px;
        }

        /* الهيدر والنتيجة */
        header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .score-box {
            background: #FFD700;
            color: #d84315;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 6px 0 #c7a700, 0 10px 20px rgba(0,0,0,0.15);
            transform-style: preserve-3d;
            animation: float 4s ease-in-out infinite;
        }

        /* زر الصوت */
        .sound-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e7d32;
            font-family: 'Cairo', sans-serif;
        }

        /* حاوية السؤال والكروت */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .question-card {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 30px;
            padding: 20px 40px;
            text-align: center;
            box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
            margin-bottom: 40px;
            transform: rotateX(10deg);
            animation: float 3s ease-in-out infinite;
        }

        .question-title {
            font-size: 32px;
            color: #6a1b9a;
            margin: 0 0 10px 0;
        }

        .target-number {
            font-size: 80px;
            color: #ff3d00;
            text-shadow: 3px 3px 0px #ff9e80;
            margin: 0;
            line-height: 1;
        }

        /* خيارات الكروت الثلاثية الأبعاد */
        .options-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            width: 100%;
            flex-wrap: wrap;
        }

        .3d-card {
            width: 120px;
            height: 160px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 0 15px rgba(255,255,255,0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            animation: float 3.5s ease-in-out infinite;
            border: 4px solid #fff;
        }

        /* كروت بألوان مختلفة عشان تتألق */
        .3d-card:nth-child(1) { background: linear-gradient(135deg, #FF512F, #DD2476); animation-delay: 0s; }
        .3d-card:nth-child(2) { background: linear-gradient(135deg, #11998e, #38ef7d); animation-delay: 0.5s; }
        .3d-card:nth-child(3) { background: linear-gradient(135deg, #FFB75E, #ED8F03); animation-delay: 1s; }

        .3d-card:hover {
            transform: translateY(-15px) scale(1.08) rotateY(10deg);
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }

        .3d-card:active {
            transform: translateY(-5px) scale(0.98);
        }

        /* رسائل التشجيع */
        .feedback {
            font-size: 35px;
            font-weight: 900;
            height: 50px;
            margin-top: 20px;
            color: #2e7d32;
            text-shadow: 2px 2px 0px #fff;
        }

        /* أنيميشن الطوفان العايم */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* شريط سفلي تحفيزي */
        footer {
            margin-bottom: 20px;
            font-size: 20px;
            color: #424242;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="score-box">النجوم: <span id="score">0</span> ⭐</div>
        <button class="sound-btn" onclick="toggleMusic()">🔊 الموسيقى</button>
    </header>

    <div class="game-container">
        <div class="question-card">
            <h2 class="question-title" id="question-text">إيه الرقم اللي بيجي أبل؟</h2>
            <div class="target-number" id="target-num">٥</div>
        </div>

        <div class="options-container" id="options-box">
            <!-- الكروت هتتنزل هنا بالـ JavaScript -->
        </div>

        <div class="feedback" id="feedback-text"></div>
    </div>

    <footer>شاطر يا بطل! كمل لعب وسلّي وقتك 🎉</footer>

    <script>
        // الأرقام بالعربي
        const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '١٠'];
        const praises = ["الله عليك يا بطل! 🌟", "ممتاز يا عبقري! 🎈", "شاطر أوي! 👏", "فنان يا وحش! 🦁", "إجابة صح! 🎯"];

        let score = 0;
        let currentTarget = 0;
        let isBefore = true; // نركز أكتر على "السابق"
        let audioCtx = null;
        let isSoundOn = true;

        // تهيئة الأصوات بسيطة بدعم المتصفحات
        function playSound(type) {
            if (!isSoundOn) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        function generateQuestion() {
            document.getElementById('feedback-text').innerText = "";
            
            // 70% تركيز على الرقم "السابق" (اللي قبل) و 30% على "اللاحق" (اللي بعد)
            isBefore = Math.random() < 0.7;

            if (isBefore) {
                // نختار رقم من 1 لـ 10 عشان ينفع نجيب اللي قبله
                currentTarget = Math.floor(Math.random() * 10) + 1;
                document.getElementById('question-text').innerText = "إيه الرقم اللي بيجي أبل (السابق)؟ 👈";
            } else {
                // نختار رقم من 0 لـ 9 عشان ينفع نجيب اللي بعده
                currentTarget = Math.floor(Math.random() * 10);
                document.getElementById('question-text').innerText = "إيه الرقم اللي بيجي بعد (اللاحق)؟ 👉";
            }

            document.getElementById('target-num').innerText = arabicNumbers[currentTarget];

            // الإجابة الصحيحة
            const correctAnswer = isBefore ? currentTarget - 1 : currentTarget + 1;

            // خيارات خادعة (غلط)
            let options = [correctAnswer];
            while (options.length < 3) {
                let randomOption = Math.floor(Math.random() * 11);
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }

            // لغبطة ترتيب الخيارات
            options.sort(() => Math.random() - 0.5);

            // رسم الكروت
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            options.forEach(num => {
                const card = document.createElement('div');
                card.className = '3d-card';
                card.innerText = arabicNumbers[num];
                
                // إضافة حركة للمس على الموبايل والماوس
                card.onclick = () => checkAnswer(num, correctAnswer, card);
                card.onpointerdown = () => playSound('click');

                optionsBox.appendChild(card);
            });
        }

        function checkAnswer(selected, correct, cardElement) {
            if (selected === correct) {
                playSound('correct');
                score += 10;
                document.getElementById('score').innerText = arabicNumbers[score] || score;

                // إطلاق الألعاب النارية والبلونات
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.7 }
                });

                const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                document.getElementById('feedback-text').innerText = randomPraise;

                // الانتقال للسؤال التالي بعد ثانية ونصف
                setTimeout(generateQuestion, 1500);
            } else {
                playSound('wrong');
                document.getElementById('feedback-text').innerText = "فكر تاني كده يا بطل! 🤔";
                
                // اهتزاز الكارت الخاطئ
                cardElement.style.animation = "none";
                cardElement.style.transform = "shake 0.5s";
                setTimeout(() => {
                    cardElement.style.animation = "float 3.5s ease-in-out infinite";
                }, 500);
            }
        }

        function toggleMusic() {
            isSoundOn = !isSoundOn;
            const btn = document.querySelector('.sound-btn');
            btn.innerText = isSoundOn ? "🔊 الصوت شغال" : "🔇 الصوت مقفول";
        }

        // تشغيل اللعبة فوراً
        generateQuestion();
    </script>
</body>
</html>
