<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="auth-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحركة اليومية — الزيادي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5e3d">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--g8:#0b4e33;--g7:#0f6e48;--g6:#16a34a;--g1:#dcfce7;--g0:#f0fdf4;--a7:#b45309;--b7:#0369a1;--r7:#b91c1c;--r1:#fee2e2;--r0:#fef2f2;--s9:#0f172a;--s5:#64748b;--wh:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8edea;font-family:'Cairo',sans-serif;color:var(--s9);font-size:.85rem;padding-bottom:60px}
.topbar{background:var(--g8);height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar h1{font-size:.95rem;font-weight:800;color:#fff}
.tb-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.bar{background:var(--wh);padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #d0ddd6;flex-wrap:wrap}
.bar label{font-weight:800;font-size:.72rem;color:var(--s5)}
.bar input{font-family:'Cairo';font-weight:700;border:1.5px solid #9fd3b5;background:var(--g0);border-radius:7px;padding:3px 6px;color:var(--g8)}
.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}
.tot{background:var(--wh);border:1px solid #dde8e2;border-radius:12px;padding:10px;text-align:center}
.tot small{display:block;font-size:.65rem;font-weight:800;color:var(--s5)}
.tot b{font-size:1rem;font-weight:900}
.days{padding:0 10px;display:flex;flex-direction:column;gap:10px}
.day{background:var(--wh);border-radius:12px;border:1px solid #d0ddd6;overflow:hidden;border-right:5px solid var(--g6)}
.day.loss{border-right-color:var(--r7)}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--g0);font-weight:900}
.day.loss .day-h{background:var(--r0)}
.day-h span{font-size:.7rem;color:var(--s5);font-weight:700}
.row{display:flex;justify-content:space-between;padding:6px 12px;border-top:1px solid #eef3f0;font-weight:700}
.row.net{font-size:.95rem;font-weight:900;background:var(--g1);color:var(--g7)}
.day.loss .row.net{background:var(--r1);color:var(--r7)}
.det{padding:4px 12px 8px;font-size:.7rem;font-weight:700;color:var(--s5);display:flex;flex-wrap:wrap;gap:4px}
.det i{font-style:normal;background:var(--r0);color:var(--r7);border:1px solid #fecaca;border-radius:6px;padding:1px 7px}
.s{color:var(--b7)}.c{color:var(--a7)}.e{color:var(--r7)}
.tbl{margin:0 10px;background:#fff;border:1px solid #d0ddd6;border-radius:12px;overflow:hidden}
.tbl-in{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-weight:700;white-space:nowrap}
th{background:var(--g8);color:#fff;padding:9px 8px;font-size:.74rem;text-align:center}
td{padding:9px 8px;text-align:center;border-bottom:1px solid #eef3f0}
td:first-child{text-align:right;background:var(--g0);font-weight:900}
td:first-child small{display:block;font-size:.65rem;color:var(--s5);font-weight:700}
td.win{background:var(--g1);color:var(--g7);font-weight:900}
td.lose{background:var(--r1);color:var(--r7);font-weight:900}
tfoot td{background:#ecf5ef;font-weight:900;border-top:2px solid #b6d5c4}
.empty{text-align:center;padding:40px;color:var(--s5);font-weight:700}
.warn{margin:8px 10px 0;background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:7px 12px;font-size:.72rem;font-weight:800;display:none}
</style>
</head>
<body>
<nav class="topbar">
  <h1><i class="fas fa-calendar-day"></i> الحركة اليومية — الزيادي</h1>
  <a href="index.html" class="tb-btn"><i class="fas fa-home"></i></a>
</nav>
<div class="bar">
  <label>من</label><input type="date" id="fromD">
  <label>إلى</label><input type="date" id="toD">
</div>
<div class="warn" id="warn"></div>
<div class="tbl"><div class="tbl-in"><table>
<thead><tr><th>اليوم</th><th>المبيعات</th><th>المشتريات</th><th>المصروفات</th><th>ربح اليوم</th></tr></thead>
<tbody id="days"><tr><td colspan="5" class="empty">جاري تحميل البيانات…</td></tr></tbody>
<tfoot id="foot"></tfoot>
</table></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain:"ahmedelzaiady.firebaseapp.com",
  projectId:"ahmedelzaiady",
  storageBucket:"ahmedelzaiady.firebasestorage.app",
  messagingSenderId:"300306825071",
  appId:"1:300306825071:web:0426ddde56280fa090329a"
});
let db;
try { db = initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentSingleTabManager()})}); }
catch(e){ db = getFirestore(app); }

// اسم مجموعة فواتير الشراء في Firestore (الفواتير اللي بتتعمل من new-purchase-invoice.html)
// لو اسمها مختلف عندك غيّره هنا فقط
const PURCHASE_COLLECTIONS = ["supplier_transactions"]; // نفس مجموعة سجل فواتير الشراء

const DAY_NAMES = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

let salesInv = [], purchBy = {}, expenses = [];
const ready = {sales:false, purch:false, exp:false};

function toEn(s){ if(!s) return ""; let r=s.toString(); "٠١٢٣٤٥٦٧٨٩".split("").forEach((d,i)=>r=r.split(d).join(i)); return r; }
function parseDate(df,ts){
  if(df){
    const s=toEn(df);
    let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  if(ts?.seconds) return new Date(ts.seconds*1000).toISOString().slice(0,10);
  return "";
}
const f0 = n => Math.round(n).toLocaleString('en-US') + " ج";

// إجمالي فاتورة المبيعات = مجموع (الكمية × السعر) للأصناف بدون المرتجع
function salesTotal(inv){
  if(!Array.isArray(inv.items)) return 0;
  return inv.items.reduce((s,it)=>{
    if(it.isReturn) return s;
    const q=Number(it.qty)||0, p=Number(it.price)||0;
    return q>0 ? s+q*p : s;
  },0);
}
// إجمالي فاتورة الشراء (نفس منطق سجل المشتريات): مرتجع الشراء بيتخصم
function purchaseSigned(inv){
  const amt = Number(inv.grossTotal) || Number(inv.total) || Number(inv.amount) || 0;
  if(inv.type==="مرتجع شراء" || inv.type==="مرتجع") return -amt;
  if(inv.type==="شراء" || inv.type==="فاتورة شراء" || !inv.type) return amt;
  return 0;
}

function render(){
  if(!(ready.sales && ready.purch && ready.exp)) return;
  const from = document.getElementById("fromD").value;
  const to = document.getElementById("toD").value;
  const inRange = d => d && !(from && d<from) && !(to && d>to);
  const byDay = {};
  const get = d => byDay[d] = byDay[d] || {sales:0,purch:0,exp:0,expItems:{}};

  salesInv.forEach(inv=>{
    const d=parseDate(inv.date, inv.timestamp);
    if(inRange(d)) get(d).sales += salesTotal(inv);
  });
  Object.values(purchBy).flat().forEach(inv=>{
    const d=parseDate(inv.date, inv.timestamp||inv.createdAt);
    if(inRange(d)) get(d).purch += purchaseSigned(inv);
  });
  expenses.forEach(e=>{
    const d=parseDate(e.date, e.timestamp);
    if(!inRange(d)) return;
    const o=get(d), a=Number(e.amount)||0;
    o.exp += a;
    o.expItems[e.type||"أخرى"] = (o.expItems[e.type||"أخرى"]||0)+a;
  });

  const dates = Object.keys(byDay).sort((a,b)=>b.localeCompare(a));
  let TS=0,TC=0,TE=0, html="";
  dates.forEach(d=>{
    const o=byDay[d];
    const net=o.sales-o.purch-o.exp;
    TS+=o.sales; TC+=o.purch; TE+=o.exp;
    const dt=new Date(d+"T12:00:00");
    html += `<tr>
      <td>${DAY_NAMES[dt.getDay()]}<small>${d.replace(/-/g,'/')}</small></td>
      <td class="s">${f0(o.sales)}</td>
      <td class="c">${f0(o.purch)}</td>
      <td class="e">${f0(o.exp)}</td>
      <td class="${net>=0?'win':'lose'}">${net<0?'-':''}${f0(Math.abs(net))}</td>
    </tr>`;
  });
  document.getElementById("days").innerHTML = html || '<tr><td colspan="5" class="empty">لا توجد حركة في هذه الفترة</td></tr>';
  const net=TS-TC-TE;
  document.getElementById("foot").innerHTML = dates.length ? `<tr><td>الإجمالي</td><td>${f0(TS)}</td><td>${f0(TC)}</td><td>${f0(TE)}</td><td style="color:${net<0?'var(--r7)':'var(--g7)'}">${net<0?'-':''}${f0(Math.abs(net))}</td></tr>` : "";

  const w=document.getElementById("warn");
  if(Object.values(purchBy).flat().length===0){
    w.style.display="block";
    w.textContent=`تنبيه: لا توجد فواتير شراء مسجلة في supplier_transactions.`;
  } else w.style.display="none";
}

document.addEventListener("DOMContentLoaded",()=>{
  const t=new Date(), p=new Date(); p.setDate(p.getDate()-29);
  const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  document.getElementById("toD").value=fmt(t);
  document.getElementById("fromD").value=fmt(p);
  document.getElementById("fromD").onchange=render;
  document.getElementById("toD").onchange=render;

  onSnapshot(collection(db,"invoices"),snap=>{
    salesInv=[]; snap.forEach(d=>{const x=d.data(); if(x.isDeleted!==true) salesInv.push(x);});
    ready.sales=true; render();
  });
  let purchLoaded=0;
  PURCHASE_COLLECTIONS.forEach(name=>{
    onSnapshot(collection(db,name),snap=>{
      purchBy[name]=[]; snap.forEach(d=>{const x=d.data(); if(x.isDeleted!==true) purchBy[name].push(x);});
      if(++purchLoaded>=PURCHASE_COLLECTIONS.length) ready.purch=true;
      render();
    },()=>{ purchBy[name]=[]; if(++purchLoaded>=PURCHASE_COLLECTIONS.length) ready.purch=true; render(); });
  });
  onSnapshot(collection(db,"expenses"),snap=>{
    expenses=[]; snap.forEach(d=>expenses.push(d.data()));
    ready.exp=true; render();
  });
});
</script>
</body>
</html>
