<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الزيادي لزيوت السيارات - متجر الطلبات الذكي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b0764">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-purple: #3b0764;
            --purple-gradient: linear-gradient(135deg, #3b0764 0%, #6b21a8 50%, #581c87 100%);
            --bg-light: #f3f0fa;
            --text-dark: #1e1b4b;
            --yellow: #ffd814;
            --shadow-3d: 0 6px 18px -4px rgba(59, 7, 100, 0.15), 0 3px 6px -3px rgba(0, 0, 0, 0.06);
        }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-dark); padding-bottom: 96px; -webkit-tap-highlight-color: transparent; }

        /* ===== الهيدر المضغوط ===== */
        .hero-banner { background: var(--purple-gradient); color: #fff; padding: 8px 12px 9px; }
        .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .brand-title { font-weight: 900; font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .brand-title i { font-size: .8rem; opacity: .8; }
        .hero-contacts { display: flex; gap: 6px; margin-top: 6px; }
        .hc { flex: 1; justify-content: center; display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 5px 6px; font-size: .74rem; white-space: nowrap; font-weight: 800; color: #fff; text-decoration: none; }
        .hc i { font-size: .85rem; }
        .hc.wa i { color: #4ade80; }
        .hc.ph i { color: #facc15; }
        .deadline-friendly-banner { margin-top: 6px; font-size: .68rem; font-weight: 700; opacity: .9; display: flex; align-items: center; gap: 6px; }

        /* بطاقة التاجر والرصيد */
        .account-card { background: #fff; border-radius: 14px; padding: 9px 12px; box-shadow: var(--shadow-3d); border: 1px solid rgba(107,33,168,.1); margin-top: 8px; }
        .acc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .acc-hello { font-size: .68rem; font-weight: 700; color: #7c3aed; line-height: 1.1; }
        .acc-name { font-weight: 800; font-size: .95rem; line-height: 1.2; }
        .balance-pill { border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: .82rem; display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .balance-due { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
        .balance-credit { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .balance-zero { background: #f5f3ff; color: #6b21a8; border: 1px solid #ddd6fe; }
        #balanceUpdated { font-size: .6rem; color: #6b7280; margin-top: 3px; }

        .net-banner { display: none; background: #92400e; color: #fef3c7; text-align: center; font-weight: 700; font-size: .78rem; padding: 6px 10px; }

        /* ===== الشريط العلوي الثابت (بحث + سلة + فلاتر) ===== */
        .topbar { position: sticky; top: 0; z-index: 1010; background: var(--purple-gradient); padding: 8px 10px 6px; margin-top: 8px; box-shadow: 0 4px 10px rgba(59,7,100,.25); }
        .tb-row { display: flex; align-items: center; gap: 10px; }
        .sbox { flex: 1; display: flex; background: #fff; border-radius: 10px; overflow: hidden; height: 42px; }
        .sbox input { flex: 1; border: 0; outline: 0; padding: 0 12px; font-weight: 700; font-size: .9rem; font-family: inherit; min-width: 0; }
        .sbox .sbtn { width: 48px; border: 0; background: var(--yellow); color: #111; font-size: 1.05rem; }
        .cartbtn { position: relative; border: 0; background: transparent; color: #fff; font-size: 1.55rem; padding: 0 4px; line-height: 1; }
        .cbadge { position: absolute; top: -8px; left: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--yellow); color: #111; font-size: .72rem; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
        .cbadge.bump { animation: bump .35s ease; }
        @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }

        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { flex: 0 0 auto; border: 1.5px solid rgba(255,255,255,.35); background: #fff; color: #3b0764; border-radius: 20px; padding: 4px 14px; font-size: .82rem; font-weight: 800; font-family: inherit; }
        .chip.on { background: var(--yellow); border-color: var(--yellow); color: #111; }

        /* ===== كروت الأصناف (على طريقة أمازون) ===== */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-items: start; }
        .full { grid-column: 1 / -1; text-align: center; padding: 40px 10px; font-weight: 800; }
        .card { background: #fff; border-radius: 14px; border: 1px solid #ebe7f5; overflow: hidden; position: relative; box-shadow: var(--shadow-3d); }
        .card.has { box-shadow: 0 0 0 2.5px var(--yellow), var(--shadow-3d); }

        .imwrap { position: relative; }
        .card .im { aspect-ratio: 1 / 1; width: 100%; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .card .im img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
        .card .im img.ph { padding: 34px; opacity: .45; }

        /* زرار + الأصفر فوق الصورة */
        .act { position: absolute; bottom: 8px; inset-inline: 8px; display: flex; justify-content: flex-start; pointer-events: none; }
        .act > * { pointer-events: auto; }
        .addb { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--yellow); color: #111; font-size: 1.1rem; box-shadow: 0 2px 8px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
        .addb:active { transform: scale(.92); }
        /* بعد الإضافة: يتحول لعدّاد بإطار أصفر */
        .stepper { width: 100%; height: 42px; display: flex; align-items: center; justify-content: space-between; background: #fff; border: 2.5px solid var(--yellow); border-radius: 22px; padding: 0 6px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
        .sb { border: 0; background: transparent; width: 36px; height: 36px; font-size: 1.5rem; font-weight: 800; color: #111; line-height: 1; display: flex; align-items: center; justify-content: center; }
        .sb:active { background: #f4f4f5; border-radius: 50%; }
        .sq { width: 56px; text-align: center; border: 0; outline: 0; background: transparent; font-size: 1.2rem; font-weight: 900; color: #111; padding: 0; }

        .badge-b { position: absolute; top: 8px; right: 8px; background: #f3e8ff; color: #581c87; font-size: .65rem; font-weight: 800; border-radius: 8px; padding: 2px 8px; z-index: 2; border: 1px solid #e9d5ff; }

        .det { padding: 8px 10px 10px; }
        .ttl { font-weight: 700; font-size: .95rem; line-height: 1.35; min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .pbox { margin-top: 4px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
        .cur { font-size: .8rem; font-weight: 700; color: #3f3f46; }
        .int { font-size: 1.75rem; font-weight: 800; color: #111; line-height: 1.1; }
        .dec { font-size: .8rem; font-weight: 800; color: #111; position: relative; top: -.55em; vertical-align: baseline; }
        .disc { color: #c4143b; font-weight: 800; font-size: .95rem; }
        .was { width: 100%; font-size: .78rem; color: #71717a; text-decoration: line-through; font-weight: 700; }

        .units { display: flex; gap: 4px; margin-top: 8px; }
        .unit { flex: 1; font-size: .78rem; font-weight: 800; padding: 4px 6px; border-radius: 8px; border: 1px solid #e4e4e7; background: #fff; color: #52525b; transition: .2s; }
        .unit.on { background: var(--primary-purple); color: #fff; border-color: var(--primary-purple); }

        /* شريط الطلب السفلي: بيظهر بعد أول إضافة */
        .floating-cta-bar { position: fixed; bottom: 10px; left: 12px; right: 12px; background: var(--purple-gradient); color: #fff; border-radius: 16px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 22px rgba(59,7,100,.35); z-index: 999; transform: translateY(160%); transition: transform .3s ease; }
        .floating-cta-bar.show { transform: translateY(0); }
        .btn-send-order { background: var(--yellow); color: #111; font-weight: 800; border: none; border-radius: 12px; padding: 8px 16px; font-size: .9rem; }

        .modal-backdrop-x { position: fixed; inset: 0; background: rgba(30,27,75,.65); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-card-x { background: #fff; border-radius: 24px; width: 100%; max-width: 420px; padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.25); max-height: 88vh; display: flex; flex-direction: column; }
        .modal-item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e9d5ff; gap: 8px; }
        .hist-row { display: flex; justify-content: space-between; font-size: .78rem; font-weight: 700; padding: 5px 0; border-bottom: 1px dashed #e9d5ff; }
    </style>
</head>
<body>

<div class="net-banner" id="netBanner">📡 أنت بدون إنترنت — الأسعار والرصيد من آخر تحديث، وطلبك هيتبعت أول ما النت يرجع</div>

<div class="hero-banner">

    </div>
    <div class="hero-contacts">

        <a href="tel:01027830834" class="hc ph"><i class="fas fa-phone-alt"></i><span>فكري</span><span dir="ltr" class="fw-bold">01027830834</span></a>

<!-- تنبيه -->
<div class="modal-backdrop-x" id="alertModal" style="z-index:3000">

</div>

<!-- عارض الصور -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
let db;
try {
    db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
    });
} catch (e) {
    db = getFirestore(app);
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const round2 = (n) => Math.round(n * 100) / 100;
const fmt = (n) => Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });

const cid = new URLSearchParams(location.search).get("cid") || "";
const CART_KEY = "shop_cart_" + (cid || "guest"), HIST_KEY = "shop_hist_" + (cid || "guest"), LAST_KEY = "shop_last_order_" + (cid || "guest");
const MAX_LINES = 80, MAX_QTY = 9999, COOLDOWN_MS = 20 * 1000;
const STOP = ["جركن", "علبة", "زيت", "زجاجة", "جالون", "جيلكن", "كرتونة", "اصلي", "نوع"];
const PH_IMG = "https://cdn-icons-png.flaticon.com/512/3076/3076962.png";

let account = null, items = [], byId = {}, cart = {}, pendUnit = {}, filterMode = "all";
try { cart = JSON.parse(localStorage.getItem(CART_KEY)) || {}; } catch (_) { cart = {}; }

function alertBox(msg, title = "تنبيه", icon = "fa-circle-exclamation") {
    $("alertTitle").textContent = title; $("alertText").textContent = msg;
    $("alertIcon").className = "fas " + icon + " fa-xl";
    $("alertModal").style.display = "flex";
}
$("btnAlertOk").onclick = () => { $("alertModal").style.display = "none"; };

const unitPrice = (p, unit) => (unit === "pcs" ? round2(p.s / p.f) : p.s);
const unitOf = (id) => (cart[id] && cart[id].unit) || pendUnit[id] || "box";

// ---------- السلة: العدّاد + الشريط السفلي ----------
function refreshCartUI() {
    let lines = 0, qty = 0, total = 0;
    for (const id of Object.keys(cart)) {
        const c = cart[id]; lines++; qty += Number(c.qty) || 0;
        const p = byId[id]; if (p) total += unitPrice(p, c.unit) * c.qty;
    }
    $("cartBadge").textContent = qty;
    $("barLines").textContent = lines;
    $("barTotal").textContent = fmt(round2(total));
    $("ctaBar").classList.toggle("show", lines > 0 && items.length > 0);
}
function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (_) {} refreshCartUI(); }
function bumpBadge() { const b = $("cartBadge"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }

function norm(t) {
    return String(t || "").toLowerCase().replace(/[إأآا]/g, "ا").replace(/ة/g, "ه").replace(/[ى]/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/[\u064B-\u0652]/g, "");
}

async function load() {
    if (!cid) {
        $("guestNameCard").style.display = "block";
        return loadCatalogFromFirestore();
    }

    if (!/^[A-Za-z0-9_-]{6,60}$/.test(cid)) return fatal("الرابط غير صحيح. اطلب من المسؤول إرسال رابطك الخاص.");
    try {
        const accSnap = await getDoc(doc(db, "shop_accounts", cid));
        if (accSnap.exists()) {
            account = accSnap.data();
            renderAccount();
        } else {
            $("guestNameCard").style.display = "block";
        }
        await loadCatalogFromFirestore();
    } catch (e) {
        console.error(e);
        fatal(navigator.onLine ? "تعذر تحميل البيانات. حاول مرة تانية." : "أنت بدون إنترنت ولسه ما فتحتش المتجر قبل كده. افتحه مرة واحدة والنت شغال.");
    }
}

async function loadCatalogFromFirestore() {
    try {
        const meta = await getDoc(doc(db, "shop_catalog", "meta"));
        if (!meta.exists()) return fatal("الكتالوج لسه ما اتنشرش. حاول بعد قليل.");
        const n = meta.data().chunks || 1;
        const parts = await Promise.all(Array.from({ length: n }, (_, i) => getDoc(doc(db, "shop_catalog", "c" + i))));
        items = parts.flatMap((s) => (s.exists() ? s.data().items || [] : []));

        // تطبيق أسعار العميل المخصصة (آخر سعر اشترى بيه الصنف)
        if (account) {
            const customerPrices = account.customPrices || {};
            items = items.map(p => {
                if (customerPrices[p.id]) {
                    p.g = p.s;                       // السعر العام (للمقارنة)
                    p.s = Number(customerPrices[p.id]);
                    p.cp = true;                     // له سعر خاص
                }
                return p;
            });
        }
        $("chipMine").style.display = items.some((p) => p.cp) ? "" : "none";

        byId = Object.fromEntries(items.map((p) => [p.id, p]));

        // تنظيف السلة من أي أصناف لم تعد موجودة
        for (const id of Object.keys(cart)) if (!byId[id]) delete cart[id];
        saveCart();

        renderCatalog();
    } catch (err) {
        console.error(err);
        fatal("تعذر جلب أصناف الكتالوج.");
    }
}

function fatal(msg) {
    $("catalogList").innerHTML = `<div class="full text-danger">${esc(msg)}</div>`;
}

function renderAccount() {
    if (!account) return;
    $("accountCard").style.display = "block";
    $("merchantName").textContent = account.name || "";
    const b = Number(account.balance) || 0;
    const pill = $("balancePill");
    if (b > 0.005) { pill.className = "balance-pill balance-due"; pill.innerHTML = `<span><i class="fas fa-wallet me-1"></i> المطلوب منك</span><span>${esc(fmt(b))} ج.م</span>`; }
    else if (b < -0.005) { pill.className = "balance-pill balance-credit"; pill.innerHTML = `<span><i class="fas fa-circle-check me-1"></i> رصيد لك عندنا</span><span>${esc(fmt(-b))} ج.م</span>`; }
    else { pill.className = "balance-pill balance-zero"; pill.innerHTML = `<span><i class="fas fa-circle-check me-1"></i> حسابك مسوّى</span><span>0 ج.م</span>`; }
    if (account.updatedAt) $("balanceUpdated").textContent = "آخر تحديث للرصيد: " + new Date(account.updatedAt).toLocaleString("ar-EG");
}

// ---------- السعر بشكل أمازون: العملة صغيرة + الرقم كبير + الكسور مرفوعة ----------
function priceHtml(n) {
    const v = round2(n), ip = Math.floor(v), dp = Math.round((v - ip) * 100);
    return `<span class="cur">ج.م</span><span class="int">${ip.toLocaleString("en-US")}</span><sup class="dec">${String(dp).padStart(2, "0")}</sup>`;
}
function priceBlock(p, unit) {
    const pr = unitPrice(p, unit);
    const orig = p.g !== undefined ? (unit === "pcs" ? round2(p.g / p.f) : p.g) : null;
    if (orig && orig > pr + 0.005) {
        const pct = Math.round((1 - pr / orig) * 100);
        return `<span class="disc">-${pct}%</span>${priceHtml(pr)}<div class="was">${esc(fmt(orig))} ج.م</div>`;
    }
    return priceHtml(pr);
}

// زرار + أو العدّاد حسب الكمية
function actHtml(id, qty) {
    const e = esc(id);
    return qty > 0
        ? `<div class="stepper"><button class="sb" data-act="plus" data-id="${e}">+</button><input class="sq" id="qty_${e}" inputmode="numeric" value="${qty}" data-act="qty" data-id="${e}"><button class="sb" data-act="minus" data-id="${e}">−</button></div>`
        : `<button class="addb" data-act="plus" data-id="${e}" aria-label="إضافة"><i class="fas fa-plus"></i></button>`;
}

function renderCatalog() {
    const term = norm($("catalogSearch").value.trim());
    let words = term.split(/\s+/).filter(Boolean);
    let key = words.filter((w) => !STOP.includes(w)); if (!key.length) key = words;
    let list = !term ? items : items.filter((p) => {
        const nn = norm(p.n), parts = nn.split(/\s+/);
        return key.every((w) => nn.includes(w) || parts.some((x) => x.startsWith(w)));
    });
    if (filterMode === "sel") list = list.filter((p) => cart[p.id]);
    else if (filterMode === "mine") list = list.filter((p) => p.cp);

    if (!list.length) {
        const msg = filterMode === "sel" ? "لسه ما اخترتش أصناف" : "تأكد من كتابة الاسم صحيح";
        $("catalogList").innerHTML = `<div class="full"><i class="fas fa-triangle-exclamation text-warning fa-2x mb-2"></i><div>${msg}</div>${filterMode === "all" ? '<small class="text-muted">لا توجد أصناف تطابق بحثك</small>' : ""}</div>`;
        return;
    }

    $("catalogList").innerHTML = list.map((p) => {
        const c = cart[p.id], unit = unitOf(p.id), qty = c ? c.qty : 0;

        const imgSrc = p.img || p.imageUrl || p.image || "";
        const validImg = imgSrc && (imgSrc.startsWith("data:image/") || /^https?:\/\//.test(imgSrc)) ? imgSrc : PH_IMG;
        const isPh = validImg === PH_IMG;

        const brandBadge = p.b || p.brand ? `<span class="badge-b">${esc(p.b || p.brand)}</span>` : '';

        const unitsHtml = p.f > 1
            ? `<div class="units"><button class="unit ${unit === "box" ? "on" : ""}" data-act="unit" data-id="${esc(p.id)}" data-unit="box">كرتونة</button><button class="unit ${unit === "pcs" ? "on" : ""}" data-act="unit" data-id="${esc(p.id)}" data-unit="pcs">علبة</button></div>`
            : "";

        return `<div class="card ${qty > 0 ? "has" : ""}" id="card_${esc(p.id)}">
            ${brandBadge}
            <div class="imwrap">
              <div class="im" data-act="img" data-id="${esc(p.id)}">
                <img loading="lazy" class="${isPh ? 'ph' : ''}" src="${esc(validImg)}" alt="${esc(p.n)}">
              </div>
              <div class="act" id="act_${esc(p.id)}">${actHtml(p.id, qty)}</div>
            </div>
            <div class="det">
              <div class="ttl">${esc(p.n)}</div>
              <div class="pbox" id="price_${esc(p.id)}">${priceBlock(p, unit)}</div>
              ${unitsHtml}
            </div>
          </div>`;
    }).join("");
}

function setQty(id, qty) {
    const p = byId[id]; if (!p) return;
    const before = cart[id] ? cart[id].qty : 0;
    qty = Math.max(0, Math.min(MAX_QTY, Math.floor(Number(qty) || 0)));
    if (qty > 0) {
        if (!cart[id] && Object.keys(cart).length >= MAX_LINES) return alertBox("الحد الأقصى " + MAX_LINES + " صنف في الطلب الواحد.", "تنبيه");
        cart[id] = { unit: unitOf(id), qty };
    } else delete cart[id];
    saveCart();
    if (qty > before) bumpBadge();
    const card = $("card_" + id), act = $("act_" + id);
    if (card) card.classList.toggle("has", qty > 0);
    if (act) act.innerHTML = actHtml(id, qty);   // + يتحول لعدّاد (والعكس)
}

function setUnit(id, unit) {
    const p = byId[id]; if (!p || p.f <= 1) return;
    pendUnit[id] = unit;
    if (cart[id]) cart[id].unit = unit;
    saveCart();
    const card = $("card_" + id); if (!card) return;
    card.querySelectorAll(".unit").forEach((b) => b.classList.toggle("on", b.dataset.unit === unit));
    $("price_" + id).innerHTML = priceBlock(p, unit);
}

$("catalogList").addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]"); if (!t) return;
    const id = t.dataset.id, act = t.dataset.act;

    if (act === "plus") setQty(id, (cart[id]?.qty || 0) + 1);
    else if (act === "minus") setQty(id, (cart[id]?.qty || 0) - 1);
    else if (act === "unit") setUnit(id, t.dataset.unit);
    else if (act === "img") {
        const p = byId[id]; if(!p) return;
        const imgSrc = p.img || p.imageUrl || p.image || "";
        const validImg = imgSrc && (imgSrc.startsWith("data:image/") || /^https?:\/\//.test(imgSrc)) ? imgSrc : PH_IMG;
        $("imgModalSrc").src = validImg;
        $("imgModalTitle").textContent = p.n;
        $("imgModal").style.display = "flex";
    }
});

$("catalogList").addEventListener("change", (e) => { if (e.target.dataset.act === "qty") setQty(e.target.dataset.id, e.target.value); });
$("catalogList").addEventListener("focusin", (e) => { if (e.target.dataset.act === "qty") e.target.select(); });
let st; $("catalogSearch").addEventListener("input", () => { clearTimeout(st); st = setTimeout(renderCatalog, 150); });

// فلاتر: الكل / المختارة / بسعري الخاص
$("chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    filterMode = b.dataset.mode;
    document.querySelectorAll("#chips .chip").forEach((c) => c.classList.toggle("on", c === b));
    renderCatalog();
});

// ---------------- المراجعة والإرسال ----------------
function ymd(d) { const z = (n) => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }

function openReview() {
    const ids = Object.keys(cart);
    if (!ids.length) return alertBox("حدد كمية صنف واحد على الأقل قبل الإرسال.", "تنبيه 📦", "fa-box-open");
    let total = 0;
    $("modalItemsList").innerHTML = ids.map((id) => {
        const p = byId[id], c = cart[id], pr = unitPrice(p, c.unit), sub = round2(pr * c.qty); total += sub;
        return `<div class="modal-item-row"><div><div class="fw-bold" style="font-size:.82rem">${esc(p.n)}</div>
            <div class="text-muted" style="font-size:.72rem">${c.qty} ${c.unit === "box" ? "كرتونة" : "علبة"} × ${esc(fmt(pr))}</div></div>
            <div class="d-flex align-items-center gap-2"><span class="fw-bold" style="font-size:.85rem;color:var(--primary-purple)">${esc(fmt(sub))}</span>
            <button class="btn btn-sm btn-outline-danger p-1 px-2 rounded-2" data-del="${esc(id)}"><i class="fas fa-trash-can"></i></button></div></div>`;
    }).join("");
    $("modalTotalSum").textContent = fmt(round2(total)) + " ج.م";
    if (!$("deliveryDate").value) { const t = new Date(); t.setDate(t.getDate() + 1); $("deliveryDate").value = ymd(t); }
    $("deliveryDate").min = ymd(new Date());
    $("reviewModal").style.display = "flex";
}
$("btnReview").onclick = openReview;
$("btnCart").onclick = openReview;
$("btnCloseReview").onclick = $("btnEditMore").onclick = () => { $("reviewModal").style.display = "none"; };
$("modalItemsList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    setQty(b.dataset.del, 0);
    if (!Object.keys(cart).length) $("reviewModal").style.display = "none"; else openReview();
});

function history() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (_) { return []; } }
function renderHistory() {
    const h = history();
    $("histBox").innerHTML = h.length
        ? "<div style='font-size:.74rem;font-weight:800;color:#6b21a8'>آخر طلباتك (من هذا الجهاز)</div>" + h.map((o) => `<div class="hist-row"><span>${esc(new Date(o.ts).toLocaleString("ar-EG"))}</span><span>${o.count} أصناف — ${esc(fmt(o.total))} ج.م ${o.pending ? "⏳" : "✅"}</span></div>`).join("")
        : "<div class='text-muted' style='font-size:.75rem'>لسه ما بعتّش طلبات من هذا الجهاز.</div>";
}
$("btnHistory").onclick = () => { const b = $("histBox"); if (b.style.display === "none") { renderHistory(); b.style.display = "block"; } else b.style.display = "none"; };

let sending = false;
$("confirmSendBtn").onclick = async () => {
    if (sending) return;
    const ids = Object.keys(cart);
    if (!ids.length) return;

    let finalCustomerName = account ? account.name : ($("guestNameInput")?.value || "").trim();
    if (!account && !finalCustomerName) {
        return alertBox("يرجى إدخال اسم محلك أو اسمك في الحقل العلوي لتأكيد الطلب.", "تنبيه ✏️", "fa-pen");
    }

    const last = Number(localStorage.getItem(LAST_KEY) || 0);
    if (Date.now() - last < COOLDOWN_MS) return alertBox("لسه باعت طلب حالًا. استنى لحظات قبل ما تبعت طلب جديد.", "استنى لحظة ⏳", "fa-hourglass-half");

    sending = true;
    const btn = $("confirmSendBtn"); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> جاري الإرسال...';
    try {
        const lines = ids.map((id) => { const p = byId[id], c = cart[id]; return { stockId: id, name: p.n, unit: c.unit, qty: c.qty, price: unitPrice(p, c.unit) }; });
        const total = round2(lines.reduce((s, l) => s + l.qty * l.price, 0));
        const wasOnline = navigator.onLine;
        await addDoc(collection(db, "orders"), {
            customerId: cid || null,
            customerName: finalCustomerName,
            items: lines,
            total,
            notes: $("orderNotes").value.replace(/[<>]/g, "").trim().slice(0, 200),
            date: $("deliveryDate").value || ymd(new Date()),
            timestamp: serverTimestamp(),
            status: "pending",
            source: "shop"
        });
        localStorage.setItem(LAST_KEY, String(Date.now()));
        const h = history(); h.unshift({ ts: Date.now(), count: lines.length, total, pending: !wasOnline }); localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 5)));
        cart = {}; pendUnit = {}; saveCart(); $("orderNotes").value = ""; renderCatalog();
        $("reviewModal").style.display = "none";
        alertBox(wasOnline ? "تم إرسال طلبك بنجاح، وهنتواصل معاك لتأكيد التحميل." : "تم حفظ طلبك على جهازك، وهيوصلنا تلقائيًا أول ما النت يرجع.", wasOnline ? "تم الإرسال 🚀" : "تم الحفظ 📥", "fa-circle-check");
    } catch (e) {
        console.error(e);
        alertBox("حصل خطأ أثناء الإرسال. حاول مرة تانية.", "خطأ ❌", "fa-triangle-exclamation");
    } finally {
        sending = false; btn.disabled = false; btn.innerHTML = "تأكيد وإرسال 🚀";
    }
};

const net = () => { $("netBanner").style.display = navigator.onLine ? "none" : "block"; };
window.addEventListener("online", net); window.addEventListener("offline", net); net();

saveCart();
load();
</script>
</body>
