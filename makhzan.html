<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخزن - شركة الزيادي</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 90px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }

        .top-nav i { cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .top-nav i:active { transform: scale(0.9); }

        .search-section {
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: -5px;
        }
        .search-wrapper {
            position: relative;
            flex-grow: 1;
        }
        .search-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
        }
        .search-input {
            width: 100%;
            padding: 14px 40px 14px 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: 0.2s;
        }
        .search-input:focus { border-color: var(--accent-green); }
        
        .qr-btn {
            background: white;
            color: var(--primary-green);
            border: 1px solid var(--border-color);
            width: 52px;
            height: 52px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            cursor: pointer;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr 0.6fr 0.6fr;
            gap: 10px;
            align-items: center;
        }

        .table-headers {
            padding: 0 25px 10px 25px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .table-headers div { text-align: center; }
        .table-headers div:first-child { text-align: right; }

        .item-card {
            padding: 16px 20px;
            background: white;
            border-radius: 20px;
            margin: 0 15px 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .item-card:active { transform: scale(0.98); background: #f8f9fa; }
        
        .item-card.out-of-stock {
            opacity: 0.6;
            background: #fdfdfd;
            border-color: #f1f2f6;
        }
        .item-card.out-of-stock .item-price { color: var(--text-muted); }

        .item-name { font-weight: 800; font-size: 0.95rem; margin-bottom: 3px; color: var(--text-dark); line-height: 1.3;}
        .item-barcode { font-size: 0.75rem; color: var(--text-muted); }

        .item-price { 
            text-align: center; 
            color: var(--primary-green); 
            font-weight: 800;
            font-size: 1.05rem;
        }

        .qty-badge {
            background: #f0fdf4;
            color: var(--primary-green);
            padding: 5px 0;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            display: inline-block;
            border: 1px solid #dcfce7;
        }
        
        .qty-low { background: var(--danger-bg); color: var(--danger); border-color: #ffe4e6; }
        .qty-zero { background: #f1f5f9; color: var(--text-muted); border-color: var(--border-color); }

        .bottom-summary {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 18px 20px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border-color);
            color: var(--primary-green);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
            z-index: 999;
        }

        .fab {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: var(--primary-green);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 25px rgba(11, 102, 65, 0.4);
            text-decoration: none;
            transition: 0.3s;
            z-index: 1000;
        }
        .fab:hover { background: #0a5234; transform: translateY(-3px); color: white;}
    </style>
</head>
<body>

<div class="top-nav">
    <i class="fas fa-sync-alt" onclick="location.reload()"></i>
    <span class="fw-bold">الأصناف والمخزون</span>
    <i class="fas fa-chevron-left" onclick="history.back()"></i>
</div>

<div class="search-section">
    <button class="qr-btn" aria-label="مسح الباركود"><i class="fas fa-qrcode"></i></button>
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج أو باركود..." oninput="renderItems()">
    </div>
</div>

<div class="table-headers grid-layout">
    <div>المنتج والباركود</div>
    <div>السعر</div>
    <div>كرتونة</div>
    <div>جركن</div>
</div>

<div id="itemsContainer"></div>

<div class="bottom-summary">
    <i class="fas fa-boxes me-2"></i> إجمالي الأصناف: <span id="totalCount" class="ms-2">0</span>
</div>

<a href="add-product.html" class="fab" aria-label="إضافة منتج">
    <i class="fas fa-plus"></i>
</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }
    let allData = [];

    onSnapshot(collection(db, "inventory"), (snap) => {
        allData = [];
        snap.forEach(doc => {
            const data = doc.data();
            if (!data.isDeleted) {
                allData.push({ id: doc.id, ...data });
            }
        });
        renderItems();
    }, (error) => {
        console.error("خطأ في جلب البيانات: ", error);
        document.getElementById('itemsContainer').innerHTML = 
            `<div class="text-center text-danger mt-4 fw-bold">حدث خطأ أثناء جلب البيانات، يرجى التأكد من اتصالك بالإنترنت.</div>`;
    });

    window.renderItems = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('itemsContainer');
        
        let filtered = allData.filter(i => 
            (i.name && i.name.toLowerCase().includes(term)) || 
            (i.barcode && String(i.barcode).includes(term))
        );

        // تحديد أولوية الترتيب حسب الشروط المطلوبة
        const getPriority = (item) => {
            const qty = Number(item.totalPcs !== undefined && item.totalPcs !== null ? item.totalPcs : (item.qty || 0));
            const price = Number(item.sell || 0);

            if (qty > 0 && price === 0) return 1;  // له عدد وبدون سعر
            if (qty > 0 && price > 0) return 2;   // له عدد وله سعر
            if (qty < 0) return 3;                // عدد بالسالب
            if (qty === 0 && price > 0) return 4; // بدون عدد وله سعر
            return 5;                             // بدون عدد وبدون سعر
        };

        filtered.sort((a, b) => {
            const priorityA = getPriority(a);
            const priorityB = getPriority(b);
            
            if (priorityA !== priorityB) {
                return priorityA - priorityB;
            }
            return (a.name || '').localeCompare(b.name || '', 'ar');
        });

        let html = '';
        filtered.forEach(item => {
            const factor = Math.max(1, Number(item.unitFactor || item.factor || item.pcsPerCarton) || 1); 
            const total = Number(item.totalPcs !== undefined && item.totalPcs !== null ? item.totalPcs : (item.qty || 0));
            
            const isNegative = total < 0;
            const absTotal = Math.abs(total);

            const cartons = Math.floor(absTotal / factor) * (isNegative ? -1 : 1);
            const jerrycans = (absTotal % factor) * (isNegative ? -1 : 1);

            const isZero = total === 0;
            const minAllowed = (Number(item.min) || 0) * factor;
            const isLow = !isZero && (total <= minAllowed);

            let badgeClass = 'qty-badge';
            if (isZero) {
                badgeClass += ' qty-zero';
            } else if (isLow || isNegative) {
                badgeClass += ' qty-low';
            }

            html += `
                <div class="item-card grid-layout ${isZero ? 'out-of-stock' : ''}" onclick="goToDetails('${item.id}')">
                    <div class="item-info">
                        <div class="item-name">${item.name || 'بدون اسم'}</div>
                        <div class="item-barcode">باركود: ${item.barcode || '---'}</div>
                    </div>
                    <div class="item-price">
                        ${Number(item.sell || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}
                    </div>
                    <div>
                        <div class="${badgeClass}">${cartons}</div>
                    </div>
                    <div>
                        <div class="${badgeClass}">${jerrycans}</div>
                    </div>
                </div>
            `;
        });

        if (filtered.length === 0) {
            html = `<div class="text-center text-muted mt-5 fw-bold"><i class="fas fa-search fa-2x mb-2"></i><br>لا توجد أصناف مطابقة للبحث</div>`;
        }

        container.innerHTML = html;
        document.getElementById('totalCount').innerText = filtered.length;
    };

    window.goToDetails = function(id) {
        window.location.href = `product-details.html?id=${id}`;
    };
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
</html>
