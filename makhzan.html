<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المخزن - شركة الزيادي</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 90px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }

        .top-nav .nav-icon { 
            cursor: pointer; 
            font-size: 1.2rem; 
            transition: 0.2s; 
            color: white;
            text-decoration: none;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .search-section {
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: -5px;
        }
        .search-wrapper {
            position: relative;
            flex-grow: 1;
        }
        .search-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
        }
        .search-input {
            width: 100%;
            padding: 14px 40px 14px 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: 0.2s;
        }
        .search-input:focus { border-color: var(--accent-green); }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr 0.6fr 0.6fr;
            gap: 10px;
            align-items: center;
        }

        .table-headers {
            padding: 0 25px 10px 25px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .table-headers div { text-align: center; }
        .table-headers div:first-child { text-align: right; }

        .item-card {
            padding: 14px 16px;
            background: white;
            border-radius: 20px;
            margin: 0 15px 12px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
            position: relative;
        }
        
        .item-card.out-of-stock {
            opacity: 0.7;
            background: #fdfdfd;
        }

        .item-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* الصورة المصغرة للصنف وقابليتها للضغط لرفع صورة جديدة */
        .img-upload-btn {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s ease;
        }

        .img-upload-btn:active {
            transform: scale(0.92);
        }

        .img-upload-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img-upload-btn i.fa-camera {
            position: absolute;
            bottom: 3px;
            right: 3px;
            background: rgba(11, 102, 65, 0.85);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-name { font-weight: 800; font-size: 0.95rem; color: var(--text-dark); line-height: 1.3;}
        .item-barcode { font-size: 0.75rem; color: var(--text-muted); }

        .item-price { 
            text-align: center; 
            color: var(--primary-green); 
            font-weight: 800;
            font-size: 1.05rem;
        }

        .qty-badge {
            background: #f0fdf4;
            color: var(--primary-green);
            padding: 5px 0;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            display: inline-block;
            border: 1px solid #dcfce7;
        }
        
        .qty-low { background: var(--danger-bg); color: var(--danger); border-color: #ffe4e6; }
        .qty-zero { background: #f1f5f9; color: var(--text-muted); border-color: var(--border-color); }

        .bottom-summary {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 18px 20px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            color: var(--primary-green);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
            z-index: 999;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d1d5db;
        }
        .sync-dot.fresh { background: #10b981; }

        .fab {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: var(--primary-green);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 25px rgba(11, 102, 65, 0.4);
            text-decoration: none;
            z-index: 1000;
        }

        /* نافذة التنبيه جاري رفع الصورة */
        .toast-loader {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0b6641;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.88rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            z-index: 9999;
            display: none;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="index1.html" class="nav-icon" title="الصفحة الرئيسية">
            <i class="fas fa-home"></i>
        </a>
        <i class="fas fa-sync-alt nav-icon" onclick="window.location.reload(true)" title="تحديث"></i>
    </div>
    <span class="fw-bold">الأصناف والمخزون</span>
    <i class="fas fa-chevron-left nav-icon" onclick="history.back()" title="رجوع"></i>
</div>

<!-- توست التنبيه التلقائي -->
<div class="toast-loader" id="toastLoader">
    <div class="spinner-border spinner-border-sm text-white"></div>
    <span id="toastMsg">جاري ضغط ورفع الصورة...</span>
</div>

<div class="search-section">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج أو باركود..." oninput="renderItems()">
    </div>
</div>

<!-- عنصر إدخال الصورة المخفي لتسهيل الالتقاط المباشر -->
<input type="file" id="directImageInput" accept="image/*" style="display:none;" onchange="processDirectImage(event)">

<div class="table-headers grid-layout">
    <div>المنتج والباركود</div>
    <div>السعر</div>
    <div>كرتونة</div>
    <div>جركن</div>
</div>

<div id="itemsContainer">
    <div class="text-center text-muted mt-5 fw-bold">
        <div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري ترتيب الأصناف بالمخزن...
    </div>
</div>

<div class="bottom-summary">
    <i class="fas fa-boxes me-2"></i> إجمالي الأصناف: <span id="totalCount" class="ms-2">0</span>
    <span class="sync-dot" id="syncDot"></span>
</div>

<a href="add-product.html" class="fab" aria-label="إضافة منتج">
    <i class="fas fa-plus"></i>
</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
    } catch (e) {
        db = getFirestore(app);
    }

    let allData = [];
    let activeUploadProductId = null;

    async function loadInventory() {
        try {
            const snap = await getDocs(collection(db, "makhzan"));
            allData = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(i => !i.isDeleted);
            allData.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            renderItems();
        } catch (e) {
            console.error("خطأ في جلب المخزن:", e);
        }
    }

    window.renderItems = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('itemsContainer');
        
        let filtered = allData.filter(i => 
            (i.name && i.name.toLowerCase().includes(term)) || 
            (i.barcode && String(i.barcode).includes(term))
        );

        let html = '';
        filtered.forEach(item => {
            const factor = Math.max(1, Number(item.unitFactor || item.factor) || 1); 
            const total = Number(item.totalPcs || item.qty || 0);
            const cartons = Math.floor(total / factor);
            const jerrycans = total % factor;

            const imgSrc = item.imageUrl || item.image || item.img || "";
            const imgHtml = imgSrc 
                ? `<img src="${imgSrc}" alt="${item.name}">` 
                : `<i class="fas fa-image text-secondary fs-5"></i>`;

            html += `
                <div class="item-card grid-layout ${total === 0 ? 'out-of-stock' : ''}">
                    <div class="item-header-row">
                        <!-- زر رفع الصورة المباشر بضغط واحدة -->
                        <div class="img-upload-btn" onclick="triggerImageUpload(event, '${item.id}')" title="اضغط لرفع / تغيير الصورة مباشرة">
                            ${imgHtml}
                            <i class="fas fa-camera"></i>
                        </div>
                        <div onclick="goToDetails('${item.id}')" style="cursor:pointer; flex-grow:1;">
                            <div class="item-name">${item.name || 'بدون اسم'}</div>
                            <div class="item-barcode">باركود: ${item.barcode || '---'}</div>
                        </div>
                    </div>
                    <div class="item-price" onclick="goToDetails('${item.id}')">
                        ${Number(item.sell || 0).toLocaleString('en-US', {minimumFractionDigits: 0})}
                    </div>
                    <div onclick="goToDetails('${item.id}')">
                        <div class="qty-badge">${cartons}</div>
                    </div>
                    <div onclick="goToDetails('${item.id}')">
                        <div class="qty-badge">${jerrycans}</div>
                    </div>
                </div>
            `;
        });

        if (filtered.length === 0) {
            html = `<div class="text-center text-muted mt-5 fw-bold"><i class="fas fa-search fa-2x mb-2"></i><br>لا توجد أصناف مطابقة للبحث</div>`;
        }

        container.innerHTML = html;
        document.getElementById('totalCount').innerText = filtered.length;
    };

    window.triggerImageUpload = function(event, id) {
        event.stopPropagation();
        activeUploadProductId = id;
        document.getElementById('directImageInput').click();
    };

    window.processDirectImage = function(event) {
        const file = event.target.files[0];
        if (!file || !activeUploadProductId) return;

        showToast("جاري ضغط ورفع الصورة...");

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;
                const maxSide = 500;

                if (width > height && width > maxSide) {
                    height = Math.round((height * maxSide) / width);
                    width = maxSide;
                } else if (height > maxSide) {
                    width = Math.round((width * maxSide) / height);
                    height = maxSide;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);

                try {
                    const updatePayload = {
                        imageUrl: compressedBase64,
                        image: compressedBase64,
                        img: compressedBase64
                    };

                    await setDoc(doc(db, "makhzan", activeUploadProductId), updatePayload, { merge: true });
                    await setDoc(doc(db, "inventory", activeUploadProductId), updatePayload, { merge: true });

                    // تحديث الحالة محلياً
                    const targetItem = allData.find(i => i.id === activeUploadProductId);
                    if (targetItem) {
                        targetItem.imageUrl = compressedBase64;
                        targetItem.image = compressedBase64;
                        targetItem.img = compressedBase64;
                    }

                    renderItems();
                    showToast("تمت حِفظ الصورة بنجاح! 🚀", 2500);
                } catch (err) {
                    console.error("خطأ أثناء حفظ الصورة:", err);
                    alert("تعذر حفظ الصورة، يرجى إعادة المحاولة.");
                    hideToast();
                } finally {
                    document.getElementById('directImageInput').value = "";
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    function showToast(msg, timeout = 0) {
        const toast = document.getElementById('toastLoader');
        document.getElementById('toastMsg').innerText = msg;
        toast.style.display = 'flex';
        if (timeout > 0) {
            setTimeout(() => { hideToast(); }, timeout);
        }
    }

    function hideToast() {
        document.getElementById('toastLoader').style.display = 'none';
    }

    window.goToDetails = function(id) {
        window.location.href = `product-details.html?id=${id}`;
    };

    loadInventory();
</script>
</body>
</html>
