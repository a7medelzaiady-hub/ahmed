<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص المبيعات اليومية - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- مكاتب فايربيز compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --accent: #000000;
            --header-bg: linear-gradient(135deg, #000000, #252525 80%);
            --bg-light: #f5f6f6;
            --text-primary: #000000;
            --text-secondary: #4a4a4a;
            --border: #dcdcdc;
            --white: #ffffff;
            
            --germany-black: #000000;
            --germany-red: #FF0000;
            --germany-gold: #FFCC00;
            
            --card-radius: 18px;
            --input-radius: 14px;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
        }
        
        * { box-sizing: border-box; }
        
        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 80px;
            font-size: 0.88rem;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        .num { 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }

        .header-nav {
            background: var(--header-bg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom: 4px solid var(--germany-red);
        }
        .header-nav h6 { 
            font-weight: 900; 
            font-size: 1.05rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-btn {
            background: rgba(255, 255, 255, 0.15);
            width: 38px; 
            height: 38px;
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: white; 
            text-decoration: none; 
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2); 
            transition: all 0.2s ease;
        }
        .add-btn:active { transform: scale(0.92); }

        .kpi-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            height: 100%;
        }
        .kpi-title { font-size: 0.72rem; color: var(--text-secondary); font-weight: 800; }
        .kpi-value { font-size: 1.05rem; font-weight: 900; margin-top: 4px; }

        .day-summary-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            border-right: 5px solid var(--germany-gold);
            transition: all 0.2s ease;
        }
        .day-summary-card:hover { box-shadow: var(--shadow-md); }

        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px dashed var(--border);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .day-date {
            font-size: 1rem;
            font-weight: 900;
            color: var(--germany-black);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .source-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
        }
        .source-box.van { border-right: 4px solid var(--germany-gold); }
        .source-box.main { border-right: 4px solid var(--germany-black); }

        .source-title {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .source-val { font-size: 1.05rem; font-weight: 900; color: var(--text-primary); }

        .stats-footer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #fffdf5;
            border: 1px solid #fef08a;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-sub-title { font-size: 0.68rem; color: #71717a; font-weight: 800; }
        .stat-sub-val { font-size: 0.88rem; font-weight: 800; color: #000; margin-top: 2px; }

        .filter-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .empty-state { text-align: center; padding: 50px 10px; color: var(--text-secondary); }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
    <h6 class="m-0"><i class="fas fa-chart-line me-1"></i> ملخص المبيعات اليومية</h6>
    <div class="d-flex gap-2">
        <a href="sales-history.html" class="add-btn" title="سجل الفواتير التفصيلي"><i class="fas fa-history"></i></a>
        <button class="add-btn" onclick="exportSummaryExcel()" title="تصدير إكسيل"><i class="fas fa-file-excel"></i></button>
    </div>
</div>

<div class="container px-2 mt-3">

    <!-- الفلاتر واختيار النطاق الزمني -->
    <div class="filter-card">
        <div class="row g-2 align-items-center">
            <div class="col-6">
                <label class="fw-bold mb-1" style="font-size: 0.75rem;">من تاريخ:</label>
                <input type="date" id="startDateInput" class="form-control form-control-sm fw-bold num" onchange="renderDailySummary()">
            </div>
            <div class="col-6">
                <label class="fw-bold mb-1" style="font-size: 0.75rem;">إلى تاريخ:</label>
                <input type="date" id="endDateInput" class="form-control form-control-sm fw-bold num" onchange="renderDailySummary()">
            </div>
        </div>
    </div>

    <!-- كروت الإحصائيات الإجمالية للفترة -->
    <div class="row g-2 mb-3">
        <div class="col-4">
            <div class="kpi-card">
                <div class="kpi-title">إجمالي المبيعات</div>
                <div class="kpi-value num text-dark" id="periodTotalSales">0.0</div>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card">
                <div class="kpi-title">متوسط اليوم</div>
                <div class="kpi-value num text-primary" id="periodDailyAvg">0.0</div>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card">
                <div class="kpi-title">متوسط الفاتورة</div>
                <div class="kpi-value num" style="color: var(--germany-red);" id="periodInvoiceAvg">0.0</div>
            </div>
        </div>
    </div>

    <!-- قائمة يوميات المبيعات -->
    <div id="dailySummaryList">
        <div class="empty-state">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p class="mt-3 fw-bold">جاري تجميع وحساب بيانات اليوميات...</p>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let rawInvoices = [];
    let processedDaysList = [];

    function convertToEnglishNumbers(str) {
        if (!str) return "";
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let res = str.toString();
        for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
        return res;
    }

    function parseInvoiceDate(inv) {
        let dateStr = "";
        if (inv.date) { dateStr = convertToEnglishNumbers(inv.date); }
        else if (inv.timestamp?.seconds) { return new Date(inv.timestamp.seconds * 1000).toLocaleDateString('en-CA'); }
        if (!dateStr) return "";
        let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return dateStr;
    }

    async function fetchInvoices() {
        try {
            const snap = await db.collection("invoices").orderBy("timestamp", "desc").get();
            rawInvoices = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (!data.isDeleted) {
                    rawInvoices.push({ id: doc.id, ...data });
                }
            });

            // ضبط فلتر التاريخ التلقائي (آخر 30 يوم)
            const today = new Date();
            const pastDate = new Date();
            pastDate.setDate(today.getDate() - 30);

            document.getElementById('endDateInput').value = today.toLocaleDateString('en-CA');
            document.getElementById('startDateInput').value = pastDate.toLocaleDateString('en-CA');

            renderDailySummary();
        } catch (e) {
            console.error("خطأ جلب البيانات:", e);
            document.getElementById('dailySummaryList').innerHTML = `<div class="alert alert-danger text-center font-weight-bold">تعذر تحميل بيانات المبيعات: ${e.message}</div>`;
        }
    }

    function renderDailySummary() {
        const startDate = document.getElementById('startDateInput').value;
        const endDate = document.getElementById('endDateInput').value;

        // تجميع الفواتير حسب التاريخ
        const dayGroups = {};

        rawInvoices.forEach(inv => {
            const d = parseInvoiceDate(inv);
            if (!d) return;

            if (startDate && d < startDate) return;
            if (endDate && d > endDate) return;

            if (!dayGroups[d]) {
                dayGroups[d] = {
                    date: d,
                    totalSales: 0,
                    storeSales: 0,
                    vanSales: 0,
                    cashSales: 0,
                    walletSales: 0,
                    creditSales: 0,
                    count: 0,
                    storeCount: 0,
                    vanCount: 0
                };
            }

            const total = Number(inv.total) || 0;
            const cash = Number(inv.cashAmount ?? inv.cashPaid ?? inv.paid) || 0;
            const wallet = Number(inv.walletAmount ?? inv.walletPaid) || 0;
            const remaining = Number(inv.remaining) || (total - (cash + wallet));

            const isVan = (inv.source === 'van_sales');

            dayGroups[d].totalSales += total;
            dayGroups[d].count += 1;
            dayGroups[d].cashSales += cash;
            dayGroups[d].walletSales += wallet;
            if (remaining > 0) dayGroups[d].creditSales += remaining;

            if (isVan) {
                dayGroups[d].vanSales += total;
                dayGroups[d].vanCount += 1;
            } else {
                dayGroups[d].storeSales += total;
                dayGroups[d].storeCount += 1;
            }
        });

        processedDaysList = Object.values(dayGroups).sort((a, b) => b.date.localeCompare(a.date));

        const listContainer = document.getElementById('dailySummaryList');

        if (processedDaysList.length === 0) {
            listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-times fa-2x mb-2"></i><p class="fw-bold mb-0">لا توجد مبيعات في هذه الفترة المحددة.</p></div>`;
            document.getElementById('periodTotalSales').innerText = "0.0";
            document.getElementById('periodDailyAvg').innerText = "0.0";
            document.getElementById('periodInvoiceAvg').innerText = "0.0";
            return;
        }

        let overallTotal = 0;
        let overallInvoices = 0;

        const html = processedDaysList.map(day => {
            overallTotal += day.totalSales;
            overallInvoices += day.count;

            const avgPerInvoice = day.count > 0 ? (day.totalSales / day.count) : 0;
            const vanPercent = day.totalSales > 0 ? ((day.vanSales / day.totalSales) * 100).toFixed(0) : 0;
            const storePercent = day.totalSales > 0 ? ((day.storeSales / day.totalSales) * 100).toFixed(0) : 0;

            return `
            <div class="day-summary-card">
                <div class="day-header">
                    <div class="day-date">
                        <i class="far fa-calendar-alt text-danger"></i> ${day.date}
                    </div>
                    <div class="badge bg-dark px-3 py-2 fw-bold num" style="font-size: 0.95rem;">
                        إجمالي اليوم: ${day.totalSales.toFixed(2)}
                    </div>
                </div>

                <!-- تقسيم مبيعات المخزن والسيارة -->
                <div class="source-grid">
                    <div class="source-box main">
                        <div class="source-title">
                            <span><i class="fas fa-warehouse me-1"></i> مبيعات المخزن</span>
                            <span class="badge bg-dark">${storePercent}%</span>
                        </div>
                        <div class="source-val num">${day.storeSales.toFixed(2)}</div>
                        <div class="text-muted fw-bold mt-1" style="font-size:0.7rem;">${day.storeCount} فاتورة</div>
                    </div>
                    <div class="source-box van">
                        <div class="source-title">
                            <span><i class="fas fa-truck me-1"></i> مبيعات السيارة</span>
                            <span class="badge bg-warning text-dark">${vanPercent}%</span>
                        </div>
                        <div class="source-val num">${day.vanSales.toFixed(2)}</div>
                        <div class="text-muted fw-bold mt-1" style="font-size:0.7rem;">${day.vanCount} فاتورة</div>
                    </div>
                </div>

                <!-- الإحصائيات والمتوسطات -->
                <div class="stats-footer-grid">
                    <div>
                        <div class="stat-sub-title">عدد الفواتير</div>
                        <div class="stat-sub-val num">${day.count}</div>
                    </div>
                    <div>
                        <div class="stat-sub-title">متوسط الفاتورة</div>
                        <div class="stat-sub-val num text-primary">${avgPerInvoice.toFixed(1)}</div>
                    </div>
                    <div>
                        <div class="stat-sub-title">البيع الآجل</div>
                        <div class="stat-sub-val num text-danger">${day.creditSales.toFixed(1)}</div>
                    </div>
                </div>
            </div>`;
        }).join('');

        listContainer.innerHTML = html;

        // إحصائيات أعلى الكروت
        const totalDays = processedDaysList.length;
        document.getElementById('periodTotalSales').innerText = overallTotal.toFixed(1);
        document.getElementById('periodDailyAvg').innerText = totalDays > 0 ? (overallTotal / totalDays).toFixed(1) : "0.0";
        document.getElementById('periodInvoiceAvg').innerText = overallInvoices > 0 ? (overallTotal / overallInvoices).toFixed(1) : "0.0";
    }

    function exportSummaryExcel() {
        if (!processedDaysList || processedDaysList.length === 0) return;
        const excelRows = [
            ["التاريخ", "إجمالي المبيعات", "مبيعات المخزن", "عدد فواتير المخزن", "مبيعات السيارة", "عدد فواتير السيارة", "عدد الفواتير الكلي", "متوسط سعر الفاتورة", "البيع النقدي", "المحفظة", "الآجل"]
        ];

        processedDaysList.forEach(d => {
            const avg = d.count > 0 ? (d.totalSales / d.count) : 0;
            excelRows.push([
                d.date,
                d.totalSales,
                d.storeSales,
                d.storeCount,
                d.vanSales,
                d.vanCount,
                d.count,
                Number(avg.toFixed(2)),
                d.cashSales,
                d.walletSales,
                d.creditSales
            ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(excelRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "ملخص المبيعات اليومية");
        XLSX.writeFile(wb, `ملخص_المبيعات_اليومية_${new Date().toLocaleDateString('en-CA')}.xlsx`);
    }

    // تشغيل الجلب عند التحميل
    fetchInvoices();
</script>
</body>
</html>
