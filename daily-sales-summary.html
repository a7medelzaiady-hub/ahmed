<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص مبيعات العربية - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- مكاتب فايربيز compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --accent: #000000;
            --header-bg: linear-gradient(135deg, #000000, #252525 80%);
            --bg-light: #f5f6f6;
            --text-primary: #000000;
            --text-secondary: #4a4a4a;
            --border: #dcdcdc;
            --white: #ffffff;
            
            --germany-black: #000000;
            --germany-red: #FF0000;
            --germany-gold: #FFCC00;
            --purple: #5b21b6;
            
            --card-radius: 18px;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
        }
        
        * { box-sizing: border-box; }
        
        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 80px;
            font-size: 0.88rem;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        .num { 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }

        .header-nav {
            background: var(--header-bg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom: 4px solid var(--germany-gold);
        }
        .header-nav h6 { 
            font-weight: 900; 
            font-size: 1.05rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-btn {
            background: rgba(255, 255, 255, 0.15);
            width: 38px; 
            height: 38px;
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: white; 
            text-decoration: none; 
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2); 
            transition: all 0.2s ease;
        }
        .add-btn:active { transform: scale(0.92); }

        .kpi-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 6px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            height: 100%;
        }
        .kpi-title { font-size: 0.68rem; color: var(--text-secondary); font-weight: 800; white-space: nowrap; }
        .kpi-value { font-size: 0.95rem; font-weight: 900; margin-top: 4px; }

        .day-summary-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            border-right: 5px solid var(--germany-gold);
            transition: all 0.2s ease;
        }

        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px dashed var(--border);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .day-date {
            font-size: 1rem;
            font-weight: 900;
            color: var(--germany-black);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title-sm {
            font-size: 0.78rem;
            font-weight: 800;
            color: #475569;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .data-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .data-box.cash { border-right: 3px solid #16a34a; background: #f0fdf4; }
        .data-box.credit { border-right: 3px solid var(--germany-red); background: #fff1f1; }

        .box-lbl { font-size: 0.72rem; font-weight: 800; color: var(--text-secondary); text-align: center; }
        .box-val { font-size: 1.05rem; font-weight: 900; margin-top: 2px; }

        .filter-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .empty-state { text-align: center; padding: 50px 10px; color: var(--text-secondary); }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
    <h6 class="m-0"><i class="fas fa-truck me-1"></i> ملخص مبيعات العربية</h6>
    <div class="d-flex gap-2">
        <a href="sales-history.html" class="add-btn" title="سجل الفواتير"><i class="fas fa-history"></i></a>
        <button class="add-btn" onclick="exportSummaryExcel()" title="تصدير إكسيل"><i class="fas fa-file-excel"></i></button>
    </div>
</div>

<div class="container px-2 mt-3">

    <!-- الفلاتر واختيار النطاق الزمني -->
    <div class="filter-card">
        <div class="row g-2 align-items-center">
            <div class="col-6">
                <label class="fw-bold mb-1" style="font-size: 0.75rem;">من تاريخ:</label>
                <input type="date" id="startDateInput" class="form-control form-control-sm fw-bold num" onchange="renderDailySummary()">
            </div>
            <div class="col-6">
                <label class="fw-bold mb-1" style="font-size: 0.75rem;">إلى تاريخ:</label>
                <input type="date" id="endDateInput" class="form-control form-control-sm fw-bold num" onchange="renderDailySummary()">
            </div>
        </div>
    </div>

    <!-- كروت الإحصائيات العامة للفترة المحددة -->
    <div class="row g-1 mb-3">
        <div class="col-3">
            <div class="kpi-card">
                <div class="kpi-title">إجمالي مبيعات العربية</div>
                <div class="kpi-value num text-dark" id="periodTotalSales">0.0</div>
            </div>
        </div>
        <div class="col-3">
            <div class="kpi-card">
                <div class="kpi-title">متوسط النقدية</div>
                <div class="kpi-value num text-success" id="periodCashAvg">0.0</div>
            </div>
        </div>
        <div class="col-3">
            <div class="kpi-card">
                <div class="kpi-title">متوسط الآجل</div>
                <div class="kpi-value num text-danger" id="periodCreditAvg">0.0</div>
            </div>
        </div>
        <div class="col-3">
            <div class="kpi-card">
                <div class="kpi-title">إجمالي النقدية</div>
                <div class="kpi-value num text-success" id="periodCashTotal">0.0</div>
            </div>
        </div>
    </div>

    <!-- قائمة اليوميات -->
    <div id="dailySummaryList">
        <div class="empty-state">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p class="mt-3 fw-bold">جاري تجميع وحساب مبيعات العربية والسندات...</p>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let rawInvoices = [];
    let rawTransactions = [];
    let processedDaysList = [];

    function convertToEnglishNumbers(str) {
        if (!str) return "";
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let res = str.toString();
        for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
        return res;
    }

    function parseInvoiceDate(inv) {
        let dateStr = "";
        if (inv.date) { dateStr = convertToEnglishNumbers(inv.date); }
        else if (inv.timestamp?.seconds) { return new Date(inv.timestamp.seconds * 1000).toLocaleDateString('en-CA'); }
        if (!dateStr) return "";
        let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return dateStr;
    }

    function parseTransactionDate(tr) {
        if (!tr) return "";
        if (tr.date) {
            let dateStr = convertToEnglishNumbers(tr.date);
            let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            if (dateStr) return dateStr;
        }
        if (tr.timestamp?.seconds) { return new Date(tr.timestamp.seconds * 1000).toLocaleDateString('en-CA'); }
        return "";
    }

    async function fetchData() {
        try {
            const [invSnap, transSnap] = await Promise.all([
                db.collection("invoices").orderBy("timestamp", "desc").get(),
                db.collection("transactions").get()
            ]);

            rawInvoices = [];
            invSnap.forEach(doc => {
                const data = doc.data();
                if (!data.isDeleted && data.source === 'van_sales') {
                    rawInvoices.push({ id: doc.id, ...data });
                }
            });

            rawTransactions = [];
            transSnap.forEach(doc => {
                const tr = doc.data();
                // جلب كل السندات كالسابق، مع استبعاد المحذوف أو المسجل بـ يد أحمد فقط إن وُجد حقلها صراحة
                if (!tr.isDeleted && tr.custody !== "يد أحمد") {
                    rawTransactions.push({ id: doc.id, ...tr });
                }
            });

            const today = new Date();
            const pastDate = new Date();
            pastDate.setDate(today.getDate() - 30);

            document.getElementById('endDateInput').value = today.toLocaleDateString('en-CA');
            document.getElementById('startDateInput').value = pastDate.toLocaleDateString('en-CA');

            renderDailySummary();
        } catch (e) {
            console.error("خطأ جلب البيانات:", e);
            document.getElementById('dailySummaryList').innerHTML = `<div class="alert alert-danger text-center fw-bold">تعذر تحميل البيانات: ${e.message}</div>`;
        }
    }

    function renderDailySummary() {
        const startDate = document.getElementById('startDateInput').value;
        const endDate = document.getElementById('endDateInput').value;

        const dayGroups = {};

        // 1. تجميع مبيعات العربية من الفواتير
        rawInvoices.forEach(inv => {
            const d = parseInvoiceDate(inv);
            if (!d) return;
            if (startDate && d < startDate) return;
            if (endDate && d > endDate) return;

            if (!dayGroups[d]) {
                dayGroups[d] = {
                    date: d,
                    vanSales: 0,
                    invCashVan: 0,
                    invWalletVan: 0,
                    invCreditVan: 0,
                    voucherCash: 0,
                    voucherWallet: 0
                };
            }

            const total = Number(inv.total) || 0;
            const cash = Number(inv.cashAmount ?? inv.cashPaid ?? inv.paid) || 0;
            const wallet = Number(inv.walletAmount ?? inv.walletPaid) || 0;
            const remaining = Number(inv.remaining) || (total - (cash + wallet));

            dayGroups[d].vanSales += total;
            dayGroups[d].invCashVan += cash;
            dayGroups[d].invWalletVan += wallet;
            if (remaining > 0) dayGroups[d].invCreditVan += remaining;
        });

        // 2. تجميع كل سندات القبض (الكاش والمحفظة) ودمجها مباشرة مع النقدية
        rawTransactions.forEach(tr => {
            const isInvoicePayment = tr.invoiceId || (tr.note && tr.note.includes('فاتورة'));
            if (tr.type === 'قبض' && !isInvoicePayment) {
                const d = parseTransactionDate(tr);
                if (!d) return;
                if (startDate && d < startDate) return;
                if (endDate && d > endDate) return;

                if (!dayGroups[d]) {
                    dayGroups[d] = {
                        date: d, vanSales: 0, invCashVan: 0, invWalletVan: 0, invCreditVan: 0,
                        voucherCash: 0, voucherWallet: 0
                    };
                }

                let amt = Math.abs(Number(tr.amount || tr.total || 0));
                let method = tr.method || tr.paymentMethod || 'نقدى';
                
                let cashAmt = (method === 'محفظة' || method === 'محفظه') ? 0 : amt;
                let walletAmt = (method === 'محفظة' || method === 'محفظه') ? amt : 0;
                
                if (tr.cashPaid !== undefined) cashAmt = Number(tr.cashPaid);
                if (tr.walletPaid !== undefined) walletAmt = Number(tr.walletPaid);

                dayGroups[d].voucherCash += cashAmt;
                dayGroups[d].voucherWallet += walletAmt;
            }
        });

        processedDaysList = Object.values(dayGroups).sort((a, b) => b.date.localeCompare(a.date));

        const listContainer = document.getElementById('dailySummaryList');

        if (processedDaysList.length === 0) {
            listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-truck-pickup fa-2x mb-2"></i><p class="fw-bold mb-0">لا توجد حركات مبيعات أو سندات في هذه الفترة.</p></div>`;
            document.getElementById('periodTotalSales').innerText = "0.0";
            document.getElementById('periodCashAvg').innerText = "0.0";
            document.getElementById('periodCreditAvg').innerText = "0.0";
            document.getElementById('periodCashTotal').innerText = "0.0";
            return;
        }

        let gVanSales = 0;
        let gCashTotal = 0;
        let gCreditTotal = 0;

        const html = processedDaysList.map(day => {
            gVanSales += day.vanSales;

            // حساب النقدية الشاملة (مبيعات كاش + محفظة + سندات قبض كاش ومحفظة)
            const totalCashVan = day.invCashVan + day.invWalletVan + day.voucherCash + day.voucherWallet;
            const totalCreditVan = day.invCreditVan;

            gCashTotal += totalCashVan;
            gCreditTotal += totalCreditVan;

            return `
            <div class="day-summary-card">
                <div class="day-header">
                    <div class="day-date">
                        <i class="far fa-calendar-alt text-danger"></i> ${day.date}
                    </div>
                    <div class="badge bg-dark px-3 py-2 fw-bold num" style="font-size: 0.92rem;">
                        إجمالي مبيعات العربية: ${day.vanSales.toFixed(2)}
                    </div>
                </div>

                <!-- النقدية المستلمة للسيارة (شاملة كل السندات) -->
                <div class="section-title-sm"><i class="fas fa-money-bill-wave text-success"></i> النقدية المستلمة للسيارة:</div>
                <div class="data-box cash mb-2">
                    <div class="box-lbl">نقدي العربية (مبيعات + سندات القبض)</div>
                    <div class="box-val num text-success" style="font-size: 1.15rem;">${totalCashVan.toFixed(2)}</div>
                </div>

                <!-- الآجل المتبقي على عملاء العربية -->
                <div class="section-title-sm"><i class="fas fa-file-invoice-dollar text-danger"></i> الآجل المتبقي على عملاء العربية:</div>
                <div class="data-box credit">
                    <div class="box-lbl">آجل مبيعات العربية</div>
                    <div class="box-val num text-danger" style="font-size: 1.15rem;">${totalCreditVan.toFixed(2)}</div>
                </div>
            </div>`;
        }).join('');

        listContainer.innerHTML = html;

        // حساب المتوسطات العامة العلوية
        const totalDays = processedDaysList.length;
        document.getElementById('periodTotalSales').innerText = gVanSales.toFixed(1);
        document.getElementById('periodCashAvg').innerText = totalDays > 0 ? (gCashTotal / totalDays).toFixed(1) : "0.0";
        document.getElementById('periodCreditAvg').innerText = totalDays > 0 ? (gCreditTotal / totalDays).toFixed(1) : "0.0";
        document.getElementById('periodCashTotal').innerText = gCashTotal.toFixed(1);
    }

    function exportSummaryExcel() {
        if (!processedDaysList || processedDaysList.length === 0) return;
        const excelRows = [
            ["التاريخ", "إجمالي مبيعات العربية", "نقدي العربية (شامل السندات)", "آجل العربية"]
        ];

        processedDaysList.forEach(d => {
            const totalCashVan = d.invCashVan + d.invWalletVan + d.voucherCash + d.voucherWallet;
            excelRows.push([
                d.date,
                d.vanSales,
                totalCashVan,
                d.invCreditVan
            ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(excelRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "ملخص مبيعات العربية");
        XLSX.writeFile(wb, `ملخص_مبيعات_العربية_${new Date().toLocaleDateString('en-CA')}.xlsx`);
    }

    // تشغيل الجلب عند فتح الصفحة
    fetchData();
</script>
</body>
</html>
