<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الربح - شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641;
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 40px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }
        .top-nav .nav-icon {
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .product-header {
            margin: 18px 15px;
            background: white;
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .product-header .name { font-weight: 800; font-size: 1.15rem; margin-bottom: 3px; }
        .product-header .barcode { font-size: 0.8rem; color: var(--text-muted); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 0 15px 15px;
        }
        .stat-box {
            background: white;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .stat-box .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .stat-box .value { font-size: 1.15rem; font-weight: 800; color: var(--primary-green); }
        .stat-box .value.negative { color: var(--danger); }

        .filter-section { padding: 0 15px 10px; }
        .filter-card {
            background: white;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        .filter-row { display: flex; gap: 10px; }
        .filter-row .form-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .filter-row input[type="date"] {
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            width: 100%;
        }
        .filter-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-apply {
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
            flex: 1;
        }
        .btn-clear {
            background: #f1f5f9;
            color: var(--text-muted);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .section-title {
            padding: 5px 20px 10px;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .day-card {
            background: white;
            border-radius: 18px;
            margin: 0 15px 10px;
            padding: 14px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-date { font-weight: 700; font-size: 0.9rem; }
        .day-qty { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .day-profit { font-weight: 800; font-size: 1rem; color: var(--primary-green); }
        .day-profit.negative { color: var(--danger); }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="profits.html" class="nav-icon" title="رجوع للأرباح">
        <i class="fas fa-chevron-right"></i>
    </a>
    <span class="fw-bold">تفاصيل الربح</span>
    <a href="index.html" class="nav-icon" title="الصفحة الرئيسية">
        <i class="fas fa-home"></i>
    </a>
</div>

<div class="product-header" id="productHeader">
    <div class="name">جاري التحميل...</div>
    <div class="barcode"></div>
</div>

<div class="stats-grid">
    <div class="stat-box">
        <div class="label">إجمالي الربح</div>
        <div class="value" id="totalProfitVal">0.00</div>
    </div>
    <div class="stat-box">
        <div class="label">إجمالي القطع المباعة</div>
        <div class="value" id="totalQtyVal" style="color: var(--text-dark);">0</div>
    </div>
</div>

<div class="filter-section">
    <div class="filter-card">
        <div class="filter-row">
            <div style="flex:1">
                <div class="form-label">من تاريخ</div>
                <input type="date" id="fromDate">
            </div>
            <div style="flex:1">
                <div class="form-label">إلى تاريخ</div>
                <input type="date" id="toDate">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn-apply" onclick="renderDetails()"><i class="fas fa-filter me-1"></i> تطبيق الفلتر</button>
            <button class="btn-clear" onclick="clearFilter()">مسح</button>
        </div>
    </div>
</div>

<div class="section-title">الربح حسب اليوم</div>
<div id="daysContainer">
    <div class="text-center text-muted mt-5 fw-bold">
        <div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري تحميل التفاصيل...
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // حقل سعر التكلفة في مستند الصنف (inventory) = buy
    function getCostPerPiece(productData) {
        return Number(productData.buy) || 0;
    }

    // حقل تاريخ الفاتورة = timestamp (Firestore Timestamp)
    function getInvoiceDate(invoiceData) {
        if (invoiceData.timestamp && invoiceData.timestamp.toDate) {
            return invoiceData.timestamp.toDate();
        }
        if (invoiceData.timestamp) {
            const d = new Date(invoiceData.timestamp);
            if (!isNaN(d)) return d;
        }
        return null;
    }

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const paramFrom = params.get('from');
    const paramTo = params.get('to');

    let allLines = []; // {date, qtyPcs, revenue, profit, invoiceNumber}
    let productInfo = null;

    async function loadDetails() {
        if (!productId) {
            document.getElementById('productHeader').innerHTML = '<div class="name">لم يتم تحديد الصنف</div>';
            return;
        }
        try {
            const productSnap = await getDoc(doc(db, "inventory", productId));
            if (!productSnap.exists()) {
                document.getElementById('productHeader').innerHTML = '<div class="name">الصنف غير موجود</div>';
                return;
            }
            const pData = productSnap.data();
            productInfo = {
                name: pData.name || 'بدون اسم',
                barcode: pData.barcode || '---',
                costPerPiece: getCostPerPiece(pData)
            };

            document.getElementById('productHeader').innerHTML = `
                <div class="name">${productInfo.name}</div>
                <div class="barcode">باركود: ${productInfo.barcode}</div>
            `;

            const invoicesSnap = await getDocs(collection(db, "invoices"));
            invoicesSnap.forEach(docSnap => {
                const data = docSnap.data();
                const invDate = getInvoiceDate(data);
                data.items?.forEach(item => {
                    const id = item.stockId;
                    const nameMatch = item.name && item.name.trim() === productInfo.name.trim();
                    if (id !== productId && !(!id && nameMatch)) return;

                    const itemFactor = Math.max(1, Number(item.unitFactor) || 1);
                    let pcs = item.totalPcs !== undefined && item.totalPcs !== null
                        ? Number(item.totalPcs)
                        : (Number(item.qty) || 0) * itemFactor;

                    const revenue = (Number(item.price) || 0) * (Number(item.qty) || 0);
                    const costTotal = productInfo.costPerPiece * pcs;
                    let profit = revenue - costTotal;

                    if (item.isReturn) {
                        profit = -profit;
                        pcs = -pcs;
                    }

                    allLines.push({
                        date: invDate,
                        qtyPcs: pcs,
                        profit,
                        invoiceNumber: data.invoiceNumber || docSnap.id
                    });
                });
            });

            // تطبيق فلتر التاريخ الجاي من صفحة الأرباح (لو موجود)
            if (paramFrom) document.getElementById('fromDate').value = paramFrom;
            if (paramTo) document.getElementById('toDate').value = paramTo;

            renderDetails();
        } catch (e) {
            console.error("خطأ في تحميل تفاصيل الربح:", e);
            document.getElementById('daysContainer').innerHTML =
                '<div class="text-center text-danger mt-5 fw-bold">حدث خطأ أثناء تحميل البيانات</div>';
        }
    }

    window.clearFilter = function() {
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        renderDetails();
    };

    window.renderDetails = function() {
        const fromVal = document.getElementById('fromDate').value;
        const toVal = document.getElementById('toDate').value;
        const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
        const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

        let filtered = allLines.filter(l => {
            if (fromDate && (!l.date || l.date < fromDate)) return false;
            if (toDate && (!l.date || l.date > toDate)) return false;
            return true;
        });

        // تجميع حسب اليوم
        let byDay = {};
        filtered.forEach(l => {
            const key = l.date ? l.date.toISOString().slice(0, 10) : 'بدون تاريخ';
            if (!byDay[key]) byDay[key] = { qty: 0, profit: 0 };
            byDay[key].qty += l.qtyPcs;
            byDay[key].profit += l.profit;
        });

        const dayKeys = Object.keys(byDay).sort((a, b) => b.localeCompare(a));

        let totalProfit = 0;
        let totalQty = 0;
        let html = '';

        dayKeys.forEach(key => {
            const d = byDay[key];
            totalProfit += d.profit;
            totalQty += d.qty;
            const isNeg = d.profit < 0;
            const displayDate = key === 'بدون تاريخ' ? key : new Date(key).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            html += `
                <div class="day-card">
                    <div>
                        <div class="day-date">${displayDate}</div>
                        <div class="day-qty">القطع المباعة: ${d.qty}</div>
                    </div>
                    <div class="day-profit ${isNeg ? 'negative' : ''}">${d.profit.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                </div>
            `;
        });

        if (dayKeys.length === 0) {
            html = `<div class="text-center text-muted mt-5 fw-bold"><i class="fas fa-inbox fa-2x mb-2"></i><br>لا توجد بيانات مبيعات في هذه الفترة</div>`;
        }

        document.getElementById('daysContainer').innerHTML = html;
        document.getElementById('totalProfitVal').innerText = totalProfit.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('totalProfitVal').classList.toggle('negative', totalProfit < 0);
        document.getElementById('totalQtyVal').innerText = totalQty;
    };

    loadDetails();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch((err) => console.log(err));
}
</script>
</body>
</html>
