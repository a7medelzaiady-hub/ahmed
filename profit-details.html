<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الربح - شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641;
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 40px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }
        .top-nav .nav-icon {
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .product-header {
            margin: 18px 15px;
            background: white;
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .product-header .name { font-weight: 800; font-size: 1.15rem; margin-bottom: 3px; }
        .product-header .barcode { font-size: 0.8rem; color: var(--text-muted); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 0 15px 10px;
        }
        .stats-grid.three-col { grid-template-columns: 1fr 1fr 1fr; }
        .stat-box {
            background: white;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .stat-box .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .stat-box .value { font-size: 1.15rem; font-weight: 800; color: var(--primary-green); }
        .stat-box .value.negative { color: var(--danger); }

        .filter-section { padding: 0 15px 10px; }
        .filter-card {
            background: white;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        .filter-row { display: flex; gap: 10px; }
        .filter-row .form-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .filter-row input[type="date"] {
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            width: 100%;
        }
        .filter-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-apply {
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
            flex: 1;
        }
        .btn-clear {
            background: #f1f5f9;
            color: var(--text-muted);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .section-title {
            padding: 5px 20px 10px;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .day-card {
            background: white;
            border-radius: 18px;
            margin: 0 15px 10px;
            padding: 14px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-date { font-weight: 700; font-size: 0.9rem; }
        .day-qty { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .day-profit { font-weight: 800; font-size: 1rem; color: var(--primary-green); }
        .day-profit.negative { color: var(--danger); }
        .day-profit-secondary { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; font-weight: 700; }
        .day-profit-secondary.negative { color: #e11d48; opacity: 0.8; }

        .price-history-card {
            background: white;
            border-radius: 16px;
            margin: 0 15px 8px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-history-date { font-size: 0.82rem; font-weight: 700; }
        .price-history-qty { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
        .price-history-price { font-weight: 800; font-size: 0.95rem; color: #1d4ed8; }
        .price-history-price.opening { color: #b45309; }
        .price-history-price.return-price { color: var(--danger); }
        .price-history-tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
        }
        .price-history-tag.opening { background: #fef3c7; color: #b45309; }
        .price-history-tag.return-tag { background: var(--danger-bg); color: var(--danger); }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="profits.html" class="nav-icon" title="رجوع للأرباح">
        <i class="fas fa-chevron-right"></i>
    </a>
    <span class="fw-bold">تفاصيل الربح</span>
    <a href="index.html" class="nav-icon" title="الصفحة الرئيسية">
        <i class="fas fa-home"></i>
    </a>
</div>

<div class="product-header" id="productHeader">
    <div class="name">جاري التحميل...</div>
    <div class="barcode"></div>
</div>

<div class="stats-grid">
    <div class="stat-box">
        <div class="label">الربح (متوسط التكلفة المتحرك)</div>
        <div class="value" id="totalProfitVal">0.00</div>
    </div>
    <div class="stat-box">
        <div class="label">الربح (سعر الشراء الحالي)</div>
        <div class="value" id="totalProfitCurrentVal" style="color: #1d4ed8;">0.00</div>
    </div>
    <div class="stat-box">
        <div class="label">إجمالي القطع المباعة</div>
        <div class="value" id="totalQtyVal" style="color: var(--text-dark);">0</div>
    </div>
    <div class="stat-box">
        <div class="label">متوسط سعر التكلفة الحالي</div>
        <div class="value" id="avgCostVal" style="color: var(--text-dark);">0.00</div>
    </div>
</div>

<div class="filter-section">
    <div class="filter-card">
        <div class="filter-row">
            <div style="flex:1">
                <div class="form-label">من تاريخ</div>
                <input type="date" id="fromDate">
            </div>
            <div style="flex:1">
                <div class="form-label">إلى تاريخ</div>
                <input type="date" id="toDate">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn-apply" onclick="renderDetails()"><i class="fas fa-filter me-1"></i> تطبيق الفلتر</button>
            <button class="btn-clear" onclick="clearFilter()">مسح</button>
        </div>
    </div>
</div>

<div class="section-title">سجل أسعار الشراء (المستخدمة في حساب المتوسط)</div>
<div id="priceHistoryContainer">
    <div class="text-center text-muted mt-3 fw-bold small">جاري التحميل...</div>
</div>

<div class="section-title">الربح حسب اليوم</div>
<div id="daysContainer">
    <div class="text-center text-muted mt-5 fw-bold">
        <div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري تحميل التفاصيل...
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // تاريخ أي مستند (فاتورة بيع أو فاتورة توريد) = حقل timestamp
    function getDocDate(data) {
        if (data.timestamp && data.timestamp.toDate) return data.timestamp.toDate();
        if (data.timestamp) {
            const d = new Date(data.timestamp);
            if (!isNaN(d)) return d;
        }
        return null;
    }

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const paramFrom = params.get('from');
    const paramTo = params.get('to');

    let allLines = []; // {date, qty, revenue, cost, profit} - نتيجة محاكاة المتوسط المتحرك
    let productInfo = null;

    async function loadDetails() {
        if (!productId) {
            document.getElementById('productHeader').innerHTML = '<div class="name">لم يتم تحديد الصنف</div>';
            return;
        }
        try {
            const productSnap = await getDoc(doc(db, "inventory", productId));
            if (!productSnap.exists()) {
                document.getElementById('productHeader').innerHTML = '<div class="name">الصنف غير موجود</div>';
                return;
            }
            const pData = productSnap.data();
            const factor = Math.max(1, Number(pData.unitFactor || pData.factor || pData.pcsPerCarton) || 1);
            productInfo = {
                name: pData.name || 'بدون اسم',
                barcode: pData.barcode || '---',
                fallbackBuy: Number(pData.buy) || 0
            };

            document.getElementById('productHeader').innerHTML = `
                <div class="name">${productInfo.name}</div>
                <div class="barcode">باركود: ${productInfo.barcode}</div>
            `;

            const [invoicesSnap, supplierSnap, openingSnap] = await Promise.all([
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions")),
                getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance"), where("productId", "==", productId)))
            ]);

            let events = [];
            let purchaseHistory = []; // لعرض سجل الأسعار للمستخدم

            // الرصيد الافتتاحي - كل حركة على حدة بسعرها المسجل وقت الاستيراد
            // لو السعر مكتوبش وقتها (0 أو غير موجود) بناخد سعر الشراء الحالي كبديل
            openingSnap.forEach(d => {
                const data = d.data();
                const qty = Number(data.quantityPcs) || 0;
                if (!qty) return;
                let price;
                let priceIsFallback = false;
                if (data.unitPrice !== undefined && data.unitPrice !== null && Number(data.unitPrice) > 0) {
                    price = Number(data.unitPrice);
                } else if (data.totalAmount !== undefined && data.totalAmount !== null && Number(data.totalAmount) > 0) {
                    price = Number(data.totalAmount) / qty;
                } else {
                    price = productInfo.fallbackBuy; // لم يُكتب سعر شراء وقت استيراد الرصيد الافتتاحي
                    priceIsFallback = true;
                }
                events.push({ type: 'purchase', date: new Date(0), qty, price });
                purchaseHistory.push({ date: new Date(0), qty, price, isOpening: true, isReturn: false, priceIsFallback });
            });

            // لو الصنف مفهوش أي حركة رصيد افتتاحي مسجلة أصلاً (نادر) - نستخدم الحقول القديمة على مستند الصنف
            if (openingSnap.empty) {
                let openingPcs = 0;
                if (pData.openingTotalPcs !== undefined && pData.openingTotalPcs !== null) {
                    openingPcs = Number(pData.openingTotalPcs);
                } else if (pData.openingQty !== undefined && pData.openingQty !== null) {
                    openingPcs = Math.round(Number(pData.openingQty) * factor);
                }
                if (openingPcs) {
                    events.push({ type: 'purchase', date: new Date(0), qty: openingPcs, price: productInfo.fallbackBuy });
                    purchaseHistory.push({ date: new Date(0), qty: openingPcs, price: productInfo.fallbackBuy, isOpening: true, isReturn: false, priceIsFallback: true });
                }
            }

            // عمليات الشراء بسعرها الفعلي وقت التوريد
            supplierSnap.forEach(docSnap => {
                const data = docSnap.data();
                const date = getDocDate(data);
                data.items?.forEach(item => {
                    const id = item.stockId;
                    const nameMatch = item.name && item.name.trim() === productInfo.name.trim();
                    if (id !== productId && !(!id && nameMatch)) return;
                    const itemFactor = Math.max(1, Number(item.unitFactor) || 1);
                    let pcs = item.totalPcs !== undefined && item.totalPcs !== null
                        ? Number(item.totalPcs)
                        : (Number(item.qty) || 0) * itemFactor;
                    const buyPrice = Number(item.buy) || 0;
                    const isReturn = item.isReturn === true || Number(item.returnQty) > 0;
                    if (isReturn) pcs = -Math.abs(pcs);
                    events.push({ type: 'purchase', date, qty: pcs, price: buyPrice });
                    purchaseHistory.push({ date, qty: pcs, price: buyPrice, isOpening: false, isReturn, priceIsFallback: false });
                });
            });

            // عمليات البيع
            invoicesSnap.forEach(docSnap => {
                const data = docSnap.data();
                const invDate = getDocDate(data);
                data.items?.forEach(item => {
                    const id = item.stockId;
                    const nameMatch = item.name && item.name.trim() === productInfo.name.trim();
                    if (id !== productId && !(!id && nameMatch)) return;

                    const itemFactor = Math.max(1, Number(item.unitFactor) || 1);
                    let pcs = item.totalPcs !== undefined && item.totalPcs !== null
                        ? Number(item.totalPcs)
                        : (Number(item.qty) || 0) * itemFactor;

                    let revenue = (Number(item.price) || 0) * (Number(item.qty) || 0);
                    if (item.isReturn) { pcs = -pcs; revenue = -revenue; }

                    events.push({ type: 'sale', date: invDate, qty: pcs, revenue });
                });
            });

            // محاكاة متوسط التكلفة المتحرك بالترتيب الزمني + حساب الربح بطريقة السعر الحالي للمقارنة
            events.sort((a, b) => (a.date ? a.date.getTime() : Number.MAX_SAFE_INTEGER) - (b.date ? b.date.getTime() : Number.MAX_SAFE_INTEGER));
            purchaseHistory.sort((a, b) => (a.date ? a.date.getTime() : Number.MAX_SAFE_INTEGER) - (b.date ? b.date.getTime() : Number.MAX_SAFE_INTEGER));
            let runQty = 0, runAvg = 0;
            events.forEach(ev => {
                if (ev.type === 'purchase') {
                    if (ev.qty > 0) {
                        const newQty = runQty + ev.qty;
                        runAvg = newQty > 0 ? (runQty * runAvg + ev.qty * ev.price) / newQty : 0;
                        runQty = newQty;
                    } else {
                        runQty = Math.max(0, runQty + ev.qty);
                    }
                } else {
                    const cost = runAvg * ev.qty;
                    const profit = ev.revenue - cost;
                    const costCurrent = productInfo.fallbackBuy * ev.qty;
                    const profitCurrent = ev.revenue - costCurrent;
                    runQty = Math.max(0, runQty - ev.qty);
                    allLines.push({ date: ev.date, qty: ev.qty, revenue: ev.revenue, cost, profit, profitCurrent });
                }
            });
            document.getElementById('avgCostVal').innerText = runAvg.toLocaleString('en-US', { minimumFractionDigits: 2 });
            renderPriceHistory(purchaseHistory);

            // تطبيق فلتر التاريخ الجاي من صفحة الأرباح (لو موجود)
            if (paramFrom) document.getElementById('fromDate').value = paramFrom;
            if (paramTo) document.getElementById('toDate').value = paramTo;

            renderDetails();
        } catch (e) {
            console.error("خطأ في تحميل تفاصيل الربح:", e);
            document.getElementById('daysContainer').innerHTML =
                '<div class="text-center text-danger mt-5 fw-bold">حدث خطأ أثناء تحميل البيانات</div>';
        }
    }

    function renderPriceHistory(history) {
        const container = document.getElementById('priceHistoryContainer');
        if (!history || history.length === 0) {
            container.innerHTML = '<div class="text-center text-muted mt-2 small">لا يوجد سجل شراء لهذا الصنف</div>';
            return;
        }
        let html = '';
        history.forEach(h => {
            const displayDate = h.isOpening
                ? 'رصيد افتتاحي'
                : (h.date ? h.date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : 'بدون تاريخ');
            let tagClass = 'price-history-tag';
            let priceClass = 'price-history-price';
            let tagText = 'شراء';
            if (h.isOpening) { tagClass += ' opening'; priceClass += ' opening'; tagText = h.priceIsFallback ? 'رصيد افتتاحي (سعر تقديري)' : 'رصيد افتتاحي'; }
            if (h.isReturn) { tagClass += ' return-tag'; priceClass += ' return-price'; tagText = 'مرتجع للمورد'; }
            html += `
                <div class="price-history-card">
                    <div>
                        <div class="price-history-date">${displayDate}</div>
                        <div class="price-history-qty">الكمية: ${h.qty} قطعة <span class="${tagClass}">${tagText}</span></div>
                    </div>
                    <div class="${priceClass}">${h.price.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.clearFilter = function() {
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        renderDetails();
    };

    window.renderDetails = function() {
        const fromVal = document.getElementById('fromDate').value;
        const toVal = document.getElementById('toDate').value;
        const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
        const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

        let filtered = allLines.filter(l => {
            if (fromDate && (!l.date || l.date < fromDate)) return false;
            if (toDate && (!l.date || l.date > toDate)) return false;
            return true;
        });

        // تجميع حسب اليوم
        let byDay = {};
        filtered.forEach(l => {
            const key = l.date ? l.date.toISOString().slice(0, 10) : 'بدون تاريخ';
            if (!byDay[key]) byDay[key] = { qty: 0, profit: 0, profitCurrent: 0 };
            byDay[key].qty += l.qty;
            byDay[key].profit += l.profit;
            byDay[key].profitCurrent += l.profitCurrent;
        });

        const dayKeys = Object.keys(byDay).sort((a, b) => b.localeCompare(a));

        let totalProfit = 0;
        let totalProfitCurrent = 0;
        let totalQty = 0;
        let html = '';

        dayKeys.forEach(key => {
            const d = byDay[key];
            totalProfit += d.profit;
            totalProfitCurrent += d.profitCurrent;
            totalQty += d.qty;
            const isNeg = d.profit < 0;
            const isNegCurrent = d.profitCurrent < 0;
            const displayDate = key === 'بدون تاريخ' ? key : new Date(key).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            html += `
                <div class="day-card">
                    <div>
                        <div class="day-date">${displayDate}</div>
                        <div class="day-qty">القطع المباعة: ${d.qty}</div>
                    </div>
                    <div>
                        <div class="day-profit ${isNeg ? 'negative' : ''}">${d.profit.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                        <div class="day-profit-secondary ${isNegCurrent ? 'negative' : ''}">${d.profitCurrent.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                </div>
            `;
        });

        if (dayKeys.length === 0) {
            html = `<div class="text-center text-muted mt-5 fw-bold"><i class="fas fa-inbox fa-2x mb-2"></i><br>لا توجد بيانات مبيعات في هذه الفترة</div>`;
        }

        document.getElementById('daysContainer').innerHTML = html;
        document.getElementById('totalProfitVal').innerText = totalProfit.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('totalProfitVal').classList.toggle('negative', totalProfit < 0);
        document.getElementById('totalProfitCurrentVal').innerText = totalProfitCurrent.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('totalQtyVal').innerText = totalQty;
    };

    loadDetails();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch((err) => console.log(err));
}
</script>
</body>
</html>
