<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الربح - شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641;
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 40px;
            direction: rtl;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }
        .top-nav .nav-icon {
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .product-header {
            margin: 18px 15px;
            background: white;
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .product-header .name { font-weight: 800; font-size: 1.15rem; margin-bottom: 3px; }
        .product-header .barcode { font-size: 0.8rem; color: var(--text-muted); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 0 15px 10px;
        }
        .stat-box {
            background: white;
            border-radius: 16px;
            padding: 12px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .stat-box .label { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .stat-box .value { font-size: 1.05rem; font-weight: 800; color: var(--primary-green); }
        .stat-box .value.current { color: #0284c7; }
        .stat-box .value.negative { color: var(--danger); }

        .filter-section { padding: 0 15px 10px; }
        .filter-card {
            background: white;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        .filter-row { display: flex; gap: 10px; }
        .filter-row .form-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .filter-row input[type="date"] {
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            width: 100%;
        }
        .filter-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-apply {
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
            flex: 1;
        }
        .btn-clear {
            background: #f1f5f9;
            color: var(--text-muted);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .section-title {
            padding: 5px 20px 10px;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-card {
            background: white;
            border-radius: 18px;
            margin: 0 15px 10px;
            padding: 14px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-date { font-weight: 700; font-size: 0.9rem; }
        .day-qty { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .day-profit { font-weight: 800; font-size: 0.95rem; color: var(--primary-green); text-align: left; }
        .day-profit .sub { font-size: 0.75rem; color: #0284c7; font-weight: 700; display: block; }
        .day-profit.negative { color: var(--danger); }

        .purchases-box {
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            margin: 0 15px 15px;
            padding: 12px;
        }
        .purchase-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 6px;
            font-size: 0.8rem;
            border: 1px solid #e2e8f0;
        }
        .purchase-item:last-child { margin-bottom: 0; }
        .badge-buy { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="profits.html" class="nav-icon" title="رجوع للأرباح">
        <i class="fas fa-chevron-right"></i>
    </a>
    <span class="fw-bold">تفاصيل الربح</span>
    <a href="index.html" class="nav-icon" title="الصفحة الرئيسية">
        <i class="fas fa-home"></i>
    </a>
</div>

<div class="product-header" id="productHeader">
    <div class="name">جاري التحميل...</div>
    <div class="barcode"></div>
</div>

<div class="stats-grid">
    <div class="stat-box">
        <div class="label">إجمالي الربح (بالمتوسط)</div>
        <div class="value" id="totalProfitVal">0.00</div>
    </div>
    <div class="stat-box">
        <div class="label">إجمالي الربح (بالسعر الحالي)</div>
        <div class="value current" id="totalProfitCurrVal">0.00</div>
    </div>
    <div class="stat-box">
        <div class="label">إجمالي القطع المباعة</div>
        <div class="value" id="totalQtyVal" style="color: var(--text-dark);">0</div>
    </div>
    <div class="stat-box">
        <div class="label">متوسط التكلفة / السعر الحالي</div>
        <div class="value" id="avgVsCurrVal" style="color: var(--text-dark); font-size: 0.85rem;">0.00 / 0.00</div>
    </div>
</div>

<div class="section-title">
    <span><i class="fas fa-history text-success me-1"></i> سجل أسعار الشراء الواردة</span>
</div>
<div class="purchases-box" id="purchasesList">
    <div class="text-center text-muted font-small">جاري التحميل...</div>
</div>

<div class="filter-section">
    <div class="filter-card">
        <div class="filter-row">
            <div style="flex:1">
                <div class="form-label">من تاريخ</div>
                <input type="date" id="fromDate">
            </div>
            <div style="flex:1">
                <div class="form-label">إلى تاريخ</div>
                <input type="date" id="toDate">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn-apply" onclick="renderDetails()"><i class="fas fa-filter me-1"></i> تطبيق الفلتر</button>
            <button class="btn-clear" onclick="clearFilter()">مسح</button>
        </div>
    </div>
</div>

<div class="section-title">
    <span>الربح حسب اليوم</span>
    <span style="font-size: 0.72rem; color: var(--text-muted);">(المتوسط / السعر الحالي)</span>
</div>
<div id="daysContainer">
    <div class="text-center text-muted mt-5 fw-bold">
        <div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري تحميل التفاصيل...
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function getDocDate(data) {
        if (data.timestamp && data.timestamp.toDate) return data.timestamp.toDate();
        if (data.timestamp) {
            const d = new Date(data.timestamp);
            if (!isNaN(d)) return d;
        }
        return null;
    }

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const paramFrom = params.get('from');
    const paramTo = params.get('to');

    let allLines = []; 
    let purchaseEvents = [];
    let productInfo = null;
    let currentBuyPrice = 0;

    async function loadDetails() {
        if (!productId) {
            document.getElementById('productHeader').innerHTML = '<div class="name">لم يتم تحديد الصنف</div>';
            return;
        }
        try {
            const productSnap = await getDoc(doc(db, "inventory", productId));
            if (!productSnap.exists()) {
                document.getElementById('productHeader').innerHTML = '<div class="name">الصنف غير موجود</div>';
                return;
            }
            const pData = productSnap.data();
            const factor = Math.max(1, Number(pData.unitFactor || pData.factor || pData.pcsPerCarton) || 1);
            
            // حساب سعر شراء القطعة الواحدة للسعر الحالي
            let rawBuy = Number(pData.buy) || 0;
            currentBuyPrice = rawBuy > 0 ? (rawBuy / factor) : 0;

            productInfo = {
                name: pData.name || 'بدون اسم',
                barcode: pData.barcode || '---',
                fallbackBuy: currentBuyPrice
            };

            document.getElementById('productHeader').innerHTML = `
                <div class="name">${productInfo.name}</div>
                <div class="barcode">باركود: ${productInfo.barcode}</div>
            `;

            const [invoicesSnap, supplierSnap, openingSnap] = await Promise.all([
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions")),
                getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance"), where("productId", "==", productId)))
            ]);

            let events = [];

            // تجميع كمية وقيمة الرصيد الافتتاحي
            let openingPcs = 0;
            let openingValue = 0;
            openingSnap.forEach(d => {
                const data = d.data();
                const qty = Number(data.quantityPcs) || 0;
                let value = (data.totalAmount !== undefined && data.totalAmount !== null) ? Number(data.totalAmount) || 0 : (Number(data.unitPrice) || 0) * qty;
                openingPcs += qty;
                openingValue += value;
            });

            let openingPrice = (openingPcs > 0 && openingValue > 0) ? (openingValue / openingPcs) : currentBuyPrice;

            if (!openingPcs) {
                if (pData.openingTotalPcs !== undefined && pData.openingTotalPcs !== null) {
                    openingPcs = Number(pData.openingTotalPcs);
                } else if (pData.openingQty !== undefined && pData.openingQty !== null) {
                    openingPcs = Math.round(Number(pData.openingQty) * factor);
                }
            }

            if (openingPcs) {
                events.push({ type: 'purchase', label: 'رصيد افتتاحي', date: new Date(0), qty: openingPcs, price: openingPrice });
            }

            // فواتير التوريد
            supplierSnap.forEach(docSnap => {
                const data = docSnap.data();
                const date = getDocDate(data);
                data.items?.forEach(item => {
                    const id = item.stockId;
                    const nameMatch = item.name && item.name.trim() === productInfo.name.trim();
                    if (id !== productId && !(!id && nameMatch)) return;
                    const itemFactor = Math.max(1, Number(item.unitFactor) || 1);
                    let pcs = item.totalPcs !== undefined && item.totalPcs !== null ? Number(item.totalPcs) : (Number(item.qty) || 0) * itemFactor;
                    
                    // تحويل سعر الشراء إلى سعر القطعة
                    let itemBuy = Number(item.buy) || 0;
                    let buyPrice = itemBuy > 0 ? (itemBuy / itemFactor) : currentBuyPrice;

                    const isReturn = item.isReturn === true || Number(item.returnQty) > 0;
                    if (isReturn) pcs = -Math.abs(pcs);
                    events.push({ type: 'purchase', label: 'فاتورة توريد', date, qty: pcs, price: buyPrice });
                });
            });

            // الاعتماد على آخر سعر توريد متوفر إذا كان السعر الحالي في كارت الصنف = 0
            let lastPurchase = events.filter(e => e.type === 'purchase' && e.price > 0).slice(-1)[0];
            if (currentBuyPrice === 0 && lastPurchase) {
                currentBuyPrice = lastPurchase.price;
            }

            // عمليات البيع
            invoicesSnap.forEach(docSnap => {
                const data = docSnap.data();
                const invDate = getDocDate(data);
                data.items?.forEach(item => {
                    const id = item.stockId;
                    const nameMatch = item.name && item.name.trim() === productInfo.name.trim();
                    if (id !== productId && !(!id && nameMatch)) return;

                    const itemFactor = Math.max(1, Number(item.unitFactor) || 1);
                    let pcs = item.totalPcs !== undefined && item.totalPcs !== null ? Number(item.totalPcs) : (Number(item.qty) || 0) * itemFactor;
                    let revenue = (Number(item.price) || 0) * (Number(item.qty) || 0);
                    if (item.isReturn) { pcs = -pcs; revenue = -revenue; }

                    events.push({ type: 'sale', date: invDate, qty: pcs, revenue });
                });
            });

            events.sort((a, b) => (a.date ? a.date.getTime() : 0) - (b.date ? b.date.getTime() : 0));
            let runQty = 0, runAvg = 0;

            events.forEach(ev => {
                if (ev.type === 'purchase') {
                    if (ev.qty > 0) {
                        const newQty = runQty + ev.qty;
                        runAvg = newQty > 0 ? (runQty * runAvg + ev.qty * ev.price) / newQty : 0;
                        runQty = newQty;
                    } else {
                        runQty = Math.max(0, runQty + ev.qty);
                    }
                    purchaseEvents.push(ev);
                } else {
                    const costAvg = runAvg * ev.qty;
                    const profitAvg = ev.revenue - costAvg;

                    const costCurrent = currentBuyPrice * ev.qty;
                    const profitCurrent = ev.revenue - costCurrent;

                    runQty -= ev.qty;
                    allLines.push({ 
                        date: ev.date, 
                        qty: ev.qty, 
                        revenue: ev.revenue, 
                        costAvg, 
                        profitAvg,
                        costCurrent,
                        profitCurrent
                    });
                }
            });

            document.getElementById('avgVsCurrVal').innerText = `${runAvg.toFixed(2)} / ${currentBuyPrice.toFixed(2)}`;

            let pLinesHtml = '';
            purchaseEvents.forEach(p => {
                const dateStr = p.date.getTime() === 0 ? 'عند التأسيس' : p.date.toLocaleDateString('ar-EG');
                pLinesHtml += `
                    <div class="purchase-item">
                        <div><strong>${p.label}:</strong> ${p.qty} قطعة</div>
                        <div>بتاريخ: ${dateStr}</div>
                        <div class="badge-buy">${p.price.toFixed(2)} ج.م</div>
                    </div>
                `;
            });
            document.getElementById('purchasesList').innerHTML = pLinesHtml || '<div class="text-center text-muted">لا يوجد سجل توريد</div>';

            if (paramFrom) document.getElementById('fromDate').value = paramFrom;
            if (paramTo) document.getElementById('toDate').value = paramTo;

            renderDetails();
        } catch (e) {
            console.error("خطأ في تحميل تفاصيل الربح:", e);
            document.getElementById('daysContainer').innerHTML = '<div class="text-center text-danger mt-5 fw-bold">حدث خطأ أثناء تحميل البيانات</div>';
        }
    }

    window.clearFilter = function() {
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        renderDetails();
    };

    window.renderDetails = function() {
        const fromVal = document.getElementById('fromDate').value;
        const toVal = document.getElementById('toDate').value;
        const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
        const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

        let filtered = allLines.filter(l => {
            if (fromDate && (!l.date || l.date < fromDate)) return false;
            if (toDate && (!l.date || l.date > toDate)) return false;
            return true;
        });

        let byDay = {};
        filtered.forEach(l => {
            const key = l.date ? l.date.toISOString().slice(0, 10) : 'بدون تاريخ';
            if (!byDay[key]) byDay[key] = { qty: 0, profitAvg: 0, profitCurrent: 0 };
            byDay[key].qty += l.qty;
            byDay[key].profitAvg += l.profitAvg;
            byDay[key].profitCurrent += l.profitCurrent;
        });

        const dayKeys = Object.keys(byDay).sort((a, b) => b.localeCompare(a));

        let totalProfitAvg = 0;
        let totalProfitCurrent = 0;
        let totalQty = 0;
        let html = '';

        dayKeys.forEach(key => {
            const d = byDay[key];
            totalProfitAvg += d.profitAvg;
            totalProfitCurrent += d.profitCurrent;
            totalQty += d.qty;

            const displayDate = key === 'بدون تاريخ' ? key : new Date(key).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            html += `
                <div class="day-card">
                    <div>
                        <div class="day-date">${displayDate}</div>
                        <div class="day-qty">القطع المباعة: ${d.qty}</div>
                    </div>
                    <div class="day-profit">
                        <div>${d.profitAvg.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                        <span class="sub">${d.profitCurrent.toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
                    </div>
                </div>
            `;
        });

        if (dayKeys.length === 0) {
            html = `<div class="text-center text-muted mt-5 fw-bold"><i class="fas fa-inbox fa-2x mb-2"></i><br>لا توجد بيانات مبيعات في هذه الفترة</div>`;
        }

        document.getElementById('daysContainer').innerHTML = html;
        document.getElementById('totalProfitVal').innerText = totalProfitAvg.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('totalProfitCurrVal').innerText = totalProfitCurrent.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('totalQtyVal').innerText = totalQty;
    };

    loadDetails();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch((err) => console.log(err));
}
</script>
</body>
</html>
