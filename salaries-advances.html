<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore,
        collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, query, where, getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
    } catch (e) {
        db = getFirestore(app);
    }

    const DRIVERS_COL = "drivers";
    const ADVANCES_COL = "driverAdvances";

    const ARABIC_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

    let drivers = [];
    let advances = [];
    let currentMonth = new Date().toISOString().slice(0,7);
    let openPanels = new Map();

    const currentUser = (localStorage.getItem("currentUser") || sessionStorage.getItem("currentUser") || localStorage.getItem("username") || sessionStorage.getItem("username") || "").trim();
    const userRole = (sessionStorage.getItem('role') || localStorage.getItem('role') || '').toLowerCase();
    const isAdmin = userRole === 'admin';
    const isFekry = currentUser.includes("فكري") || currentUser.toLowerCase().includes("fekry");

    if (isAdmin) {
        const addBlock = document.getElementById('addDriverBlock');
        const statsRow = document.getElementById('statsRow');
        if (addBlock) addBlock.style.display = 'block';
        if (statsRow) statsRow.style.display = 'grid';
    }

    function fmt(n){
        n = Math.round(Number(n) || 0);
        return n.toLocaleString('en-US') + ' ج.م';
    }
    function escapeHtml(s){
        return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function monthLabel(ym){
        const [y,m] = ym.split('-').map(Number);
        return ARABIC_MONTHS[m-1] + ' ' + y;
    }
    function advancesOf(driverId){ return advances.filter(a => a.driverId === driverId); }
    function itemsOfMonth(driverId, ym, type){ 
        return advancesOf(driverId).filter(a => {
            if (!a.date || a.date.slice(0,7) !== ym) return false;
            if (type === 'absence') return a.isAbsence;
            if (type === 'deficit') return a.isDeficit;
            if (type === 'nondeductible') return a.isNonDeductible;
            return !a.isDeficit && !a.isAbsence && !a.isNonDeductible;
        }); 
    }

    function calcAllowedLimit(baseSalary, dateStr){
        const d = new Date(dateStr + 'T00:00:00');
        const year = d.getFullYear(), month = d.getMonth();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const dailyRate = Number(baseSalary || 0) / daysInMonth;
        const dayOfMonth = d.getDate();
        return (dayOfMonth * dailyRate) + 2000;
    }

    function displayLimitForDriver(d){
        const now = new Date();
        const [vy, vm] = currentMonth.split('-').map(Number);
        let refDateStr;
        if (vy === now.getFullYear() && vm === (now.getMonth()+1)) {
            refDateStr = now.toISOString().slice(0,10);
        } else {
            const daysInMonth = new Date(vy, vm, 0).getDate();
            refDateStr = `${vy}-${String(vm).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;
        }
        return calcAllowedLimit(d.baseSalary, refDateStr);
    }

    function calcAccrualData(driver, ym) {
        const now = new Date();
        const [vy, vm] = ym.split('-').map(Number);
        const daysInMonth = new Date(vy, vm, 0).getDate();
        const dailyRate = Number(driver.baseSalary || 0) / daysInMonth;

        let elapsedDays = 0;
        if (vy < now.getFullYear() || (vy === now.getFullYear() && vm < (now.getMonth() + 1))) {
            elapsedDays = daysInMonth;
        } else if (vy === now.getFullYear() && vm === (now.getMonth() + 1)) {
            elapsedDays = now.getDate();
        } else {
            elapsedDays = 0;
        }

        const earnedSoFar = elapsedDays * dailyRate;

        const advSum = itemsOfMonth(driver.id, ym, 'adv').reduce((s, a) => s + Number(a.amount), 0);
        const deficitSum = itemsOfMonth(driver.id, ym, 'deficit').reduce((s, a) => s + Number(a.amount), 0);
        const absenceSum = itemsOfMonth(driver.id, ym, 'absence').reduce((s, a) => s + Number(a.amount), 0);
        const totalDeductions = advSum + deficitSum + absenceSum;

        const netBalance = earnedSoFar - totalDeductions;

        return {
            daysInMonth,
            elapsedDays,
            dailyRate,
            earnedSoFar,
            totalDeductions,
            netBalance
        };
    }

    onSnapshot(collection(db, DRIVERS_COL), (snap) => {
        drivers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    }, (err) => {
        console.error("خطأ في جلب البيانات:", err);
        document.getElementById('driversList').innerHTML = `<div class="empty">تعذر تحميل البيانات، تأكد من الاتصال بالإنترنت</div>`;
    });

    onSnapshot(collection(db, ADVANCES_COL), (snap) => {
        advances = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    }, (err) => console.error("خطأ في جلب البيانات:", err));

    function render(){
        document.getElementById('monthLabel').textContent = monthLabel(currentMonth);

        let displayDrivers = drivers;
        if (isFekry) {
            displayDrivers = drivers.filter(d => (d.name || '').includes('فكري'));
        }

        document.getElementById('driversTitle').textContent = `القائمة (${displayDrivers.length})`;

        let totalSalary = 0, totalAdv = 0, totalNet = 0;
        const list = document.getElementById('driversList');

        if(displayDrivers.length === 0){
            list.innerHTML = `<div class="empty">لا يوجد بيانات متاحة لعرضها</div>`;
        } else {
            list.innerHTML = displayDrivers.map(d => {
                const advsMonth = itemsOfMonth(d.id, currentMonth, 'adv');
                const deficitsMonth = itemsOfMonth(d.id, currentMonth, 'deficit');
                const absencesMonth = itemsOfMonth(d.id, currentMonth, 'absence');
                const nonDeductibleMonth = itemsOfMonth(d.id, currentMonth, 'nondeductible');

                const advSum = advsMonth.reduce((s,a)=>s+Number(a.amount),0);
                const deficitSum = deficitsMonth.reduce((s,a)=>s+Number(a.amount),0);
                const absenceSum = absencesMonth.reduce((s,a)=>s+Number(a.amount),0);
                const nonDeductibleSum = nonDeductibleMonth.reduce((s,a)=>s+Number(a.amount),0);

                const net = Number(d.baseSalary||0) - advSum - absenceSum - deficitSum;

                totalSalary += Number(d.baseSalary||0);
                totalAdv += (advSum + deficitSum + absenceSum);
                totalNet += net;

                const maxAdv = displayLimitForDriver(d);
                const accrual = calcAccrualData(d, currentMonth);

                if (isFekry && !openPanels.has(d.id)) openPanels.set(d.id, 'adv');
                const activePanel = openPanels.get(d.id);

                const initial = (d.name||'؟').trim().charAt(0);

                // أزرار الحذف تظهر فقط للأدمن
                const advItemsHtml = advsMonth.length ? advsMonth.map(a => `
                    <div class="adv-item">
                        <div class="info">
                            <span class="amount">${fmt(a.amount)}</span>
                            <span class="date">${a.date||''}</span>
                            ${a.exception ? `<span class="badge-tag badge-exception">استثناء</span>` : ''}
                            ${a.note ? `<span class="note">— ${escapeHtml(a.note)}</span>` : ''}
                        </div>
                        ${isAdmin ? `<button data-del-adv="${a.id}" title="حذف">✕</button>` : ''}
                    </div>
                `).join('') : `<div class="no-adv">لا توجد سلف مسجلة في هذا الشهر</div>`;

                const deficitItemsHtml = deficitsMonth.length ? deficitsMonth.map(a => `
                    <div class="adv-item is-deficit">
                        <div class="info">
                            <span class="badge-tag badge-deficit">عجز</span>
                            <span class="amount">${fmt(a.amount)}</span>
                            <span class="date">${a.date||''}</span>
                            ${a.note ? `<span class="note">— ${escapeHtml(a.note)}</span>` : ''}
                        </div>
                        ${isAdmin ? `<button data-del-adv="${a.id}" title="حذف">✕</button>` : ''}
                    </div>
                `).join('') : `<div class="no-adv">لا يوجد عجز مسجل في هذا الشهر</div>`;

                const absenceItemsHtml = absencesMonth.length ? absencesMonth.map(a => `
                    <div class="adv-item is-absence">
                        <div class="info">
                            <span class="badge-tag badge-absence">غياب</span>
                            <span class="amount">${fmt(a.amount)}</span>
                            <span class="date">${a.date||''}</span>
                            ${a.note ? `<span class="note">— ${escapeHtml(a.note)}</span>` : ''}
                        </div>
                        ${isAdmin ? `<button data-del-adv="${a.id}" title="حذف">✕</button>` : ''}
                    </div>
                `).join('') : `<div class="no-adv">لا يوجد أي غياب مسجل في هذا الشهر</div>`;

                const nonDeductibleItemsHtml = nonDeductibleMonth.length ? nonDeductibleMonth.map(a => `
                    <div class="adv-item is-nondeductible">
                        <div class="info">
                            <span class="badge-tag badge-nondeductible">لم تُخصم</span>
                            <span class="amount">${fmt(a.amount)}</span>
                            <span class="date">${a.date||''}</span>
                            ${a.note ? `<span class="note">— ${escapeHtml(a.note)}</span>` : ''}
                        </div>
                        ${isAdmin ? `<button data-del-adv="${a.id}" title="حذف">✕</button>` : ''}
                    </div>
                `).join('') : `<div class="no-adv">لا يوجد مصروفات غير مخصومة مسجلة في هذا الشهر</div>`;

                return `
                <div class="driver">
                    <div class="driver-top">
                        <div class="driver-id">
                            <div class="avatar">${initial}</div>
                            <div>
                                <div class="driver-name">${escapeHtml(d.name)}</div>
                                ${d.phone ? `<div class="driver-phone">${escapeHtml(d.phone)}</div>` : ''}
                            </div>
                        </div>
                        <div class="driver-nums">
                            ${isAdmin ? `<div class="n"><div class="k">الراتب الأساسي</div><div class="v">${fmt(d.baseSalary)}</div></div>` : ''}
                            <div class="n adv"><div class="k">سلف الشهر</div><div class="v">${fmt(advSum)}</div></div>
                            <div class="n absence"><div class="k">خصم الغياب</div><div class="v">${fmt(absenceSum)}</div></div>
                            <div class="n deficit"><div class="k">عجز الشهر</div><div class="v">${fmt(deficitSum)}</div></div>
                            <div class="n nondeductible"><div class="k">مصروف وعجز لن يخصم</div><div class="v">${fmt(nonDeductibleSum)}</div></div>
                            
                            <div class="n accrual-status">
                                <div class="k">${accrual.netBalance >= 0 ? `متبقي له (يوم ${accrual.elapsedDays})` : `مطلوب منه (يوم ${accrual.elapsedDays})`}</div>
                                <div class="v ${accrual.netBalance >= 0 ? 'due-pos' : 'due-neg'}">${fmt(Math.abs(accrual.netBalance))}</div>
                            </div>

                            ${isAdmin ? `<div class="n net"><div class="k">الصافي النهائي</div><div class="v">${fmt(net)}</div></div>` : ''}
                            ${isAdmin ? `<div class="n limit"><div class="k">الحد المسموح حتى الآن</div><div class="v">${fmt(maxAdv)}</div></div>` : ''}
                        </div>
                        <div class="driver-actions">
                            <button class="icon-btn" data-toggle="${d.id}" data-type="adv"><i class="fa-solid fa-plus"></i> سلفة</button>
                            <button class="icon-btn violet-btn" data-toggle="${d.id}" data-type="absence"><i class="fa-solid fa-user-slash"></i> غياب</button>
                            <button class="icon-btn danger-btn" data-toggle="${d.id}" data-type="deficit"><i class="fa-solid fa-triangle-exclamation"></i> العجز</button>
                            <button class="icon-btn teal-btn" data-toggle="${d.id}" data-type="nondeductible"><i class="fa-solid fa-receipt"></i> مصروفات لم تخصم</button>
                            ${isAdmin ? `<button class="icon-btn danger-btn" data-del-driver="${d.id}"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    </div>

                    ${isAdmin ? `
                    <div class="accrual-box">
                        <div class="accrual-head">
                            <span><i class="fa-solid fa-calculator"></i> تفاصيل العمل الفعلي (حتى يوم ${accrual.elapsedDays} من ${accrual.daysInMonth})</span>
                        </div>
                        <div class="accrual-details">
                            <span>يومية العمل: <b>${fmt(accrual.dailyRate)}</b></span>
                            <span>الاستحقاق الفعلي (${accrual.elapsedDays} يوم): <b>${fmt(accrual.earnedSoFar)}</b></span>
                            <span>إجمالي الخصومات والسلف: <b>${fmt(accrual.totalDeductions)}</b></span>
                        </div>
                    </div>
                    ` : ''}

                    <div class="advances-panel ${activePanel === 'adv' ? 'open' : ''}">
                        <h3>تسجيل سلفة — ${monthLabel(currentMonth)} ${isAdmin ? `(الحد المسموح حتى الآن: ${fmt(maxAdv)})` : ''}</h3>
                        <div class="adv-form">
                            <input type="number" min="0" placeholder="مبلغ السلفة" id="advAmount-${d.id}">
                            <input type="date" id="advDate-${d.id}" value="${new Date().toISOString().slice(0,10)}">
                            <input type="text" placeholder="ملاحظة (اختياري)" id="advNote-${d.id}">
                            <button class="btn btn-brand" data-add-adv="${d.id}">إضافة سلفة</button>
                        </div>
                        <div class="adv-list">${advItemsHtml}</div>
                    </div>

                    <div class="advances-panel ${activePanel === 'absence' ? 'open' : ''}" style="background:#faf5ff; border-top: 1px solid #ddd6fe;">
                        <h3 style="color: var(--violet);">تسجيل أسبوع/أيام غياب — ${monthLabel(currentMonth)}</h3>
                        <div class="adv-form">
                            <input type="number" min="0" placeholder="قيمة الخصم أو اليومية" id="absenceAmount-${d.id}">
                            <input type="date" id="absenceDate-${d.id}" value="${new Date().toISOString().slice(0,10)}">
                            <input type="text" placeholder="ملاحظة (مثال: غياب بدون إذن)" id="absenceNote-${d.id}">
                            <button class="btn btn-violet" data-add-absence="${d.id}">تسجيل غياب</button>
                        </div>
                        <div class="adv-list">${absenceItemsHtml}</div>
                    </div>

                    <div class="advances-panel ${activePanel === 'deficit' ? 'open' : ''}" style="background:#fff3f3; border-top: 1px solid #fca5a5;">
                        <h3 style="color: var(--coral);">تسجيل عجز مالي مميز — ${monthLabel(currentMonth)}</h3>
                        <div class="adv-form">
                            <input type="number" min="0" placeholder="مبلغ العجز" id="deficitAmount-${d.id}">
                            <input type="date" id="deficitDate-${d.id}" value="${new Date().toISOString().slice(0,10)}">
                            <input type="text" placeholder="سبب/ملاحظة العجز (اختياري)" id="deficitNote-${d.id}">
                            <button class="btn btn-coral" data-add-deficit="${d.id}">تسجيل عجز</button>
                        </div>
                        <div class="adv-list">${deficitItemsHtml}</div>
                    </div>

                    <div class="advances-panel ${activePanel === 'nondeductible' ? 'open' : ''}" style="background:#e0f7fa; border-top: 1px solid #80deea;">
                        <h3 style="color: var(--teal);">تسجيل مصروفات/عهدة لم تخصم — ${monthLabel(currentMonth)}</h3>
                        <div class="adv-form">
                            <input type="number" min="0" placeholder="المبلغ" id="nonDeductibleAmount-${d.id}">
                            <input type="date" id="nonDeductibleDate-${d.id}" value="${new Date().toISOString().slice(0,10)}">
                            <input type="text" placeholder="البيان / سبب الصرف" id="nonDeductibleNote-${d.id}">
                            <button class="btn btn-teal" data-add-nondeductible="${d.id}">تسجيل مصروفات</button>
                        </div>
                        <div class="adv-list">${nonDeductibleItemsHtml}</div>
                    </div>
                </div>`;
            }).join('');
        }

        document.getElementById('statSalary').textContent = fmt(totalSalary);
        document.getElementById('statAdv').textContent = fmt(totalAdv);
        document.getElementById('statNet').textContent = fmt(totalNet);

        bindDynamicEvents();
    }

    function bindDynamicEvents(){
        document.querySelectorAll('[data-toggle]').forEach(btn => {
            btn.onclick = () => {
                const id = btn.getAttribute('data-toggle');
                const type = btn.getAttribute('data-type');
                if(openPanels.get(id) === type) {
                    openPanels.delete(id);
                } else {
                    openPanels.set(id, type);
                }
                render();
            };
        });
        document.querySelectorAll('[data-add-adv]').forEach(btn => {
            btn.onclick = () => addAdvance(btn.getAttribute('data-add-adv'));
        });
        document.querySelectorAll('[data-add-deficit]').forEach(btn => {
            btn.onclick = () => addDeficit(btn.getAttribute('data-add-deficit'));
        });
        document.querySelectorAll('[data-add-absence]').forEach(btn => {
            btn.onclick = () => addAbsence(btn.getAttribute('data-add-absence'));
        });
        document.querySelectorAll('[data-add-nondeductible]').forEach(btn => {
            btn.onclick = () => addNonDeductible(btn.getAttribute('data-add-nondeductible'));
        });
        
        // تفعيل أزرار الحذف فقط للأدمن
        if (isAdmin) {
            document.querySelectorAll('[data-del-adv]').forEach(btn => {
                btn.onclick = () => {
                    const advId = btn.getAttribute('data-del-adv');
                    deleteAdvance(advId);
                };
            });
            document.querySelectorAll('[data-del-driver]').forEach(btn => {
                btn.onclick = () => deleteDriver(btn.getAttribute('data-del-driver'));
            });
        }
    }

    const addDriverBtn = document.getElementById('addDriverBtn');
    if (addDriverBtn) {
        addDriverBtn.addEventListener('click', async () => {
            if (!isAdmin) {
                alert("عذراً، هذه الصلاحية للمدير فقط");
                return;
            }
            const name = document.getElementById('newName').value.trim();
            const phone = document.getElementById('newPhone').value.trim();
            const baseSalary = Number(document.getElementById('newSalary').value) || 0;
            if(!name){ document.getElementById('newName').focus(); return; }
            try{
                await addDoc(collection(db, DRIVERS_COL), { name, phone, baseSalary, createdAt: serverTimestamp() });
                document.getElementById('newName').value = '';
                document.getElementById('newPhone').value = '';
                document.getElementById('newSalary').value = '';
            }catch(e){
                alert('تعذرت الإضافة، حاول مرة أخرى');
                console.error(e);
            }
        });
    }

    let pendingAdvance = null;

    window.addAdvance = async function(driverId){
        const amountEl = document.getElementById(`advAmount-${driverId}`);
        const dateEl = document.getElementById(`advDate-${driverId}`);
        const noteEl = document.getElementById(`advNote-${driverId}`);
        const amount = Number(amountEl.value);
        const date = dateEl.value || new Date().toISOString().slice(0,10);
        const note = noteEl.value.trim();
        if(!amount || amount <= 0){ amountEl.focus(); return; }

        const driver = drivers.find(d => d.id === driverId);
        if(!driver) return;

        const monthOfDate = date.slice(0,7);
        const existingMonthTotal = itemsOfMonth(driverId, monthOfDate, 'adv').reduce((s,a)=>s+Number(a.amount),0);
        const newTotal = existingMonthTotal + amount;
        const limit = calcAllowedLimit(driver.baseSalary, date);

        if(newTotal > limit){
            pendingAdvance = { driverId, amount, date, note, limit, newTotal, existingMonthTotal };
            openExceptionModal(driver, pendingAdvance);
            return;
        }

        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isDeficit: false, isAbsence: false, isNonDeductible: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'adv');
        }catch(e){
            alert('تعذرت إضافة السلفة، حاول مرة أخرى');
            console.error(e);
        }
    };

    window.addDeficit = async function(driverId){
        const amountEl = document.getElementById(`deficitAmount-${driverId}`);
        const dateEl = document.getElementById(`deficitDate-${driverId}`);
        const noteEl = document.getElementById(`deficitNote-${driverId}`);
        const amount = Number(amountEl.value);
        const date = dateEl.value || new Date().toISOString().slice(0,10);
        const note = noteEl.value.trim();
        if(!amount || amount <= 0){ amountEl.focus(); return; }

        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isDeficit: true, isAbsence: false, isNonDeductible: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'deficit');
        }catch(e){
            alert('تعذر تسجيل العجز، حاول مرة أخرى');
            console.error(e);
        }
    };

    window.addAbsence = async function(driverId){
        const amountEl = document.getElementById(`absenceAmount-${driverId}`);
        const dateEl = document.getElementById(`absenceDate-${driverId}`);
        const noteEl = document.getElementById(`absenceNote-${driverId}`);
        const amount = Number(amountEl.value);
        const date = dateEl.value || new Date().toISOString().slice(0,10);
        const note = noteEl.value.trim();
        if(!amount || amount <= 0){ amountEl.focus(); return; }

        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isAbsence: true, isDeficit: false, isNonDeductible: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'absence');
        }catch(e){
            alert('تعذر تسجيل الغياب، حاول مرة أخرى');
            console.error(e);
        }
    };

    window.addNonDeductible = async function(driverId){
        const amountEl = document.getElementById(`nonDeductibleAmount-${driverId}`);
        const dateEl = document.getElementById(`nonDeductibleDate-${driverId}`);
        const noteEl = document.getElementById(`nonDeductibleNote-${driverId}`);
        const amount = Number(amountEl.value);
        const date = dateEl.value || new Date().toISOString().slice(0,10);
        const note = noteEl.value.trim();
        if(!amount || amount <= 0){ amountEl.focus(); return; }

        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isNonDeductible: true, isAbsence: false, isDeficit: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'nondeductible');
        }catch(e){
            alert('تعذر تسجيل المصروفات، حاول مرة أخرى');
            console.error(e);
        }
    };

    function openExceptionModal(driver, p){
        const excess = p.newTotal - p.limit;
        document.getElementById('exceptionModalRows').innerHTML = `
            <div class="modal-row"><span>الاسم</span><b>${escapeHtml(driver.name)}</b></div>
            <div class="modal-row"><span>الحد المسموح به بتاريخ ${p.date}</span><b>${fmt(p.limit)}</b></div>
            <div class="modal-row"><span>سلف الشهر الحالية</span><b>${fmt(p.existingMonthTotal)}</b></div>
            <div class="modal-row"><span>السلفة الجديدة</span><b>${fmt(p.amount)}</b></div>
            <div class="modal-row"><span>الإجمالي بعد الإضافة</span><b>${fmt(p.newTotal)}</b></div>
            <div class="modal-row excess"><span>مقدار التجاوز (سيتسجل كعجز تلقائياً)</span><b>${fmt(excess)}</b></div>
        `;
        document.getElementById('exceptionModal').classList.add('open');
    }

    function closeExceptionModal(){
        document.getElementById('exceptionModal').classList.remove('open');
        pendingAdvance = null;
    }

    document.getElementById('modalCancelBtn').addEventListener('click', closeExceptionModal);

    document.getElementById('modalExceptionBtn').addEventListener('click', async () => {
        if(!pendingAdvance) return;
        const { driverId, amount, date, note, limit, newTotal } = pendingAdvance;
        const excess = Math.round(newTotal - limit);
        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isDeficit: false, isAbsence: false, isNonDeductible: false, exception: true, createdAt: serverTimestamp() });
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount: excess, date, note: 'عجز عن تجاوز الحد المسموح بالسلفة', isDeficit: true, isAbsence: false, isNonDeductible: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'deficit');
        }catch(e){
            alert('تعذر تسجيل السلفة بالعجز');
            console.error(e);
        }
        closeExceptionModal();
    });

    async function deleteAdvance(advId){
        if (!isAdmin) {
            alert('عذراً، ليس لديك صلاحية الحذف');
            return;
        }
        try{ await deleteDoc(doc(db, ADVANCES_COL, advId)); }
        catch(e){ alert('تعذر الحذف'); console.error(e); }
    }

    async function deleteDriver(driverId){
        if (!isAdmin) {
            alert('عذراً، ليس لديك صلاحية الحذف');
            return;
        }
        const driver = drivers.find(d => d.id === driverId);
        if(!confirm(`هل تريد الحذف وكل البيانات الخاصة به؟`)) return;
        try{
            const q = query(collection(db, ADVANCES_COL), where("driverId", "==", driverId));
            const snap = await getDocs(q);
            await Promise.all(snap.docs.map(d => deleteDoc(doc(db, ADVANCES_COL, d.id))));
            await deleteDoc(doc(db, DRIVERS_COL, driverId));
        }catch(e){
            alert('تعذر الحذف');
            console.error(e);
        }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
        const [y,m] = currentMonth.split('-').map(Number);
        currentMonth = new Date(y, m-2, 1).toISOString().slice(0,7);
        render();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
        const [y,m] = currentMonth.split('-').map(Number);
        currentMonth = new Date(y, m, 1).toISOString().slice(0,7);
        render();
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
</script>
