<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رواتب وسلف | شركة الزيادى</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075E3D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #0E8F5B;
            --brand-mid: #12A06B;
            --brand-dark: #075E3D;
            --brand-tint: #E6F7EF;

            --amber: #D97706;
            --amber-tint: #FEF3C7;

            --teal: #0E7C86;
            --teal-tint: #E0F7FA;

            --coral: #DC2626;
            --coral-tint: #FEE2E2;

            --violet: #7C3AED;
            --violet-tint: #F3E8FF;

            --surface: #F3FAF7;
            --card-bg: #FFFFFF;
            --text-deep: #0F2A1E;
            --text-mid: #5B6B63;
            --text-faint: #9BAAA2;
            --border-subtle: #DFEFE7;

            --shadow-sm: 0 4px 14px rgba(7, 94, 61, 0.07);
            --shadow-md: 0 10px 26px rgba(7, 94, 61, 0.11);
            --shadow-lg: 0 18px 38px rgba(7, 94, 61, 0.2);

            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--surface);
            color: var(--text-deep);
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
            padding-bottom: 60px;
        }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px;
            border-radius: 8px;
        }

        /* Header */
        .header {
            position: sticky; top: 0; z-index: 1000;
            background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand) 100%);
            padding: 0 16px;
            height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-md);
        }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
            background: #ffffff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .logo-mark i { font-size: 18px; color: var(--brand); }
        .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
        .logo-text .brand-name { font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.2px; }
        .logo-text .sub { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.75); }
        .btn-icon {
            width: 38px; height: 38px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25); border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 15px; cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .btn-icon:active { transform: scale(0.92); background: rgba(255,255,255,0.25); }

        /* Hero */
        .hero-panel {
            margin: 16px;
            border-radius: var(--radius-lg);
            background: linear-gradient(150deg, var(--brand-dark) 0%, var(--brand) 65%, var(--brand-mid) 100%);
            padding: 20px 16px 18px;
            position: relative; overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .hero-panel::before {
            content: ""; position: absolute; top: -60px; left: -40px;
            width: 180px; height: 180px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }
        .hero-panel::after {
            content: ""; position: absolute; bottom: -70px; right: -50px;
            width: 200px; height: 200px; border-radius: 50%;
            background: rgba(255,255,255,0.06);
        }
        .hero-top {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
        }
        .hero-eyebrow {
            color: rgba(255,255,255,0.9); font-family: 'Tajawal', sans-serif;
            font-size: 15px; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
        }
        .hero-eyebrow i { color: #B9F5D8; }
        .month-nav {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22);
            border-radius: 999px; padding: 5px 6px;
        }
        .month-nav button {
            width: 28px; height: 28px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.9); color: var(--brand-dark); font-size: 15px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .month-nav .label { color: #fff; font-weight: 700; font-size: 13px; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }

        .stats-row {
            position: relative; z-index: 1;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
        }
        .stat-chip {
            background: var(--card-bg); border-radius: var(--radius-md);
            padding: 13px 10px; display: flex; flex-direction: column; gap: 9px;
            box-shadow: 0 10px 22px rgba(5, 46, 30, 0.22);
        }
        .chip-icon {
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .chip-icon.gold-bg { background: var(--amber-tint); color: var(--amber); }
        .chip-icon.red-bg  { background: var(--coral-tint); color: var(--coral); }
        .chip-icon.black-bg{ background: var(--brand-tint); color: var(--brand); }
        .chip-num { font-family: 'Tajawal', sans-serif; font-size: 17px; font-weight: 900; color: var(--text-deep); font-variant-numeric: tabular-nums; }
        .chip-label { font-size: 10px; color: var(--text-mid); font-weight: 700; }

        .section-block { padding: 4px 16px 0; }
        .section-label { display: flex; align-items: center; gap: 8px; padding: 0 2px 10px; }
        .section-label .mark {
            width: 22px; height: 22px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10.5px; color: #fff; background: var(--brand);
        }
        .section-label span.title { font-family: 'Tajawal', sans-serif; font-size: 13.5px; font-weight: 800; color: var(--brand-dark); }

        /* Form card */
        .form-card {
            background: var(--card-bg); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); padding: 16px; margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
        }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .field { flex: 1; min-width: 130px; }
        .field label { display: block; font-size: 11px; color: var(--text-mid); font-weight: 700; margin-bottom: 5px; }
        input, textarea {
            width: 100%; background: var(--surface); border: 1px solid var(--border-subtle);
            color: var(--text-deep); border-radius: 10px; padding: 10px 12px;
            font-family: 'Cairo', sans-serif; font-size: 13.5px;
        }
        input:focus { outline: none; border-color: var(--brand); }
        .btn {
            border: none; border-radius: 10px; padding: 10px 18px;
            font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 13px;
            cursor: pointer; transition: filter .15s, transform .1s; white-space: nowrap;
        }
        .btn:active { transform: scale(.96); }
        .btn-brand { background: linear-gradient(135deg, var(--brand-mid), var(--brand-dark)); color: #fff; box-shadow: var(--shadow-sm); }
        .btn-brand:hover { filter: brightness(1.07); }
        .btn-coral { background: linear-gradient(135deg, #ef4444, var(--coral)); color: #fff; box-shadow: var(--shadow-sm); }
        .btn-coral:hover { filter: brightness(1.07); }
        .btn-violet { background: linear-gradient(135deg, #8b5cf6, var(--violet)); color: #fff; box-shadow: var(--shadow-sm); }
        .btn-violet:hover { filter: brightness(1.07); }
        .btn-ghost { background: var(--brand-tint); color: var(--brand-dark); }
        .btn-ghost:hover { background: #d7f0e3; }

        /* Driver cards */
        .empty {
            text-align: center; padding: 46px 20px; color: var(--text-mid);
            border: 1px dashed var(--border-subtle); border-radius: var(--radius-md);
            font-size: 13px; background: var(--card-bg);
        }
        .driver {
            background: var(--card-bg); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); margin-bottom: 12px; overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .driver-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 15px; gap: 12px; flex-wrap: wrap; }
        .driver-id { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-mid), var(--brand-dark));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #fff; font-size: 15px; flex-shrink: 0;
        }
        .driver-name { font-weight: 800; font-size: 14.5px; color: var(--text-deep); }
        .driver-phone { font-size: 11.5px; color: var(--text-mid); margin-top: 2px; }

        .driver-nums { display: flex; gap: 14px; flex-wrap: wrap; }
        .driver-nums .n { text-align: center; }
        .driver-nums .n .k { font-size: 10px; color: var(--text-mid); font-weight: 700; margin-bottom: 3px; }
        .driver-nums .n .v { font-weight: 800; font-size: 13.5px; font-variant-numeric: tabular-nums; }
        .driver-nums .net .v { color: var(--brand); }
        .driver-nums .adv .v { color: var(--coral); }
        .driver-nums .limit .v { color: var(--text-mid); font-size: 12px; }
        .driver-nums .deficit .v { color: var(--coral); }
        .driver-nums .absence .v { color: var(--violet); }

        /* Exception modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15,42,30,0.55);
            z-index: 5000; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff; border-radius: var(--radius-md); max-width: 380px; width: 100%;
            padding: 20px; box-shadow: var(--shadow-lg);
        }
        .modal-box .modal-icon {
            width: 46px; height: 46px; border-radius: 50%; background: var(--coral-tint); color: var(--coral);
            display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px;
        }
        .modal-box h3 { font-size: 15px; font-weight: 800; color: var(--text-deep); margin-bottom: 10px; }
        .modal-box .modal-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .modal-box .modal-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-mid); }
        .modal-box .modal-row b { color: var(--text-deep); font-variant-numeric: tabular-nums; }
        .modal-box .modal-row.excess b { color: var(--coral); }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions .btn { flex: 1; }
        .btn-cancel { background: var(--surface); color: var(--text-mid); border: 1px solid var(--border-subtle); }
        .btn-exception { background: linear-gradient(135deg, #ef4444, var(--coral)); color: #fff; }

        .driver-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .icon-btn {
            border-radius: 8px; border: 1px solid var(--border-subtle);
            background: var(--surface); color: var(--text-mid); cursor: pointer;
            display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700;
            padding: 6px 9px; transition: all .15s; font-family: 'Cairo', sans-serif;
        }
        .icon-btn:hover { color: var(--brand-dark); border-color: var(--brand-mid); background: var(--brand-tint); }
        .icon-btn.danger-btn:hover { color: var(--coral); border-color: var(--coral); background: var(--coral-tint); }
        .icon-btn.violet-btn:hover { color: var(--violet); border-color: var(--violet); background: var(--violet-tint); }

        .advances-panel { border-top: 1px solid var(--border-subtle); padding: 14px 15px 16px; display: none; background: var(--surface); }
        .advances-panel.open { display: block; }
        .advances-panel h3 { font-size: 11.5px; color: var(--text-mid); margin-bottom: 10px; font-weight: 700; }
        .adv-form { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .adv-form input { flex: 1; min-width: 100px; }
        .adv-list { display: flex; flex-direction: column; gap: 6px; }
        
        .adv-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--border-subtle); border-radius: 99px;
            padding: 8px 12px; font-size: 12.5px;
        }
        .adv-item.is-deficit {
            border-color: #fca5a5;
            background: #fff5f5;
        }
        .adv-item.is-absence {
            border-color: #ddd6fe;
            background: #f5f3ff;
        }
        .adv-item .info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .adv-item .amount { color: var(--coral); font-weight: 800; font-variant-numeric: tabular-nums; }
        .adv-item.is-absence .amount { color: var(--violet); }
        .adv-item .date { color: var(--text-mid); font-size: 11px; font-variant-numeric: tabular-nums; }
        .adv-item .note { color: var(--text-mid); font-size: 11.5px; }
        
        .badge-tag {
            padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 800;
        }
        .badge-deficit { background: var(--coral-tint); color: var(--coral); border: 1px solid #f87171; }
        .badge-absence { background: var(--violet-tint); color: var(--violet); border: 1px solid #a78bfa; }
        .badge-exception { background: var(--amber-tint); color: var(--amber); }

        .adv-item button { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 13px; padding: 2px 6px; }
        .adv-item button:hover { color: var(--coral); }
        .no-adv { font-size: 12px; color: var(--text-mid); padding: 6px 2px; }

        .toolbar { display: flex; justify-content: flex-end; padding: 18px 16px 4px; }

        @media print {
            body { background: #fff !important; }
            .header, .form-card, .toolbar, .month-nav button, .driver-actions, .adv-form { display: none !important; }
            .advances-panel { display: block !important; }
        }
        @media (max-width: 560px) {
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            .driver-top { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore,
        collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, query, where, getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
    } catch (e) {
        db = getFirestore(app);
    }

    const DRIVERS_COL = "drivers";
    const ADVANCES_COL = "driverAdvances";

    const ARABIC_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

    let drivers = [];
    let advances = [];
    let currentMonth = new Date().toISOString().slice(0,7);
    let openPanels = new Map();

    const currentUser = (localStorage.getItem("currentUser") || sessionStorage.getItem("currentUser") || localStorage.getItem("username") || sessionStorage.getItem("username") || "").trim();
    const userRole = (sessionStorage.getItem('role') || localStorage.getItem('role') || '').toLowerCase();
    const isAdmin = userRole === 'admin';
    const isFekry = currentUser.includes("فكري") || currentUser.toLowerCase().includes("fekry");

    if (isAdmin) {
        const addBlock = document.getElementById('addDriverBlock');
        const statsRow = document.getElementById('statsRow');
        if (addBlock) addBlock.style.display = 'block';
        if (statsRow) statsRow.style.display = 'grid';
    }

    function fmt(n){
        n = Math.round(Number(n) || 0);
        return n.toLocaleString('en-US') + ' ج.م';
    }
    function escapeHtml(s){
        return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function monthLabel(ym){
        const [y,m] = ym.split('-').map(Number);
        return ARABIC_MONTHS[m-1] + ' ' + y;
    }
    function advancesOf(driverId){ return advances.filter(a => a.driverId === driverId); }
    function itemsOfMonth(driverId, ym, type){ 
        return advancesOf(driverId).filter(a => {
            if (!a.date || a.date.slice(0,7) !== ym) return false;
            if (type === 'absence') return a.isAbsence;
            if (type === 'deficit') return a.isDeficit;
            return !a.isDeficit && !a.isAbsence;
        }); 
    }

    function calcAllowedLimit(baseSalary, dateStr){
        const d = new Date(dateStr + 'T00:00:00');
        const year = d.getFullYear(), month = d.getMonth();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const dailyRate = Number(baseSalary || 0) / daysInMonth;
        const dayOfMonth = d.getDate();
        return (dayOfMonth * dailyRate) + 2000;
    }

    function displayLimitForDriver(d){
        const now = new Date();
        const [vy, vm] = currentMonth.split('-').map(Number);
        let refDateStr;
        if (vy === now.getFullYear() && vm === (now.getMonth()+1)) {
            refDateStr = now.toISOString().slice(0,10);
        } else {
            const daysInMonth = new Date(vy, vm, 0).getDate();
            refDateStr = `${vy}-${String(vm).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;
        }
        return calcAllowedLimit(d.baseSalary, refDateStr);
    }

    // ---------- Firestore listeners ----------
    onSnapshot(collection(db, DRIVERS_COL), (snap) => {
        drivers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    }, (err) => {
        console.error("خطأ في جلب البيانات:", err);
        document.getElementById('driversList').innerHTML = `<div class="empty">تعذر تحميل البيانات، تأكد من الاتصال بالإنترنت</div>`;
    });

    onSnapshot(collection(db, ADVANCES_COL), (snap) => {
        advances = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    }, (err) => console.error("خطأ في جلب السلف/العجز/الغياب:", err));

    // ---------- Render ----------
    function render(){
        document.getElementById('monthLabel').textContent = monthLabel(currentMonth);

        let displayDrivers = drivers;
        if (isFekry) {
            displayDrivers = drivers.filter(d => (d.name || '').includes('فكري'));
        }

        document.getElementById('driversTitle').textContent = `القائمة (${displayDrivers.length})`;

        let totalSalary = 0, totalAdv = 0, totalNet = 0;
        const list = document.getElementById('driversList');

        if(displayDrivers.length === 0){
            list.innerHTML = `<div class="empty">لا يوجد بيانات متاحة لعرضها</div>`;
        } else {
            list.innerHTML = displayDrivers.map(d => {
                const advsMonth = itemsOfMonth(d.id, currentMonth, 'adv');
                const deficitsMonth = itemsOfMonth(d.id, currentMonth, 'deficit');
                const absencesMonth = itemsOfMonth(d.id, currentMonth, 'absence');

                const advSum = advsMonth.reduce((s,a)=>s+Number(a.amount),0);
                const deficitSum = deficitsMonth.reduce((s,a)=>s+Number(a.amount),0);
                const absenceSum = absencesMonth.reduce((s,a)=>s+Number(a.amount),0);

                // 🟢 إدخال (الغياب + العجز + السلف) في حسبة صافي الراتب
                const net = Number(d.baseSalary||0) - advSum - absenceSum - deficitSum;

                totalSalary += Number(d.baseSalary||0);
                totalAdv += advSum;
                totalNet += net;

                const maxAdv = displayLimitForDriver(d);
                
                if (isFekry && !openPanels.has(d.id)) openPanels.set(d.id, 'adv');
                const activePanel = openPanels.get(d.id);

                const initial = (d.name||'؟').trim().charAt(0);

                // قائمة السلف
                const advItemsHtml = advsMonth.length ? advsMonth.map(a => `
                    <div class="adv-item">
                        <div class="info">
                            <span class="amount">${fmt(a.amount)}</span>
                            <span class="date">${a.date||''}</span>
                            ${a.exception ? `<span class="badge-tag badge-exception">استثناء</span>` : ''}
                            ${a.note ? `<span class="note">— ${escapeHtml(a.note)}</span>` : ''}
                        </div>
                        <button data-del-adv="${a.id}" title="حذف">✕</button>
                    </div>
                `).join('') : `<div class="no-adv">لا توجد سلف مسجلة في هذا الشهر</div>`;

                // قائمة العجز المميزة
                const deficitItemsHtml = deficitsMonth.length ? deficitsMonth.map(a => `
                    <div class="adv-item is-deficit">
                        <div class="info">
                            <span class="badge-tag badge-deficit">عجز</span>
                            <span class="amount">${fmt(a.amount)}</span>
                            <span class="date">${a.date||''}</span>
                            ${a.note ? `<span class="note">— ${escapeHtml(a.note)}</span>` : ''}
                        </div>
                        <button data-del-adv="${a.id}" title="حذف">✕</button>
                    </div>
                `).join('') : `<div class="no-adv">لا يوجد عجز مسجل في هذا الشهر</div>`;

                // قائمة الغياب المميزة
                const absenceItemsHtml = absencesMonth.length ? absencesMonth.map(a => `
                    <div class="adv-item is-absence">
                        <div class="info">
                            <span class="badge-tag badge-absence">غياب</span>
                            <span class="amount">${fmt(a.amount)}</span>
                            <span class="date">${a.date||''}</span>
                            ${a.note ? `<span class="note">— ${escapeHtml(a.note)}</span>` : ''}
                        </div>
                        <button data-del-adv="${a.id}" title="حذف">✕</button>
                    </div>
                `).join('') : `<div class="no-adv">لا يوجد أي غياب مسجل في هذا الشهر</div>`;

                return `
                <div class="driver">
                    <div class="driver-top">
                        <div class="driver-id">
                            <div class="avatar">${initial}</div>
                            <div>
                                <div class="driver-name">${escapeHtml(d.name)}</div>
                                ${d.phone ? `<div class="driver-phone">${escapeHtml(d.phone)}</div>` : ''}
                            </div>
                        </div>
                        <div class="driver-nums">
                            ${isAdmin ? `<div class="n"><div class="k">الراتب الأساسي</div><div class="v">${fmt(d.baseSalary)}</div></div>` : ''}
                            <div class="n adv"><div class="k">سلف الشهر</div><div class="v">${fmt(advSum)}</div></div>
                            <div class="n absence"><div class="k">خصم الغياب</div><div class="v">${fmt(absenceSum)}</div></div>
                            <div class="n deficit"><div class="k">عجز الشهر</div><div class="v">${fmt(deficitSum)}</div></div>
                            ${isAdmin ? `<div class="n net"><div class="k">الصافي المستحق</div><div class="v">${fmt(net)}</div></div>` : ''}
                            ${isAdmin ? `<div class="n limit"><div class="k">الحد المسموح حتى الآن</div><div class="v">${fmt(maxAdv)}</div></div>` : ''}
                        </div>
                        <div class="driver-actions">
                            <button class="icon-btn" data-toggle="${d.id}" data-type="adv"><i class="fa-solid fa-plus"></i> سلفة</button>
                            <button class="icon-btn violet-btn" data-toggle="${d.id}" data-type="absence"><i class="fa-solid fa-user-slash"></i> غياب</button>
                            <button class="icon-btn danger-btn" data-toggle="${d.id}" data-type="deficit"><i class="fa-solid fa-triangle-exclamation"></i> العجز</button>
                            ${isAdmin ? `<button class="icon-btn danger-btn" data-del-driver="${d.id}"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    </div>

                    <!-- لوحة السلف -->
                    <div class="advances-panel ${activePanel === 'adv' ? 'open' : ''}">
                        <h3>تسجيل سلفة — ${monthLabel(currentMonth)} ${isAdmin ? `(الحد المسموح حتى الآن: ${fmt(maxAdv)})` : ''}</h3>
                        <div class="adv-form">
                            <input type="number" min="0" placeholder="مبلغ السلفة" id="advAmount-${d.id}">
                            <input type="date" id="advDate-${d.id}" value="${new Date().toISOString().slice(0,10)}">
                            <input type="text" placeholder="ملاحظة (اختياري)" id="advNote-${d.id}">
                            <button class="btn btn-brand" data-add-adv="${d.id}">إضافة سلفة</button>
                        </div>
                        <div class="adv-list">${advItemsHtml}</div>
                    </div>

                    <!-- لوحة الغياب المميزة -->
                    <div class="advances-panel ${activePanel === 'absence' ? 'open' : ''}" style="background:#faf5ff; border-top: 1px solid #ddd6fe;">
                        <h3 style="color: var(--violet);">تسجيل أسبوع/أيام غياب — ${monthLabel(currentMonth)}</h3>
                        <div class="adv-form">
                            <input type="number" min="0" placeholder="قيمة الخصم أو اليومية" id="absenceAmount-${d.id}">
                            <input type="date" id="absenceDate-${d.id}" value="${new Date().toISOString().slice(0,10)}">
                            <input type="text" placeholder="ملاحظة (مثال: غياب بدون إذن)" id="absenceNote-${d.id}">
                            <button class="btn btn-violet" data-add-absence="${d.id}">تسجيل غياب</button>
                        </div>
                        <div class="adv-list">${absenceItemsHtml}</div>
                    </div>

                    <!-- لوحة العجز المميزة -->
                    <div class="advances-panel ${activePanel === 'deficit' ? 'open' : ''}" style="background:#fff3f3; border-top: 1px solid #fca5a5;">
                        <h3 style="color: var(--coral);">تسجيل عجز مالي مميز — ${monthLabel(currentMonth)}</h3>
                        <div class="adv-form">
                            <input type="number" min="0" placeholder="مبلغ العجز" id="deficitAmount-${d.id}">
                            <input type="date" id="deficitDate-${d.id}" value="${new Date().toISOString().slice(0,10)}">
                            <input type="text" placeholder="سبب/ملاحظة العجز (اختياري)" id="deficitNote-${d.id}">
                            <button class="btn btn-coral" data-add-deficit="${d.id}">تسجيل عجز</button>
                        </div>
                        <div class="adv-list">${deficitItemsHtml}</div>
                    </div>
                </div>`;
            }).join('');
        }

        document.getElementById('statSalary').textContent = fmt(totalSalary);
        document.getElementById('statAdv').textContent = fmt(totalAdv);
        document.getElementById('statNet').textContent = fmt(totalNet);

        bindDynamicEvents();
    }

    function bindDynamicEvents(){
        document.querySelectorAll('[data-toggle]').forEach(btn => {
            btn.onclick = () => {
                const id = btn.getAttribute('data-toggle');
                const type = btn.getAttribute('data-type');
                if(openPanels.get(id) === type) {
                    openPanels.delete(id);
                } else {
                    openPanels.set(id, type);
                }
                render();
            };
        });
        document.querySelectorAll('[data-add-adv]').forEach(btn => {
            btn.onclick = () => addAdvance(btn.getAttribute('data-add-adv'));
        });
        document.querySelectorAll('[data-add-deficit]').forEach(btn => {
            btn.onclick = () => addDeficit(btn.getAttribute('data-add-deficit'));
        });
        document.querySelectorAll('[data-add-absence]').forEach(btn => {
            btn.onclick = () => addAbsence(btn.getAttribute('data-add-absence'));
        });
        document.querySelectorAll('[data-del-adv]').forEach(btn => {
            btn.onclick = () => {
                const advId = btn.getAttribute('data-del-adv');
                deleteAdvance(advId);
            };
        });
        document.querySelectorAll('[data-del-driver]').forEach(btn => {
            btn.onclick = () => deleteDriver(btn.getAttribute('data-del-driver'));
        });
    }

    // ---------- Actions ----------
    const addDriverBtn = document.getElementById('addDriverBtn');
    if (addDriverBtn) {
        addDriverBtn.addEventListener('click', async () => {
            const name = document.getElementById('newName').value.trim();
            const phone = document.getElementById('newPhone').value.trim();
            const baseSalary = Number(document.getElementById('newSalary').value) || 0;
            if(!name){ document.getElementById('newName').focus(); return; }
            try{
                await addDoc(collection(db, DRIVERS_COL), { name, phone, baseSalary, createdAt: serverTimestamp() });
                document.getElementById('newName').value = '';
                document.getElementById('newPhone').value = '';
                document.getElementById('newSalary').value = '';
            }catch(e){
                alert('تعذرت الإضافة، حاول مرة أخرى');
                console.error(e);
            }
        });
    }

    let pendingAdvance = null;

    // إضافة سلفة
    window.addAdvance = async function(driverId){
        const amountEl = document.getElementById(`advAmount-${driverId}`);
        const dateEl = document.getElementById(`advDate-${driverId}`);
        const noteEl = document.getElementById(`advNote-${driverId}`);
        const amount = Number(amountEl.value);
        const date = dateEl.value || new Date().toISOString().slice(0,10);
        const note = noteEl.value.trim();
        if(!amount || amount <= 0){ amountEl.focus(); return; }

        const driver = drivers.find(d => d.id === driverId);
        if(!driver) return;

        const monthOfDate = date.slice(0,7);
        const existingMonthTotal = itemsOfMonth(driverId, monthOfDate, 'adv').reduce((s,a)=>s+Number(a.amount),0);
        const newTotal = existingMonthTotal + amount;
        const limit = calcAllowedLimit(driver.baseSalary, date);

        if(newTotal > limit){
            pendingAdvance = { driverId, amount, date, note, limit, newTotal, existingMonthTotal };
            openExceptionModal(driver, pendingAdvance);
            return;
        }

        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isDeficit: false, isAbsence: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'adv');
        }catch(e){
            alert('تعذرت إضافة السلفة، حاول مرة أخرى');
            console.error(e);
        }
    };

    // إضافة عجز
    window.addDeficit = async function(driverId){
        const amountEl = document.getElementById(`deficitAmount-${driverId}`);
        const dateEl = document.getElementById(`deficitDate-${driverId}`);
        const noteEl = document.getElementById(`deficitNote-${driverId}`);
        const amount = Number(amountEl.value);
        const date = dateEl.value || new Date().toISOString().slice(0,10);
        const note = noteEl.value.trim();
        if(!amount || amount <= 0){ amountEl.focus(); return; }

        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isDeficit: true, isAbsence: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'deficit');
        }catch(e){
            alert('تعذر تسجيل العجز، حاول مرة أخرى');
            console.error(e);
        }
    };

    // إضافة غياب
    window.addAbsence = async function(driverId){
        const amountEl = document.getElementById(`absenceAmount-${driverId}`);
        const dateEl = document.getElementById(`absenceDate-${driverId}`);
        const noteEl = document.getElementById(`absenceNote-${driverId}`);
        const amount = Number(amountEl.value);
        const date = dateEl.value || new Date().toISOString().slice(0,10);
        const note = noteEl.value.trim();
        if(!amount || amount <= 0){ amountEl.focus(); return; }

        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isAbsence: true, isDeficit: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'absence');
        }catch(e){
            alert('تعذر تسجيل الغياب، حاول مرة أخرى');
            console.error(e);
        }
    };

    function openExceptionModal(driver, p){
        const excess = p.newTotal - p.limit;
        document.getElementById('exceptionModalRows').innerHTML = `
            <div class="modal-row"><span>الاسم</span><b>${escapeHtml(driver.name)}</b></div>
            <div class="modal-row"><span>الحد المسموح به بتاريخ ${p.date}</span><b>${fmt(p.limit)}</b></div>
            <div class="modal-row"><span>سلف الشهر الحالية</span><b>${fmt(p.existingMonthTotal)}</b></div>
            <div class="modal-row"><span>السلفة الجديدة</span><b>${fmt(p.amount)}</b></div>
            <div class="modal-row"><span>الإجمالي بعد الإضافة</span><b>${fmt(p.newTotal)}</b></div>
            <div class="modal-row excess"><span>مقدار التجاوز (سيتسجل كعجز تلقائياً)</span><b>${fmt(excess)}</b></div>
        `;
        document.getElementById('exceptionModal').classList.add('open');
    }

    function closeExceptionModal(){
        document.getElementById('exceptionModal').classList.remove('open');
        pendingAdvance = null;
    }

    document.getElementById('modalCancelBtn').addEventListener('click', closeExceptionModal);

    document.getElementById('modalExceptionBtn').addEventListener('click', async () => {
        if(!pendingAdvance) return;
        const { driverId, amount, date, note, limit, newTotal } = pendingAdvance;
        const excess = Math.round(newTotal - limit);
        try{
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount, date, note, isDeficit: false, isAbsence: false, exception: true, createdAt: serverTimestamp() });
            await addDoc(collection(db, ADVANCES_COL), { driverId, amount: excess, date, note: 'عجز عن تجاوز الحد المسموح بالسلفة', isDeficit: true, isAbsence: false, exception: false, createdAt: serverTimestamp() });
            openPanels.set(driverId, 'deficit');
        }catch(e){
            alert('تعذر تسجيل السلفة بالعجز');
            console.error(e);
        }
        closeExceptionModal();
    });

    async function deleteAdvance(advId){
        try{ await deleteDoc(doc(db, ADVANCES_COL, advId)); }
        catch(e){ alert('تعذر الحذف'); console.error(e); }
    }

    async function deleteDriver(driverId){
        const driver = drivers.find(d => d.id === driverId);
        if(!confirm(`هل تريد الحذف وكل البيانات الخاصة به؟`)) return;
        try{
            const q = query(collection(db, ADVANCES_COL), where("driverId", "==", driverId));
            const snap = await getDocs(q);
            await Promise.all(snap.docs.map(d => deleteDoc(doc(db, ADVANCES_COL, d.id))));
            await deleteDoc(doc(db, DRIVERS_COL, driverId));
        }catch(e){
            alert('تعذر الحذف');
            console.error(e);
        }
    }

    // ---------- Month navigation ----------
    document.getElementById('prevMonth').addEventListener('click', () => {
        const [y,m] = currentMonth.split('-').map(Number);
        currentMonth = new Date(y, m-2, 1).toISOString().slice(0,7);
        render();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
        const [y,m] = currentMonth.split('-').map(Number);
        currentMonth = new Date(y, m, 1).toISOString().slice(0,7);
        render();
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
</script>

<script>
    // Back button logic
    document.getElementById('btnBack').addEventListener('click', () => {
        if (document.referrer) { history.back(); } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
