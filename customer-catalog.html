<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الزيادي لزيوت وقطع غيار السيارات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b0764">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#3b0764;--g:linear-gradient(135deg,#3b0764,#6b21a8 60%,#581c87);--bg:#f4f4f5}
body{background:var(--bg);font-family:Cairo,sans-serif;color:#18181b;padding-bottom:100px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.dot-on{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block}
.hero{background:var(--g);color:#fff;padding:12px 14px;border-radius:0 0 20px 20px;text-align:center;box-shadow:0 8px 18px rgba(59,7,100,.2)}
.hero h1{font-size:1.2rem;font-weight:900;margin:0;cursor:pointer}
.hero .sub{font-size:.72rem;opacity:.75;font-weight:700}
.pill-info{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:5px 10px;margin-top:6px;font-size:.74rem;font-weight:700;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pill-info a{color:#fff;text-decoration:none}
body.kb .hero,body.kb #bnWrap{display:none}
body.kb #cta{display:none}
#bnWrap{overflow:hidden}
#bnTrack{display:flex;transition:transform .4s}
.bn{min-width:100%}
.bn-card{border-radius:16px;padding:14px 18px;color:#fff;display:flex;align-items:center;justify-content:space-between;min-height:110px}
.bn-card h5{font-size:1.05rem;font-weight:900;margin-bottom:3px}
.bn-card p{font-size:.74rem;font-weight:700;opacity:.9;margin-bottom:8px}
.bn-btn{background:#fff;color:#1e1b4b;border:0;border-radius:8px;padding:4px 14px;font-size:.78rem;font-weight:900}
.bn-ic{font-size:2.8rem;opacity:.85;color:#f59e0b}
.c-purple{background:linear-gradient(135deg,#3b0764,#6b21a8)}.c-dark{background:linear-gradient(135deg,#1e1b4b,#312e81)}.c-orange{background:linear-gradient(135deg,#9a3412,#d97706)}.c-green{background:linear-gradient(135deg,#14532d,#16a34a)}
#dots{display:flex;justify-content:center;gap:6px;margin:8px 0}
#dots i{width:8px;height:8px;background:#d4d4d8;border-radius:10px;transition:.3s}
#dots i.on{background:#6b21a8;width:20px}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to left,#000 92%,transparent);mask-image:linear-gradient(to left,#000 92%,transparent)}
.scroller::-webkit-scrollbar{display:none}
.tab{background:#fff;border:1.5px solid #e4e4e7;border-radius:20px;padding:6px 14px;font-size:.78rem;font-weight:800;color:#52525b;white-space:nowrap}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.chip{background:#f8fafc;border:1px solid #cbd5e1;border-radius:14px;padding:3px 10px;font-size:.72rem;font-weight:800;color:#334155;white-space:nowrap}
.chip.on{background:#d97706;color:#fff;border-color:#b45309}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:2px solid #e4e4e7;border-radius:14px;padding:10px 2px;text-align:center;font-weight:800;font-size:.85rem;color:#3f3f46;line-height:1.3}
.tile i{display:block;font-size:1.4rem;margin-bottom:3px;color:#6b21a8}
.tile.sm{padding:8px 2px;font-size:.78rem;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile.sm img{height:30px;max-width:85%;object-fit:contain;margin-bottom:4px;background:#fff;border-radius:6px;padding:2px}
.tile.sm i{font-size:1.2rem}
.tile.on{background:var(--p);color:#fff;border-color:var(--p)}
.tile.on i{color:#fbbf24}
.tile.sm.on{background:#d97706;border-color:#b45309}
.tools-row{display:flex;gap:6px}
.tools-row input{flex:1}
.tools-row select{width:110px;border-radius:10px;font-size:.75rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.full{grid-column:span 2;text-align:center;padding:40px 0}
.card{background:#fff;border-radius:16px;border:1px solid #e4e4e7;overflow:hidden;padding-bottom:10px;position:relative}
.card.has{border:2px solid #8b5cf6;box-shadow:0 4px 15px rgba(139,92,246,.2)}
.card .im{height:170px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .im img.ph{object-fit:contain;padding:36px;opacity:.5}
.badge-b{position:absolute;top:8px;right:8px;background:#f3e8ff;color:#581c87;font-size:.65rem;font-weight:800;border-radius:8px;padding:1px 8px}
.gear{position:absolute;top:8px;left:8px;background:#18181b;color:#fff;border:0;border-radius:50%;width:28px;height:28px;font-size:.75rem}
.det{padding:6px 10px 0;text-align:center}
.ttl{font-weight:800;font-size:.86rem;line-height:1.35;min-height:2.3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:900;font-size:1rem}
.price small{display:block;font-size:.68rem;color:#71717a;font-weight:700}
.units{display:flex;gap:4px;margin-top:6px}
.unit{flex:1;font-size:.72rem;font-weight:800;padding:3px 6px;border-radius:8px;border:1px solid #e4e4e7;background:#fff;color:#52525b}
.unit.on{background:var(--p);color:#fff;border-color:var(--p)}
.qty{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.qb{border:0;border-radius:50%;width:34px;height:34px;font-size:1.2rem;font-weight:800;background:#f4f4f5}
.qb.plus{background:var(--g);color:#fff}
.qn{font-size:1.1rem;font-weight:900;color:var(--p);min-width:24px;text-align:center}
.sk{height:250px;border-radius:16px;background:linear-gradient(90deg,#e4e4e7 25%,#f4f4f5 50%,#e4e4e7 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
#cta{position:fixed;bottom:10px;left:12px;right:12px;background:var(--g);color:#fff;border-radius:14px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 22px rgba(59,7,100,.35);z-index:999}
#cta .send{background:#22c55e;color:#fff;border:0;border-radius:10px;padding:7px 16px;font-weight:900;font-size:.85rem}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;display:none;align-items:center;justify-content:center;padding:14px}
#box{background:#fff;border-radius:20px;width:100%;max-width:420px;padding:16px;max-height:88vh;overflow:auto}
.row-i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #e4e4e7;gap:8px}
.f label{font-size:.75rem;font-weight:800;margin-top:6px}
.f input,.f select{border-radius:10px;font-size:.85rem}
.btn-p{background:var(--g);color:#fff;border:0;border-radius:10px;font-weight:800;padding:8px}
</style>
</head>
<body>

<div class="hero">
  <h1 id="brand">الزيادي لزيوت وقطع غيار السيارات</h1>
  <div class="sub">سجل نواقص محلك ليلاً لتجهيزها وتحميلها صباحاً</div>
  <div class="pill-info"><span><i class="fas fa-clock text-warning"></i> الطلبات حتى <b>12:00 منتصف الليل</b></span></div>
  <div class="pill-info" style="flex-wrap:nowrap;gap:14px;font-size:.72rem;white-space:nowrap">
    <a href="https://wa.me/201000197222" target="_blank"><i class="fab fa-whatsapp text-success"></i> أحمد <b dir="ltr">01000197222</b></a>
    <a href="tel:01027830834"><i class="fas fa-phone-alt text-warning"></i> فكري <b dir="ltr">01027830834</b></a>
  </div>
</div>

<div class="container px-2 mt-2">
  <div id="bnWrap" style="display:none"><div id="bnTrack"></div><div id="dots"></div></div>

  <input id="clientName" class="form-control fw-bold shadow-sm mb-2 kbf" placeholder="أدخل اسم محلك هنا..." style="border-radius:12px;padding:10px 12px">

  <div id="sel" style="display:none" class="d-flex align-items-center justify-content-between bg-white border rounded-3 p-2 mb-2">
    <div style="font-size:.85rem;font-weight:800">عرض: <span id="selTxt" style="color:var(--p)"></span></div>
    <button class="btn btn-sm fw-bold text-white" style="background:var(--p)" data-act="pick">تغيير</button>
  </div>
  <div id="pick" class="bg-white border rounded-3 p-2 mb-2">
    <div class="fw-bold mb-2" style="font-size:.88rem">١ - اختار النوع</div>
    <div class="g3" id="tabs">
      <button class="tile on" data-act="tab" data-v="all"><i class="fas fa-border-all"></i>الكل</button>
      <button class="tile" data-act="tab" data-v="oils"><i class="fas fa-oil-can"></i>زيت موتور</button>
      <button class="tile" data-act="tab" data-v="gears"><i class="fas fa-cogs"></i>زيت فتيس</button>
      <button class="tile" data-act="tab" data-v="brakes"><i class="fas fa-circle-stop"></i>فرامل</button>
      <button class="tile" data-act="tab" data-v="parts"><i class="fas fa-gears"></i>قطع غيار</button>
    </div>
    <div class="fw-bold mt-3 mb-2" style="font-size:.88rem">٢ - اختار الشركة <span class="text-muted" style="font-size:.72rem">(لو عايز)</span></div>
    <div class="g3" id="chips">
      <button class="tile sm on" data-act="brand" data-v="all"><i class="fas fa-layer-group"></i>كل الشركات</button>
      <button class="tile sm" data-act="brand" data-v="موبيل"><img src="logos/mobil.png" alt="" onerror="this.remove()">موبيل</button>
      <button class="tile sm" data-act="brand" data-v="توتال"><img src="logos/total.png" alt="" onerror="this.remove()">توتال</button>
      <button class="tile sm" data-act="brand" data-v="شيل"><img src="logos/shell.png" alt="" onerror="this.remove()">شيل</button>
      <button class="tile sm" data-act="brand" data-v="بترومين"><img src="logos/petromin.png" alt="" onerror="this.remove()">بترومين</button>
      <button class="tile sm" data-act="brand" data-v="التعاون"><img src="logos/taawon.png" alt="" onerror="this.remove()">التعاون</button>
      <button class="tile sm" data-act="brand" data-v="مصر"><img src="logos/misr.png" alt="" onerror="this.remove()">مصر للبترول</button>
      <button class="tile sm" data-act="brand" data-v="شعبى"><i class="fas fa-droplet"></i>زيوت شعبية</button>
      <button class="tile sm" data-act="brand" data-v="أخرى"><i class="fas fa-ellipsis"></i>شركات أخرى</button>
    </div>
    <button class="btn-p w-100 mt-3" style="background:linear-gradient(135deg,#15803d,#22c55e)" data-act="done">عرض الأصناف ↓</button>
  </div>

  <div class="tools-row mb-2">
    <input id="search" class="form-control form-control-sm fw-bold shadow-sm kbf" placeholder="🔍 ابحث عن اسم الصنف..." style="border-radius:10px;padding:9px 12px">
    <select id="sort" class="form-select form-select-sm">
      <option value="def">الترتيب</option><option value="asc">الأقل سعراً</option><option value="desc">الأعلى سعراً</option><option value="name">الاسم</option>
    </select>
  </div>

  <div class="grid" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</div>

<div id="cta">
  <div><span style="font-size:.72rem;opacity:.75">المختارة:</span> <b><span id="cnt">0</span> أنواع</b>
    <div style="font-size:.72rem;opacity:.85">≈ <span id="tot">0</span> ج.م</div></div>
  <button class="send" data-act="review">إرسال الطلب 🚀</button>
</div>

<div id="ov"><div id="box"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentSingleTabManager,getFirestore,collection,getDocs,addDoc,doc,setDoc,updateDoc,deleteDoc,increment,onSnapshot,serverTimestamp,query,where} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",authDomain:"ahmedelzaiady.firebaseapp.com",projectId:"ahmedelzaiady",storageBucket:"ahmedelzaiady.firebasestorage.app",messagingSenderId:"300306825071",appId:"1:300306825071:web:0426ddde56280fa090329a"});
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentSingleTabManager()})})}catch(e){db=getFirestore(app)}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STOP=['جركن','علبة','زيت','زجاجة','جالون','جيلكن','كرتونة','نوع','قطعة'];
const WA='201000197222';
const BRANDS=['موبيل','توتال','شيل','بترومين','التعاون','مصر','شعبى','أخرى'];
const CATS={oils:'محركات',gears:'تروس',brakes:'فرامل',parts:'قطع غيار'};

let items=[],cart={},units={},banners=[],allBanners=[],isAdmin=false;
let cat='all',brand='all',slide=0,timer=null,firstAuth=true,unsubs=[];
try{cart=JSON.parse(localStorage.getItem('zc_cart')||'{}');$('clientName').value=localStorage.getItem('zc_name')||''}catch(e){}
const save=()=>{try{localStorage.setItem('zc_cart',JSON.stringify(cart));localStorage.setItem('zc_name',$('clientName').value)}catch(e){}};

/* ---------- المودال ---------- */
const openModal=h=>{$('box').innerHTML=h;$('ov').style.display='flex'};
const closeModal=()=>{$('ov').style.display='none'};
const alertBox=(m,t='تنبيه')=>openModal(`<div class="text-center"><h5 class="fw-bold">${t}</h5><p class="fw-bold" style="color:var(--p)">${esc(m)}</p><button class="btn-p w-100" data-act="close">موافق</button></div>`);
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});

/* ---------- الزيارات ---------- */
async function track(){
  try{
    await setDoc(doc(db,'store_analytics','general'),{totalVisits:increment(1)},{merge:true});
    const ref=doc(db,'store_presence','u_'+Math.random().toString(36).slice(2,9));
    await setDoc(ref,{lastSeen:serverTimestamp()});
    addEventListener('beforeunload',()=>setDoc(ref,{active:false},{merge:true}));
  }catch(e){}
}

/* ---------- الإعلانات ---------- */
async function loadBanners(){
  try{
    const s=await getDocs(collection(db,'banners'));
    allBanners=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    banners=allBanners.filter(b=>b.active!==false);
  }catch(e){allBanners=banners=[]}
  renderBanners();
}
function renderBanners(){
  const w=$('bnWrap');clearInterval(timer);
  if(!banners.length){w.style.display='none';return}
  w.style.display='block';slide=0;
  $('bnTrack').style.transform='';
  $('bnTrack').innerHTML=banners.map(b=>`<div class="bn"><div class="bn-card c-${esc(b.color||'purple')}"><div><h5>${esc(b.title)}</h5><p>${esc(b.text)}</p>${b.actionType&&b.actionType!=='none'&&b.btnText?`<button class="bn-btn" data-act="bn" data-t="${esc(b.actionType)}" data-v="${esc(b.actionValue)}">${esc(b.btnText)}</button>`:''}</div><i class="fas ${esc(b.icon||'fa-oil-can')} bn-ic"></i></div></div>`).join('');
  $('dots').innerHTML=banners.length>1?banners.map((_,i)=>`<i class="${i?'':'on'}" data-act="slide" data-v="${i}"></i>`).join(''):'';
  if(banners.length>1)timer=setInterval(()=>goSlide((slide+1)%banners.length),4500);
}
function goSlide(i){slide=i;$('bnTrack').style.transform=`translateX(${i*100}%)`;[...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i))}
function bannerAction(t,v){
  if(t==='search'){$('search').value=v;filter();$('search').scrollIntoView({behavior:'smooth'})}
  else if(t==='category')setCat(v);
  else if(t==='link'&&/^https:\/\//.test(v))window.open(v,'_blank','noopener');
}
/* ---------- الأصناف ---------- */
const isBrake=i=>{const c=(i.category||'').toLowerCase(),n=(i.name||'').toLowerCase();return c.includes('فرامل')||['فرامل','باكم','تيل','dot3','dot4','dot 3','dot 4'].some(k=>n.includes(k))};
const isGear=i=>{const c=(i.category||'').toLowerCase(),n=(i.name||'').toLowerCase();return c.includes('تروس')||c.includes('فتيس')||['تروس','فتيس','gear','90','140','80w'].some(k=>n.includes(k)&&!n.includes('محرك'))};
const isPart=i=>{if(isBrake(i)||isGear(i))return false;const c=(i.category||'').toLowerCase(),n=(i.name||'').toLowerCase();return c.includes('قطع')||c.includes('غيار')||['سلك','أكور','اقور','اكس','أكس','فلتر','سير','بوجيه','كابل','جلبة','مسمار','طلمبة','مساعد','خرطوم'].some(k=>n.includes(k))};
const norm=t=>(t||'').toLowerCase().replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/[\u064B-\u0652]/g,'');

async function loadProducts(){
  try{
    const s=await getDocs(collection(db,'inventory'));
    items=s.docs.map(d=>({id:d.id,...d.data()}));
    items.sort((a,b)=>{const x=+a.sell||0,y=+b.sell||0;if(x>0&&y<=0)return -1;if(x<=0&&y>0)return 1;return(a.name||'').localeCompare(b.name||'','ar')});
    render();
  }catch(e){$('list').innerHTML='<div class="full text-danger fw-bold">تعذر تحميل الأصناف. تأكد من الاتصال وأعد المحاولة.</div>'}
}
function filtered(){
  let r=items.filter(i=>{
    if(i.storeCategory)return cat==='all'||i.storeCategory===cat;
    if(cat==='brakes')return isBrake(i);if(cat==='gears')return isGear(i);if(cat==='parts')return isPart(i);
    if(cat==='oils')return !isBrake(i)&&!isGear(i)&&!isPart(i);return true;
  });
  if(brand!=='all'){
    const nb=norm(brand),known=['موبيل','توتال','شيل','بترومين','التعاون','مصر'].map(norm);
    r=r.filter(i=>{
      const ib=norm(i.brand),t=norm(i.name)+' '+norm(i.category);
      if(ib)return ib===nb;
      if(brand==='شعبى'||brand==='أخرى')return !known.some(k=>t.includes(k));
      return t.includes(nb);
    });
  }
  const q=norm($('search').value.trim());
  if(q){let w=q.split(/\s+/).filter(x=>!STOP.includes(x));if(!w.length)w=q.split(/\s+/);r=r.filter(i=>i.name&&w.every(x=>norm(i.name).includes(x)))}
  const s=$('sort').value,p=i=>+i.sell||0;
  if(s==='asc')r=[...r].sort((a,b)=>p(a)-p(b));
  if(s==='desc')r=[...r].sort((a,b)=>p(b)-p(a));
  if(s==='name')r=[...r].sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  return r;
}
function render(){
  const r=filtered();
  if(!items.length&&!r.length)return;
  if(!r.length){$('list').innerHTML='<div class="full"><i class="fas fa-triangle-exclamation text-warning fa-2x mb-2"></i><p class="fw-bold m-0">لا توجد أصناف تطابق اختيارك</p><small class="text-muted">جرّب شركة أو قسماً آخر</small></div>';return}
  $('list').innerHTML=r.map(p=>{
    const f=Math.max(1,+(p.unitFactor||p.factor||p.pcsPerCarton)||1),pr=+p.sell||0;
    const part=p.storeCategory==='parts'||(!p.storeCategory&&isPart(p));
    const u=cart[p.id]?.unit||units[p.id]||'box',q=cart[p.id]?.qty||0;
    return `<div class="card ${q?'has':''}" id="c_${p.id}">
      ${p.brand?`<span class="badge-b">${esc(p.brand)}</span>`:''}
      <div class="im" data-act="img" data-id="${p.id}"><img loading="lazy" class="${p.imageUrl||p.image?'':'ph'}" src="${esc(p.imageUrl||p.image||'https://cdn-icons-png.flaticon.com/512/3076/3076962.png')}" alt=""></div>
      <div class="det"><div class="ttl">${esc(p.name)}</div>
      <div class="price">${pr>0?pr.toFixed(0)+' ج.م':'سعر عند التحميل'}${pr>0?`<small>${part?'للطقم':'للكرتونة'} · ${part?'القطعة':'العلبة'} ≈ ${(pr/f).toFixed(1)}</small>`:''}</div>
      <div class="units"><button class="unit ${u==='box'?'on':''}" data-act="unit" data-id="${p.id}" data-u="box">${part?'طقم':'كرتونة'}</button><button class="unit ${u==='pcs'?'on':''}" data-act="unit" data-id="${p.id}" data-u="pcs">${part?'قطعة':'علبة'}</button></div>
      <div class="qty"><button class="qb" data-act="qty" data-id="${p.id}" data-d="-1">-</button><span class="qn">${q}</span><button class="qb plus" data-act="qty" data-id="${p.id}" data-d="1">+</button></div></div></div>`;
  }).join('');
}
const priceOf=(p,u)=>{const f=Math.max(1,+(p.unitFactor||p.factor||p.pcsPerCarton)||1),c=+p.sell||0;return u==='box'?c:c/f};
function setUnit(id,u){
  const p=items.find(x=>x.id===id);if(!p)return;units[id]=u;
  if(cart[id]){cart[id].unit=u;cart[id].price=priceOf(p,u);save();summary()}
  render();
}
function alter(id,d){
  const p=items.find(x=>x.id===id);if(!p)return;
  const q=Math.max(0,(cart[id]?.qty||0)+d),u=cart[id]?.unit||units[id]||'box';
  if(q>0)cart[id]={stockId:id,name:p.name,unit:u,qty:q,price:priceOf(p,u)};else delete cart[id];
  save();summary();
  const c=$('c_'+id);if(c){c.classList.toggle('has',q>0);c.querySelector('.qn').innerText=q}
}
function summary(){
  const v=Object.values(cart);
  $('cnt').innerText=v.length;$('tot').innerText=v.reduce((s,i)=>s+i.qty*i.price,0).toFixed(0);
}
const CL={all:'كل الأقسام',oils:'زيت موتور',gears:'زيت فتيس',brakes:'فرامل',parts:'قطع غيار'},BL={all:'كل الشركات',مصر:'مصر للبترول',شعبى:'زيوت شعبية',أخرى:'شركات أخرى'};
function upSel(){$('selTxt').innerText=CL[cat]+' · '+(BL[brand]||brand)}
function showPick(on){$('pick').style.display=on?'block':'none';$('sel').style.display=on?'none':'flex';upSel();if(!on)$('sel').scrollIntoView({behavior:'smooth',block:'start'})}
function setCat(c){cat=c;document.querySelectorAll('.tile[data-act=tab]').forEach(b=>b.classList.toggle('on',b.dataset.v===c));upSel();render()}

/* ---------- مراجعة وإرسال ---------- */
function review(){
  const name=$('clientName').value.trim(),v=Object.values(cart);
  if(!name)return alertBox('يرجى كتابة اسم محلك أولاً.');
  if(!v.length)return alertBox('اختر كمية صنف واحد على الأقل قبل الإرسال.');
  let t=0;
  openModal(`<div class="d-flex justify-content-between mb-1"><h6 class="fw-bold m-0" style="color:var(--p)">مراجعة الطلبية</h6><button class="btn-close" data-act="close"></button></div>
  <div class="text-muted fw-bold mb-2" style="font-size:.8rem">طلب خاص بـ: ${esc(name)}</div>
  <div style="max-height:280px;overflow:auto">${v.map(i=>{const s=i.qty*i.price;t+=s;return `<div class="row-i"><div><div class="fw-bold" style="font-size:.82rem">${esc(i.name)}</div><div class="text-muted" style="font-size:.72rem">${i.qty} ${i.unit==='box'?'كرتونة/طقم':'علبة/قطعة'} × ${i.price.toFixed(0)} ج.م</div></div><div class="d-flex align-items-center gap-2"><b style="font-size:.85rem;color:var(--p)">${s.toFixed(0)}</b><button class="btn btn-sm btn-outline-danger px-2" data-act="rm" data-id="${i.stockId}"><i class="fas fa-trash-can"></i></button></div></div>`}).join('')}</div>
  <div class="bg-light p-2 rounded-3 border mt-3 d-flex justify-content-between"><b style="font-size:.9rem">الإجمالي التقريبي:</b><b style="color:var(--p)">${t.toFixed(0)} ج.م</b></div>
  <div class="d-flex gap-2 mt-3"><button class="btn btn-sm btn-outline-secondary fw-bold flex-fill" data-act="close">تعديل / إضافة</button><button id="sendBtn" class="btn-p flex-fill" data-act="send">تأكيد وإرسال 🚀</button></div>`);
}
async function send(){
  const name=$('clientName').value.trim(),v=Object.values(cart),b=$('sendBtn');
  b.disabled=true;b.innerText='جاري الإرسال...';
  const total=v.reduce((s,i)=>s+i.qty*i.price,0);
  try{
    await addDoc(collection(db,'orders'),{customerName:name,items:v,total,date:new Date().toISOString().split('T')[0],createdAt:serverTimestamp(),status:'pending',source:'pwa_store'});
    const msg=`طلب جديد من: ${name}\n`+v.map(i=>`• ${i.name} × ${i.qty} ${i.unit==='box'?'كرتونة':'علبة'}`).join('\n')+`\nالإجمالي التقريبي: ${total.toFixed(0)} ج.م`;
    cart={};units={};save();summary();render();
    openModal(`<div class="text-center"><h5 class="fw-bold">تم إرسال الطلبية ✅</h5><p class="fw-bold" style="color:var(--p)">سنتواصل معك لتأكيد التحميل. تقدر كمان تبعت نسخة على واتساب.</p><a class="btn btn-success w-100 fw-bold mb-2" target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">إرسال نسخة على واتساب</a><button class="btn-p w-100" data-act="close">تم</button></div>`);
  }catch(e){b.disabled=false;b.innerText='تأكيد وإرسال 🚀';alertBox('حدث خطأ أثناء الإرسال، حاول مرة أخرى.')}
}

/* ---------- الأحداث ---------- */
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const filter=render;
$('search').addEventListener('input',debounce(render,300));
$('sort').addEventListener('change',render);
$('clientName').addEventListener('input',save);
document.querySelectorAll('.kbf').forEach(i=>{
  i.addEventListener('focus',()=>{document.body.classList.add('kb');setTimeout(()=>i.scrollIntoView({block:'start',behavior:'smooth'}),300)});
  i.addEventListener('blur',()=>document.body.classList.remove('kb'));
});

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  try{
  switch(a){
    case'close':closeModal();break;
    case'tab':setCat(v);break;
    case'brand':brand=v;document.querySelectorAll('.tile[data-act=brand]').forEach(c=>c.classList.toggle('on',c===el));render();showPick(false);break;
    case'pick':showPick(true);break;
    case'done':showPick(false);break;
    case'unit':setUnit(id,el.dataset.u);break;
    case'qty':alter(id,+el.dataset.d);break;
    case'img':{const p=items.find(x=>x.id===id);openModal(`<img src="${esc(p.imageUrl||p.image)}" style="width:100%;max-height:65vh;object-fit:contain"><h6 class="fw-bold text-center mt-2">${esc(p.name)}</h6><button class="btn-p w-100" data-act="close">إغلاق</button>`);break}
    case'review':review();break;
    case'send':await send();break;
    case'rm':delete cart[id];save();summary();render();Object.keys(cart).length?review():closeModal();break;
    case'slide':goSlide(+v);break;
    case'bn':bannerAction(el.dataset.t,el.dataset.v);break;
  }}catch(err){console.error(err);alertBox('تعذر تنفيذ العملية. تأكد من تسجيل الدخول وصلاحيات Firestore.')}
});

summary();loadProducts();loadBanners();track();
</script>
</body>
</html>
