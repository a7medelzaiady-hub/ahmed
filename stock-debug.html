<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تشخيص رصيد صنف - شركة الزيادي</title>
<script src="auth-guard.js"></script>
<style>
  body { font-family: system-ui, 'Cairo', sans-serif; background:#f4f6f8; margin:0; padding:12px; color:#0f172a; }
  h1 { font-size:1.05rem; margin:6px 0 10px; }
  .box { background:#fff; border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  input { width:100%; box-sizing:border-box; padding:10px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:1rem; }
  .sum { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; }
  .sum div { background:#f1f5f9; border-radius:10px; padding:8px; text-align:center; font-weight:700; font-size:.85rem; }
  .sum b { display:block; font-size:1.05rem; }
  .total { background:#0f172a !important; color:#fff; grid-column:span 2; }
  table { width:100%; border-collapse:collapse; font-size:.78rem; }
  th, td { padding:6px 4px; border-bottom:1px solid #e2e8f0; text-align:center; }
  th { background:#f8fafc; }
  .in { color:#059669; font-weight:800; } .out { color:#dc2626; font-weight:800; }
  .flag { color:#b45309; font-weight:800; }
  .muted { color:#64748b; font-size:.8rem; }
  .skip { opacity:.45; }
</style>
</head>
<body>
<h1>🔎 تشخيص رصيد صنف (للقراءة فقط - لا يكتب أي شيء)</h1>
<div class="box">
  <input id="q" placeholder="اكتب اسم الصنف..." value="فورما صغير">
  <div class="muted" id="status" style="margin-top:6px">جاري التحميل...</div>
  <div id="summary"></div>
</div>
<div class="box" id="movesBox" style="display:none;overflow-x:auto">
  <table>
    <thead><tr><th>#</th><th>النوع</th><th>التاريخ</th><th>الكمية</th><th>الوحدة</th><th>العبوة</th><th>= قطع</th><th>أثره على الرصيد</th><th>ملاحظة</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script type="module">
import { calculateStockBalances, normalizeStockName } from "./stock-balance.mjs";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls", authDomain: "ahmedelzaiady.firebaseapp.com", projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app", messagingSenderId: "300306825071", appId: "1:300306825071:web:0426ddde56280fa090329a"
});
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) }); }
catch (e) { db = getFirestore(app); }

let data = null;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KIND = { opening: 'افتتاحي', purchase: 'شراء', 'purchase-return': 'مرتجع شراء', sale: 'بيع', 'sale-return': 'مرتجع بيع' };
const fmt = (pcs, f) => { const a = Math.abs(pcs), s = pcs < 0 ? '-' : ''; return f > 1 ? `${s}${Math.floor(a / f)} كرتونة و ${a % f} قطعة` : `${s}${a} قطعة`; };

async function load() {
  const [inv, sales, sup, op] = await Promise.all([
    getDocs(collection(db, 'inventory')), getDocs(collection(db, 'invoices')), getDocs(collection(db, 'supplier_transactions')),
    getDocs(query(collection(db, 'inventory_transactions'), where('type', '==', 'opening_balance')))
  ]);
  data = {
    inventoryItems: inv.docs.map(d => ({ id: d.id, ...d.data() })),
    salesInvoices: sales.docs.map(d => ({ id: d.id, ...d.data() })),
    supplierTransactions: sup.docs.map(d => ({ id: d.id, ...d.data() })),
    openingTransactions: op.docs.map(d => ({ id: d.id, ...d.data() }))
  };
  document.getElementById('status').textContent = `تم تحميل ${data.inventoryItems.length} صنف و ${data.salesInvoices.length} فاتورة بيع و ${data.supplierTransactions.length} حركة مورد`;
  render();
}

function render() {
  if (!data) return;
  const q = normalizeStockName(document.getElementById('q').value);
  const rows = calculateStockBalances({ ...data, trace: true }).filter(r => q && normalizeStockName(r.name).includes(q));
  const sum = document.getElementById('summary'), box = document.getElementById('movesBox'), tb = document.getElementById('rows');
  if (rows.length === 0) { sum.innerHTML = '<div class="muted" style="margin-top:8px">لا يوجد صنف بهذا الاسم</div>'; box.style.display = 'none'; return; }
  const r = rows[0];
  const extra = rows.length > 1 ? `<div class="muted">يوجد ${rows.length} أصناف مطابقة، المعروض: ${esc(r.name)} (اكتب الاسم كاملاً لتحديد صنف آخر)</div>` : '';
  sum.innerHTML = extra + `<div class="sum">
    <div>العبوة (قطع بالكرتونة)<b>${r.capacity}</b></div>
    <div>مصدر الرصيد الافتتاحي<b style="font-size:.8rem">${esc(r.openingSource)}</b></div>
    <div>افتتاحي<b>${esc(fmt(r.openingPcs, r.capacity))}</b></div>
    <div>مشتريات (صافي)<b>${esc(fmt(r.purchasesPcs, r.capacity))}</b></div>
    <div>مبيعات (صافي)<b>${esc(fmt(r.salesPcs, r.capacity))}</b></div>
    <div class="total">الرصيد = افتتاحي + مشتريات − مبيعات<b>${esc(fmt(r.totalPcs, r.capacity))} (${r.totalPcs} قطعة)</b></div></div>`;
  const openingCounted = r.openingSource === 'inventory_transactions';
  tb.innerHTML = r.movements.map((m, i) => {
    const skipped = m.kind === 'opening' && !openingCounted;
    const flags = [...(m.flags || []), skipped ? 'لا يُحتسب (الافتتاحي محدد على الصنف نفسه)' : ''].filter(Boolean).join(' / ');
    return `<tr class="${skipped ? 'skip' : ''}"><td>${i + 1}</td><td>${esc(KIND[m.kind] || m.kind)}</td><td>${esc(m.date)}</td>
      <td>${esc(m.rawQty)}</td><td>${esc(m.unit || '—')}</td><td>${esc(m.factor)}</td><td>${esc(m.pcs)}</td>
      <td class="${(m.kind === 'sale' || m.kind === 'purchase-return') ? 'out' : 'in'}">${(m.kind === 'sale' || m.kind === 'purchase-return') ? '-' : '+'}${esc(Math.abs(m.pcs))}</td>
      <td class="flag">${esc(flags)}${m.ref ? `<div class="muted">${esc(String(m.ref).slice(0, 10))}${m.party ? ' · ' + esc(m.party) : ''}</div>` : ''}</td></tr>`;
  }).join('') || '<tr><td colspan="9" class="muted">لا توجد حركات</td></tr>';
  box.style.display = 'block';
}

document.getElementById('q').addEventListener('input', render);
load().catch(e => { console.error(e); document.getElementById('status').textContent = 'تعذر تحميل البيانات: ' + e.message; });
</script>
</body>
</html>
