<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الأصناف — الزيادي</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--g8:#0b4e33;--g7:#0f6e48;--g6:#16a34a;--g1:#dcfce7;--g0:#f0fdf4;--a7:#b45309;--a1:#fef3c7;--a0:#fffbeb;--r7:#b91c1c;--r1:#fee2e2;--r0:#fef2f2;--s9:#0f172a;--s7:#334155;--s5:#64748b;--s3:#cbd5e1;--s1:#f1f5f9;--wh:#fff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#e8edea;font-family:'Cairo',sans-serif;color:var(--s9);font-size:.88rem;padding-bottom:60px;-webkit-font-smoothing:antialiased;}

/* ══ CSS ══ */
.topbar{background:var(--g8);height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(5,46,22,.4);}
.tb-brand{display:flex;align-items:center;gap:9px}
.tb-logo{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.95rem;color:#fff;flex-shrink:0;}
.tb-name{font-size:.82rem;font-weight:800;color:#fff;line-height:1.25}
.tb-sub{font-size:.62rem;color:rgba(255,255,255,.58);font-weight:500}
.tb-btns{display:flex;gap:7px}
.tb-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:.88rem;color:#fff;cursor:pointer;text-decoration:none;transition:background .15s;}
.tb-btn:hover{background:rgba(255,255,255,.22);color:#fff}

.datebar{background:var(--wh);border-bottom:1px solid #d0ddd6;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.datebar-title{font-size:.78rem;font-weight:800;color:var(--s7);display:flex;align-items:center;gap:6px;}
.date-pick{display:flex;align-items:center;gap:7px;background:var(--g0);border:1.5px solid #9fd3b5;border-radius:9px;padding:6px 11px;}
.date-pick input[type="date"]{border:none;background:transparent;font-family:'Cairo',sans-serif;font-weight:800;font-size:.82rem;color:var(--g8);outline:none;cursor:pointer;}

.tbl-card{margin:0 8px 12px;background:var(--wh);border-radius:12px;border:1px solid #d0ddd6;box-shadow:0 3px 12px rgba(0,0,0,.06);overflow-x:auto;}
table.inv{width:100%;border-collapse:separate;border-spacing:0;font-size:.75rem;}
table.inv thead th{background:var(--g8);color:#fff;padding:10px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;}
table.inv tbody td{padding:10px 6px;text-align:center;border-bottom:1px solid #eef3f0;}
table.inv tbody tr:hover td{background:#f5faf7 !important;cursor:pointer;}

.nm-cell{display:flex;align-items:center;font-weight:700;color:var(--g8)}
.badge-det{padding:2px 8px;border-radius:4px;font-size:.65rem;font-weight:700;}
.b-sales{background:var(--g1);color:var(--g7)}
.b-purch{background:var(--a1);color:var(--a7)}
.b-ret{background:var(--r1);color:var(--r7)}

.modal-content{border-radius:15px;border:none;box-shadow:0 10px 25px rgba(0,0,0,.2);}
.modal-header{background:var(--g8);color:#fff;border-radius:15px 15px 0 0;padding:12px;}
.modal-title{font-size:1rem;font-weight:800;}
</style>
</head>
<body>

<nav class="topbar">
  <div class="tb-brand">
    <div class="tb-logo"><i class="fas fa-oil-can"></i></div>
    <div>
      <div class="tb-name">الزيادي لزيوت السيارات</div>
      <div class="tb-sub">تقرير حركة المخزون التفصيلي</div>
    </div>
  </div>
  <div class="tb-btns">
    <a href="index.html" class="tb-btn" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
    <button class="tb-btn" onclick="window.print()" title="طباعة"><i class="fas fa-print"></i></button>
  </div>
</nav>

<div class="datebar">
  <div class="datebar-title"><i class="fas fa-chart-bar"></i> تفاصيل الحركات</div>
  <div class="date-pick">
    <input type="date" id="dateIn" onchange="window.loadData()">
  </div>
</div>

<div class="tbl-card">
  <table class="inv">
    <thead>
      <tr>
        <th>الصنف (اضغط للتفاصيل)</th>
        <th>مبيعات</th>
        <th>مشتريات</th>
        <th>مرتجع</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">تفاصيل الصنف</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table table-sm">
          <thead><tr><th>التاريخ</th><th>النوع</th><th>الكمية</th></tr></thead>
          <tbody id="modalBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain:"ahmedelzaiady.firebaseapp.com",
  projectId:"ahmedelzaiady",
  storageBucket:"ahmedelzaiady.firebasestorage.app",
  messagingSenderId:"300306825071",
  appId:"1:300306825071:web:0426ddde56280fa090329a"
});
let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

let inventoryData = {}; 

function toEn(s){
  if(!s)return"";
  const a=[/٠/g,/١/g,/٢/g,/٣/g,/٤/g,/٥/g,/٦/g,/٧/g,/٨/g,/٩/g];
  let r=s.toString();a.forEach((p,i)=>r=r.replace(p,i));return r;
}

function parseDate(df,ts){
  if(df){
    const s=toEn(df);
    let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }
  if(ts?.seconds)return new Date(ts.seconds*1000).toISOString().slice(0,10);
  return"";
}

function isCarton(item){
  const u=(item.unit||"").trim();
  const un=(item.unitName||"").trim();
  return u==="box" || un==="كرتونة" || un==="كرتونه";
}

function add(name, cart, qty, type, date) {
  if (!inventoryData[name]) {
    inventoryData[name] = { sJ:0, sC:0, pJ:0, pC:0, rJ:0, rC:0, details: [] };
  }
  const unitStr = cart ? "كرتونة" : "جركن";
  inventoryData[name].details.push({ date: date || "غير محدد", type, qty, unit: unitStr });

  const k = type + (cart ? "C" : "J");
  inventoryData[name][k] += qty;
}

window.showDetails = function(name){
  const item = inventoryData[name];
  document.getElementById("modalTitle").textContent = name;
  const tbody = document.getElementById("modalBody");
  tbody.innerHTML = "";
  
  // ترتيب التفاصيل داخل المودال من الأحدث للأقدم
  const sortedDetails = [...item.details].sort((a,b) => b.date.localeCompare(a.date));

  sortedDetails.forEach(d => {
    const colorClass = d.type==='s'?'b-sales':(d.type==='p'?'b-purch':'b-ret');
    const typeText = d.type==='s'?'مبيعات':(d.type==='p'?'مشتريات':'مرتجع');
    tbody.innerHTML += `<tr>
      <td>${d.date}</td>
      <td><span class="badge-det ${colorClass}">${typeText}</span></td>
      <td>${d.qty} (${d.unit})</td>
    </tr>`;
  });
  new bootstrap.Modal(document.getElementById('detailModal')).show();
};

window.loadData = async function(){
  const date = document.getElementById("dateIn").value; // ستكون فارغة "" إذا قام المستخدم بمسحها
  inventoryData = {};
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "<tr><td colspan='4'>جاري التحميل...</td></tr>";

  // جلب المبيعات
  const sSnap = await getDocs(collection(db,"invoices"));
  sSnap.forEach(doc => {
    const inv = doc.data();
    const dStr = parseDate(inv.date, inv.timestamp);
    
    // شرط الفلترة: إذا كان حقل التاريخ فارغاً، أو يتطابق تماماً مع تاريخ الفاتورة
    if(date && dStr !== date) return;
    
    if(!Array.isArray(inv.items)) return;
    inv.items.forEach(item => {
      add(item.name, isCarton(item), Number(item.qty)||0, !!item.isReturn ? "r" : "s", dStr);
    });
  });

  // جلب المشتريات
  const pSnap = await getDocs(collection(db,"supplier_transactions"));
  pSnap.forEach(doc => {
    const pur = doc.data();
    const dStr = parseDate(pur.date, pur.timestamp);
    
    // شرط الفلترة للمشتريات
    if(date && dStr !== date) return;
    
    if(!Array.isArray(pur.items)) return;
    pur.items.forEach(item => {
      const qty = Number(item.qty)||0;
      const ret = Number(item.returnQty)||0;
      if(qty > 0) add(item.name, isCarton(item), qty, "p", dStr);
      if(ret > 0) add(item.name, isCarton(item), ret, "r", dStr);
    });
  });

  // عرض الجدول
  tbody.innerHTML = "";
  const keys = Object.keys(inventoryData).sort();
  if(keys.length === 0){
    tbody.innerHTML = "<tr><td colspan='4' class='text-muted text-center p-3'>لا توجد حركات لعرضها</td></tr>";
    return;
  }
  
  keys.forEach(name => {
    const d = inventoryData[name];
    tbody.innerHTML += `
      <tr onclick="showDetails('${name}')">
        <td class="nm-cell">${name}</td>
        <td>${d.sJ||d.sC ? (d.sJ ? d.sJ+' جركن ':'') + (d.sC ? d.sC+' كرتونة':'') : '-'}</td>
        <td>${d.pJ||d.pC ? (d.pJ ? d.pJ+' جركن ':'') + (d.pC ? d.pC+' كرتونة':'') : '-'}</td>
        <td>${d.rJ||d.rC ? (d.rJ ? d.rJ+' جركن ':'') + (d.rC ? d.rC+' كرتونة':'') : '-'}</td>
      </tr>
    `;
  });
}

// التشغيل التلقائي عند فتح الصفحة
document.addEventListener("DOMContentLoaded", () => {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("dateIn").value = today; // يفتح افتراضياً على اليوم، ويمكن مسحه لرؤية الكل
  window.loadData();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
</html>
