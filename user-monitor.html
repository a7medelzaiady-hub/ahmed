<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مراقبة المتصلين - شركة الزيادي</title>
    <!-- إعدادات التطبيق PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --accent: #000000;
            --bg-light: #f5f6f6;
            --text-primary: #000000;
            --border: #dcdcdc;
            --white: #ffffff;
            --germany-red: #FF0000;
            --germany-gold: #FFCC00;
            --success: #16a34a;
            --card-radius: 18px;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 60px;
            font-size: 0.88rem;
            -webkit-tap-highlight-color: transparent;
        }

        .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

        .header-nav {
            background: linear-gradient(135deg, #000000, #252525 80%);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom: 4px solid var(--germany-red);
        }

        .header-nav h6 {
            font-weight: 900;
            font-size: 1.05rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn {
            background: rgba(255, 255, 255, 0.15);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        .add-btn:active { transform: scale(0.92); }

        .monitor-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .card-header-title {
            font-size: 0.92rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            border-bottom: 1.5px dashed var(--border);
            padding-bottom: 10px;
        }

        .online-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #dcfce7;
            color: #15803d;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
        }
        
        .offline-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            color: #64748b;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .dot-offline { background: #94a3b8; }

        .user-avatar {
            width: 42px;
            height: 42px;
            background: #000;
            color: var(--germany-gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
        }

        .user-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .user-box:hover { border-color: #000; }

        .session-table {
            width: 100%;
            margin: 0;
            font-size: 0.82rem;
            border-collapse: collapse;
        }
        .session-table th {
            background: #f1f5f9;
            padding: 10px;
            border: 1px solid var(--border);
            font-weight: 800;
            text-align: center;
            color: #475569;
        }
        .session-table td {
            padding: 10px;
            border: 1px solid var(--border);
            text-align: center;
            font-weight: 700;
            vertical-align: middle;
        }

        .empty-state { text-align: center; padding: 40px 10px; color: #64748b; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn" title="الرئيسية"><i class="fas fa-home"></i></a>
    <h6 class="m-0"><i class="fas fa-users-viewfinder text-warning me-1"></i> مراقبة المتصلين والجلسات</h6>
    <a href="sales-history.html" class="add-btn" title="سجل الفواتير"><i class="fas fa-history"></i></a>
</div>

<div class="container px-2 mt-3">
    <!-- قسم المتصلين الآن -->
    <div class="monitor-card">
        <div class="card-header-title">
            <span class="d-flex align-items-center gap-2">
                <i class="fas fa-wifi text-success"></i>
                <span>المتصلون بالسيستم الآن</span>
                <span class="badge bg-dark text-warning num px-2 py-1" id="onlineCount">0</span>
            </span>
            <span class="badge bg-danger" style="font-size: 0.65rem;">بث مباشر Live</span>
        </div>
        <div class="row g-2" id="onlineUsersContainer">
            <div class="empty-state w-100">
                <i class="fas fa-spinner fa-spin fa-2x mb-2"></i>
                <p class="fw-bold mb-0">جاري فحص المستخدمين المتصلين...</p>
            </div>
        </div>
    </div>

    <!-- قسم سجل الحركات والدخول -->
    <div class="monitor-card">
        <div class="card-header-title">
            <span class="d-flex align-items-center gap-2">
                <i class="fas fa-clock-rotate-left text-primary"></i>
                <span>سجل الدخول والخروج الأخير</span>
            </span>
            <button class="btn btn-sm btn-dark fw-bold px-3" onclick="loadSessionLogs()" style="border-radius: 8px; font-size: 0.75rem;">
                <i class="fas fa-sync-alt me-1"></i> تحديث السجل
            </button>
        </div>
        <div class="table-responsive">
            <table class="session-table table-hover">
                <thead>
                    <tr>
                        <th>المستخدم</th>
                        <th>الحدث</th>
                        <th>التاريخ والوقت</th>
                        <th>الجهاز / المنفذ</th>
                    </tr>
                </thead>
                <tbody id="sessionLogsBody">
                    <tr><td colspan="4" class="py-4 text-muted">جاري تحميل السجلات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // الاستماع المباشر المتواصل لحالة المستخدمين (Realtime Presence)
    function listenToOnlineUsers() {
        db.collection("users_status").onSnapshot(snapshot => {
            const container = document.getElementById('onlineUsersContainer');
            let html = '';
            let onlineCount = 0;

            if (snapshot.empty) {
                container.innerHTML = `
                    <div class="empty-state w-100">
                        <i class="fas fa-user-slash fa-2x mb-2"></i>
                        <p class="fw-bold mb-0">لا يوجد مستخدمون مسجلون حالياً.</p>
                    </div>`;
                document.getElementById('onlineCount').innerText = "0";
                return;
            }

            snapshot.forEach(doc => {
                const user = doc.data();
                const isOnline = user.isOnline === true;
                if (isOnline) onlineCount++;

                let lastSeenStr = 'الآن';
                if (user.lastSeen?.seconds) {
                    const d = new Date(user.lastSeen.seconds * 1000);
                    lastSeenStr = d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString('ar-EG');
                }

                const userName = user.userName || 'مستخدم غير معروف';
                const firstChar = userName.charAt(0);
                const sourceDevice = user.deviceInfo || 'متصفح ويب';

                html += `
                    <div class="col-md-4 col-sm-6">
                        <div class="user-box">
                            <div class="d-flex align-items-center gap-2">
                                <div class="user-avatar">${firstChar}</div>
                                <div>
                                    <div class="fw-bold text-dark" style="font-size:0.85rem;">${userName}</div>
                                    <small class="text-muted d-block" style="font-size:0.68rem;">
                                        <i class="far fa-clock me-1"></i>${lastSeenStr}
                                    </small>
                                </div>
                            </div>
                            <div>
                                ${isOnline 
                                    ? `<span class="online-pill"><span class="dot dot-online"></span> متصل</span>` 
                                    : `<span class="offline-pill"><span class="dot dot-offline"></span> غائب</span>`}
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('onlineCount').innerText = onlineCount;
            container.innerHTML = html;
        }, err => {
            console.error("خطأ البث المباشر:", err);
            document.getElementById('onlineUsersContainer').innerHTML = `
                <div class="text-center text-danger py-3 fw-bold">تعذر الاتصال بالسيرفر للمراقبة اللحظية.</div>
            `;
        });
    }

    // تحميل جدول السجلات التاريخية لعمليات الدخول والخروج
    async function loadSessionLogs() {
        const tbody = document.getElementById('sessionLogsBody');
        tbody.innerHTML = '<tr><td colspan="4" class="py-3 text-muted"><i class="fas fa-spinner fa-spin me-1"></i> جاري تحديث السجل...</td></tr>';
        
        try {
            const snapshot = await db.collection("user_sessions").orderBy("timestamp", "desc").limit(35).get();
            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-muted fw-bold">لا توجد حركات دخول أو خروج مسجلة مؤخراً.</td></tr>';
                return;
            }

            let rows = '';
            snapshot.forEach(doc => {
                const log = doc.data();
                
                let timeStr = 'غير محدد';
                if (log.timestamp?.seconds) {
                    const d = new Date(log.timestamp.seconds * 1000);
                    timeStr = d.toLocaleDateString('ar-EG') + ' | ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                }

                const actionBadge = (log.action === 'تسجيل دخول')
                    ? '<span class="badge bg-success px-2 py-1"><i class="fas fa-right-to-bracket me-1"></i> دخول</span>' 
                    : '<span class="badge bg-secondary px-2 py-1"><i class="fas fa-right-from-bracket me-1"></i> خروج</span>';

                rows += `
                    <tr>
                        <td class="fw-bold text-dark">${log.userName || 'أحمد محمود الزيادي'}</td>
                        <td>${actionBadge}</td>
                        <td class="num text-secondary" style="direction:ltr;">${timeStr}</td>
                        <td class="text-muted" style="font-size:0.75rem;">${log.device || 'تطبيق المحمول / المتصفح'}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = rows;
        } catch (err) {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="4" class="text-danger py-3 fw-bold">حدث خطأ أثناء تحميل سجل الجلسات.</td></tr>';
        }
    }

    // تشغيل الدواب والـ Listeners فور فتح الصفحة
    listenToOnlineUsers();
    loadSessionLogs();
</script>
</body>
</html>
