<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
    <script src="auth-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل طلبية جديدة - شركة الزيادي</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5e3d">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --accent: #0b5e3d;
  --bg-light: #f4f7f6;
  --text-primary: #1b2e26;
  --border: #dce3de;
}

body {
  background: var(--bg-light);
  font-family: 'Cairo', sans-serif;
  color: var(--text-primary);
  padding-bottom: 30px;
}

.header-nav {
  background: var(--accent);
  padding: 12px 16px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.card-box {
  background: white;
  border-radius: 12px;
  padding: 14px;
  margin: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}

.form-control, .form-select {
  font-family: 'Cairo', sans-serif;
  font-size: 0.85rem;
  border-radius: 8px;
  font-weight: 600;
}

.items-table {
  width: 100%;
  font-size: 0.8rem;
  margin-top: 10px;
}

.items-table th {
  border-bottom: 2px solid var(--border);
  padding: 6px;
  text-align: center;
}

.items-table td {
  padding: 6px 4px;
  border-bottom: 1px dashed var(--border);
  vertical-align: middle;
}

.action-btn-mini {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
}

.btn-share-item {
  background: #25d366;
  color: white;
}

.btn-del-item {
  background: #ffebee;
  color: #c62828;
}

.btn-share-table {
  background: linear-gradient(135deg, #25d366, #128c7e);
  color: white;
  border: none;
  border-radius: 8px;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.modal-content-custom {
  background: white;
  border-radius: 16px;
  padding: 24px 18px;
  text-align: center;
  width: 88%;
  max-width: 320px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.success-icon-wrap {
  width: 58px;
  height: 58px;
  background: #e8f5e9;
  color: #2e7d32;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  margin: 0 auto 12px;
}
</style>
</head>
<body>

<div class="header-nav">
  <a href="all-orders.html" class="nav-btn"><i class="fas fa-arrow-right"></i></a>
  <h6 class="m-0 fw-bold">تسجيل طلبية جديدة</h6>
  <a href="index.html" class="nav-btn"><i class="fas fa-home"></i></a>
</div>

<div class="card-box">
  <label class="form-label fw-bold mb-1" style="font-size:0.8rem;">اسم العميل / المورد</label>
  <input type="text" id="clientNameInput" class="form-control mb-3" placeholder="أدخل الاسم هنا...">

  <label class="form-label fw-bold mb-1" style="font-size:0.8rem;">تاريخ التسليم</label>
  <input type="date" id="deliveryDateInput" class="form-control mb-3">

  <hr style="border-color: var(--border);">

  <div class="row g-2 mb-2">
    <div class="col-6">
      <input type="text" id="itemNameInput" class="form-control" placeholder="اسم الصنف">
    </div>
    <div class="col-3">
      <input type="number" id="itemQtyInput" class="form-control text-center" placeholder="الكمية" value="1">
    </div>
    <div class="col-3">
      <input type="number" id="itemPriceInput" class="form-control text-center" placeholder="السعر">
    </div>
  </div>
  <button class="btn btn-success w-100 fw-bold py-2 mb-3" style="background: var(--accent);" onclick="addItemToTable()">
    <i class="fas fa-plus me-1"></i> إضافـة للجدول
  </button>

  <div class="d-flex justify-content-between align-items-center mb-1">
    <span class="fw-bold" style="font-size:0.85rem;">أصناف الطلبية</span>
    <button class="btn btn-sm btn-share-table fw-bold d-flex align-items-center gap-1" style="font-size:0.75rem; padding:5px 12px;" onclick="shareSavedOrderDirectly()">
      <i class="fas fa-share-alt"></i> مشاركة الطلبية
    </button>
  </div>

  <table class="items-table">
    <thead>
      <tr>
        <th style="text-align:right;">الصنف</th>
        <th style="width:40px;">الكمية</th>
        <th style="width:65px;">الإجمالي</th>
        <th style="width:65px;">إجراءات</th>
      </tr>
    </thead>
    <tbody id="itemsTableBody">
      <!-- يتم إدراج الأصناف هنا -->
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center mt-3 pt-2" style="border-top:2px solid var(--border);">
    <span class="fw-bold" style="font-size:0.9rem;">إجمالي الطلبية:</span>
    <span class="fw-extrabold text-success" id="orderGrandTotal" style="font-size:1.1rem;">0.00 ج.م</span>
  </div>
</div>

<div class="p-3">
  <button class="btn btn-success w-100 py-2.5 fw-bold" style="background: var(--accent); font-size: 0.95rem;" onclick="saveOrderToFirebase()">
    <i class="fas fa-save me-1"></i> تسجيـل الطلبيـة
  </button>
</div>

<!-- مودال النجاح بعد الحفظ مع زر المشاركة -->
<div class="modal-overlay" id="successModal">
  <div class="modal-content-custom">
    <div class="success-icon-wrap">
      <i class="fas fa-check"></i>
    </div>
    <h5 class="fw-bold mb-1" style="font-size:1rem; color:#1b2e26;">تم تسجيل الطلبية!</h5>
    <p class="text-muted" style="font-size:0.78rem; margin-bottom:16px;" id="successModalSubtext">تم حفظ طلبية العميل بنجاح</p>

    <div class="d-grid gap-2">
      <!-- زر المشاركة المباشرة داخل المودال -->
      <button type="button" class="btn btn-success fw-bold py-2 d-flex align-items-center justify-content-center gap-2" style="background: linear-gradient(135deg, #25d366, #128c7e); border:none; border-radius:10px; font-size:0.85rem;" onclick="shareSavedOrderDirectly()">
        <i class="fas fa-share-alt"></i> مشاركة الطلبية الآن
      </button>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-success w-100 fw-bold py-2" style="background:#0b5e3d; border-radius:10px; font-size:0.78rem;" onclick="window.location.href='all-orders.html'">
          <i class="fas fa-list-ul me-1"></i> كل الطلبات
        </button>
        <button type="button" class="btn btn-outline-success w-100 fw-bold py-2" style="border-radius:10px; font-size:0.78rem;" onclick="resetForm()">
          <i class="fas fa-plus me-1"></i> طلبية جديدة
        </button>
      </div>

      <button type="button" class="btn btn-light w-100 fw-bold py-2" style="border:1px solid #dce3de; border-radius:10px; font-size:0.78rem; color:#4a5568;" onclick="window.location.href='index.html'">
        <i class="fas fa-home me-1"></i> الرئيسية
      </button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentItems = [];

window.addItemToTable = function() {
  const name = document.getElementById('itemNameInput').value.trim();
  const qty = parseFloat(document.getElementById('itemQtyInput').value) || 0;
  const price = parseFloat(document.getElementById('itemPriceInput').value) || 0;

  if (!name || qty <= 0) {
    alert('برجاء إدخال اسم الصنف والكمية بشكل صحيح');
    return;
  }

  currentItems.push({ name, quantity: qty, price });
  
  document.getElementById('itemNameInput').value = '';
  document.getElementById('itemQtyInput').value = '1';
  document.getElementById('itemPriceInput').value = '';
  document.getElementById('itemNameInput').focus();

  renderItemsTable();
};

window.renderItemsTable = function() {
  const tbody = document.getElementById('itemsTableBody');
  let html = '';
  let grandTotal = 0;

  currentItems.forEach((item, index) => {
    const total = item.quantity * item.price;
    grandTotal += total;

    html += `
    <tr>
      <td style="text-align:right; font-weight:700;">${item.name}</td>
      <td style="text-align:center;">${item.quantity}</td>
      <td style="text-align:center;">${total.toFixed(2)}</td>
      <td style="text-align:center;">
        <div class="d-flex justify-content-center gap-1">
          <button class="action-btn-mini btn-share-item" onclick="shareItemDirect(${index})" title="مشاركة الصنف">
            <i class="fas fa-share-alt"></i>
          </button>
          <button class="action-btn-mini btn-del-item" onclick="removeItem(${index})" title="حذف">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </td>
    </tr>`;
  });

  tbody.innerHTML = html || `<tr><td colspan="4" class="text-center text-muted py-3">لا توجد أصناف مضافة حتى الآن</td></tr>`;
  document.getElementById('orderGrandTotal').innerText = `${grandTotal.toFixed(2)} ج.م`;
};

window.removeItem = function(index) {
  currentItems.splice(index, 1);
  renderItemsTable();
};

window.shareItemDirect = function(index) {
  const item = currentItems[index];
  if (!item) return;

  const clientName = document.getElementById('clientNameInput').value.trim() || 'عميل';
  const total = item.quantity * item.price;

  const text = `شركة الزيادي لزيوت وفلاتر السيارات\n` +
               `تفاصيل صنف من طلبية (${clientName}):\n` +
               `📦 الصنف: ${item.name}\n` +
               `🔢 الكمية: ${item.quantity}\n` +
               `💰 السعر: ${item.price.toFixed(2)} ج.م\n` +
               `💵 الإجمالي: ${total.toFixed(2)} ج.م`;

  if (navigator.share) {
    navigator.share({ title: `صنف ${item.name}`, text: text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => alert('تم نسخ بيانات الصنف!'));
  }
};

window.shareSavedOrderDirectly = function() {
  const clientName = document.getElementById('clientNameInput')?.value.trim() || 'العميل';

  if (!currentItems || currentItems.length === 0) {
    alert('لا توجد أصناف لمشاركتها');
    return;
  }

  let itemsDetails = '';
  let grandTotal = 0;

  currentItems.forEach((item, index) => {
    const total = (item.quantity || 0) * (item.price || 0);
    grandTotal += total;
    itemsDetails += `${index + 1}. ${item.name} | العدد: ${item.quantity} | الإجمالي: ${total.toFixed(2)} ج.م\n`;
  });

  const shareMessage = `شركة الزيادي لزيوت وفلاتر السيارات\n` +
                       `تفاصيل طلبية: ${clientName}\n` +
                       `-----------------------------------\n` +
                       `${itemsDetails}` +
                       `-----------------------------------\n` +
                       `💰 إجمالي الطلبية: ${grandTotal.toFixed(2)} ج.م`;

  if (navigator.share) {
    navigator.share({
      title: `طلبية ${clientName}`,
      text: shareMessage
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(shareMessage).then(() => {
      alert('تم نسخ تفاصيل الطلبية بنجاح!');
    });
  }
};

window.saveOrderToFirebase = async function() {
  const clientName = document.getElementById('clientNameInput').value.trim();
  const date = document.getElementById('deliveryDateInput').value;

  if (!clientName) {
    alert('برجاء إدخال اسم العميل/المورد');
    return;
  }
  if (currentItems.length === 0) {
    alert('برجاء إضافه صنف واحد على الأقل للجدول');
    return;
  }

  const grandTotal = currentItems.reduce((acc, i) => acc + (i.quantity * i.price), 0);

  try {
    await addDoc(collection(db, 'orders'), {
      customerName: clientName,
      date: date || new Date().toISOString().split('T')[0],
      items: currentItems,
      total: grandTotal,
      status: 'pending',
      createdAt: new Date()
    });

    document.getElementById('successModalSubtext').innerText = `تم حفظ طلبية العميل ${clientName} بنجاح`;
    document.getElementById('successModal').style.display = 'flex';
  } catch (e) {
    console.error(e);
    alert('حدث خطأ أثناء حفظ الطلبية');
  }
};

window.resetForm = function() {
  currentItems = [];
  document.getElementById('clientNameInput').value = '';
  document.getElementById('deliveryDateInput').value = '';
  renderItemsTable();
  document.getElementById('successModal').style.display = 'none';
};

renderItemsTable();
</script>
</body>
</html>
