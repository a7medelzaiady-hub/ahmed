<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حركة الصنف والسيارة — شركة الزيادي</title>
    
    <!-- PWA settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --header-bg: linear-gradient(135deg, #07472e 0%, #0b5e3d 100%);
            --bg-light: #eef3f0;
            --text-primary: #0f172a;
            --brand-d: #0a4a31;
            --border-color: #cbd5e1;
            --shadow-3d: 0 10px 20px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.03);
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 30px;
        }
        
        .header-section { 
            padding: 0 16px; 
            height: 65px;
            background: var(--header-bg); 
            color: white;
            box-shadow: 0 6px 18px rgba(7, 71, 46, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 20px 20px;
        }
        .header-container { height: 100%; display: flex; justify-content: space-between; align-items: center; }

        .btn-action { 
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff; transition: all 0.2s; 
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
        }
        .btn-action:active { transform: scale(0.92); }

        .main-container {
            padding: 16px 10px;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
        }

        .filter-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow-3d);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 16px;
        }

        .search-input {
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            padding: 10px 14px;
            font-size: 0.95rem;
            font-weight: 700;
        }
        .search-input:focus { border-color: #0b5e3d; box-shadow: 0 0 0 3px rgba(11,94,61,0.1); }

        .stat-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-3d);
            height: 100%;
        }
        .stat-card .lbl { font-size: 0.72rem; font-weight: 700; color: #64748b; margin-bottom: 4px; }
        .stat-card .val { font-size: 0.9rem; font-weight: 800; color: #0f172a; line-height: 1.2; }

        .stat-card.highlight { background: #0b5e3d; color: white; border-color: #07472e; }
        .stat-card.highlight .lbl { color: rgba(255,255,255,0.8); }
        .stat-card.highlight .val { color: #facc15; }

        .table-custom {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-3d);
            border: 1px solid var(--border-color);
        }
        .table-custom th {
            background: #0b5e3d;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 12px 6px;
            text-align: center;
            white-space: nowrap;
        }
        .table-custom td {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 10px 6px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
        }

        .empty-box {
            text-align: center;
            padding: 30px 15px;
            color: #64748b;
            font-weight: 700;
        }

        .spin-loader {
            width: 32px; height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #0b5e3d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section">
        <div class="header-container container">
            <a href="reports.html" class="btn-action" title="رجوع">
                <i class="fas fa-arrow-right fs-5"></i>
            </a>
            <div class="title-area text-center flex-grow-1">
                <h5 class="fw-bold m-0" style="font-size: 1.15rem; font-weight: 800;">حركة الصنف والسيارة</h5>
            </div>
            <button class="btn-action" onclick="loadDataAndRender()" title="تحديث">
                <i class="fas fa-sync-alt fs-5"></i>
            </button>
        </div>
    </div>

    <div class="main-container container">
        
        <!-- Filter Controls -->
        <div class="filter-card">
            <div class="row g-2">
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold small text-secondary mb-1"><i class="fas fa-search me-1"></i>اسم الصنف / الباركود</label>
                    <input type="text" id="searchInput" class="form-control search-input" placeholder="اكتب اسم الصنف للبحث الفوري..." autocomplete="off">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold small text-secondary mb-1"><i class="fas fa-calendar-alt me-1"></i>التاريخ (فارغ = تراكمي من أول المدة حتى اليوم)</label>
                    <div class="input-group">
                        <input type="date" id="dateInput" class="form-control search-input">
                        <button class="btn btn-outline-secondary border-secondary-subtle" type="button" id="clearDateBtn" title="مسح التاريخ">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row g-2 mb-3" id="statsContainer">
            <!-- الكروت الإحصائية تُبنى ديناميكياً بواسطة JavaScript -->
        </div>

        <!-- Details Table -->
        <div class="table-responsive table-custom">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>التاريخ / الفترة</th>
                        <th style="text-align: right; padding-right: 12px;">اسم الصنف</th>
                        <th>المشتريات</th>
                        <th>قبل التحميل</th>
                        <th>تم تحميله بالسيارة</th>
                        <th>المبيعات</th>
                        <th>المرتجعات</th>
                        <th style="background: #07472e;">المتبقي بالسيارة</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="8"><div class="spin-loader"></div><div class="text-center text-muted fw-bold small">جاري تجميع حركات المخزن وشاشة تحميل السيارة...</div></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

    let allInventory = [];
    let salesData = [];
    let purchasesData = [];
    let loadDataMap = {}; // خريطة جلب حمولات السيارة المسجلة من شاشة التحميل

    function parseDate(df, ts) {
        if (df) {
            let m = String(df).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        }
        if (ts?.seconds) return new Date(ts.seconds * 1000).toISOString().slice(0, 10);
        return "";
    }

    function formatQuantityDetailed(totalPcs, capacity, unit = 'جركن') {
        totalPcs = parseInt(totalPcs) || 0;
        capacity = parseInt(capacity) || 1;
        if (totalPcs === 0) return `0 ${unit}`;
        const isNegative = totalPcs < 0;
        const absPcs = Math.abs(totalPcs);
        
        let result = '';
        if (capacity <= 1) {
            result = `${absPcs} ${unit}`;
        } else {
            const cartons = Math.floor(absPcs / capacity);
            const loose = absPcs % capacity;
            if (cartons > 0 && loose > 0) result = `${cartons} ك و ${loose} ${unit}`;
            else if (cartons > 0) result = `${cartons} كرتونة`;
            else result = `${loose} ${unit}`;
        }
        return isNegative ? `-${result}` : result;
    }

    async function loadDataAndRender() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<tr><td colspan="8"><div class="spin-loader"></div><div class="text-center text-muted fw-bold small">جاري ربط بيانات شاشة التحميل والحركات...</div></td></tr>`;

        try {
            const [inventorySnap, invoicesSnap, supplierSnap, archiveSnap] = await Promise.all([
                getDocs(collection(db, "inventory")),
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions")),
                getDocs(collection(db, "archived_loads"))
            ]);

            allInventory = [];
            inventorySnap.forEach(d => {
                const data = d.data();
                if (!data.isDeleted) {
                    allInventory.push({
                        id: d.id,
                        name: data.name || 'بدون اسم',
                        barcode: data.barcode || '',
                        unitFactor: Math.max(1, Number(data.unitFactor || data.factor || data.pcsPerCarton) || 1),
                        unitName: data.unitName || data.unit || 'جركن',
                        openingPcs: Number(data.openingTotalPcs || data.openingQty || 0)
                    });
                }
            });

            // جلب مبيعات اليوم ومرتجعاتها
            salesData = [];
            invoicesSnap.forEach(doc => {
                const inv = doc.data();
                if (inv.isDeleted) return;
                const dStr = parseDate(inv.date, inv.timestamp);
                inv.items?.forEach(item => {
                    salesData.push({
                        date: dStr,
                        stockId: item.stockId,
                        name: item.name?.trim(),
                        qty: Number(item.qty) || 0,
                        isCarton: (item.unit === 'box' || item.isCarton === true),
                        isReturn: !!item.isReturn
                    });
                });
            });

            // جلب المشتريات
            purchasesData = [];
            supplierSnap.forEach(doc => {
                const sup = doc.data();
                const dStr = parseDate(sup.date, sup.timestamp);
                sup.items?.forEach(item => {
                    const isReturn = Number(item.returnQty) > 0 || item.isReturn === true;
                    purchasesData.push({
                        date: dStr,
                        stockId: item.stockId,
                        name: item.name?.trim(),
                        qty: isReturn ? Number(item.returnQty || item.qty) : Number(item.qty),
                        isCarton: (item.unitName === 'كرتونة' || item.isCarton !== false),
                        isReturn: isReturn
                    });
                });
            });

            // قراءة حركات شاشة تحميل السيارة المسجلة والمؤرشفة بنفس هيكلية (cartItems / loadedInSession)
            loadDataMap = {};
            archiveSnap.forEach(doc => {
                const dStr = doc.id;
                const data = doc.data();
                const cart = data.cartItems || {};
                const sess = data.loadedInSession || {};
                
                Object.keys(cart).forEach(itemId => {
                    if (!loadDataMap[itemId]) loadDataMap[itemId] = {};
                    const cap = Number(cart[itemId].capacity) || 1;
                    
                    const c = sess[itemId] ? Number(sess[itemId].cartons || 0) : Number(cart[itemId].loadedCartons || 0);
                    const l = sess[itemId] ? Number(sess[itemId].loose || 0) : Number(cart[itemId].loadedLoose || 0);
                    
                    loadDataMap[itemId][dStr] = (c * cap) + l;
                });
            });

            renderReport();

        } catch (e) {
            console.error(e);
            tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4 fw-bold">❌ حدث خطأ أثناء الاتصال بسجلات التحميل والقواعد</td></tr>`;
        }
    }

    function renderReport() {
        const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
        const selectedDate = document.getElementById('dateInput').value;
        const tableBody = document.getElementById('tableBody');

        let rowsHTML = "";
        let totalPurchasesAll = 0;
        let totalPreLoadingAll = 0;
        let totalLoadedAll = 0;
        let totalSalesAll = 0;
        let totalReturnsAll = 0;

        const filteredItems = allInventory.filter(item => 
            (item.name && item.name.toLowerCase().includes(searchVal)) ||
            (item.barcode && String(item.barcode).includes(searchVal))
        );

        if (filteredItems.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="8" class="empty-box"><i class="fas fa-folder-open fs-3 d-block mb-2"></i>لا توجد أصناف مطابقة للبحث</td></tr>`;
            renderCards(0, 0, 0, 0, 0, 0);
            return;
        }

        filteredItems.forEach(item => {
            const cap = item.unitFactor;
            
            let itemPurchases = 0;
            let itemSales = 0;
            let itemReturns = 0;
            let itemPreLoading = 0;
            let itemLoaded = 0;

            if (!selectedDate) {
                // === الحالة 1: عدم تحديد تاريخ (السجل التراكمي الشامل) ===
                itemPurchases = purchasesData
                    .filter(p => p.stockId === item.id || p.name === item.name)
                    .reduce((sum, p) => sum + (p.isReturn ? -(p.qty * (p.isCarton ? cap : 1)) : (p.qty * (p.isCarton ? cap : 1))), 0);

                salesData
                    .filter(s => s.stockId === item.id || s.name === item.name)
                    .forEach(s => {
                        const pcs = s.qty * (s.isCarton ? cap : 1);
                        if (s.isReturn) itemReturns += pcs;
                        else itemSales += pcs;
                    });

                itemPreLoading = item.openingPcs;

                // إجمالي ما تم تحميله في ملف/شاشة تحميل السيارة عبر كل التواريخ
                if (loadDataMap[item.id]) {
                    Object.values(loadDataMap[item.id]).forEach(v => itemLoaded += v);
                }

            } else {
                // === الحالة 2: تاريخ محدد (يعتمد كلياً على سجلات شاشة تحميل العربية لهذا اليوم) ===
                
                // مشتريات ومبيعات اليوم المحدد فقط
                itemPurchases = purchasesData
                    .filter(p => (p.stockId === item.id || p.name === item.name) && p.date === selectedDate)
                    .reduce((sum, p) => sum + (p.isReturn ? -(p.qty * (p.isCarton ? cap : 1)) : (p.qty * (p.isCarton ? cap : 1))), 0);

                salesData
                    .filter(s => (s.stockId === item.id || s.name === item.name) && s.date === selectedDate)
                    .forEach(s => {
                        const pcs = s.qty * (s.isCarton ? cap : 1);
                        if (s.isReturn) itemReturns += pcs;
                        else itemSales += pcs;
                    });

                // كمية التحميل المسجلة في شاشة تحميل العربية الخاصة بهذا اليوم المحدد
                itemLoaded = loadDataMap[item.id]?.[selectedDate] || 0;

                // "قبل التحميل": الرصيد التراكمي للسيارة المتبقي من الأيام السابقة قبل هذا التاريخ
                let pastLoaded = 0;
                let pastSales = 0;
                let pastReturns = 0;

                if (loadDataMap[item.id]) {
                    Object.keys(loadDataMap[item.id]).forEach(d => {
                        if (d < selectedDate) pastLoaded += loadDataMap[item.id][d];
                    });
                }

                salesData
                    .filter(s => (s.stockId === item.id || s.name === item.name) && s.date && s.date < selectedDate)
                    .forEach(s => {
                        const pcs = s.qty * (s.isCarton ? cap : 1);
                        if (s.isReturn) pastReturns += pcs;
                        else pastSales += pcs;
                    });

                itemPreLoading = pastLoaded - pastSales + pastReturns;
            }

            // المتبقي في السيارة
            let itemRemainingInCar = selectedDate ? (itemPreLoading + itemLoaded - itemSales + itemReturns) : (itemLoaded - itemSales + itemReturns);

            totalPurchasesAll += itemPurchases;
            totalPreLoadingAll += itemPreLoading;
            totalLoadedAll += itemLoaded;
            totalSalesAll += itemSales;
            totalReturnsAll += itemReturns;

            const dateBadgeLabel = selectedDate ? selectedDate : 'تراكمي (أول المدة حتى اليوم)';

            rowsHTML += `
                <tr>
                    <td><span class="badge bg-light text-dark border">${dateBadgeLabel}</span></td>
                    <td style="text-align: right; padding-right: 12px; font-weight: 800; color: #0a4a31;">${item.name}</td>
                    <td class="text-primary">${formatQuantityDetailed(itemPurchases, cap, item.unitName)}</td>
                    <td class="text-secondary">${formatQuantityDetailed(itemPreLoading, cap, item.unitName)}</td>
                    <td class="text-info fw-bold">${formatQuantityDetailed(itemLoaded, cap, item.unitName)}</td>
                    <td class="text-success">${formatQuantityDetailed(itemSales, cap, item.unitName)}</td>
                    <td class="text-warning">${formatQuantityDetailed(itemReturns, cap, item.unitName)}</td>
                    <td style="background: #f0fdf4; color: #0b5e3d; font-weight: 800;">${formatQuantityDetailed(itemRemainingInCar, cap, item.unitName)}</td>
                </tr>
            `;
        });

        const totalRemainingAll = selectedDate ? (totalPreLoadingAll + totalLoadedAll - totalSalesAll + totalReturnsAll) : (totalLoadedAll - totalSalesAll + totalReturnsAll);

        renderCards(totalPurchasesAll, totalPreLoadingAll, totalLoadedAll, totalSalesAll, totalReturnsAll, totalRemainingAll);
        tableBody.innerHTML = rowsHTML;
    }

    function renderCards(pur, pre, load, sale, ret, rem) {
        const statsContainer = document.getElementById('statsContainer');
        statsContainer.innerHTML = `
            <div class="col-4 col-md-2">
                <div class="stat-card">
                    <div class="lbl">المشتريات</div>
                    <div class="val text-primary">${pur}</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card">
                    <div class="lbl">قبل التحميل</div>
                    <div class="val text-secondary">${pre}</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card">
                    <div class="lbl">تم تحميله بالسيارة</div>
                    <div class="val text-info">${load}</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card">
                    <div class="lbl">المبيعات</div>
                    <div class="val text-success">${sale}</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card">
                    <div class="lbl">المرتجعات</div>
                    <div class="val text-warning">${ret}</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card highlight">
                    <div class="lbl">المتبقي بالسيارة</div>
                    <div class="val">${rem}</div>
                </div>
            </div>
        `;
    }

    document.getElementById('searchInput').addEventListener('input', renderReport);
    document.getElementById('dateInput').addEventListener('change', renderReport);
    document.getElementById('clearDateBtn').addEventListener('click', () => {
        document.getElementById('dateInput').value = '';
        renderReport();
    });

    window.loadDataAndRender = loadDataAndRender;

    loadDataAndRender();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(err => console.log(err));
}
</script>
</body>
</html>
