<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الطلبات</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

body{
    font-family:'Cairo';
    background:#f4f7f6;
}

.header{
    background:#0b5e3d;
    color:#fff;
    padding:18px;
    font-size:22px;
    font-weight:bold;
    text-align:center;
}

.box{
    background:#fff;
    border-radius:20px;
    padding:25px;
    margin-top:25px;
    border:1px solid #dce3de;
    text-align:center;
    transition:0.3s;
    cursor:pointer;
}

.box:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.icon{
    font-size:45px;
    margin-bottom:15px;
}

.title{
    font-size:22px;
    font-weight:700;
    color:#0b5e3d;
}

.desc{
    color:#666;
    margin-top:8px;
}

.home-btn{
    position:fixed;
    bottom:20px;
    left:20px;
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:#0b5e3d;
    color:#fff;
    font-size:22px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<div class="header">
    📦 إدارة طلبات العملاء
</div>

<div class="container">

    <!-- طلب جديد -->

<div class="box"
     onclick="window.location.href='customer-orders.html'">
        <div class="icon">🧾</div>

        <div class="title">
            طلب جديد
        </div>

        <div class="desc">
            إنشاء طلب عميل جديد
        </div>

    </div>

    <!-- كل الطلبات -->

    <div class="box"
         onclick="window.location.href='all-orders.html'">

        <div class="icon">📋</div>

        <div class="title">
            كل الطلبات
        </div>

        <div class="desc">
            عرض وإدارة الطلبات
        </div>

    </div>

</div>

<!-- زر الرئيسية -->

<button class="home-btn"
onclick="window.location.href='index1.html'">

🏠

</button>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
</html>
