<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادى | إدارة الجلسات والمستخدمين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #0E8F5B;
            --brand-mid: #12A06B;
            --brand-dark: #075E3D;
            --brand-tint: #E6F7EF;
            --coral: #DC2626;
            --coral-tint: #FEE2E2;
            --amber: #D97706;
            --amber-tint: #FEF3C7;
            --surface: #F3FAF7;
            --card-bg: #FFFFFF;
            --text-deep: #0F2A1E;
            --text-mid: #5B6B63;
            --border-subtle: #DFEFE7;
            --shadow-sm: 0 4px 14px rgba(7, 94, 61, 0.07);
            --shadow-md: 0 10px 26px rgba(7, 94, 61, 0.11);
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--surface);
            color: var(--text-deep);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .header {
            background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand) 100%);
            padding: 0 16px;
            height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-md);
            position: sticky; top: 0; z-index: 100;
        }
        .header-title { font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
        .btn-back {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
            color: #fff; width: 38px; height: 38px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none;
        }

        .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }

        .info-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between;
        }
        .info-card .text h3 { font-size: 14px; font-weight: 800; color: var(--brand-dark); }
        .info-card .text p { font-size: 12px; color: var(--text-mid); margin-top: 2px; }
        .active-count {
            background: var(--brand-tint); color: var(--brand);
            padding: 6px 14px; border-radius: 20px; font-weight: 900; font-size: 14px;
        }

        .sessions-list { display: flex; flex-direction: column; gap: 12px; }

        .session-item {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s;
        }
        .session-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 48px; height: 48px; border-radius: 14px;
            background: var(--brand-tint); color: var(--brand);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; flex-shrink: 0;
        }
        .user-details h4 { font-size: 14px; font-weight: 800; color: var(--text-deep); }
        .user-details .role-badge {
            display: inline-block; font-size: 10px; font-weight: 700;
            padding: 2px 8px; border-radius: 6px; margin-top: 4px;
        }
        .role-admin { background: var(--amber-tint); color: var(--amber); }
        .role-employee { background: var(--brand-tint); color: var(--brand); }

        .session-meta { font-size: 11px; color: var(--text-mid); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; display: inline-block; }

        .btn-kick {
            background: var(--coral-tint);
            color: var(--coral);
            border: none;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .btn-kick:hover { background: var(--coral); color: #fff; }

        .empty-state {
            text-align: center; padding: 40px 20px; background: var(--card-bg);
            border-radius: var(--radius-md); border: 1px solid var(--border-subtle);
            color: var(--text-mid); font-weight: 700;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-title"><i class="fa-solid fa-users-gear"></i> إدارة الجلسات النشطة</div>
    <a href="index1.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i></a>
</header>

<div class="container">
    <div class="info-card">
        <div class="text">
            <h3>المستخدمين المتصلين حالياً</h3>
            <p>مراقبة الأجهزة المفتوحة والتحكم في صلاحية الدخول</p>
        </div>
        <div class="active-count" id="activeCountBadge">0</div>
    </div>

    <div class="sessions-list" id="sessionsContainer">
        <div class="empty-state">جاري تحميل الجلسات النشطة...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }

    const sessionsContainer = document.getElementById('sessionsContainer');
    const activeCountBadge = document.getElementById('activeCountBadge');

    // استماع لحظي للجلسات مع فلترة الأجهزة النشطة فقط خلال آخر دقيقتين
    onSnapshot(collection(db, "sessions"), (snapshot) => {
        sessionsContainer.innerHTML = '';
        let activeCount = 0;
        let docsArray = [];
        const now = new Date();

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            
            // التحقق من أن الجهاز يرسل نبضات نشاط خلال آخر 120 ثانية (دقيقتين)
            if (data.lastActive && data.lastActive.toDate) {
                const diffSeconds = (now - data.lastActive.toDate()) / 1000;
                if (diffSeconds > 120) return; // استبعاد الجلسات غير المتصلة حالياً
            }

            if (data.status === 'active') {
                docsArray.push({ id: docSnap.id, ...data });
            }
        });

        if (docsArray.length === 0) {
            sessionsContainer.innerHTML = `<div class="empty-state">لا توجد جلسات نشطة حالياً</div>`;
            activeCountBadge.textContent = '0';
            return;
        }

        docsArray.forEach(data => {
            activeCount++;
            const userName = data.userName || 'مستخدم غير معروف';
            const userRole = data.role === 'admin' ? 'مدير النظام' : 'موظف / مستخدم';
            const roleClass = data.role === 'admin' ? 'role-admin' : 'role-employee';

            const item = document.createElement('div');
            item.className = 'session-item';
            item.innerHTML = `
                <div class="session-info">
                    <div class="user-avatar">${userName.charAt(0).toUpperCase()}</div>
                    <div class="user-details">
                        <h4>${userName}</h4>
                        <span class="role-badge ${roleClass}">${userRole}</span>
                        <div class="session-meta">
                            <span class="status-dot"></span>
                            <span>متصل الآن</span>
                        </div>
                    </div>
                </div>
                <button class="btn-kick" onclick="window.terminateSession('${data.id}')">
                    <i class="fa-solid fa-power-off"></i> إنهاء الجلسة وطرد
                </button>
            `;
            sessionsContainer.appendChild(item);
        });

        activeCountBadge.textContent = activeCount;
    }, (error) => {
        console.error("Error fetching sessions:", error);
        sessionsContainer.innerHTML = `<div class="empty-state">حدث خطأ أثناء جلب الجلسات</div>`;
    });

    // دالة طرد المستخدم باستخدام المعرف الصحيح للمستند
    window.terminateSession = async function(docId) {
        if (confirm('هل أنت متأكد من رغبتك في طرد هذا المستخدم وإنهاء جلسته فوراً؟')) {
            try {
                await updateDoc(doc(db, "sessions", docId), {
                    status: 'kicked'
                });
                alert('تم طرد المستخدم بنجاح.');
            } catch (err) {
                console.error("Error kicking user:", err);
                alert('فشل في تنفيذ عملية الطرد. تأكد من قواعد الأمان في Firebase.');
            }
        }
    };
</script>

</body>
</html>
