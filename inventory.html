<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادى | الأصناف والمخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg: #f4f7f5;
            --card: #ffffff;
            --accent: #0b5e3d;
            --text: #1e293b;
            --sub: #64748b;
            --danger: #e11d48;
            --success: #16a34a;
            --gold: #d97706;
            --border: #e2e8f0;
            --r: 20px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 40px; direction: rtl; }

        header {
            background: var(--accent); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 0 0 25px 25px;
        }
        .h-title { font-size: 16px; font-weight: 800; color: #fff; }
        .back-btn { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; padding: 8px 14px; text-decoration: none; font-size: 13px; font-weight: 700; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; max-width: 700px; margin: 0 auto; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 12px; text-align: center; }
        .stat-num { font-size: 28px; font-weight: 900; }
        .stat-lbl { font-size: 12px; color: var(--sub); font-weight: 700; }

        .search-wrap { max-width: 700px; margin: 4px auto 0; padding: 0 16px; }
        .search-inner { background: var(--card); border: 1.5px solid var(--border); border-radius: 30px; padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
        .search-inner input { border: none; background: transparent; width: 100%; font-family: 'Cairo', sans-serif; outline: none; text-align: right; }

        .list-wrap { max-width: 700px; margin: 16px auto 0; padding: 0 16px; }
        #listBody { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }

        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
        .row-name { font-size: 12px; font-weight: 700; color: #0f172a; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-card { background: var(--card); width: 100%; max-width: 550px; border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; }
        .modal-header { background: var(--accent); color: #fff; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
        .modal-body { padding: 16px; overflow-y: auto; background: #f8fafc; }

        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .tx-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; }
        .tx-type { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; color: #fff; }
        .tx-type.sale { background: var(--success); }
        .tx-type.purchase { background: #0284c7; }
        .tx-type.opening { background: var(--sub); }
        .tx-type.return { background: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="h-title">شركة الزيادى | الأصناف والمخزون</div>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> الرئيسية</a>
</header>

<div class="stats">
    <div class="stat"><div class="stat-num" id="sTotal">—</div><div class="stat-lbl">إجمالي الأصناف</div></div>
    <div class="stat"><div class="stat-num" id="sOk">—</div><div class="stat-lbl">متوفر</div></div>
</div>

<div class="search-wrap">
    <div class="search-inner">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ابحث بالاسم..." oninput="renderList()">
    </div>
</div>

<div class="list-wrap">
    <div id="listBody"></div>
</div>

<div class="modal-overlay" id="historyModal" onclick="closeHistoryModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h4 id="modalItemName">كشف حركة الصنف</h4>
            <button style="background:none; border:none; color:white;" onclick="closeHistoryModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

    let allItems = [];

    onSnapshot(collection(db, "inventory"), snap => {
        allItems = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.isDeleted !== true) allItems.push({ id: d.id, ...data });
        });
        document.getElementById('sTotal').textContent = allItems.length;
        renderList();
    });

    window.renderList = function() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        const list = term ? allItems.filter(i => (i.name||'').toLowerCase().includes(term)) : allItems;
        const listBody = document.getElementById('listBody');

        listBody.innerHTML = list.map(item => `
            <div class="item-card" onclick="showItemHistory('${item.id}', '${item.name}')">
                <div class="row-name">${item.name}</div>
                <div style="font-size:11px; color:#64748b;">المتاح: <b>${item.totalPcs || 0}</b> قطعة</div>
            </div>
        `).join('');
    };

    window.showItemHistory = async function(itemId, itemName) {
        const modal = document.getElementById('historyModal');
        const modalTitle = document.getElementById('modalItemName');
        const modalBody = document.getElementById('modalBody');

        modalTitle.innerText = `حركة الصنف: ${itemName}`;
        modalBody.innerHTML = `<div class="text-center py-4"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الحركات...</div>`;
        modal.style.display = 'flex';

        try {
            const qTrans = query(
                collection(db, "inventory_transactions"),
                where("productId", "==", itemId)
            );
            const querySnapshot = await getDocs(qTrans);
            
            let transactions = [];
            querySnapshot.forEach(docSnap => {
                transactions.push({ id: docSnap.id, ...docSnap.data() });
            });

            if (transactions.length === 0) {
                modalBody.innerHTML = `<div class="text-center py-4 text-muted">لا توجد حركات مسجلة لهذا الصنف بعد.</div>`;
                return;
            }

            transactions.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

            let html = '<div class="history-list">';
            transactions.forEach(tx => {
                let badgeClass = 'sale', typeText = 'بيع', sign = '-';

                if (tx.type === 'purchase') { badgeClass = 'purchase'; typeText = 'شراء'; sign = '+'; }
                else if (tx.type === 'opening_balance') { badgeClass = 'opening'; typeText = 'رصيد افتتاحي'; sign = '+'; }
                else if (tx.type === 'purchase_return' || tx.type === 'sale_return') { badgeClass = 'return'; typeText = 'مرتجع'; sign = tx.type === 'sale_return' ? '+' : '-'; }

                const entityName = tx.customerName || tx.supplierName || 'عملية عامة';

                html += `
                    <div class="tx-item">
                        <span class="tx-type ${badgeClass}">${typeText}</span>
                        <div style="flex:1; margin: 0 10px;">
                            <div style="font-size:12px; font-weight:700;">${entityName}</div>
                            <div style="font-size:10px; color:#94a3b8;">${tx.date || 'بدون تاريخ'}</div>
                        </div>
                        <div style="font-weight:900; direction:ltr;">${sign}${tx.quantityPcs} قطعة</div>
                    </div>`;
            });
            html += '</div>';

            modalBody.innerHTML = html;

        } catch (err) {
            console.error("خطأ قراءة الحركة:", err);
            modalBody.innerHTML = `<div class="text-danger text-center">حدث خطأ أثناء تحميل الحركات: ${err.message}</div>`;
        }
    };

    window.closeHistoryModal = () => document.getElementById('historyModal').style.display = 'none';
</script>
</body>
</html>
