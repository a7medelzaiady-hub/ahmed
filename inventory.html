<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادى | الأصناف والمخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --accent: #0f172a;
            --header: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --text: #0f172a;
            --sub: #64748b;
            --danger: #ef4444;
            --success: #16a34a;
            --gold: #f59e0b;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            --r: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; direction: rtl; }
        .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
        header { background: var(--header); padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.12); border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; border-bottom: 3px solid var(--gold); gap: 10px; }
        .header-center { text-align: center; }
        .header-left-btn { display: flex; justify-content: flex-end; gap: 6px; }
        .h-title { font-size: 15px; font-weight: 900; color: #fff; line-height: 1.2; }
        .h-title span { color: var(--gold); }
        .h-sub { font-size: 10.5px; color: rgba(255,255,255,0.8); font-weight: 600; margin-top: 2px; }
        .back-btn, .pdf-btn, .quick-btn { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 7px 11px; font-family: 'Cairo', sans-serif; font-size: 11.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; white-space: nowrap; transition: all 0.2s; }
        .pdf-btn { background: #d97706; border-color: transparent; }
        .pdf-btn:hover { background: #b45309; }
        .quick-btn { background: #0284c7; border-color: transparent; }
        .quick-btn:hover { background: #0369a1; }
        .back-btn:active, .pdf-btn:active, .quick-btn:active { transform: scale(0.95); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px; max-width: 700px; margin: 0 auto; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .stat::after { content:''; position:absolute; bottom:0; left:0; right:0; height:4px; }
        .stat.s-total::after { background: var(--accent); }
        .stat.s-ok::after    { background: var(--success); }
        .stat.s-low::after   { background: var(--gold); }
        .stat.s-zero::after  { background: var(--danger); }
        .stat-num { font-size: 24px; font-weight: 900; line-height: 1.1; }
        .stat-lbl { font-size: 11px; color: var(--sub); font-weight: 700; margin-top: 4px; }
        .stat.s-total .stat-num { color: var(--accent); }
        .stat.s-ok    .stat-num { color: var(--success); }
        .stat.s-low   .stat-num { color: var(--gold); }
        .stat.s-zero  .stat-num { color: var(--danger); }
        .search-wrap { max-width: 700px; margin: 0 auto; padding: 0 16px; }
        .search-inner { background: var(--card); border: 1.5px solid var(--border); border-radius: 25px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }
        .search-inner:focus-within { border-color: var(--accent); }
        .search-inner input { border: none; background: transparent; width: 100%; font-family: 'Cairo', sans-serif; font-size: 13.5px; color: var(--text); outline: none; text-align: right; font-weight: 700; }
        .list-wrap { max-width: 700px; margin: 14px auto 0; padding: 0 16px; }
        .list-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
        .list-head { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .list-head h3 { font-size: 13.5px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }
        .count-badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 10px; border-radius: 12px; }
        #listBody { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
        #listBody.full-width { display: block; padding: 0; }
        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; transition: transform 0.15s ease-in-out; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .item-card:active { transform: scale(0.97); background: #f8fafc; }
        .item-card.zero-row { background: #fef2f2; border-color: #fecaca; }
        .item-card.low-row  { background: #fffbeb; border-color: #fde68a; }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
        .row-info { flex: 1; min-width: 0; text-align: right; padding-right: 10px; }
        .row-name { font-size: 11.5px; font-weight: 800; line-height: 1.3; color: #0f172a; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 30px; }
        .row-meta { font-size: 9.5px; color: var(--sub); font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .cat-tag { background: #e2e8f0; color: #334155; padding: 2px 6px; border-radius: 4px; font-size: 8.5px; font-weight: 700; white-space: nowrap; }
        .price-tag { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 8.5px; font-weight: 800; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
        .price-tag.no-price { background: #f1f5f9; color: var(--sub); font-weight: 700; }
        .row-widgets { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .row-num { font-size: 9.5px; color: #94a3b8; font-weight: 800; min-width: 12px; text-align: center; }
        .row-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; background: #f1f5f9; color: var(--accent); }
        .zero-row .row-icon { background: #fee2e2; color: var(--danger); }
        .low-row  .row-icon { background: #fef3c7; color: var(--gold); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; position: absolute; top: 12px; right: 8px; }
        .status-dot.ok   { background: var(--success); }
        .status-dot.low  { background: var(--gold); }
        .status-dot.zero { background: var(--danger); }
        .row-qty { border-top: 1px dashed #e2e8f0; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .qty-chips { display: flex; align-items: stretch; gap: 4px; width: 100%; }
        .qty-chip { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 4px 2px; min-width: 0; }
        .qty-chip.is-empty { opacity: 0.45; }
        .qty-main { font-size: 15px; font-weight: 900; line-height: 1; }
        .qty-main.ok   { color: var(--success); }
        .qty-main.low  { color: var(--gold); }
        .qty-main.zero { color: var(--danger); }
        .qty-lbl { font-size: 8.5px; font-weight: 700; color: var(--sub); margin-top: 2px; white-space: nowrap; }
        .qty-total { display: flex; align-items: center; justify-content: center; gap: 4px; background: #f1f5f9; color: var(--accent); border-radius: 6px; padding: 3px 4px; font-size: 9.5px; font-weight: 800; }
        .zero-row .qty-total { background: #fee2e2; color: var(--danger); }
        .low-row  .qty-total { background: #fef3c7; color: var(--gold); }
        .loading, .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 15px; color: var(--sub); }
        .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .err-box { grid-column: 1 / -1; margin: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--r); padding: 16px; text-align: center; color: var(--danger); font-weight: 700; font-size: 13px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 14px; }

        .modal-header { background: var(--accent); color: #fff; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
        .modal-header h4 { font-size: 14px; font-weight: 800; width: 100%; }
        .close-modal { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .modal-body { padding: 12px; overflow-y: auto; flex: 1; background: #f8fafc; }
        .modal-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .mini-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex; align-items: center; gap: 6px; min-width: 0; }
        .mini-card i { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
        .mini-info { display: flex; flex-direction: column; text-align: right; min-width: 0; flex: 1; }
        .mini-val { font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-lbl { font-size: 9px; color: var(--sub); font-weight: 700; margin-top: 1px; white-space: nowrap; }
        .mc-init i { background: #f1f5f9; color: var(--sub); }
        .mc-buy i { background: #e0f2fe; color: #0284c7; }
        .mc-buy .mini-val { color: #0284c7; }
        .mc-sell i { background: #dcfce7; color: var(--success); }
        .mc-sell .mini-val { color: var(--success); }
        .mc-ret i { background: #fef3c7; color: var(--gold); }
        .mc-ret .mini-val { color: var(--gold); }
        .mc-current { grid-column: 1 / -1; background: #f1f5f9; border: 1px dashed var(--accent); justify-content: center; padding: 8px; }
        .mc-current .mini-val { color: var(--accent); font-size: 13.5px; font-weight: 900; }
        .sales-filter-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .sales-filter-title { font-size: 12px; font-weight: 800; color: var(--accent); display: flex; align-items: center; justify-content: space-between; }
        .sales-date-input-wrap { display: flex; align-items: center; gap: 8px; }
        .sales-date-input-wrap label { font-size: 11px; font-weight: 700; color: var(--sub); white-space: nowrap; }
        .sales-date-input-wrap input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; outline: none; background: #f8fafc; }
        .sales-date-input-wrap input:focus { border-color: var(--accent); background: #fff; }
        .summary-bar { font-size: 11px; font-weight: 800; color: var(--accent); margin-bottom: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #e0f2fe; padding: 8px 10px; border-radius: 8px; text-align: center; }
        .summary-bar .item-box { background: #fff; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; display: flex; flex-direction: column; gap: 2px; }
        .summary-bar .item-box .lbl { font-size: 9.5px; color: var(--sub); }
        .summary-bar .item-box .val { font-size: 11.5px; color: var(--accent); }
        .summary-bar .full-col { grid-column: 1 / -1; background: #0f172a; padding: 6px; border-radius: 6px; color: #fff; font-size: 12px; }
        .sales-table-wrap { overflow-x: auto; margin-top: 6px; border: 1px solid var(--border); border-radius: 10px; }
        .sales-table { width: 100%; border-collapse: collapse; font-size: 10.5px; background: #fff; text-align: center; }
        .sales-table th { background: #0f172a; color: #fff; padding: 8px 4px; font-weight: 800; }
        .sales-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); font-weight: 700; }
        .sales-table tr:nth-child(even) { background: #f8fafc; }
        .sales-table .row-sale { background: #f0fdf4; color: #15803d; }
        .sales-table .row-buy { background: #eff6ff; color: #1d4ed8; }
        .sales-table .row-return { background: #fef2f2; color: #b91c1c; }
        .type-badge { padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: 800; display: inline-block; }
        .type-badge.sale { background: #dcfce7; color: #15803d; }
        .type-badge.buy { background: #dbeafe; color: #1d4ed8; }
        .type-badge.return { background: #fee2e2; color: #b91c1c; }
        .modal-search-wrap { padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--border); }
        .modal-search-inner { background: #f1f5f9; border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; }
        .modal-search-inner input { border: none; background: transparent; width: 100%; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700; color: var(--text); outline: none; text-align: right; }
        .quick-list { display: flex; flex-direction: column; gap: 6px; }
        .quick-row-item { background: #ffffff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
        .quick-item-name { font-size: 12px; font-weight: 800; color: #0f172a; }
        .quick-item-qty { font-size: 12px; font-weight: 900; color: var(--accent); background: #f0fdf4; border: 1px solid #bbf7d0; padding: 2px 8px; border-radius: 6px; }
        .quick-item-qty.zero { color: var(--danger); background: #fef2f2; border-color: #fecdd3; }
        #pdfExportTemplate { display: none; padding: 20px; background: #fff; font-family: 'Cairo', sans-serif; color: #000; direction: rtl; }
        @media (max-width: 400px) {
            #listBody { grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
            .row-name { font-size: 10.5px; height: 28px; }
            .qty-main { font-size: 13.5px; }
            .stats { padding: 10px; gap: 6px; }
            .stat-num { font-size: 20px; }
        }
    </style>
</head>

let rawPurchasesList = [];

const daysArabic = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

function normalizeAr(s) {
    return String(s || '').trim()
        .replace(/[\u064B-\u0652]/g, '')
        .replace(/[إأآا]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه');
}

function isCartonUnit(unitValue, isCartonFlag) {
    if (isCartonFlag === true) return true;
    if (!unitValue) return false;
    const u = String(unitValue).trim().toLowerCase();
    return u === 'box' || u === 'carton' || u === 'كرتونة' || u === 'كرتونه';
}

function parseRecordDate(doc) {
    if (!doc) return null;
    let val = doc.createdAt || doc.created_at || doc.date || doc.dateTime || doc.timestamp || doc.time;
    if (!val) return null;
    if (typeof val.toDate === 'function') { return val.toDate(); }
    if (val.seconds) { return new Date(val.seconds * 1000); }
    if (typeof val === 'number') { return new Date(val); }
    if (typeof val === 'string') {
        const d = new Date(val);
        if (!isNaN(d.getTime())) return d;
    }
    return null;
}

function formatDateWithDay(dateObj, fallbackStr = '') {
    if (!dateObj || isNaN(dateObj.getTime())) {
        return fallbackStr || 'غير محدد';
    }
    const dayName = daysArabic[dateObj.getDay()];
    const dayNum = dateObj.getDate();
    const monthNum = dateObj.getMonth() + 1;
    const yearNum = dateObj.getFullYear();
    return `${dayName} ${dayNum}/${monthNum}/${yearNum}`;
}

function parseFilterDateInput(val) {
    if (!val) return null;
    val = String(val).trim();
    if (!val) return null;
    const now = new Date();
    const currentYear = now.getFullYear();
    let day, month, year = currentYear;

    if (val.includes('/') || val.includes('-') || val.includes('.')) {
        const parts = val.split(/[\/\-\.]/).map(p => p.trim()).filter(Boolean);
        if (parts.length === 2) {
            let p1 = Number(parts[0]);
            let p2 = Number(parts[1]);
            if (p1 > 12) { day = p1; month = p2; }
            else if (p2 > 12) { day = p2; month = p1; }
            else { day = p1; month = p2; }
        } else if (parts.length === 3) {
            if (parts[0].length === 4) {
                year = Number(parts[0]); month = Number(parts[1]); day = Number(parts[2]);
            } else {
                day = Number(parts[0]); month = Number(parts[1]); year = Number(parts[2]);
                if (year < 100) year += 2000;
            }
        }
    } else if (/^\d{3,4}$/.test(val)) {
        if (val.length === 3) {
            day = Number(val.slice(0, 1));
            month = Number(val.slice(1));
        } else {
            day = Number(val.slice(0, 2));
            month = Number(val.slice(2));
        }
    }

    if (day > 0 && month > 0 && month <= 12) {
        return new Date(year, month - 1, day, 23, 59, 59, 999);
    }
    return null;
}

async function loadLiveInventory() {
    try {
        onSnapshot(collection(db, "inventory"), async (snap) => {
            const factorsMap = new Map();
            const namesMap = new Map();
            snap.forEach(d => {
                const data = d.data();
                const f = Math.max(1, Number(data.unitFactor || data.pcsPerCarton || data.factor) || 1);
                factorsMap.set(d.id, f);
                if (data.name) namesMap.set(normalizeAr(data.name), d.id);
            });

            try {
                const [invoicesSnap, supplierSnap, transSnap] = await Promise.all([
                    getDocs(collection(db, "invoices")).catch(() => ({ forEach: () => {} })),
                    getDocs(collection(db, "supplier_transactions")).catch(() => ({ forEach: () => {} })),
                    getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance"))).catch(() => ({ forEach: () => {} }))
                ]);

                salesMapGlobal.clear();
                purchasesMapGlobal.clear();
                openingMapGlobal.clear();
                rawInvoicesList = [];
                rawPurchasesList = [];

                if (transSnap.forEach) {
                    transSnap.forEach(docSnap => {
                        const data = docSnap.data();
                        if (data.productId) {
                            const current = openingMapGlobal.get(data.productId) || 0;
                            openingMapGlobal.set(data.productId, current + (Number(data.quantityPcs) || 0));
                        }
                    });
                }

                if (invoicesSnap.forEach) {
                    invoicesSnap.forEach(docSnap => {
                        const invData = docSnap.data() || {};
                        if (invData.isDeleted) return; // استبعاد الفواتير المحذوفة
                        
                        rawInvoicesList.push({ id: docSnap.id, ...invData });
                        const items = invData.items || [];
                        items.forEach(item => {
                            const normName = item.name ? normalizeAr(item.name) : '';
                            const id = item.stockId || item.id || namesMap.get(normName);
                            if (id) {
                                const factor = factorsMap.get(id) || 1;
                                const rawQty = Number(item.qty) || 0;
                                const isCarton = isCartonUnit(item.unit, item.isCarton);
                                const pcs = isCarton ? (rawQty * factor) : rawQty;
                                const current = salesMapGlobal.get(id) || 0;
                                salesMapGlobal.set(id, item.isReturn ? current - pcs : current + pcs);
                            }
                        });
                    });
                }

                if (supplierSnap.forEach) {
                    supplierSnap.forEach(docSnap => {
                        const supData = docSnap.data() || {};
                        if (supData.isDeleted) return; // استبعاد التوريدات المحذوفة
                        
                        rawPurchasesList.push({ id: docSnap.id, ...supData });
                        const items = supData.items || [];
                        items.forEach(item => {
                            const normName = item.name ? normalizeAr(item.name) : '';
                            const id = item.stockId || item.id || namesMap.get(normName);
                            if (id) {
                                const factor = factorsMap.get(id) || 1;
                                const isReturn = Number(item.returnQty) > 0 || item.isReturn === true;
                                const rawQty = isReturn ? Number(item.returnQty || item.qty) : Number(item.qty);
                                const isCarton = isCartonUnit(item.unitName || item.unit, item.isCarton);
                                const pcs = isCarton ? (rawQty * factor) : rawQty;
                                const current = purchasesMapGlobal.get(id) || 0;
                                purchasesMapGlobal.set(id, isReturn ? current - pcs : current + pcs);
                            }
                        });
                    });
                }
            } catch (err) {
                console.warn("تنبيه جلب الحركات:", err);
            }

            allItems = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (!data.isDeleted) {
                    const factor = Math.max(1, Number(data.unitFactor || data.factor || data.pcsPerCarton) || 1);
                    let openingTotalPcs = 0;
                    if (data.openingTotalPcs != null) {
                        openingTotalPcs = Number(data.openingTotalPcs);
                    } else if (data.openingQty != null) {
                        openingTotalPcs = Math.round(Number(data.openingQty) * factor);
                    } else if (openingMapGlobal.has(doc.id)) {
                        openingTotalPcs = openingMapGlobal.get(doc.id);
                    }

                    const salesPcs = salesMapGlobal.get(doc.id) || 0;
                    const purchasesPcs = purchasesMapGlobal.get(doc.id) || 0;
                    const calculatedRealPcs = openingTotalPcs + purchasesPcs - salesPcs;

                    allItems.push({
                        id: doc.id,
                        ...data,
                        openingTotalPcsCalc: openingTotalPcs,
                        purchasesPcsCalc: purchasesPcs,
                        salesPcsCalc: salesPcs,
                        totalPcs: calculatedRealPcs,
                        qty: calculatedRealPcs
                    });
                }
            });

            allItems.sort((a, b) => {
                const qtyA = Number(a.totalPcs || 0);
                const qtyB = Number(b.totalPcs || 0);
                const getPriorityGroup = (item) => {
                    const sellPrice = Number(item.sell || 0);
                    const qty = Number(item.totalPcs || 0);
                    if (sellPrice <= 0 && qty !== 0) return 1;
                    if (qty < 0) return 2;
                    if (qty > 0) return 3;
                    return 4;
                };
                const groupA = getPriorityGroup(a);
                const groupB = getPriorityGroup(b);
                if (groupA !== groupB) return groupA - groupB;
                if (qtyA !== qtyB) return qtyA - qtyB;
                return (a.name || '').localeCompare(b.name || '', 'ar');
            });

            updateStats();
            renderList();
            const now = new Date();
            dom.syncTime.textContent = `محدث: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        }, err => {
            dom.listBody.classList.add('full-width');
            dom.listBody.innerHTML = `<div class="err-box"><i class="fas fa-wifi"></i>خطأ في اتصال الأصناف<br><small>${err.message}</small></div>`;
        });
    } catch (e) {
        console.error("خطأ التجميع:", e);
        dom.listBody.classList.add('full-width');
        dom.listBody.innerHTML = `<div class="err-box"><i class="fas fa-exclamation-triangle"></i>فشل تحميل المخزون.<br><small>${e.message}</small></div>`;
    }
}

function formatQuantityDetailed(totalPcs, capacity, unit = 'جركن') {
    totalPcs = parseInt(totalPcs) || 0;
    capacity = parseInt(capacity) || 1;
    if (totalPcs === 0) return capacity > 1 ? `0 كرتونة` : `0 ${unit}`;
    const isNegative = totalPcs < 0;
    const absPcs = Math.abs(totalPcs);
    let result = '';
    if (capacity <= 1) {
        result = `${absPcs} ${unit}`;
    } else {
        const cartons = Math.floor(absPcs / capacity);
        const loose = absPcs % capacity;
        if (cartons > 0 && loose > 0) result = `${cartons} ك و ${loose} ${unit}`;
        else if (cartons > 0) result = `${cartons} كرتونة`;
        else result = `${loose} ${unit}`;
    }
    return isNegative ? `-${result}` : result;
}

function updateStats() {
    let ok = 0, low = 0, zero = 0;
    allItems.forEach(item => {
        const factor   = Number(item.unitFactor || item.factor || item.pcsPerCarton) || 1;
        const totalPcs = Number(item.totalPcs) || 0;
        const minPcs   = (Number(item.min) || 0) * factor;

        if (totalPcs <= 0) zero++;
        else if (totalPcs <= minPcs) low++;
        else ok++;
    });
    dom.sTotal.textContent = allItems.length;
    dom.sOk.textContent    = ok;
    dom.sLow.textContent   = low;
    dom.sZero.textContent  = zero;
}

function renderList() {
    const term = dom.searchInput.value.trim().toLowerCase();
    const list = term ? allItems.filter(i => (i.name||'').toLowerCase().includes(term) || (i.barcode||'').toLowerCase().includes(term)) : allItems;
    dom.countBadge.textContent = list.length + ' صنف';

    if (list.length === 0) {
        dom.listBody.classList.add('full-width');
        dom.listBody.innerHTML = `<div class="empty-state"><i class="fas fa-box-open fa-2x mb-2"></i><p>لا توجد أصناف مطابقة للبحث</p></div>`;
        return;
    }
    dom.listBody.classList.remove('full-width');
    let html = '';
    let n = 1;
    list.forEach(item => {
        html += buildRow(item, n++);
    });
    dom.listBody.innerHTML = html;
}

function buildRow(item, num) {
    const totalPcs = Number(item.totalPcs) || 0;
    const factor = Math.max(1, Number(item.unitFactor || item.factor || item.pcsPerCarton) || 1);
    const minPcs = (Number(item.min) || 0) * factor;

    const isNegative = totalPcs < 0;
    const absTotal = Math.abs(totalPcs);
    const cartons = Math.floor(absTotal / factor) * (isNegative ? -1 : 1);
    const jerrycans = (absTotal % factor) * (isNegative ? -1 : 1);

    let status = 'ok';
    if (totalPcs <= 0) status = 'zero';
    else if (totalPcs <= minPcs) status = 'low';

    const rawUnit = (item.unitName || item.unit || '').trim();
    const unitName = (rawUnit && normalizeAr(rawUnit) !== normalizeAr('كرتونة')) ? rawUnit : 'جركن';

    const catHtml = item.category ? `<span class="cat-tag">${item.category}</span>` : '';
    const priceHtml = (item.sell !== undefined && item.sell !== null && item.sell !== '') 
        ? `<span class="price-tag"><i class="fas fa-tag"></i>${Number(item.sell).toLocaleString()} ج.م</span>` 
        : `<span class="price-tag no-price"><i class="fas fa-tag"></i>غير محدد</span>`;

    return `
    <div class="item-card${status==='zero' ? ' zero-row' : status==='low' ? ' low-row' : ''}" data-item-id="${item.id}">
        <span class="status-dot ${status}"></span>
        <div class="card-top">
            <div class="row-info">
                <div class="row-name">${item.name || 'بدون اسم'}</div>
                <div class="row-meta">${catHtml}${priceHtml}</div>
            </div>
            <div class="row-widgets">
                <span class="row-num num">${num}</span>
                <div class="row-icon"><i class="fas fa-${status==='zero' ? 'box-open' : 'box'}"></i></div>
            </div>
        </div>
        <div class="row-qty">
            <div class="qty-chips">
                <div class="qty-chip${cartons === 0 ? ' is-empty' : ''}">
                    <div class="qty-main num ${status}">${cartons.toLocaleString()}</div>
                    <div class="qty-lbl">كرتونة</div>
                </div>
                <div class="qty-chip${jerrycans === 0 ? ' is-empty' : ''}">
                    <div class="qty-main num ${status}">${jerrycans.toLocaleString()}</div>
                    <div class="qty-lbl">${unitName}</div>
                </div>
            </div>
            <div class="qty-total"><i class="fas fa-cubes"></i>إجمالي القطع: <span class="num">${totalPcs.toLocaleString()}</span></div>
        </div>
    </div>`;
}

function renderQuickList() {

        return;
    }

    if (filtered.length === 0) {
        dom.quickModalBody.innerHTML = `<div class="empty-state"><p>لا توجد أصناف مطابقة</p></div>`;
        return;
    }

    let listHtml = '<div class="quick-list">';
    filtered.forEach(item => {
        const totalPcs = Number(item.totalPcs) || 0;
        const factor = Math.max(1, Number(item.unitFactor || item.factor || item.pcsPerCarton) || 1);

function renderSalesTable(itemId, maxDateStr = '') {
    const itemObj = allItems.find(i => i.id === itemId) || {};
    const normItemName = itemObj.name ? normalizeAr(itemObj.name) : '';
    const capacity = Math.max(1, Number(itemObj.unitFactor || itemObj.factor || itemObj.pcsPerCarton) || 1);
    const rawUnit = (itemObj.unitName || itemObj.unit || '').trim();
    const unit = (rawUnit && normalizeAr(rawUnit) !== normalizeAr('كرتونة')) ? rawUnit : 'جركن';

    const maxDate = parseFilterDateInput(maxDateStr);

    let combinedTransactions = [];
    let salesPcsPure = 0;
    let salesReturnPcs = 0;
    let totalSalesAmount = 0;
    let purchasesPcsPure = 0;
    let purchasesReturnPcs = 0;

    // 1. تجميع المبيعات
    rawInvoicesList.forEach(inv => {
        const invDate = parseRecordDate(inv);
        if (maxDate && invDate && invDate > maxDate) return;

        const items = inv.items || [];
        items.forEach(item => {
            const normName = item.name ? normalizeAr(item.name) : '';
            if (item.stockId === itemId || item.id === itemId || (normName && normName === normItemName)) {
                const rawQty = Number(item.qty) || 0;
                const isCarton = isCartonUnit(item.unit, item.isCarton);
                const pcs = isCarton ? (rawQty * capacity) : rawQty;
                const price = Number(item.price || item.sellPrice || item.sell) || 0;
                const lineTotal = Number(item.total) || (rawQty * price);
                const isReturn = !!item.isReturn;

                if (isReturn) {
                    salesReturnPcs += pcs;
                    totalSalesAmount -= lineTotal;
                } else {
                    salesPcsPure += pcs;
                    totalSalesAmount += lineTotal;
                }

                combinedTransactions.push({
                    type: isReturn ? 'مرتجع بيع' : 'بيع',
                    typeClass: isReturn ? 'return' : 'sale',
                    rowClass: isReturn ? 'row-return' : 'row-sale',
                    dateDisplay: formatDateWithDay(invDate, inv.dateStr || inv.date),
                    rawDate: invDate ? invDate.getTime() : 0,
                    party: inv.customerName || inv.clientName || inv.customer || 'عميل نقدي',
                    rawQty: rawQty,
                    unitName: isCarton ? 'كرتونة' : unit,
                    lineTotal: lineTotal
                });
            }
        });
    });

    // 2. تجميع المشتريات
    rawPurchasesList.forEach(sup => {
        const supDate = parseRecordDate(sup);
        if (maxDate && supDate && supDate > maxDate) return;

        const items = sup.items || [];
        items.forEach(item => {
            const normName = item.name ? normalizeAr(item.name) : '';
            if (item.stockId === itemId || item.id === itemId || (normName && normName === normItemName)) {
                const isReturn = Number(item.returnQty) > 0 || item.isReturn === true;
                const rawQty = isReturn ? Number(item.returnQty || item.qty) : Number(item.qty);
                const isCarton = isCartonUnit(item.unitName || item.unit, item.isCarton);
                const pcs = isCarton ? (rawQty * capacity) : rawQty;
                const price = Number(item.price || item.buyPrice || item.cost) || 0;
                const lineTotal = Number(item.total) || (rawQty * price);

                if (isReturn) {
                    purchasesReturnPcs += pcs;
                } else {
                    purchasesPcsPure += pcs;
                }

                combinedTransactions.push({
                    type: isReturn ? 'مرتجع شراء' : 'شراء',
                    typeClass: isReturn ? 'return' : 'buy',
                    rowClass: isReturn ? 'row-return' : 'row-buy',
                    dateDisplay: formatDateWithDay(supDate, sup.dateStr || sup.date),
                    rawDate: supDate ? supDate.getTime() : 0,
                    party: sup.supplierName || sup.supplier || sup.partyName || 'مورد',
                    rawQty: rawQty,
                    unitName: isCarton ? 'كرتونة' : unit,
                    lineTotal: lineTotal
                });
            }
        });
    });

    // حسابات الصافي والمتبقي
    const openingPcs = Number(itemObj.openingTotalPcsCalc || 0);
    const netSalesPcs = salesPcsPure - salesReturnPcs;
    const netPurchasesPcs = purchasesPcsPure - purchasesReturnPcs;
    const totalReturnsCombinedPcs = salesReturnPcs + purchasesReturnPcs;
    const remainingPcsAtDate = openingPcs + netPurchasesPcs - netSalesPcs;

    // ترتيب الحركات (الأحدث أولاً)
    combinedTransactions.sort((a, b) => b.rawDate - a.rawDate);

    const salesContainer = document.getElementById('salesTableContainer');
    const summaryContainer = document.getElementById('salesSummaryBar');

    if (summaryContainer) {
        summaryContainer.innerHTML = `
        <div class="item-box">
            <span class="lbl"><i class="fas fa-circle-arrow-up text-success"></i> المباع بالفترة</span>
            <span class="val num">${formatQuantityDetailed(salesPcsPure, capacity, unit)}</span>
            <span style="font-size: 9px; color:#64748b;">(صافي: ${formatQuantityDetailed(netSalesPcs, capacity, unit)})</span>
        </div>
        <div class="item-box">
            <span class="lbl"><i class="fas fa-circle-arrow-down text-primary"></i> المشترى بالفترة</span>
            <span class="val num">${formatQuantityDetailed(purchasesPcsPure, capacity, unit)}</span>
            <span style="font-size: 9px; color:#64748b;">(صافي: ${formatQuantityDetailed(netPurchasesPcs, capacity, unit)})</span>
        </div>
        <div class="item-box">
            <span class="lbl"><i class="fas fa-rotate-left text-warning"></i> المرتجع بالفترة</span>
            <span class="val num">${formatQuantityDetailed(totalReturnsCombinedPcs, capacity, unit)}</span>
            <span style="font-size: 9px; color:#64748b;">مبيعات + توريد</span>
        </div>
        <div class="item-box">
            <span class="lbl"><i class="fas fa-money-bill-wave text-success"></i> قيمة المبيعات</span>
            <span class="val num">${totalSalesAmount.toLocaleString()} ج.م</span>
            <span style="font-size: 9px; color:#64748b;">بعد الخصم والارتجاع</span>
        </div>
        <div class="full-col">
            <i class="fas fa-boxes-stacked me-1"></i> المتبقي بالمخزن حتى هذا التاريخ: <strong class="num">${formatQuantityDetailed(remainingPcsAtDate, capacity, unit)}</strong>
        </div>`;
    }

    if (!salesContainer) return;

    if (combinedTransactions.length === 0) {
        salesContainer.innerHTML = `<div class="empty-state" style="padding:20px 10px;"><p>لا توجد حركات مبيعات أو مشتريات لهذا الصنف ${maxDateStr ? 'حتى التاريخ المحدد' : ''}</p></div>`;
        return;
    }

    let tableHtml = `
    <div class="sales-table-wrap">
        <table class="sales-table">
            <thead>
                <tr>
                    <th style="width: 15%;">النوع</th>
                    <th style="width: 32%;">التاريخ واليوم</th>
                    <th style="width: 25%;">الجهة / العميل</th>
                    <th style="width: 14%;">الكمية</th>
                    <th style="width: 14%;">المبلغ</th>
                </tr>
            </thead>
            <tbody>`;

    combinedTransactions.forEach(t => {
        tableHtml += `
        <tr class="${t.rowClass}">
            <td><span class="type-badge ${t.typeClass}">${t.type}</span></td>
            <td class="num">${t.dateDisplay}</td>
            <td>${t.party}</td>
            <td class="num">${t.rawQty} ${t.unitName}</td>
            <td class="num">${t.lineTotal ? t.lineTotal.toLocaleString() + ' ج.م' : '-'}</td>
        </tr>`;
    });

    tableHtml += `</tbody></table></div>`;
    salesContainer.innerHTML = tableHtml;
}

            <div class="mini-card mc-buy"><i class="fas fa-circle-arrow-down"></i><div class="mini-info"><span class="mini-val num">+${formatQuantityDetailed(buyPcs, capacity, unit)}</span><span class="mini-lbl">إجمالي المشتريات</span></div></div>
            <div class="mini-card mc-sell"><i class="fas fa-circle-arrow-up"></i><div class="mini-info"><span class="mini-val num">-${formatQuantityDetailed(sellPcs, capacity, unit)}</span><span class="mini-lbl">إجمالي المبيعات</span></div></div>
            <div class="mini-card mc-ret"><i class="fas fa-rotate-left"></i><div class="mini-info"><span class="mini-val num">0 كرتونة</span><span class="mini-lbl">المرتجعات والتالف</span></div></div>
            <div class="mini-card mc-current"><div class="mini-info" style="text-align: center;"><span class="mini-val num">${formatQuantityDetailed(totalPcs, capacity, unit)}</span><span class="mini-lbl">الرصيد الحالي بالمخزن</span></div></div>
        </div>

        <div class="sales-filter-card">
            <div class="sales-filter-title">
                <span><i class="fas fa-filter me-1"></i> فلترة الحركات والمبيعات حتى تاريخ</span>
            </div>
            <div class="sales-date-input-wrap">
                <label>إلى تاريخ:</label>
                <input type="text" id="salesDateInput" placeholder="اكتب التاريخ فوراً (مثال: 12/8 أو 2026-08-12)">
            </div>
        </div>

        <div id="salesSummaryBar" class="summary-bar"></div>
        <div id="salesTableContainer"></div>`;

        dom.modalBody.innerHTML = html;

        const salesDateInput = document.getElementById('salesDateInput');
        renderSalesTable(itemId, '');

        salesDateInput.addEventListener('input', () => {
            renderSalesTable(itemId, salesDateInput.value);
        });

    } catch (err) {
        dom.modalBody.innerHTML = `<div class="err-box"><i class="fas fa-exclamation-triangle"></i>فشل العرض<br><small>${err.message}</small></div>`;
    }
}

function closeHistoryModal() { dom.historyModal.style.display = 'none'; }
function closeQuickModal() { dom.quickViewModal.style.display = 'none'; }

function exportInventoryPDF() {
    if (!allItems.length) return alert('لا توجد أصناف لتصديرها!');
    const dateStr = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
    let tableRows = '';

    allItems.forEach((item, index) => {
        const totalPcs = Number(item.totalPcs) || 0;
        const price = (item.sell !== undefined && item.sell !== null && item.sell !== '') ? `${Number(item.sell).toLocaleString()} ج.م` : 'غير محدد';
        const factor = Math.max(1, Number(item.unitFactor || item.factor || item.pcsPerCarton) || 1);
        const unitName = (item.unitName || item.unit || 'جركن');
        const bgStyle = (index % 2 === 0) ? 'background-color: #f8fafc;' : 'background-color: #ffffff;';

        tableRows += `
        <tr style="${bgStyle} border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 11px;">
            <td style="padding: 6px; border-left: 1px solid #e2e8f0;">${index + 1}</td>
            <td style="padding: 6px; text-align: right; font-weight: bold; border-left: 1px solid #e2e8f0;">${item.name || 'بدون اسم'}</td>
            <td style="padding: 6px; border-left: 1px solid #e2e8f0;">${item.category || 'عام'}</td>
            <td style="padding: 6px; font-weight: bold; color: #0f172a; border-left: 1px solid #e2e8f0;">${price}</td>
            <td style="padding: 6px; font-weight: bold; ${totalPcs <= 0 ? 'color:#ef4444;' : 'color:#16a34a;'}">${formatQuantityDetailed(totalPcs, factor, unitName)}</td>
        </tr>`;
    });

    const template = document.getElementById('pdfExportTemplate');
    template.style.display = 'block';
    template.innerHTML = `
    <div style="font-family: 'Cairo', sans-serif; padding: 10px; direction: rtl;">
        <div style="text-align: center; margin-bottom: 15px; border-bottom: 2px solid #0f172a; padding-bottom: 6px;">
            <h2 style="color: #0f172a; margin: 0; font-size: 17px;">شركة الزيادى لزيوت السيارات</h2>
            <h4 style="color: #475569; margin: 3px 0; font-size: 12px;">تقرير جرد الأصناف والمخزون</h4>
            <div style="font-size: 10px; color: #64748b;">تاريخ التقرير: ${dateStr} | إجمالي الأصناف: ${allItems.length}</div>
        </div>
        <table style="width: 100%; border-collapse: collapse; border: 1px solid #0f172a;">
            <thead>
                <tr style="background: #0f172a; color: #ffffff; font-size: 11px;">
                    <th style="padding: 6px; width: 5%;">#</th>
                    <th style="padding: 6px; text-align: right; width: 40%;">اسم الصنف</th>
                    <th style="padding: 6px; width: 18%;">التصنيف</th>
                    <th style="padding: 6px; width: 17%;">سعر البيع</th>
                    <th style="padding: 6px; width: 20%;">الرصيد المتاح</th>
                </tr>
            </thead>
            <tbody>${tableRows}</tbody>
        </table>
    </div>`;

    html2pdf().set({
        margin: [6, 6, 6, 6],
        filename: `جرد_الأصناف_${new Date().toISOString().slice(0,10)}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(template).save().then(() => {
        template.style.display = 'none';
    });
}

dom.searchInput.addEventListener('input', renderList);
dom.quickSearchInput.addEventListener('input', renderQuickList);

dom.listBody.addEventListener('click', (e) => {
    const card = e.target.closest('.item-card');
    if (card) {
        const itemId = card.getAttribute('data-item-id');
        const itemObj = allItems.find(i => i.id === itemId);
        if (itemObj) {
            showItemHistory(itemObj.id, itemObj.name || 'بدون اسم');
        }
    }
});

dom.btnQuickView.addEventListener('click', showQuickView);
dom.btnCloseQuickModal.addEventListener('click', closeQuickModal);
dom.quickViewModal.addEventListener('click', (e) => { if (e.target === dom.quickViewModal) closeQuickModal(); });

dom.btnCloseModal.addEventListener('click', closeHistoryModal);
dom.historyModal.addEventListener('click', (e) => { if (e.target === dom.historyModal) closeHistoryModal(); });

dom.btnExportPDF.addEventListener('click', exportInventoryPDF);
</script>
</body>
</html>
