<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادى | الأصناف</title>
    <!-- إعدادات التطبيق الهاتفي PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة تحويل HTML إلى PDF عالي الجودة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg: #f4f7f5;
            --card: #ffffff;
            --accent: #0b5e3d;
            --accent-light: #128256;
            --header: #0b5e3d;
            --text: #1e293b;
            --sub: #64748b;
            --danger: #e11d48;
            --success: #16a34a;
            --gold: #d97706;
            --border: #e2e8f0;
            --shadow: 0 4px 18px rgba(11, 94, 61, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            --r: 20px;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            padding-bottom: 40px;
            direction: rtl;
        }

        header {
            background: var(--header);
            padding: 16px 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            position: sticky; 
            top: 0; 
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-radius: 0 0 25px 25px;
            gap: 10px;
        }
        .header-center { text-align: center; }
        .header-left-btn { display: flex; justify-content: flex-end; gap: 8px; }

        .h-title { 
            font-size: 16px; 
            font-weight: 800; 
            color: #fff; 
            line-height: 1.3; 
        }
        .h-title span { color: #ffce31; }
        .h-sub { 
            font-size: 11px; 
            color: rgba(255,255,255,0.75); 
            font-weight: 600; 
            margin-top: 3px; 
        }
        .back-btn, .pdf-btn {
            background: rgba(255,255,255,0.15);
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 12px; 
            padding: 8px 14px;
            font-family: 'Cairo', sans-serif; 
            font-size: 13px; 
            font-weight: 700;
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px;
            text-decoration: none; 
            white-space: nowrap;
            transition: all 0.2s;
        }
        .pdf-btn { background: #d97706; border-color: #f59e0b; color: #fff; }
        .pdf-btn:hover { background: #b45309; }
        .back-btn:active, .pdf-btn:active { transform: scale(0.95); }

        .stats {
            display: grid; 
            grid-template-columns: 1fr 1fr;
            gap: 12px; 
            padding: 16px;
            max-width: 700px; 
            margin: 0 auto;
        }
        .stat {
            background: var(--card); 
            border: 1px solid var(--border);
            border-radius: var(--r); 
            padding: 14px 12px;
            text-align: center; 
            box-shadow: var(--shadow);
            position: relative; 
            overflow: hidden;
        }
        .stat::after { content:''; position:absolute; bottom:0; left:0; right:0; height:4px; }
        .stat.s-total::after { background: var(--accent); }
        .stat.s-ok::after    { background: var(--success); }
        .stat.s-low::after   { background: var(--gold); }
        .stat.s-zero::after  { background: var(--danger); }

        .stat-num { font-size: 28px; font-weight: 900; line-height: 1.1; }
        .stat-lbl { font-size: 12px; color: var(--sub); font-weight: 700; margin-top: 4px; }
        
        .stat.s-total .stat-num { color: var(--accent); }
        .stat.s-ok    .stat-num { color: var(--success); }
        .stat.s-low   .stat-num { color: var(--gold); }
        .stat.s-zero  .stat-num { color: var(--danger); }

        .search-wrap { max-width: 700px; margin: 4px auto 0; padding: 0 16px; }
        .search-inner {
            background: var(--card); 
            border: 1.5px solid var(--border);
            border-radius: 30px; 
            padding: 10px 18px;
            display: flex; 
            align-items: center; 
            gap: 10px;
            box-shadow: var(--shadow); 
        }
        .search-inner:focus-within { border-color: var(--accent); }
        .search-inner input {
            border: none; background: transparent; width: 100%;
            font-family: 'Cairo', sans-serif; font-size: 14px;
            color: var(--text); outline: none; text-align: right;
        }

        .list-wrap { max-width: 700px; margin: 16px auto 0; padding: 0 16px; }
        .list-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
        }
        .list-head {
            padding: 12px 18px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(11,94,61,0.02);
        }
        .list-head h3 { font-size: 14px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .count-badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 12px; border-radius: 20px; }

        #listBody {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        #listBody.full-width { display: block; padding: 0; }

        .item-card {
            background: var(--card); 
            border: 1px solid var(--border);
            border-radius: 16px; 
            padding: 12px;
            cursor: pointer; 
            transition: all 0.15s ease-in-out;
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            position: relative;
        }
        .item-card:active { transform: scale(0.96); background: #f8fafc; }
        .item-card.zero-row { background: rgba(225, 29, 72, 0.02); border-color: rgba(225, 29, 72, 0.15); }
        .item-card.low-row  { background: rgba(217, 119, 6, 0.02); border-color: rgba(217, 119, 6, 0.15); }
        .item-card.neg-row  { background: rgba(225, 29, 72, 0.05); border-color: rgba(225, 29, 72, 0.35); }

        .card-top { 
            display: flex; 
            align-items: flex-start; 
            justify-content: space-between;
            gap: 6px; 
        }

        .row-info { 
            flex: 1; 
            min-width: 0; 
            text-align: right; 
            padding-right: 12px;
        }
        .row-name { 
            font-size: 12px; 
            font-weight: 700; 
            line-height: 1.35; 
            color: #0f172a;
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
            height: 33px;
            letter-spacing: -0.1px;
        }
        .row-meta { font-size: 10px; color: var(--sub); font-weight: 600; margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .cat-tag { background: #f1f5f9; color: #475569; padding: 2px 7px; border-radius: 6px; font-size: 9px; font-weight: 700; white-space: nowrap; }
        .price-tag {
            background: rgba(11,94,61,0.08); color: var(--accent);
            padding: 2px 7px; border-radius: 6px; font-size: 9px; font-weight: 800;
            white-space: nowrap; display: inline-flex; align-items: center; gap: 3px;
        }
        .price-tag.no-price { background: #f1f5f9; color: var(--sub); font-weight: 700; }

        .row-widgets {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .row-num { font-size: 10px; color: #94a3b8; font-weight: 800; min-width: 14px; text-align: center; }
        .row-icon {
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; 
            background: rgba(11,94,61,0.06); color: var(--accent);
        }
        .zero-row .row-icon { background: rgba(225,29,72,0.07); color: var(--danger); }
        .low-row  .row-icon { background: rgba(217,119,6,0.08); color: var(--gold); }
        .neg-row  .row-icon { background: rgba(225,29,72,0.12); color: var(--danger); }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; 
            position: absolute; top: 16px; right: 10px;
        }
        .status-dot.ok   { background: var(--success); box-shadow: 0 0 6px rgba(22,163,74,0.6); }
        .status-dot.low  { background: var(--gold);    box-shadow: 0 0 6px rgba(217,119,6,0.5); }
        .status-dot.zero { background: var(--danger);  box-shadow: 0 0 6px rgba(225,29,72,0.5); }

        .row-qty {
            border-top: 1px dashed #e2e8f0;
            padding-top: 9px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
        }
        .qty-chips {
            display: flex;
            align-items: stretch;
            gap: 6px;
            width: 100%;
        }
        .qty-chip {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 5px 4px 6px;
            min-width: 0;
        }
        .qty-chip.is-empty { opacity: 0.45; }
        .qty-main { font-size: 18px; font-weight: 900; line-height: 1.1; }
        .qty-main.ok   { color: var(--success); }
        .qty-main.low  { color: var(--gold); }
        .qty-main.zero { color: var(--danger); }
        .qty-lbl { font-size: 9.5px; font-weight: 700; color: var(--sub); margin-top: 2px; white-space: nowrap; }

        .qty-total {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            background: rgba(11,94,61,0.05); color: var(--accent);
            border-radius: 8px; padding: 4px 6px;
            font-size: 10.5px; font-weight: 800;
        }
        .qty-total i { font-size: 9px; }
        .zero-row .qty-total { background: rgba(225,29,72,0.05); color: var(--danger); }
        .low-row  .qty-total { background: rgba(217,119,6,0.06); color: var(--gold); }
        .neg-row  .qty-total { background: rgba(225,29,72,0.08); color: var(--danger); }

        .zero-divider {
            grid-column: 1 / -1; padding: 10px 16px; background: #fff1f2;
            border-radius: 12px; border: 1px dashed rgba(225,29,72,0.25);
            font-size: 12px; font-weight: 800; color: var(--danger);
            display: flex; align-items: center; gap: 8px; margin: 6px 0;
        }
        .zero-divider em { background: rgba(225,29,72,0.08); padding: 2px 10px; border-radius: 20px; font-style: normal; }
        .zero-divider.neg-divider { background: #fff1f2; border-color: rgba(225,29,72,0.4); }
        .zero-divider.low-divider { background: #fffbeb; border-color: rgba(217,119,6,0.3); color: var(--gold); }
        .zero-divider.low-divider em { background: rgba(217,119,6,0.1); }

        .loading { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--sub); }
        .spinner { width: 36px; height: 36px; border: 3.5px solid #edf2f7; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 14px; font-weight: 700; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--sub); }
        .empty-state i { font-size: 40px; opacity: 0.25; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; font-weight: 700; }
        .err-box { grid-column: 1 / -1; margin: 16px; background: #fff5f5; border: 1px solid #fed7d7; border-radius: var(--r); padding: 20px; text-align: center; color: var(--danger); font-weight: 700; font-size: 14px; }
        .err-box i { font-size: 28px; display: block; margin-bottom: 10px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
            z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-card {
            background: var(--card); width: 100%; max-width: 550px; border-radius: var(--r); 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); overflow: hidden; 
            display: flex; flex-direction: column; max-height: 85vh;
            animation: modalFade 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalFade { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { background: var(--accent); color: #fff; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
        .modal-header h4 { font-size: 15px; font-weight: 800; line-height: 1.4; padding-left: 10px; }
        .close-modal { background: rgba(255,255,255,0.2); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .modal-body { padding: 12px 16px 20px; overflow-y: auto; flex: 1; background: #f8fafc; }
        
        .modal-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .mini-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.01);
        }
        .mini-card i {
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
        }
        .mini-info { display: flex; flex-direction: column; text-align: right; }
        .mini-val { font-size: 12.5px; font-weight: 800; line-height: 1.25; }
        .mini-lbl { font-size: 10.5px; color: var(--sub); font-weight: 700; margin-top: 2px; }
        
        .mc-init i { background: rgba(100, 116, 139, 0.08); color: var(--sub); }
        .mc-init .mini-val { color: var(--text); }
        
        .mc-buy i { background: rgba(2, 132, 199, 0.08); color: #0284c7; }
        .mc-buy .mini-val { color: #0284c7; }
        
        .mc-sell i { background: rgba(22, 163, 74, 0.08); color: var(--success); }
        .mc-sell .mini-val { color: var(--success); }
        
        .mc-ret i { background: rgba(217, 119, 6, 0.08); color: var(--gold); }
        .mc-ret .mini-val { color: var(--gold); }

        .mc-current {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(11,94,61,0.03) 0%, rgba(18,130,86,0.06) 100%);
            border: 1px dashed var(--accent-light);
            justify-content: center;
            padding: 10px;
        }
        .mc-current .mini-val { color: var(--accent); font-size: 15px; font-weight: 900; }
        .mc-current .mini-lbl { color: var(--accent); font-weight: 800; }

        .mc-usage {
            grid-column: 1 / -1;
            background: rgba(2, 132, 199, 0.04);
            border: 1px dashed #0284c7;
            justify-content: center;
            padding: 8px;
        }
        .mc-usage .mini-val { color: #0284c7; font-size: 12.5px; }
        .mc-usage .mini-lbl { color: #0284c7; }

        .section-title {
            font-size: 12.5px;
            font-weight: 800;
            color: var(--text);
            margin: 8px 0 8px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .tx-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; gap: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.01);
        }
        .tx-type { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; color: #fff; text-align: center; min-width: 70px; }
        .tx-type.sale { background: var(--success); }
        .tx-type.purchase { background: #0284c7; }
        .tx-type.return { background: var(--gold); }
        .tx-type.loss { background: var(--danger); }
        .tx-details { flex: 1; text-align: right; min-width: 0; }
        .tx-title { font-size: 13px; font-weight: 800; color: #1e293b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tx-note { font-size: 10.5px; color: var(--sub); font-weight: 600; margin-top: 1px; }
        .tx-date { font-size: 10px; color: #94a3b8; font-weight: 600; margin-top: 2px; }
        .tx-amount { font-size: 12.5px; font-weight: 900; text-align: left; direction: ltr; }
        .tx-amount.plus { color: #0284c7; }
        .tx-amount.minus { color: var(--danger); }

        #pdfExportTemplate {
            display: none;
            padding: 20px;
            background: #ffffff;
            font-family: 'Cairo', sans-serif;
            color: #000;
            direction: rtl;
        }

        @media (max-width: 400px) {
            #listBody { grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
            .row-name { font-size: 11.5px; height: 32px; }
            .qty-main { font-size: 16px; }
            .qty-lbl { font-size: 9px; }
            .qty-total { font-size: 9.5px; padding: 3px 5px; }
            .stats { padding: 12px; gap: 8px; }
            .stat { padding: 10px 8px; }
            .stat-num { font-size: 24px; }
            .row-info { padding-right: 8px; }
            .item-card { padding: 10px; gap: 8px; }
            .mini-val { font-size: 11.5px; }
            .mini-lbl { font-size: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <button class="pdf-btn" onclick="exportInventoryPDF()">
            <i class="fas fa-file-pdf"></i> تصدير PDF
        </button>
    </div>
    <div class="header-center">
        <div class="h-title">شركة <span>الزيادى</span> | الأصناف</div>
        <div class="h-sub" id="syncTime">جاري المزامنة...</div>
    </div>
    <div class="header-left-btn">
        <a href="javascript:history.back()" class="back-btn">
            <i class="fas fa-arrow-right"></i> رجوع
        </a>
    </div>
</header>

<div class="stats">
    <div class="stat s-total"><div class="stat-num" id="sTotal">—</div><div class="stat-lbl">إجمالي الأصناف</div></div>
    <div class="stat s-ok">  <div class="stat-num" id="sOk">—</div>   <div class="stat-lbl">متوفر</div></div>
    <div class="stat s-low"> <div class="stat-num" id="sLow">—</div>  <div class="stat-lbl">كمية منخفضة</div></div>
    <div class="stat s-zero"><div class="stat-num" id="sZero">—</div> <div class="stat-lbl">نفد المخزون / بالسالب</div></div>
</div>

<div class="search-wrap">
    <div class="search-inner">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الباركود..." oninput="renderList()">
    </div>
</div>

<div class="list-wrap">
    <div class="list-card">
        <div class="list-head">
            <h3><i class="fas fa-boxes-stacked"></i> الأصناف المسجلة</h3>
            <span class="count-badge" id="countBadge">—</span>
        </div>
        <div id="listBody">
            <div class="loading"><div class="spinner"></div><p>جاري تحميل البيانات الحية...</p></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="historyModal" onclick="closeHistoryModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h4 id="modalItemName">سجل الحركات</h4>
            <button class="close-modal" onclick="closeHistoryModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<div id="pdfExportTemplate"></div>

<script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, onSnapshot, enableIndexedDbPersistence, getDocs, collectionGroup }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain:        "ahmedelzaiady.firebaseapp.com",
        projectId:         "ahmedelzaiady",
        storageBucket:     "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId:             "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
        db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
        });
    } catch (e) {
        db = getFirestore(app);
    }
    let allItems = [];

    let rawDocsCache = null;       
    let cacheTimestamp = 0;        
    const CACHE_TTL_MS = 5 * 60 * 1000; 

    // خريطة معدل الاستخدام (إجمالي كمية المبيعات التاريخية) لكل صنف — تُستخدم لترتيب مجموعة "نفد المخزون"
    let usageMap = new Map();
    let usageComputed = false;
    let usageComputing = false;

    enableIndexedDbPersistence(db)
        .then(() => { console.log("تم تفعيل الكاش المحلي بنجاح"); })
        .catch((err) => { console.warn("تنبيه الكاش:", err.message); });

    onSnapshot(collection(db, "inventory"), snap => {
        allItems = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.isDeleted !== true) allItems.push({ id: d.id, ...data });
        });

        sortAllItems();

        updateStats();
        renderList();

        // نحسب معدل الاستخدام مرة واحدة فى الخلفية دون تعطيل عرض القائمة
        if (!usageComputed && !usageComputing) {
            computeUsageFrequency();
        }

        const isFromCache = snap.metadata.fromCache;
        const now = new Date();
        document.getElementById('syncTime').textContent =
            `آخر تحديث: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}` + 
            (isFromCache ? " (محلي)" : " (مباشر)");

    }, err => {
        document.getElementById('listBody').classList.add('full-width');
        document.getElementById('listBody').innerHTML =
            `<div class="err-box"><i class="fas fa-wifi"></i>خطأ في جلب البيانات<br><small style="opacity:.75">${err.message}</small></div>`;
    });

    function normalizeAr(s) {
        return String(s || '').trim()
            .replace(/[\u064B-\u0652]/g, '')
            .replace(/[إأآا]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ة/g, 'ه');
    }

    function formatQuantityDetailed(totalPcs, capacity, unit) {
        totalPcs = parseInt(totalPcs) || 0;
        capacity = parseInt(capacity) || 1;
        unit = unit || 'قطعة';
        
        if (totalPcs === 0) {
            return capacity > 1 ? `0 كرتونة و 0 ${unit}` : `0 ${unit}`;
        }
        
        const isNegative = totalPcs < 0;
        const absPcs = Math.abs(totalPcs);
        
        let result = '';
        if (capacity <= 1) { 
            result = `${absPcs} ${unit}`; 
        } else {
            const cartons = Math.floor(absPcs / capacity);
            const loose = absPcs % capacity;
            
            if (cartons > 0 && loose > 0) { 
                result = `${cartons}ك و ${loose}${unit}`; 
            } else if (cartons > 0) { 
                result = `${cartons} كرتونة`; 
            } else { 
                result = `${loose} ${unit}`; 
            }
        }
        
        return isNegative ? `-${result}` : result;
    }

    // تصنيف الصنف حسب الأولوية: 0 = سالب (الأعلى إلحاحاً) ، 1 = منخفض/قريب من النفاذ ، 2 = عادي ، 3 = صفر (الأخير)
    function getStatusCategory(item) {
        const factor   = Number(item.unitFactor) || 1;
        const totalPcs = Number(item.totalPcs)   || 0;
        const minPcs   = (Number(item.min) || 0) * factor;

        if (totalPcs < 0)  return 0;
        if (totalPcs === 0) return 3;
        if (totalPcs <= minPcs) return 1;
        return 2;
    }

    // الترتيب الذكي للأصناف: سالب ← قريب من النفاذ ← عادي ← صفر (مرتب حسب الأكثر استخداماً فالأقل)
    function sortAllItems() {
        allItems.sort((a, b) => {
            const catA = getStatusCategory(a);
            const catB = getStatusCategory(b);
            if (catA !== catB) return catA - catB;

            // مجموعة الصفر: الأكثر طلباً/استخداماً تاريخياً أولاً ثم الأقل
            if (catA === 3) {
                const usageA = usageMap.get(a.id) || 0;
                const usageB = usageMap.get(b.id) || 0;
                if (usageA !== usageB) return usageB - usageA;
                return (a.name || '').localeCompare(b.name || '', 'ar');
            }

            const qa = Number(a.totalPcs) || 0;
            const qb = Number(b.totalPcs) || 0;

            // العادي: الأعلى رصيداً أولاً | السالب والمنخفض: الأكثر إلحاحاً (الأقل/الأكثر سلبية) أولاً
            if (catA === 2) return qb - qa;
            return qa - qb;
        });
    }

    function updateStats() {
        let ok = 0, low = 0, zero = 0;
        allItems.forEach(item => {
            const factor   = Number(item.unitFactor) || 1;
            const totalPcs = Number(item.totalPcs)   || 0;
            const minPcs   = (Number(item.min) || 0) * factor;
            
            if (totalPcs <= 0)          zero++;
            else if (totalPcs <= minPcs) low++;
            else                         ok++;
        });
        document.getElementById('sTotal').textContent = allItems.length;
        document.getElementById('sOk').textContent    = ok;
        document.getElementById('sLow').textContent   = low;
        document.getElementById('sZero').textContent  = zero;
    }

    window.renderList = function() {
        const listBody = document.getElementById('listBody');
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        const list = term
            ? allItems.filter(i =>
                (i.name   ||'').toLowerCase().includes(term) ||
                (i.barcode||'').toLowerCase().includes(term))
            : allItems;

        document.getElementById('countBadge').textContent = list.length + ' صنف';

        if (list.length === 0) {
            listBody.classList.add('full-width');
            listBody.innerHTML =
                `<div class="empty-state"><i class="fas fa-box-open"></i><p>لا توجد نتائج بحث مطابقة</p></div>`;
            return;
        }

        listBody.classList.remove('full-width');

        // القائمة (list) محفوظة بنفس ترتيب allItems الذكي، لذا يكفي الفصل حسب الفئة دون إعادة ترتيب
        const negItems    = list.filter(i => (Number(i.totalPcs) || 0) < 0);
        const activeItems = list.filter(i => (Number(i.totalPcs) || 0) > 0);
        const zeroItems   = list.filter(i => (Number(i.totalPcs) || 0) === 0);

        let html = '';
        let n = 1;

        if (negItems.length > 0) {
            html += `<div class="zero-divider neg-divider">
                        <i class="fas fa-circle-exclamation"></i>
                        <em>رصيد بالسالب — يحتاج مراجعة عاجلة (${negItems.length})</em>
                     </div>`;
            negItems.forEach(item => { html += buildRow(item, n++); });
        }

        activeItems.forEach(item => { html += buildRow(item, n++); });

        if (zeroItems.length > 0) {
            html += `<div class="zero-divider">
                        <i class="fas fa-triangle-exclamation"></i>
                        <em>نفد المخزون — الأكثر طلباً أولاً (${zeroItems.length})</em>
                     </div>`;
            zeroItems.forEach(item => { html += buildRow(item, n++); });
        }

        listBody.innerHTML = html;
    };

    function buildRow(item, num) {
        const totalPcs = Number(item.totalPcs) || 0;
        const rawFactor  = item.unitFactor;
        const hasCartons = rawFactor !== undefined && rawFactor !== null && Number(rawFactor) > 1;
        const factor     = hasCartons ? Number(rawFactor) : 1;
        const minPcs = (Number(item.min) || 0) * (hasCartons ? factor : 1);

        let boxes = 0;
        let jars  = 0;
        
        if (hasCartons) {
            boxes = Math.trunc(totalPcs / factor);
            jars  = totalPcs % factor;
        } else {
            jars = totalPcs;
        }

        let status = 'ok';
        if (totalPcs <= 0)          status = 'zero';
        else if (totalPcs <= minPcs) status = 'low';

        const isNegative = totalPcs < 0;
        let rowClass = '';
        if (isNegative) rowClass = ' neg-row';
        else if (status === 'zero') rowClass = ' zero-row';
        else if (status === 'low') rowClass = ' low-row';

        const rawUnit = (item.unitName || '').trim();
        const unitName = (rawUnit && normalizeAr(rawUnit) !== normalizeAr('كرتونة')) ? rawUnit : 'قطعة';

        const boxesEmpty = boxes === 0;
        const jarsEmpty  = jars  === 0;

        const catHtml = item.category ? `<span class="cat-tag">${item.category}</span>` : '';
        const priceHtml = (item.sell !== undefined && item.sell !== null && item.sell !== '')
            ? `<span class="price-tag"><i class="fas fa-tag"></i>${Number(item.sell).toLocaleString()} ج.م</span>`
            : `<span class="price-tag no-price"><i class="fas fa-tag"></i>السعر غير محدد</span>`;

        const safeName = (item.name || 'بدون اسم').replace(/'/g, "\\'");

        return `
        <div class="item-card${rowClass}" onclick="showItemHistory('${item.id}', '${safeName}', false)">
            <span class="status-dot ${status}"></span>
            <div class="card-top">
                <div class="row-info">
                    <div class="row-name">${item.name || 'بدون اسم'}</div>
                    <div class="row-meta">${catHtml}${priceHtml}</div>
                </div>
                <div class="row-widgets">
                    <span class="row-num">${num}</span>
                    <div class="row-icon"><i class="fas fa-${status==='zero' ? 'box-open' : 'box'}"></i></div>
                </div>
            </div>
            <div class="row-qty">
                <div class="qty-chips">
                    <div class="qty-chip${boxesEmpty ? ' is-empty' : ''}">
                        <div class="qty-main ${status}">${boxes.toLocaleString()}</div>
                        <div class="qty-lbl">كرتونة</div>
                    </div>
                    <div class="qty-chip${jarsEmpty ? ' is-empty' : ''}">
                        <div class="qty-main ${status}">${jars.toLocaleString()}</div>
                        <div class="qty-lbl">${unitName}</div>
                    </div>
                </div>
                <div class="qty-total"><i class="fas fa-cubes"></i>إجمالي القطع: ${totalPcs.toLocaleString()}</div>
            </div>
        </div>`;
    }

    async function getRawDocs(forceRefresh) {
        const now = Date.now();
        const cacheValid = rawDocsCache && (now - cacheTimestamp) < CACHE_TTL_MS;
        if (cacheValid && !forceRefresh) {
            return rawDocsCache; 
        }

        const targetCollections = ["orders", "transactions", "purchase_orders", "supplier_transactions", "sales", "invoice", "invoices"];
        const docs = [];

        for (const colName of targetCollections) {
            try {
                const snap = await getDocs(collection(db, colName));
                snap.forEach(docSnap => docs.push({ id: docSnap.id, data: docSnap.data(), colName }));
            } catch(e) { console.warn(`تخطى الكولكشن: ${colName}`); }
        }

        try {
            const subOrderSnap = await getDocs(collectionGroup(db, 'orders'));
            subOrderSnap.forEach(docSnap => docs.push({ id: docSnap.id, data: docSnap.data(), colName: 'orders_sub' }));

            const subItemsSnap = await getDocs(collectionGroup(db, 'items'));
            subItemsSnap.forEach(docSnap => docs.push({ id: docSnap.id, data: docSnap.data(), colName: 'items_sub' }));
        } catch (e) { console.warn("تخطى مجموعات الـ Group الفرعية."); }

        rawDocsCache = docs;
        cacheTimestamp = now;
        return docs;
    }

    // حساب معدل استخدام كل صنف (إجمالي كمية المبيعات التاريخية) لترتيب مجموعة "نفد المخزون" حسب الأكثر طلباً
    async function computeUsageFrequency() {
        usageComputing = true;
        try {
            const rawDocs = await getRawDocs(false);
            const cleanText = (txt) => String(txt || '').trim().toLowerCase().replace(/\s+/g, ' ');

            const idMap = new Map(allItems.map(it => [cleanText(it.id), it]));

            const isPurchaseType = (t) => t.includes('supplier_transactions') || t.includes('شراء') || t.includes('purchase') || t.includes('وارد') || t.includes('تزويد') || t.includes('مورد');
            const isReturnType   = (t) => t.includes('return') || t.includes('مرتجع') || t.includes('ارتجاع');
            const isLossType     = (t) => t.includes('loss') || t.includes('تالف') || t.includes('اتلاف');

            const map = new Map();
            const addUsage = (id, qty) => map.set(id, (map.get(id) || 0) + qty);

            const scanObject = (obj, colName) => {
                if (!obj || typeof obj !== 'object') return;
                const rawType = cleanText(obj.type || obj.status || obj.actionType || colName || '');
                // نحتسب فقط عمليات البيع الفعلية فى معدل الاستخدام (نستبعد الشراء والمرتجع والتالف)
                if (obj.isReturn === true || isReturnType(rawType) || isPurchaseType(rawType) || isLossType(rawType)) return;

                let matchedItem = null;
                for (let key in obj) {
                    const lowerKey = key.toLowerCase();
                    if (lowerKey.includes('id') || lowerKey === 'code') {
                        const found = idMap.get(cleanText(obj[key]));
                        if (found) { matchedItem = found; break; }
                    }
                }
                if (!matchedItem) {
                    for (let key in obj) {
                        const lowerKey = key.toLowerCase();
                        if (lowerKey.includes('name') || lowerKey.includes('item') || lowerKey.includes('product')) {
                            const val = cleanText(obj[key]);
                            if (!val) continue;
                            matchedItem = allItems.find(it => it.name && val.includes(cleanText(it.name)));
                            if (matchedItem) break;
                        }
                    }
                }
                if (!matchedItem) return;

                let qty = 0;
                if (typeof obj.totalPieces === 'number' && obj.totalPieces > 0) {
                    qty = obj.totalPieces;
                } else {
                    for (let key in obj) {
                        const lowerKey = key.toLowerCase();
                        if (['totalpieces','qty','quantity','count','amount','totalpcs','pcs','number'].includes(lowerKey)) {
                            const parsed = parseInt(obj[key]);
                            if (!isNaN(parsed) && parsed > 0) { qty = parsed; break; }
                        }
                    }
                }
                if (qty > 0) addUsage(matchedItem.id, qty);
            };

            rawDocs.forEach(({ data, colName }) => {
                scanObject(data, colName);
                for (let key in data) {
                    if (Array.isArray(data[key])) {
                        data[key].forEach(sub => scanObject(sub, colName));
                    } else if (data[key] && typeof data[key] === 'object') {
                        scanObject(data[key], colName);
                    }
                }
            });

            usageMap = map;
            usageComputed = true;

            // إعادة ترتيب وعرض القائمة بعد توفر بيانات معدل الاستخدام (يؤثر فقط على ترتيب مجموعة الصفر)
            sortAllItems();
            renderList();
        } catch (e) {
            console.warn('تعذر حساب معدل الاستخدام للأصناف:', e.message);
        } finally {
            usageComputing = false;
        }
    }

    window.showItemHistory = async function(itemId, itemName, forceRefresh) {
        const modal = document.getElementById('historyModal');
        const modalTitle = document.getElementById('modalItemName');
        const modalBody = document.getElementById('modalBody');

        const safeItemName = itemName.replace(/'/g, "\\'");

        modalTitle.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
                <div>
                    <span style="color:#ffce31; font-weight:800; display:block; font-size:11px;">تفاصيل وتحليل الصنف:</span> ${itemName}
                </div>
                <div style="display:flex; gap:6px; align-items:center;">
                    <button onclick="event.stopPropagation(); exportModalPDF('${safeItemName}')" 
                            style="background:#d97706; border:none; color:#fff; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:800; cursor:pointer;">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <i class="fas fa-rotate" title="تحديث البيانات" style="font-size:13px; cursor:pointer; opacity:.9; background:rgba(255,255,255,0.15); padding:6px; border-radius:50%;"
                       onclick="event.stopPropagation(); window.showItemHistory('${itemId}', '${safeItemName}', true)"></i>
                </div>
            </div>`;
        
        modalBody.innerHTML = `<div class="loading"><div class="spinner"></div><p>${forceRefresh ? 'جاري إعادة جلب البيانات الحية...' : 'جاري فحص بناء لوحة التحليل...'}</p></div>`;
        modal.style.display = 'flex';

        try {
            const currentItemObj = allItems.find(i => i.id === itemId) || {};
            const capacity = Number(currentItemObj.unitFactor) || 1;
            const rawUnit = (currentItemObj.unitName || '').trim();
            const unit = (rawUnit && normalizeAr(rawUnit) !== normalizeAr('كرتونة')) ? rawUnit : 'قطعة';
            
            // جلب إجمالي المخزون الحالي بالقطع
            const currentStockPcs = Number(currentItemObj.totalPcs !== undefined ? currentItemObj.totalPcs : (currentItemObj.qty * capacity || 0)) || 0;

            const cleanText = (txt) => String(txt || '').trim().toLowerCase().replace(/\s+/g, ' ');
            const targetId = cleanText(itemId);
            const targetName = cleanText(itemName);

            // دالة استخراج أسماء الكيانات (مورد / عميل) بجميع الاحتمالات
            const extractEntityNames = (obj) => {
                let supp = obj.supplierName || obj.supplier || obj.supplier_name || obj.supplierTitle || obj.mowared || '';
                let cli = obj.clientName || obj.customerName || obj.customer || obj.client_name || obj.client || obj.customer_name || '';

                // فحص الحقول المفردة مثل name إذا لم يجد اسم صريح
                if (!supp && !cli) {
                    if (obj.name && typeof obj.name === 'string' && !cleanText(obj.name).includes(targetName)) {
                        supp = obj.name;
                    }
                }
                return { supp, cli };
            };

            const inspectObj = (obj) => {
                let match = false;
                let extractedQty = 0;

                for (let key in obj) {
                    const lowerKey = key.toLowerCase();
                    if (lowerKey.includes('id') || lowerKey.includes('key') || lowerKey === 'code') {
                        if (cleanText(obj[key]) === targetId && targetId !== '') match = true;
                    }
                    if (lowerKey.includes('name') || lowerKey.includes('title') || lowerKey.includes('item') || lowerKey.includes('product')) {
                        if (cleanText(obj[key]).includes(targetName) && targetName !== '') match = true;
                    }
                }

                if (match) {
                    if (typeof obj.totalPieces === 'number' && obj.totalPieces > 0) {
                        extractedQty = obj.totalPieces;
                    } else {
                        for (let key in obj) {
                            const lowerKey = key.toLowerCase();
                            if (['totalpieces', 'qty', 'quantity', 'count', 'amount', 'totalpcs', 'pcs', 'number', 'returnqty'].includes(lowerKey)) {
                                const parsed = parseInt(obj[key]);
                                if (!isNaN(parsed) && parsed > 0) { extractedQty = parsed; break; }
                            }
                        }
                    }
                    if (extractedQty === 0 && typeof obj.qty === 'number') extractedQty = obj.qty;
                    if (extractedQty === 0 && typeof obj.count === 'number') extractedQty = obj.count;
                }
                return { match, qty: extractedQty, isReturn: obj.isReturn === true };
            };

            let foundTransactions = [];

            const processDoc = (id, d, colName) => {
                const parentNames = extractEntityNames(d);

                const topResult = inspectObj(d);
                if (topResult.match && topResult.qty > 0) {
                    foundTransactions.push({ 
                        id, ...d, 
                        finalCalculatedQty: topResult.qty, 
                        isItemReturn: topResult.isReturn, 
                        detectedSource: colName,
                        parentSupplierName: parentNames.supp,
                        parentClientName: parentNames.cli
                    });
                }

                for (let key in d) {
                    if (Array.isArray(d[key])) {
                        d[key].forEach(subItem => {
                            if (subItem && typeof subItem === 'object') {
                                const subResult = inspectObj(subItem);
                                if (subResult.match && subResult.qty > 0) {
                                    const subNames = extractEntityNames(subItem);
                                    foundTransactions.push({ 
                                        id, ...d, 
                                        finalCalculatedQty: subResult.qty, 
                                        isItemReturn: subResult.isReturn, 
                                        detectedSource: colName,
                                        parentSupplierName: parentNames.supp || subNames.supp,
                                        parentClientName: parentNames.cli || subNames.cli
                                    });
                                }
                            }
                        });
                    } else if (d[key] && typeof d[key] === 'object') {
                        const subResult = inspectObj(d[key]);
                        if (subResult.match && subResult.qty > 0) {
                            const subNames = extractEntityNames(d[key]);
                            foundTransactions.push({ 
                                id, ...d, 
                                finalCalculatedQty: subResult.qty, 
                                isItemReturn: subResult.isReturn, 
                                detectedSource: colName,
                                parentSupplierName: parentNames.supp || subNames.supp,
                                parentClientName: parentNames.cli || subNames.cli
                            });
                        }
                    }
                }
            };

            const rawDocs = await getRawDocs(forceRefresh);
            rawDocs.forEach(({ id, data, colName }) => processDoc(id, data, colName));

            const uniqueTransactions = [];
            const seenIds = new Set();
            foundTransactions.forEach(t => {
                const uniqueKey = `${t.id}_${t.finalCalculatedQty}_${t.isItemReturn ? 'ret' : 'nor'}`;
                if (!seenIds.has(uniqueKey)) {
                    seenIds.add(uniqueKey);
                    uniqueTransactions.push(t);
                }
            });

            let totalPurchasesPcs = 0;
            let totalSalesPcs = 0;
            let totalReturnsPcs = 0;
            let totalLossesPcs = 0;

            uniqueTransactions.forEach(tx => {
                const rawType = cleanText(tx.type || tx.status || tx.actionType || tx.detectedSource || '');
                const qty = Number(tx.finalCalculatedQty) || 0;
                
                if (tx.isItemReturn) {
                    totalReturnsPcs += qty;
                } else if (rawType.includes('supplier_transactions') || rawType.includes('شراء') || rawType.includes('purchase') || rawType.includes('وارد') || rawType.includes('تزويد') || rawType.includes('مورد')) {
                    totalPurchasesPcs += qty;
                } else if (rawType.includes('return') || rawType.includes('مرتجع') || rawType.includes('ارتجاع')) {
                    totalReturnsPcs += qty;
                } else if (rawType.includes('loss') || rawType.includes('تالف') || rawType.includes('اتلاف')) {
                    totalLossesPcs += qty;
                } else {
                    totalSalesPcs += qty;
                }
            });

            // الجلب الدقيق لرصيد أول المدة
            let initialStockPcs = 0;
            if (currentItemObj.initQty !== undefined && currentItemObj.initQty !== null) {
                initialStockPcs = Number(currentItemObj.initQty);
            } else if (currentItemObj.initialQty !== undefined && currentItemObj.initialQty !== null) {
                initialStockPcs = Number(currentItemObj.initialQty);
            } else {
                initialStockPcs = currentStockPcs + totalSalesPcs + totalLossesPcs - totalPurchasesPcs - totalReturnsPcs;
            }

            uniqueTransactions.sort((a, b) => {
                const parseDate = (item) => {
                    const fireDate = item.date || item.createdAt || item.timestamp;
                    if (fireDate && typeof fireDate.toDate === 'function') return fireDate.toDate().getTime();
                    if (fireDate) {
                        const parsed = new Date(fireDate).getTime();
                        return isNaN(parsed) ? 0 : parsed;
                    }
                    return 0;
                };
                return parseDate(b) - parseDate(a); 
            });

            const initialStockTxt = formatQuantityDetailed(initialStockPcs, capacity, unit);
            const totalPurchasesTxt = formatQuantityDetailed(totalPurchasesPcs, capacity, unit);
            const totalSalesTxt = formatQuantityDetailed(totalSalesPcs, capacity, unit);
            const totalReturnsTxt = formatQuantityDetailed(totalReturnsPcs + totalLossesPcs, capacity, unit);
            const currentStockTxt = formatQuantityDetailed(currentStockPcs, capacity, unit);
            const usageCount = usageMap.get(itemId) || 0;
            const usageTxt = formatQuantityDetailed(usageCount, capacity, unit);

            let html = `
            <div class="modal-dashboard">
                <div class="mini-card mc-init">
                    <i class="fas fa-hourglass-start"></i>
                    <div class="mini-info">
                        <span class="mini-val">${initialStockTxt}</span>
                        <span class="mini-lbl">رصيد أول المدة</span>
                    </div>
                </div>
                <div class="mini-card mc-buy">
                    <i class="fas fa-circle-arrow-down"></i>
                    <div class="mini-info">
                        <span class="mini-val">+${totalPurchasesTxt}</span>
                        <span class="mini-lbl">إجمالي المشتريات</span>
                    </div>
                </div>
                <div class="mini-card mc-sell">
                    <i class="fas fa-circle-arrow-up"></i>
                    <div class="mini-info">
                        <span class="mini-val">-${totalSalesTxt}</span>
                        <span class="mini-lbl">إجمالي المبيعات</span>
                    </div>
                </div>
                <div class="mini-card mc-ret">
                    <i class="fas fa-rotate-left"></i>
                    <div class="mini-info">
                        <span class="mini-val">+${totalReturnsTxt}</span>
                        <span class="mini-lbl">المرتجعات والتالف</span>
                    </div>
                </div>
                <div class="mini-card mc-current">
                    <div class="mini-info" style="text-align: center;">
                        <span class="mini-val">${currentStockTxt}</span>
                        <span class="mini-lbl"><i class="fas fa-calculator" style="margin-left: 4px;"></i>الرصيد الحالي المتوفر بالمخزن</span>
                    </div>
                </div>
                ${usageComputed ? `
                <div class="mini-card mc-usage">
                    <div class="mini-info" style="text-align: center;">
                        <span class="mini-val"><i class="fas fa-fire" style="margin-left: 4px;"></i>${usageTxt}</span>
                        <span class="mini-lbl">معدل الاستخدام التاريخي (لترتيب الأولوية)</span>
                    </div>
                </div>` : ''}
            </div>

            <div class="section-title"><i class="fas fa-clipboard-list"></i> تفاصيل الحركات التاريخية</div>
            `;

            if (uniqueTransactions.length === 0) {
                html += `
                    <div class="empty-state">
                        <i class="fas fa-receipt" style="font-size:32px; color:var(--sub); opacity:0.3;"></i>
                        <p>لا توجد حركات بيع أو شراء مسجلة حالياً.</p>
                    </div>`;
                modalBody.innerHTML = html;
                return;
            }

            html += '<div class="history-list" id="modalHistoryList">';
            uniqueTransactions.forEach(tx => {
                let typeClass = 'sale';
                let typeText = 'بيع';
                let sign = '-';
                let amtClass = 'minus';

                const rawType = cleanText(tx.type || tx.status || tx.actionType || tx.detectedSource || '');
                const isPurchase = rawType.includes('supplier_transactions') || rawType.includes('شراء') || rawType.includes('purchase') || rawType.includes('وارد') || rawType.includes('تزويد') || rawType.includes('مورد');
                
                if (tx.isItemReturn) {
                    typeClass = 'return'; typeText = 'مرتجع'; sign = '+'; amtClass = 'plus';
                } else if (isPurchase) {
                    typeClass = 'purchase'; typeText = 'شراء'; sign = '+'; amtClass = 'plus';
                } else if (rawType.includes('return') || rawType.includes('مرتجع') || rawType.includes('ارتجاع')) {
                    typeClass = 'return'; typeText = 'مرتجع'; sign = '+'; amtClass = 'plus';
                } else if (rawType.includes('loss') || rawType.includes('تالف') || rawType.includes('اتلاف')) {
                    typeClass = 'loss'; typeText = 'تالف'; sign = '-'; amtClass = 'minus';
                }

                let dateStr = 'بدون تاريخ';
                const fireDate = tx.date || tx.createdAt || tx.timestamp;
                if (fireDate) {
                    const d = fireDate.toDate ? fireDate.toDate() : new Date(fireDate);
                    dateStr = d.toLocaleDateString('ar-EG', {year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                }

                // اختيار اسم المورد أو العميل
                let entityName = '';
                if (isPurchase) {
                    entityName = tx.parentSupplierName || tx.supplierName || tx.supplier || tx.supplier_name || tx.supplierTitle || tx.mowared || 'مورد غير محدد';
                } else {
                    entityName = tx.parentClientName || tx.clientName || tx.customerName || tx.customer || tx.client_name || tx.client || 'عميل غير محدد';
                }

                let subNoteHtml = '';
                if (tx.notes && tx.notes !== entityName) {
                    subNoteHtml = `<div class="tx-note">${tx.notes}</div>`;
                }

                const txQtyFormatted = formatQuantityDetailed(tx.finalCalculatedQty, capacity, unit);

                html += `
                <div class="tx-item">
                    <span class="tx-type ${typeClass}">${typeText}</span>
                    <div class="tx-details">
                        <div class="tx-title">${entityName}</div>
                        ${subNoteHtml}
                        <div class="tx-date"><i class="far fa-clock" style="margin-left:3px;"></i>${dateStr}</div>
                    </div>
                    <div class="tx-amount ${amtClass}">${sign}${txQtyFormatted}</div>
                </div>`;
            });
            html += '</div>';

            modalBody.innerHTML = html;

        } catch (err) {
            console.error(err);
            modalBody.innerHTML = `<div class="err-box"><i class="fas fa-exclamation-triangle"></i>فشل في بناء لوحة التحليل الذكية<br><small>${err.message}</small></div>`;
        }
    };

    window.closeHistoryModal = function() {
        document.getElementById('historyModal').style.display = 'none';
    };

    window.exportInventoryPDF = function() {
        if (!allItems || allItems.length === 0) {
            alert('لا توجد أصناف لتصديرها!');
            return;
        }

        const dateStr = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
        
        let tableRows = '';
        allItems.forEach((item, index) => {
            const totalPcs = Number(item.totalPcs) || 0;
            const price = (item.sell !== undefined && item.sell !== null && item.sell !== '') 
                ? `${Number(item.sell).toLocaleString()} ج.م` 
                : 'غير محدد';
            
            const rawFactor = item.unitFactor;
            const hasCartons = rawFactor !== undefined && rawFactor !== null && Number(rawFactor) > 1;
            const factor = hasCartons ? Number(rawFactor) : 1;

            const rawUnit = (item.unitName || '').trim();
            const unitName = (rawUnit && normalizeAr(rawUnit) !== normalizeAr('كرتونة')) ? rawUnit : 'قطعة';

            let stockText = '';
            if (hasCartons) {
                const boxes = Math.trunc(totalPcs / factor);
                const jars = totalPcs % factor;

                if (boxes > 0 && jars > 0) {
                    stockText = `<b>${boxes.toLocaleString()}</b> كرتونة و <b>${jars.toLocaleString()}</b> ${unitName}`;
                } else if (boxes > 0) {
                    stockText = `<b>${boxes.toLocaleString()}</b> كرتونة`;
                } else {
                    stockText = `<b>${jars.toLocaleString()}</b> ${unitName}`;
                }
                stockText += ` <span style="font-size:10px; color:#64748b; display:block;">(إجمالي ${totalPcs.toLocaleString()} قطعة)</span>`;
            } else {
                stockText = `<b>${totalPcs.toLocaleString()}</b> ${unitName}`;
            }

            tableRows += `
                <tr style="border-bottom: 1px solid #e2e8f0; text-align: center;">
                    <td style="padding: 8px;">${index + 1}</td>
                    <td style="padding: 8px; text-align: right; font-weight: bold;">${item.name || 'بدون اسم'}</td>
                    <td style="padding: 8px;">${item.category || 'عام'}</td>
                    <td style="padding: 8px; font-weight: bold; color: #0b5e3d;">${price}</td>
                    <td style="padding: 8px; ${totalPcs <= 0 ? 'color:#e11d48;' : ''}">${stockText}</td>
                </tr>
            `;
        });

        const template = document.getElementById('pdfExportTemplate');
        template.style.display = 'block';
        template.innerHTML = `
            <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #0b5e3d; padding-bottom: 10px;">
                <h2 style="color: #0b5e3d; margin-bottom: 4px;">شركة الزيادى لزيوت السيارات</h2>
                <h4 style="color: #64748b; font-weight: bold;">تقرير جرد الأصناف والمخزون الحقيقي</h4>
                <div style="font-size: 11px; color: #94a3b8; margin-top: 5px;">تاريخ التقرير: ${dateStr} | إجمالي الأصناف: ${allItems.length}</div>
            </div>

            <table style="width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px;">
                <thead>
                    <tr style="background: #0b5e3d; color: #ffffff;">
                        <th style="padding: 8px; width: 40px;">#</th>
                        <th style="padding: 8px; text-align: right;">اسم الصنف</th>
                        <th style="padding: 8px;">التصنيف</th>
                        <th style="padding: 8px;">سعر البيع</th>
                        <th style="padding: 8px;">الرصيد المتاح</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
        `;

        const opt = {
            margin:       10,
            filename:     `جرد_الأصناف_شركة_الزيادي_${new Date().toISOString().slice(0,10)}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(template).save().then(() => {
            template.style.display = 'none';
        });
    };

    window.exportModalPDF = function(itemName) {
        const modalBody = document.getElementById('modalBody');
        if (!modalBody) return;

        const dateStr = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
        const template = document.getElementById('pdfExportTemplate');
        
        template.style.display = 'block';
        template.innerHTML = `
            <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #0b5e3d; padding-bottom: 10px;">
                <h2 style="color: #0b5e3d; margin-bottom: 4px;">شركة الزيادى لزيوت السيارات</h2>
                <h3 style="color: #d97706;">تقرير حركة الصنف: ${itemName}</h3>
                <div style="font-size: 11px; color: #64748b; margin-top: 4px;">تاريخ التصدير: ${dateStr}</div>
            </div>
            ${modalBody.innerHTML}
        `;

        const opt = {
            margin:       10,
            filename:     `حركة_صنف_${itemName.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(template).save().then(() => {
            template.style.display = 'none';
        });
    };
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
