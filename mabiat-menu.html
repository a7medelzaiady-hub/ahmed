<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075e3d">
    <meta name="description" content="إدارة عمليات البيع وفواتير المبيعات - شركة الزيادي">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>إدارة المبيعات | شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            color-scheme: light;
            --brand: #0c8958;
            --brand-dark: #075e3d;
            --brand-light: #13a76e;
            --brand-tint: #e9f7ef;
            --surface: #f3faf7;
            --card: #ffffff;
            --ink: #153328;
            --ink-muted: #66786e;
            --border: #dcece3;
            --purple: #7954cc;
            --purple-tint: #f1ecfc;
            --blue: #2075bb;
            --blue-tint: #e8f3fd;
            --shadow: 0 8px 25px rgba(7, 94, 61, .08);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--surface);
            color: var(--ink);
            font-family: "Cairo", Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        button, a { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, a:focus-visible {
            outline: 3px solid #f5a623;
            outline-offset: 3px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(115deg, var(--brand-dark), var(--brand));
            color: #fff;
            box-shadow: 0 4px 16px rgba(7, 94, 61, .12);
        }

        .header-inner {
            width: min(100% - 28px, 920px);
            min-height: 72px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
        .brand-mark {
            flex: none;
            display: grid;
            place-items: center;
            width: 45px;
            height: 45px;
            border-radius: 14px;
            background: #fff;
            color: var(--brand-dark);
            font-size: 20px;
        }

        .brand-text { min-width: 0; }
        .brand-title {
            margin: 0;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            line-height: 1.35;
        }
        .brand-sub {
            margin: 2px 0 0;
            color: rgba(255,255,255,.83);
            font-size: 11px;
            line-height: 1.5;
        }

        .header-actions { display: flex; gap: 8px; flex: none; }
        .header-btn {
            display: inline-grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.23);
            background: rgba(255,255,255,.14);
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: background .18s ease, transform .18s ease;
        }
        .header-btn:hover { background: rgba(255,255,255,.25); }
        .header-btn:active { transform: scale(.96); }

        .main {
            width: min(100% - 28px, 920px);
            margin: 22px auto 48px;
        }

        .intro {
            position: relative;
            isolation: isolate;
            padding: 22px 24px;
            overflow: hidden;
            border-radius: 22px;
            background: linear-gradient(125deg, #08744c 0%, var(--brand) 74%, #14a86e 100%);
            color: #fff;
            box-shadow: var(--shadow);
        }
        .intro::before, .intro::after {
            content: "";
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            background: rgba(255,255,255,.07);
        }
        .intro::before { width: 180px; height: 180px; left: -70px; top: -100px; }
        .intro::after { width: 120px; height: 120px; right: -35px; bottom: -75px; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 700;
            color: #d2fae6;
            margin-bottom: 5px;
        }
        .intro h2 {
            margin: 0;
            font-size: clamp(19px, 3vw, 25px);
            font-weight: 900;
            line-height: 1.5;
        }
        .intro p {
            margin: 7px 0 0;
            font-size: 13px;
            line-height: 1.85;
            color: rgba(255,255,255,.89);
        }

        .section-head {
            margin: 22px 2px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .section-title {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--brand-dark);
            font-size: 16px;
            font-weight: 800;
        }
        .section-title i {
            display: grid;
            place-items: center;
            width: 29px;
            height: 29px;
            border-radius: 9px;
            background: var(--brand);
            color: #fff;
            font-size: 13px;
        }
        .section-meta {
            flex: none;
            color: var(--ink-muted);
            font-size: 11px;
            font-weight: 700;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .menu-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
            min-height: 150px;
            padding: 22px;
            text-decoration: none;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
        }
        .menu-card:hover {
            color: var(--ink);
            transform: translateY(-2px);
            border-color: #b9dec9;
            box-shadow: 0 12px 29px rgba(7,94,61,.13);
        }
        .menu-card:active { transform: scale(.99); }

        .icon-wrapper {
            flex: none;
            display: grid;
            place-items: center;
            width: 66px;
            height: 66px;
            border-radius: 19px;
            font-size: 26px;
        }
        .icon-purple { background: var(--purple-tint); color: var(--purple); }
        .icon-blue { background: var(--blue-tint); color: var(--blue); }

        .card-content { flex: 1; min-width: 0; }
        .card-title {
            display: block;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.65;
        }
        .card-desc {
            display: block;
            margin-top: 3px;
            font-size: 12px;
            line-height: 1.7;
            color: var(--ink-muted);
        }
        .card-next {
            display: grid;
            place-items: center;
            flex: none;
            width: 29px;
            height: 29px;
            border-radius: 50%;
            color: var(--brand-dark);
            background: var(--brand-tint);
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .main { margin-top: 15px; }
            .intro { padding: 19px 17px; border-radius: 18px; }
            .menu-grid { gap: 10px; }
            .menu-card {
                min-height: 173px;
                padding: 18px 10px;
                flex-direction: column;
                justify-content: center;
                text-align: center;
                gap: 8px;
                border-radius: 16px;
            }
            .icon-wrapper { width: 55px; height: 55px; border-radius: 16px; font-size: 23px; }
            .card-title { font-size: 13px; line-height: 1.55; }
            .card-desc { font-size: 10.5px; line-height: 1.55; }
            .card-next { display: none; }
            .section-head { margin-top: 18px; }
        }
        @media (max-width: 360px) {
            .header-inner { width: calc(100% - 20px); }
            .brand-title { font-size: 15px; }
            .brand-sub { font-size: 10px; }
            .header-btn { width: 39px; height: 39px; }
            .main { width: calc(100% - 20px); }
            .intro h2 { font-size: 19px; }
            .intro p { font-size: 12px; }
            .section-title { font-size: 14px; }
            .menu-card { padding: 14px 6px; }
            .card-title { font-size: 12px; }
            .card-desc { font-size: 10px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0s !important; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-cash-register"></i></div>
            <div class="brand-text">
                <h1 class="brand-title">إدارة المبيعات</h1>
                <p class="brand-sub">شركة الزيادي</p>
            </div>
        </div>

        <div class="header-actions">
            <button class="header-btn" type="button" id="refreshBtn" aria-label="تحديث الصفحة" title="تحديث الصفحة">
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            </button>
            <button class="header-btn" type="button" id="backBtn" aria-label="رجوع" title="رجوع">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</header>

<main class="main" id="mainContent">
    <section class="intro" aria-labelledby="introTitle">
        <div class="eyebrow"><i class="fa-solid fa-chart-line" aria-hidden="true"></i> قسم المبيعات</div>
        <h2 id="introTitle">كل عمليات البيع في مكان واحد</h2>
        <p>أنشئ فاتورة جديدة أو راجع فواتير المبيعات السابقة بسهولة.</p>
    </section>

    <section aria-labelledby="servicesTitle">
        <div class="section-head">
            <h2 class="section-title" id="servicesTitle">
                <i class="fa-solid fa-grip" aria-hidden="true"></i>
                خدمات المبيعات
            </h2>
            <span class="section-meta">خدمتان متاحتان</span>
        </div>
        <nav class="menu-grid" aria-label="قائمة المبيعات">
            <a href="sales-invoice.html" class="menu-card">
                <span class="icon-wrapper icon-purple" aria-hidden="true"><i class="fa-solid fa-cash-register"></i></span>
                <span class="card-content">
                    <span class="card-title">فاتورة بيع جديدة</span>
                    <span class="card-desc">إنشاء فاتورة وتسجيل عملية بيع</span>
                </span>
                <span class="card-next" aria-hidden="true"><i class="fa-solid fa-arrow-left"></i></span>
            </a>

            <a href="sales-history.html" class="menu-card">
                <span class="icon-wrapper icon-blue" aria-hidden="true"><i class="fa-solid fa-file-invoice"></i></span>
                <span class="card-content">
                    <span class="card-title">فواتير البيع</span>
                    <span class="card-desc">عرض الفواتير السابقة وإدارتها</span>
                </span>
                <span class="card-next" aria-hidden="true"><i class="fa-solid fa-arrow-left"></i></span>
            </a>
        </nav>
    </section>
</main>

<script>
(function () {
    'use strict';

    document.getElementById('refreshBtn').addEventListener('click', function () {
        window.location.reload();
    });

    document.getElementById('backBtn').addEventListener('click', function () {
        // Do not navigate to an unrelated external site or leave a directly opened PWA page blank.
        let hasInternalReferrer = false;
        try {
            hasInternalReferrer = Boolean(document.referrer) &&
                new URL(document.referrer).origin === window.location.origin;
        } catch (error) {
            hasInternalReferrer = false;
        }

        if (hasInternalReferrer && window.history.length > 1) {
            window.history.back();
        } else {
            window.location.assign('index.html');
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function (error) {
            console.warn('Service Worker registration failed:', error);
        });
    }
})();
</script>
</body>
</html>
