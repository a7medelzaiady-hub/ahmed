<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
    <script src="auth-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حمولة العربية - الزيادي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5e3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --brand:    #0b5e3d;
  --brand-d:  #0a4a31;
  --brand-lt: #eefaf1;
  --green:    #2d6a4f;
  --green-lt: #dcfce7;
  --red:      #d90429;
  --red-lt:   #fee2e2;
  --amber:    #e69500;
  --amber-lt: #fef3c7;
  --blue:     #0284c7;
  --blue-lt:  #e0f2fe;
  --gray:     #55635c;
  --surface:  #eef1f0;
  --card:     #ffffff;
  --border:   #c2d1cb;
  --text:     #111e18;
  --text-sm:  #334155;
  --radius:   14px;
  
  --shadow-3d: 0 6px 14px rgba(0, 0, 0, 0.07), 
               0 3px 4px rgba(0, 0, 0, 0.03), 
               inset 0 1px 0 rgba(255, 255, 255, 0.9);
               
  --shadow-3d-active: 0 10px 22px rgba(11,94,61,0.15), 
                      0 0 3px rgba(11,94,61,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--surface);color:var(--text);min-height:100vh;padding-bottom:30px;scroll-behavior: smooth;-webkit-tap-highlight-color: transparent;font-size: 15px;}

#app-content { display: none; }

nav {
  background: linear-gradient(135deg, #0b5e3d 0%, #0a4a31 100%); display: flex; align-items: center; padding: 4px 8px; position: sticky;
  top: 0; z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,.25); border-radius: 0 0 16px 16px; overflow-x: auto; white-space: nowrap; -ms-overflow-style: none; scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav .logo { color: #fff; font-size: 16px; font-weight: 800; padding: 12px 6px; margin-left: 6px; display: inline-block; text-decoration: none; }
nav button, nav a.nav-btn {
  background: none; border: none; color: rgba(255,255,255,.85); font-size: 14px; font-family: inherit;
  padding: 12px 10px; cursor: pointer; border-bottom: 3.5px solid transparent; transition: .2s; font-weight: 700; display: inline-block; text-decoration: none;
}
nav button.active, nav button:hover, nav a.nav-btn:hover { color: #fff; border-bottom-color: #6ee7b7; }

.page{display:none;padding:12px 8px;max-width:1200px;margin:auto;}
.page.active{display:block; animation: fadeIn 0.25s ease;}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

#pg-summary { max-width: 100%; padding: 10px 6px; }

.ph {margin-bottom:12px;}
.ph h2{font-size:19px;color:var(--text);font-weight:800;}
.ph p{font-size:13px;color:var(--gray);margin-top:2px;font-weight:600;}

.card{
  background:var(--card); border-radius:var(--radius); box-shadow: var(--shadow-3d); padding:12px; margin-bottom:12px;
  border: 1px solid var(--border); position: relative; transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.card h3{font-size:16px;color:var(--brand);margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:800;}

/* تحسين تنسيقات أدوات الأرشيف لمنع التداخل */
.archive-tools-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.archive-search-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.date-filter-wrap {
  display: flex; 
  align-items: center; 
  gap: 6px; 
  background: #fff; 
  padding: 6px 10px;
  border-radius: 10px; 
  border: 1.5px solid var(--border); 
  flex: 1;
  min-width: 0;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
}
.date-filter-wrap label { font-size: 13px; font-weight: 800; color: var(--brand); white-space: nowrap; }
.date-filter-wrap input[type=date], .date-filter-wrap input[type=text] {
  padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; background: #fff; width: 100%; font-weight:700; color:var(--text);
}

.summary-tab-nav { display: flex; gap: 6px; margin-bottom: 10px; background: #cbd5e1; padding: 4px; border-radius: 10px; }
.summary-tab-btn { flex: 1; padding: 8px 6px; border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 800; color: var(--text-sm); border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
.summary-tab-btn.active { background: var(--card); color: var(--brand); box-shadow: var(--shadow-3d); }

.frow-inline { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.load-boxes-row { display: flex; gap: 8px; width: 100%; }
.load-section-box { flex: 1; min-width: 0; background: #f8faf9; padding: 8px; border-radius: 10px; border: 1.5px solid var(--border); }
.load-section-title { font-size: 12px; font-weight: 800; color: var(--brand-d); margin-bottom: 6px; text-align: center; }
.load-inputs-flex { display: flex; gap: 6px; }

.field-inline { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.field-inline label { font-size: 11px; color: var(--text-sm); font-weight: 800; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field-inline input { padding: 8px 6px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--text); background: var(--surface); outline: none; width: 100%; transition: .2s; text-align: center; font-weight: bold; }
.field-inline input:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px rgba(11,94,61,.15); }

.action-buttons-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }

.btn{
  padding: 8px 12px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  transition: .2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1 1 auto;
}
.btn-primary{background:var(--brand);color:#fff; box-shadow: 0 3px 6px rgba(11,94,61,0.2);}
.btn-success{background:var(--green);color:#fff; box-shadow: 0 3px 6px rgba(45,106,79,0.2);}
.btn-danger{background:var(--red);color:#fff; box-shadow: 0 3px 6px rgba(217,4,41,0.2);}
.btn-amber{background:var(--amber);color:#fff; box-shadow: 0 3px 6px rgba(230,149,0,0.2);}
.btn-excel{background:#16a34a;color:#fff; box-shadow: 0 3px 6px rgba(22,163,74,0.2);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn:active { transform: scale(0.96); }

.summary-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-3d); padding: 10px 6px; margin-bottom: 12px; }

/* تنسيق كروت الأرشيف المحترف */
.archive-card {
  background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 10px;
  border: 1.5px solid var(--border); box-shadow: var(--shadow-3d); transition: all 0.2s ease;
  position: relative;
}
.archive-card:hover { box-shadow: var(--shadow-3d-active); }
.archive-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
.archive-card-title { font-size: 15px; font-weight: 800; color: var(--brand-d); display: flex; align-items: center; gap: 6px; }
.archive-status-badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 14px; }
.archive-status-badge.closed { background: var(--green-lt); color: var(--green); border: 1px solid #a3d9b1; }
.archive-status-badge.pending { background: var(--amber-lt); color: #8a5b00; border: 1px solid #ffe599; }
.archive-actions { 
  display: grid; 
  grid-template-columns: repeat(3, 1fr); 
  gap: 6px; 
  margin-top: 8px; 
  padding-top: 8px; 
  border-top: 1px dashed var(--border); 
}
.archive-actions .btn { flex: unset; width: 100%; padding: 7px 4px; font-size: 11px; }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 12px; backdrop-filter: blur(3px); }
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; box-shadow: 0 12px 28px rgba(0,0,0,0.25); animation: modalIn 0.2s ease-out; }
@keyframes modalIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; width: 100%; box-shadow: var(--shadow-3d); -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; min-width: 700px; }
th { background: var(--brand); color: #fff; padding: 10px 6px; text-align: center; font-weight: 800; white-space: nowrap; font-size: 13px; }
td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); font-weight: 700; vertical-align: middle; }

.empty{text-align:center;padding:24px 10px;color:var(--gray);font-size:14px;font-weight:700;}
.empty .em{font-size:28px;display:block;margin-bottom:6px;}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:12px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg);}}

#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(60px);background:#1b2e26;color:#fff;padding:8px 18px;border-radius:24px;font-size:12px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;z-index:999;width:max-content;max-width:92%;text-align:center;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<div id="app-content">
  <nav>
    <span class="logo">🛢️ الزيادي</span>
    <a href="index1.html" class="nav-btn" style="display:flex; align-items:center; gap:4px;">🏠 الرئيسية</a>
    <button onclick="showPage('pg-items',this)">📦 أصناف المخزن</button>
    <button onclick="showPage('pg-load',this)">⬆️ التحميل</button>
    <button onclick="showPage('pg-summary',this)">📊 الجرد والحركة</button>
    <button class="active admin-only" onclick="showPage('pg-archive',this)">🗄️ الأرشيف</button>
  </nav>

  <div class="page active" id="pg-archive">
    <div class="ph">
      <h2>🗄️ أرشيف الأيام السابقة</h2>
      <p>استعراض حمولة وجرد الأيام المسجلة، تصدير التقارير، أو المسح والتعديل</p>
    </div>
    
    <div class="archive-tools-grid">
      <div class="archive-search-row">
        <div class="date-filter-wrap">
          <label>📅 اختر يوماً:</label>
          <input type="date" id="archiveDate" onchange="window.fetchArchive()">
        </div>
        <button class="btn btn-primary" style="flex: 0 0 auto; min-width: 110px;" onclick="window.fetchArchive()">🔍 بحث واستعرض</button>
      </div>
      <button class="btn btn-amber" style="width: 100%;" onclick="startNewLoad()">🔄 تحميل جديد (المتبقي بالعربة)</button>
    </div>

    <div id="archiveContent">
      <div class="empty"><span class="em">📅</span>يرجى تحديد تاريخ أو البحث لاستعراض الكروت</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('app-content').style.display = 'block';

window.fetchArchive = async function() {
  const selectedDate = document.getElementById('archiveDate').value;
  const container = document.getElementById('archiveContent');
  container.innerHTML = '<div class="spin"></div>';

  try {
    let archivedLoadsMap = {};
    let archivedInventoryMap = {};

    if (selectedDate) {
      const [loadSnap, invSnap] = await Promise.all([
        getDoc(doc(db, 'archived_loads', selectedDate)),
        getDoc(doc(db, 'archived_inventory', selectedDate))
      ]);
      if (loadSnap.exists()) archivedLoadsMap[selectedDate] = loadSnap.data();
      if (invSnap.exists()) archivedInventoryMap[selectedDate] = invSnap.data();
    } else {
      const [loadSnap, invSnap] = await Promise.all([
        getDocs(collection(db, 'archived_loads')),
        getDocs(collection(db, 'archived_inventory'))
      ]);
      loadSnap.forEach(d => archivedLoadsMap[d.id] = d.data());
      invSnap.forEach(d => archivedInventoryMap[d.id] = d.data());
    }

    const allDates = Array.from(new Set([...Object.keys(archivedLoadsMap), ...Object.keys(archivedInventoryMap)])).sort().reverse();

    if (!allDates.length) {
      container.innerHTML = '<div class="empty"><span class="em">📭</span>لا توجد أي بيانات مؤرشفة حتى الآن</div>';
      return;
    }

    let cardsHtml = '';
    allDates.forEach(d => {
      const invData  = archivedInventoryMap[d];
      const loadData = archivedLoadsMap[d];

      const isClosed = !!invData;
      const user = (invData?.user || loadData?.user) || 'أحمد محمود الزيادي';

      cardsHtml += `
        <div class="archive-card" id="arch-card-${d}">
          <div class="archive-card-header" onclick="window.toggleArchiveDetails('${d}')" style="cursor:pointer;">
            <div class="archive-card-title">📅 يوم: ${d}</div>
            <span class="archive-status-badge ${isClosed ? 'closed' : 'pending'}">
              ${isClosed ? '🔒 مغلق نهائياً' : '⚠️ غير مغلق'}
            </span>
          </div>

          <div style="font-size:12px; color:var(--gray); margin-bottom:6px; font-weight:700;">
            👤 بواسطة: <b>${user}</b>
          </div>

          <div class="archive-actions">
            <button class="btn btn-primary btn-sm" onclick="window.toggleArchiveDetails('${d}')">👁️ التفاصيل</button>
            <button class="btn btn-amber btn-sm" onclick="window.loadArchiveToEdit('${d}')">✏️ تعديل</button>
            <button class="btn btn-danger btn-sm" onclick="window.exportArchivePDF('${d}')">📄 PDF</button>
            <button class="btn btn-excel btn-sm" onclick="window.exportArchiveExcel('${d}')">📊 Excel</button>
            <button class="btn btn-danger btn-sm admin-only" style="grid-column: span 2;" onclick="window.deleteArchiveDate('${d}')">🗑️ مسح السجل</button>
          </div>

          <div id="arch-details-${d}" style="display:none; margin-top:10px; padding-top:8px; border-top:1.5px dashed var(--border);"></div>
        </div>
      `;
    });

    container.innerHTML = cardsHtml;
  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="empty"><span class="em">❌</span>حدث خطأ أثناء جلب الأرشيف</div>';
  }
};

window.toast = function(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
};

window.fetchArchive();
</script>
</body>
</html>
