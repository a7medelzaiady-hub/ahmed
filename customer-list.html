<style>
  :root{
    --germany-black: #000000;
    --germany-gold: #FFCC00;
    --italy-green: #178a4a;
    --germany-red: #FF0000;
    --purple: #5b21b6;
    
    --ink: #000000;
    --paper: #f4f6f8;
    --panel: #ffffff;
    --line: #e5e9f0;
    --mute: #5a677d;
    
    --owed: var(--germany-red);
    --owed-bg: #fff1f1;
    --credit: var(--italy-green);
    --credit-bg: #eefaf2;
    
    --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
    --hover-shadow: 0 8px 24px rgba(0,0,0,0.12);
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }
  
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body{
    margin:0; background:#eceef1; color:var(--ink);
    font-family:'Cairo', sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom: 90px;
    font-size: 0.95rem;
  }

  .app-container {
    max-width: 500px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }
  
  .num { 
    font-family: 'Montserrat', 'Cairo', sans-serif !important; 
    font-weight: 800; 
    text-align: center;
  }

  header{
    background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
    color:#fff; 
    padding: 24px 20px 65px; 
    position:relative; 
    overflow:hidden;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); 
    border-bottom: 4px solid var(--germany-red);
  }
  header::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle at 80% 10%, rgba(255, 204, 0, 0.15), transparent 60%);
    pointer-events:none;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  
  .icon-link{
    color:#fff; background:rgba(255,255,255,.15);
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    text-decoration:none !important; font-size:.95rem; flex-shrink:0; transition:.2s ease;
    border: 1px solid rgba(255,255,255,0.1);
    outline: none;
  }
  .icon-link:active{ background:rgba(255,255,255,.3); transform: scale(0.9); }
  
  .brand{ text-align:center; }
  .brand .eyebrow{ font-size:.65rem; letter-spacing:1.5px; text-transform:uppercase; opacity:.9; font-weight:800; color: var(--germany-gold); }
  .brand h1{ font-size:1.15rem; font-weight:900; margin:3px 0 0; letter-spacing: -0.5px; color: #ffffff; }

  .search-wrap{ position:relative; z-index:1; margin-top:20px; display:flex; gap:10px; align-items:stretch; }
  .search-box{
    flex: 1;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    border-radius:16px; padding:12px 16px; display:flex; align-items:center; gap:10px;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .search-box:focus-within {
    background: rgba(255,255,255,0.2);
    border-color: var(--germany-gold);
  }
  .search-box i{ opacity:.9; font-size:.9rem; color: var(--germany-gold); }
  .search-box input{ background:transparent; border:none; outline:none; color:#fff; width:100%; font-family:'Cairo'; font-size:.9rem; font-weight: 600; }
  .search-box input::placeholder{ color:rgba(255,255,255,.65); }

  .danger-btn{
    width:48px; flex-shrink:0; background:var(--germany-red); border:1px solid rgba(255,0,0,0.2);
    color:#fff; font-size:1.05rem; border-radius:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:.2s ease;
    outline: none;
  }
  .danger-btn:active{ transform: scale(0.9); opacity:0.8; }

  .stats{
    position:relative; z-index:1; margin:-38px 16px 0; display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px;
  }
  .stat-card{
    background:var(--panel); border-radius:var(--radius-md); padding:12px 4px;
    box-shadow: var(--card-shadow); text-align:center;
    position: relative; min-width:0;
    border: 1px solid var(--line);
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; right: 0; left: 0; height: 4px; border-radius: 10px 10px 0 0;
  }
  .stat-card.owed::before{ background-color: var(--owed); }
  .stat-card.credit::before{ background-color: var(--credit); }
  .stat-card.net::before{ background-color: var(--germany-black); }
  
  .stat-card .lbl{ font-size:.65rem; color:var(--mute); font-weight:800; display: block; }
  .stat-card .val{ font-size:.9rem; margin-top:5px; font-weight:900; display: block; }
  .stat-card.owed .val{ color:var(--owed); }
  .stat-card.credit .val{ color:var(--credit); }
  .stat-card.net .val{ color:var(--germany-black); }
  .stat-card .cur{ font-size:.6rem; font-weight:800; color:var(--mute); margin-top: 2px;}

  .toolbar{
    margin:20px 16px 10px; display:flex; gap:8px; align-items:center; justify-content:space-between;
  }
  .filter-pills{ display:flex; gap:6px; }
  .pill{
    border: 1px solid var(--line); background:#fff; color:var(--mute); font-size:.78rem; font-weight:800;
    padding:8px 16px; border-radius:999px; cursor:pointer; transition:.2s ease;
    outline: none; font-family:'Cairo', sans-serif; white-space: nowrap;
  }
  .pill.active{ background:var(--germany-black); color:#fff; border-color:var(--germany-black); box-shadow: var(--card-shadow); }
  .pill:active{ transform: scale(0.95); }
  .count-tag{ font-size:.78rem; color:var(--germany-black); font-weight:800; }

  #customersContainer{ padding:6px 16px 0; }
  .customer-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:16px; margin-bottom:14px; display:flex; flex-direction: column;
    position: relative; transition:all 0.2s ease; box-shadow:var(--card-shadow);
  }
  .customer-card:hover {
    box-shadow: var(--hover-shadow);
    transform: translateY(-1px);
  }
  .customer-card::before {
    content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 6px; 
    border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
  }
  .customer-card.has-debt::before{ background-color:var(--owed); }
  .customer-card.is-credit::before{ background-color:var(--credit); }
  .customer-card.is-zero::before{ background-color:var(--mute); }

  .row-main{ display:flex; gap:12px; align-items:center; }
  
  .avatar{
    width:44px; height:44px; border-radius:14px; background:var(--owed-bg); color:var(--germany-black);
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.95rem; flex-shrink:0;
    border: 1px solid var(--line);
  }
  
  .customer-info-box { flex: 1; min-width: 0; }
  .customer-name{ font-weight:800; font-size:1rem; margin:0; color: var(--germany-black); }
  .phone-sub{ font-size:.75rem; color:var(--mute); font-weight:700; display:block; margin-top:4px; }
  
  .balance-strip {
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px;
    margin: 12px 0 14px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .balance-label{ font-size:.78rem; color:var(--mute); font-weight:800; }
  .balance-value{ font-weight:900; font-size:1.1rem; display: inline-flex; align-items: center; gap: 4px; }
  
  .text-debt{ color:var(--owed); }
  .text-credit{ color:var(--credit); }
  .text-zero{ color:var(--mute); }
  
  .tag{ font-size:.65rem; font-weight:800; padding:4px 10px; border-radius:8px; margin-right:8px; letter-spacing: 0.2px;}
  .tag.debt{ background:var(--owed-bg); color:var(--owed); }
  .tag.credit{ background:var(--credit-bg); color:var(--credit); }
  .tag.zero{ background:#e2e8f0; color:var(--mute); }

  .action-container{ 
    display:grid; 
    grid-template-columns: repeat(2, 1fr);
    gap:8px; 
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  .action-btn{
    height: 38px; 
    border-radius: var(--radius-sm); 
    display:flex; 
    align-items:center; 
    justify-content:center;
    gap: 6px;
    text-decoration:none !important; 
    font-size:.75rem; 
    font-weight: 800;
    transition:.15s; 
    border:1px solid transparent;
    cursor: pointer;
    font-family:'Cairo', sans-serif;
  }
  .action-btn:active{ transform:scale(0.95); }
  
  .btn-log{ background:#ffffff; color:var(--germany-black); border-color:var(--germany-black); }
  .btn-info{ background:var(--germany-black); color:#ffffff; border-color:var(--germany-black); }
  .btn-share-direct{ background:linear-gradient(135deg, #25d366, #128c7e); color:#ffffff; border-color:#128c7e; }
  .btn-del{ background:var(--owed-bg); color:var(--owed); border-color:rgba(255, 0, 0, 0.15); }
  .btn-analysis{ grid-column: span 2; background:var(--germany-gold); color:#000000; border-color:var(--germany-gold); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--mute); }
  .empty-state i{ font-size:2.5rem; opacity:.4; margin-bottom:12px; display:block; color: var(--germany-gold); }

  .statement-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10500;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(5px);
  }
  .statement-modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      height: 90vh;
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
      font-family: 'Cairo';
      overflow: hidden;
  }
  .statement-modal-header {
      padding: 14px 18px;
      background: var(--germany-black);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--germany-red);
  }
  .statement-modal-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      background: #f8fafc;
  }
  .statement-modal-footer {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
  }

  .statement-card-item {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: var(--card-shadow);
  }
  .statement-card-item.invoice-card { border-right: 4px solid var(--germany-black); }
  .statement-card-item.voucher-card { border-right: 4px solid var(--purple); background: #fcfbfe; }
  
  .statement-item-table {
      width: 100%;
      margin-top: 8px;
      font-size: 0.72rem;
      border-collapse: collapse;
  }
  .statement-item-table th { background: #f1f5f9; padding: 4px 6px; border: 1px solid #e2e8f0; font-weight: 800; text-align: center; }
  .statement-item-table td { padding: 4px 6px; border: 1px solid #e2e8f0; text-align: center; font-weight: 700; }

  .btn-share-full {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
  }
  .btn-share-full:disabled{
      opacity: 0.6;
      cursor: not-allowed;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 20000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-box {
    background: white;
    width: 86%;
    max-width: 340px;
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="top-row">
      <a href="client_menu.html" class="icon-link" title="رجوع"><i class="fas fa-arrow-right"></i></a>
      <div class="brand">
        <span class="eyebrow">شركة الزيادي</span>
        <h1>كشف حساب العملاء</h1>
      </div>
      <a href="index.html" class="icon-link" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <i class="fas fa-search"></i>

  <div class="stats">
    <div class="stat-card owed">

      <span class="cur">ج.م</span>
    </div>
    <div class="stat-card credit">
      <span class="lbl">إجمالي له</span>
      <span class="val num" id="totalCredit">0.00</span>
      <span class="cur">ج.م</span>
    </div>
    <div class="stat-card net">
      <span class="lbl">الصافي</span>
      <span class="val num" id="netBalance">0.00</span>
      <span class="cur">ج.م</span>

  <div class="toolbar">
    <div class="filter-pills">
      <button class="pill active" data-filter="all" onclick="setFilter('all')">الكل</button>
      <button class="pill" data-filter="debt" onclick="setFilter('debt')">عليه</button>
      <button class="pill" data-filter="credit" onclick="setFilter('credit')">له</button>

    <span class="count-tag" id="countTag"></span>
  </div>

  <div id="customersContainer">
    <div class="text-center py-5" id="initialLoader" style="text-align:center;padding:50px 0;">
      <i class="fas fa-circle-notch fa-spin" style="font-size:1.8rem;color:#000000;"></i>
      <p style="margin-top:10px;font-size:.85rem;font-weight:800;color:#7c8b82;">جاري تحميل كشف الحساب...</p>
    </div>
  </div>
</div>

<!-- النافذة المنبثقة التفصيلية لكشف حساب السجل -->
<div id="customerStatementModal" class="statement-modal-overlay">
    <div class="statement-modal-box">
        <div class="statement-modal-header">
            <h6 class="fw-bold mb-0" id="customerStatementTitle" style="font-size: 0.95rem; margin:0;">
                <i class="fas fa-file-invoice-dollar me-1" style="color:var(--germany-gold);"></i> كشف حساب السجل
            </h6>
            <button class="icon-link" onclick="closeCustomerStatement()" style="width:30px; height:30px; background:rgba(255,255,255,0.2); border:none; color:white;"><i class="fas fa-times"></i></button>

        <div class="statement-modal-body" id="customerStatementBody"></div>
        <div class="statement-modal-footer" style="flex-direction: column;">
            <button class="btn-share-full" id="shareStatementBtn" onclick="shareEntireStatement()"><i class="fas fa-share-nodes"></i> مشاركة كشف الحساب كاملاً</button>
            <button class="action-btn btn-info" onclick="exportCustomerStatementExcel()" style="width:100%;"><i class="fas fa-file-excel me-1"></i> تصدير إكسيل Excel</button>
        </div>

</div>

<!-- نافذة تحليل عميل واحد -->
<div id="customerAnalysisModal" class="statement-modal-overlay">
  <div class="statement-modal-box">
    <div class="statement-modal-header">
      <h6 id="customerAnalysisTitle" style="font-size:0.95rem; margin:0;"><i class="fas fa-chart-line" style="color:var(--germany-gold);"></i> تحليل العميل</h6>
      <button class="icon-link" onclick="document.getElementById('customerAnalysisModal').style.display='none'" style="width:30px; height:30px; background:rgba(255,255,255,0.2); border:none; color:white;"><i class="fas fa-times"></i></button>
    </div>
    <div class="statement-modal-body" id="customerAnalysisBody"></div>
  </div>
</div>

<!-- نافذة ترتيب وتحليل كل العملاء -->
<div id="allAnalysisModal" class="statement-modal-overlay">
  <div class="statement-modal-box">
    <div class="statement-modal-header">
      <h6 style="font-size:0.95rem; margin:0;"><i class="fas fa-ranking-star" style="color:var(--germany-gold);"></i> ترتيب وتحليل العملاء</h6>
      <button class="icon-link" onclick="document.getElementById('allAnalysisModal').style.display='none'" style="width:30px; height:30px; background:rgba(255,255,255,0.2); border:none; color:white;"><i class="fas fa-times"></i></button>
    </div>
    <div style="display:flex; gap:6px; padding:10px 12px 0; background:#f8fafc; overflow-x:auto;">
      <button class="pill active" data-rank="top" onclick="switchRank('top')">الأفضل مبيعاً</button>
      <button class="pill" data-rank="late" onclick="switchRank('late')">متأخرين سداد</button>
      <button class="pill" data-rank="idle" onclick="switchRank('idle')">الخاملين</button>
    </div>
    <div class="statement-modal-body" id="allAnalysisBody"></div>
  </div>
</div>

<!-- مودال شاشة التحميل للتجهيز الحراري -->
<div class="modal-overlay" id="shareLoadingModal">
  <div class="modal-box" style="max-width: 260px;">
    <div class="spinner-border text-success mb-3" role="status" style="width: 2.5rem; height: 2.5rem; border-color: #128c7e; border-right-color: transparent;"></div>
    <h6 class="fw-bold text-dark m-0" style="font-size: 0.8rem;">جاري إنشاء صورة كشف الحساب...</h6>
  </div>
</div>

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, orderBy, query, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a",

  };

  const app = initializeApp(firebaseConfig);
  let db;
  try {
      db = initializeFirestore(app, {
          localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
      });
  } catch (e) {
      db = getFirestore(app);
  }

  let allCustomers = [];
  let customersData = {};
  let customersNameMap = {};
  let currentFilter = 'all';

  const fmt = (n) => Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function normalizeName(str) {
      return String(str || '').trim().replace(/\s+/g, ' ').replace(/[\u064B-\u0652]/g, '').replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();
  }

  function convertToEnglishNumbers(str) {
      if (!str) return "";
      const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
      let res = str.toString();
      for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
      return res;
  }

  function parseArabicDateToMs(dateStr) {
      if (!dateStr) return 0;
      try {
          let cleanStr = convertToEnglishNumbers(String(dateStr)).replace(/ص/g, 'AM').replace(/م/g, 'PM');
          const parsed = Date.parse(cleanStr);
          if (!isNaN(parsed)) return parsed;
          const parts = cleanStr.match(/(\d+)/g);
          if (parts && parts.length >= 3) {
              let year = parseInt(parts[0]), month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
              if (year < 1000) { day = parseInt(parts[0]); month = parseInt(parts[1]) - 1; year = parseInt(parts[2]); }
              let hour = parts[3] ? parseInt(parts[3]) : 0, minute = parts[4] ? parseInt(parts[4]) : 0;
              if (cleanStr.includes('PM') && hour < 12) hour += 12;
              if (cleanStr.includes('AM') && hour === 12) hour = 0;
              return new Date(year, month, day, hour, minute).getTime();
          }
      } catch (e) { } return 0;
  }

  function cleanDateString(dateStr) {
      if (!dateStr) return "";
      dateStr = convertToEnglishNumbers(dateStr);
      const match = dateStr.match(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/) || dateStr.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/);
      return match ? match[0] : dateStr;
  }

  function parseInvoiceDate(inv) {
      let dateStr = "";
      if (inv.date) { dateStr = cleanDateString(inv.date); }
      else if (inv.timestamp?.seconds) { return new Date(inv.timestamp.seconds * 1000).toLocaleDateString('en-CA'); }
      if (!dateStr) return "";
      dateStr = convertToEnglishNumbers(dateStr);
      let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      return dateStr;
  }

  function parseVoucherDate(tr) {
      if (!tr) return "";
      if (tr.date) {
          let dateStr = convertToEnglishNumbers(tr.date);
          let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
          if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
          m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
          if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
          if (dateStr) return dateStr;
      }
      if (tr.timestamp?.seconds) { return new Date(tr.timestamp.seconds * 1000).toLocaleDateString('en-CA'); }
      return "";
  }

  function parseSignedNumber(val) {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return val;
    let s = String(val).trim().replace(/,/g, '');
    let negative = false;
    if (s.startsWith('(') && s.endsWith(')')) { negative = true; s = s.slice(1, -1); }
    if (s.endsWith('-')) { negative = true; s = s.slice(0, -1); }
    if (s.startsWith('-')) { negative = true; s = s.slice(1); }
    const n = parseFloat(s);
    if (isNaN(n)) return 0;
    return negative ? -n : n;
  }

  async function loadAllLedgerData() {
    const debtMap = {}; 

    const [invoicesSnap, transSnap] = await Promise.all([
      getDocs(collection(db, "invoices")),
      getDocs(collection(db, "transactions"))
    ]);

    invoicesSnap.forEach(d => {
      const data = d.data();
      if (data.isDeleted) return;
      const cid = data.customerId;
      if (!cid) return;
      debtMap[cid] = (debtMap[cid] || 0) + parseSignedNumber(data.remaining);
    });

    transSnap.forEach(d => {
      const tr = d.data();
      if (tr.isDeleted) return;
      const pid = tr.partyId || tr.customerId;
      if (!pid) return;
      let effect = 0;
      const amt = parseSignedNumber(tr.amount);
      if (tr.type === 'قبض') effect = -Math.abs(amt);
      else if (tr.type === 'صرف') effect = Math.abs(amt);
      debtMap[pid] = (debtMap[pid] || 0) + effect;
    });

    return debtMap;
  }

  async function loadCustomers() {
    const container = document.getElementById('customersContainer');
    try {
      const q = query(collection(db, "customers"), orderBy("name"));
      const [custSnap, debtMap] = await Promise.all([getDocs(q), loadAllLedgerData()]);

      customersData = {};
      customersNameMap = {};

      allCustomers = custSnap.docs.map(d => {
        const data = d.data();
        const initial = parseSignedNumber(data.initialBalance);
        const ledgerEffect = debtMap[d.id] || 0;
        
        customersData[d.id] = { id: d.id, name: data.name, initialBalance: initial };
        if (data.name) customersNameMap[normalizeName(data.name)] = d.id;

        return {
          id: d.id,
          ...data,
          realBalance: initial + ledgerEffect
        };
      });

      allCustomers.sort((a, b) => b.realBalance - a.realBalance);

      renderCustomers(allCustomers);
      updateStats(allCustomers);

    } catch (e) {
      container.innerHTML = `<div style="color:#ff0000;text-align:center;padding:20px;font-weight:700;">خطأ: ${e.message}</div>`;
    }
  }

  function updateStats(list) {
    let totalOwed = 0, totalCredit = 0;
    list.forEach(c => {
      if (c.realBalance > 0) totalOwed += c.realBalance;
      else if (c.realBalance < 0) totalCredit += Math.abs(c.realBalance);
    });
    document.getElementById('totalOwed').textContent = fmt(totalOwed);
    document.getElementById('totalCredit').textContent = fmt(totalCredit);
    const net = totalOwed - totalCredit;
    const netEl = document.getElementById('netBalance');
    netEl.textContent = (net < 0 ? '-' : '') + fmt(net);
  }

  function balanceMeta(balance) {
    if (balance > 0) return { cls: 'has-debt', txtCls: 'text-debt', tagCls: 'debt', tagTxt: 'عليه' };
    if (balance < 0) return { cls: 'is-credit', txtCls: 'text-credit', tagCls: 'credit', tagTxt: 'له' };
    return { cls: 'is-zero', txtCls: 'text-zero', tagCls: 'zero', tagTxt: 'خالص' };
  }

  function initials(name) {
    if (!name) return '؟';
    const parts = name.trim().split(' ');
    return parts.length > 1 ? (parts[0][0] + parts[1][0]) : parts[0].slice(0, 2);
  }

  window.openCustomerStatement = async (customerId, customerName) => {

      if (isCashCustomer) {

          const [invSnap, transSnap] = await Promise.all([
              getDocs(collection(db, "invoices")),
              getDocs(collection(db, "transactions"))
          ]);

          const targetKey = customerId || ("NAME_" + normalizeName(customerName));
          let events = [];

          invSnap.forEach(d => {
              const data = d.data();
              if (data.isDeleted) return;
              let key = data.customerId;
              if (!key && data.customerName) key = customersNameMap[normalizeName(data.customerName)];
              if (!key && data.customerName) key = "NAME_" + normalizeName(data.customerName);
              if (!key || key !== targetKey) return;

              const calculatedCash = Number(data.cashAmount ?? data.cashPaid ?? data.paid) || 0;
              const calculatedWallet = Number(data.walletAmount ?? data.walletPaid) || 0;
              const total = Number(data.total) || 0;
              const paid = calculatedCash + calculatedWallet;
              const remaining = total - paid;
              const timeMs = data.timestamp?.seconds ? (data.timestamp.seconds * 1000) : parseArabicDateToMs(data.time || data.date);

              events.push({
                  type: 'invoice',
                  timeMs,
                  date: parseInvoiceDate(data),
                  paymentMethod: data.paymentMethod || 'غير محدد',
                  cashPaid: calculatedCash,
                  walletPaid: calculatedWallet,
                  items: data.items || [],
                  total: total,
                  debit: remaining,
                  credit: 0
              });
          });

          transSnap.forEach(d => {
              const tr = d.data();
              if (tr.isDeleted) return;
              const isInvoicePayment = tr.invoiceId || (tr.note && tr.note.includes('فاتورة'));
              if (isInvoicePayment) return;

              let key = tr.partyId || tr.customerId;
              let partyName = tr.customerName || tr.partyName;
              if (!key && partyName) key = customersNameMap[normalizeName(partyName)];
              if (!key && partyName) key = "NAME_" + normalizeName(partyName);
              if (!key || key !== targetKey) return;

              const amt = Math.abs(Number(tr.amount || tr.total || 0));
              const timeMs = tr.timestamp?.seconds ? (tr.timestamp.seconds * 1000) : parseArabicDateToMs(tr.date || tr.time);

              events.push({
                  type: 'voucher',
                  timeMs,
                  date: parseVoucherDate(tr),
                  voucherType: tr.type,
                  method: tr.method || 'نقدى',
                  note: tr.note || '',
                  amt: amt,
                  debit: tr.type === 'صرف' ? amt : 0,
                  credit: tr.type === 'قبض' ? amt : 0
              });
          });

          events.sort((a, b) => a.timeMs - b.timeMs);

          let baseBalance = 0;
          if (customerId && customersData[customerId]) baseBalance = Number(customersData[customerId].initialBalance || 0);

          let running = baseBalance;
          window.currentStatementRows = [];
          window.currentStatementCustomerName = customerName || 'عميل';

          let renderedCards = [];

          if (baseBalance !== 0) {
              renderedCards.push({
                  timeMs: 0,
                  html: `
                  <div class="statement-card-item bg-light">
                      <div class="d-flex justify-content-between align-items-center">
                          <span class="fw-bold text-secondary">رصيد افتتاحي سابق</span>
                          <span class="num fw-bold text-dark">${baseBalance.toFixed(2)}</span>
                      </div>
                  </div>`
              });
              window.currentStatementRows.push({ date: '', desc: 'رصيد افتتاحي', items: '-', payDetails: '-', debit: '', credit: '', balance: baseBalance });
          }

          events.forEach(ev => {
              running += ev.debit - ev.credit;

              const remainingLabel = ev.debit >= 0 ? "المتبقي عليه من فاتورة اليوم" : "المتبقي له من فاتورة اليوم";
              const balanceLabel = running >= 0 ? "الصافي عليه" : "الصافي له";

              if (ev.type === 'invoice') {
                  let itemsRowsHtml = (ev.items || []).map(i => `
                      <tr>
                          <td style="text-align:right;">${i.name}</td>
                          <td>${i.qty}</td>
                          <td>${(Number(i.price)||0).toFixed(1)}</td>
                          <td class="num">${((Number(i.qty)||0)*(Number(i.price)||0)).toFixed(1)}</td>
                      </tr>`).join('');

                  let payInfoHtml = [];
                  if (ev.cashPaid > 0) payInfoHtml.push(`كاش: <b>${ev.cashPaid.toFixed(2)}</b>`);
                  if (ev.walletPaid > 0) payInfoHtml.push(`محفظة: <b>${ev.walletPaid.toFixed(2)}</b>`);

                  renderedCards.push({
                      timeMs: ev.timeMs,
                      html: `
                      <div class="statement-card-item invoice-card">
                          <div class="d-flex justify-content-between align-items-center mb-1">
                              <span class="badge bg-dark" style="font-size:0.75rem; color:white; padding:2px 8px; border-radius:6px;"><i class="fas fa-file-invoice me-1"></i> فاتورة مبيعات</span>
                              <span class="text-muted fw-bold" style="font-size:0.72rem;"><i class="far fa-clock"></i> ${ev.date || '-'}</span>
                          </div>
                          
                          <div class="d-flex justify-content-between align-items-center my-2 p-2 bg-light rounded" style="font-size:0.8rem;">
                              <span>إجمالي الفاتورة: <b class="num">${ev.total.toFixed(2)}</b></span>
                              <span>طريقة السداد: <b class="text-primary">${ev.paymentMethod}</b></span>
                          </div>

                          ${payInfoHtml.length > 0 ? `<div class="text-muted mb-2" style="font-size:0.73rem;">مدفوعات الفاتورة: ${payInfoHtml.join(' | ')}</div>` : ''}

                          ${ev.items && ev.items.length > 0 ? `
                              <table class="statement-item-table">
                                  <thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
                                  <tbody>${itemsRowsHtml}</tbody>
                              </table>
                          ` : '<div class="text-muted text-center py-1" style="font-size:0.72rem;">بلا أصناف تفصيلية</div>'}

                          <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top" style="font-size:0.78rem;">
                              <span class="${ev.debit >= 0 ? 'text-danger' : 'text-success'} fw-bold">${remainingLabel}: <span class="num">${Math.abs(ev.debit).toFixed(2)}</span></span>
                              <span class="fw-bold">${balanceLabel}: <span class="num ${running >= 0 ? 'text-danger' : 'text-success'}">${Math.abs(running).toFixed(2)}</span></span>
                          </div>
                      </div>`
                  });

              } else {
                  renderedCards.push({
                      timeMs: ev.timeMs,
                      html: `
                      <div class="statement-card-item voucher-card">
                          <div class="d-flex justify-content-between align-items-center mb-1">
                              <span class="badge" style="background:var(--purple); color:white; font-size:0.75rem; padding:2px 8px; border-radius:6px;"><i class="fas fa-hand-holding-usd me-1"></i> ${ev.voucherType === 'صرف' ? 'سند صرف' : 'سند قبض'} (${ev.method})</span>
                              <span class="text-muted fw-bold" style="font-size:0.72rem;"><i class="far fa-clock"></i> ${ev.date || '-'}</span>
                          </div>
                          ${ev.note ? `<div class="text-dark my-1 fw-bold" style="font-size:0.78rem;"><i class="fas fa-comment-alt me-1 text-muted"></i> ${ev.note}</div>` : ''}
                          
                          <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top" style="font-size:0.78rem;">
                              <span class="text-success fw-bold">المبلغ المستلم: <span class="num">${ev.credit.toFixed(2)}</span></span>
                              <span class="fw-bold">${balanceLabel}: <span class="num ${running >= 0 ? 'text-danger' : 'text-success'}">${Math.abs(running).toFixed(2)}</span></span>
                          </div>
                      </div>`
                  });
              }

              window.currentStatementRows.push({ 
                  date: ev.date, 
                  desc: ev.type === 'invoice' ? `فاتورة (${ev.total})` : `سند قبض (${ev.amt})`, 
                  items: ev.type === 'invoice' ? (ev.items || []).map(i => `${i.name} (${i.qty}×${i.price})`).join(' ، ') : '-',
                  payDetails: ev.type === 'invoice' ? `${ev.paymentMethod} (كاش: ${ev.cashPaid} | محفظة: ${ev.walletPaid})` : ev.method,
                  debit: ev.debit || '', 
                  credit: ev.credit || '', 
                  balance: running 
              });
          });

          if (events.length === 0 && baseBalance === 0) {
              body.innerHTML = `<div class="empty-state py-4"><i class="fas fa-folder-open fa-2x mb-2"></i><p class="fw-bold mb-0">لا توجد حركات تسديد أو فواتير لهذا العميل.</p></div>`;
              return;
          }

          renderedCards.sort((a, b) => b.timeMs - a.timeMs);

          body.innerHTML = `<div class="alert alert-danger text-center p-3 my-2" style="border-radius:14px; font-weight:700;">تعذر تحميل كشف الحساب: ${err.message}</div>`;
      }
  };

  /* دالة تصوير كشف الحساب بالكامل دفعة واحدة الموثوقة، مع معالجة كل حالات الفشل */
  window.shareEntireStatement = function() {
      const statementBody = document.getElementById('customerStatementBody');
      if (!statementBody || !statementBody.children.length) {
          alert("لا يوجد كشف حساب متاح لمشاركته حالياً.");
          return;
      }

      const loadingModal = document.getElementById('shareLoadingModal');
      const shareBtn = document.getElementById('shareStatementBtn');
      if (shareBtn) shareBtn.disabled = true;
      loadingModal.style.display = 'flex';

      const finish = () => {
          loadingModal.style.display = 'none';
          if (shareBtn) shareBtn.disabled = false;
      };

      html2canvas(statementBody, {
          scale: 2,
          backgroundColor: "#ffffff",
          useCORS: true,
          allowTaint: false,
          scrollX: 0,
          scrollY: 0
      }).then(canvas => {
          canvas.toBlob((blob) => {
              if (!blob) {
                  finish();
                  alert("تعذر إنشاء الصورة (فشل تحويل الكشف إلى صورة). حاول مرة أخرى.");
                  return;
              }

              const fileName = `كشف_حساب_${window.currentStatementCustomerName || 'عميل'}.png`;
              const file = new File([blob], fileName, { type: 'image/png' });

              const downloadBlob = () => {
                  const url = URL.createObjectURL(blob);
                  const link = document.createElement('a');
                  link.download = fileName;
                  link.href = url;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  setTimeout(() => URL.revokeObjectURL(url), 2000);
              };

              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                  navigator.share({
                      files: [file],
                      title: `كشف حساب - ${window.currentStatementCustomerName || 'عميل'}`,
                      text: `كشف الحساب الخاص بـ ${window.currentStatementCustomerName || 'العميل'} - شركة الزيادي`
                  }).then(() => {
                      finish();
                  }).catch(err => {
                      finish();
                      // المستخدم لغى المشاركة بنفسه، لا داعي لتنزيل الملف أو إظهار خطأ
                      if (err && err.name === 'AbortError') return;
                      console.log('تعذرت المشاركة، سيتم تنزيل الصورة مباشرة:', err);
                      downloadBlob();
                  });
              } else {
                  finish();
                  downloadBlob();
              }
          }, 'image/png');
      }).catch(err => {
          finish();
          console.error(err);
          alert("حدث خطأ أثناء إنشاء الصورة: " + err.message);
      });
  };

  window.exportCustomerStatementExcel = () => {
      if (!window.currentStatementRows || window.currentStatementRows.length === 0) {
          alert("لا توجد بيانات لتصديرها بعد.");

      try {
          const wsData = [["التاريخ", "الحركة", "الأصناف", "طريقة السداد", "مستحق", "مسدد", "الرصيد"]];
          window.currentStatementRows.forEach(r => wsData.push([r.date, r.desc, r.items, r.payDetails, r.debit, r.credit, r.balance]));
          const ws = XLSX.utils.aoa_to_sheet(wsData);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "كشف حساب تفصيلي");

      } catch (err) {
          console.error("خطأ في تصدير كشف الحساب:", err);
          alert("تعذر تصدير الملف: " + err.message);

  function applyFilters() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    let filtered = allCustomers.filter(c =>
      (c.name && c.name.toLowerCase().includes(term)) ||
      (c.phone && c.phone.includes(term))
    );
    if (currentFilter === 'debt') filtered = filtered.filter(c => c.realBalance > 0);
    if (currentFilter === 'credit') filtered = filtered.filter(c => c.realBalance < 0);
    filtered.sort((a, b) => b.realBalance - a.realBalance);
    renderCustomers(filtered);
    updateStats(filtered);
  }

  window.filterCustomers = applyFilters;

  window.setFilter = (f) => {
    currentFilter = f;
    document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.toggle('active', p.dataset.filter === f));
    applyFilters();
  };

  window.deleteCustomer = async (id, name) => {
    if (!confirm(`هل أنت متأكد من مسح العميل "${name}"؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
    try {
      await deleteDoc(doc(db, 'customers', id));
      allCustomers = allCustomers.filter(c => c.id !== id);
      applyFilters();
    } catch (err) {
      alert('خطأ أثناء المسح: ' + err.message);
    }
  };

  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    if (allCustomers.length === 0) return;
    const sure1 = confirm(`سيتم مسح ${allCustomers.length} عميل نهائياً من قاعدة البيانات. هل أنت متأكد؟`);
    if (!sure1) return;
    const sure2 = confirm('تأكيد أخير: هذا الإجراء لا يمكن التراجع عنه. متابعة؟');
    if (!sure2) return;

    try {
      await Promise.all(allCustomers.map(c => deleteDoc(doc(db, 'customers', c.id))));
      allCustomers = [];
      applyFilters();
    } catch (err) {
      alert('خطأ أثناء مسح العملاء: ' + err.message);
    }
  });

  /* ================= تحليل أداء عميل واحد ================= */
  window.openCustomerAnalysis = async (customerId, customerName) => {
    const modal = document.getElementById('customerAnalysisModal');
    const body = document.getElementById('customerAnalysisBody');
    document.getElementById('customerAnalysisTitle').innerHTML =
      '<i class="fas fa-chart-line" style="color:var(--germany-gold);"></i> تحليل: ' + (customerName || 'عميل');
    body.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>جاري تحليل البيانات...</div>';
    modal.style.display = 'flex';

    try {
      const [invSnap, transSnap] = await Promise.all([
        getDocs(collection(db, "invoices")),
        getDocs(collection(db, "transactions"))
      ]);

      const matchKey = (id, name) => {
        let key = id;
        if (!key && name) key = customersNameMap[normalizeName(name)];
        if (!key && name) key = "NAME_" + normalizeName(name);
        return key;
      };

      let invoices = [];
      let vouchersCollected = 0;
      const itemsMap = {};

      invSnap.forEach(d => {
        const data = d.data();
        if (data.isDeleted) return;
        if (matchKey(data.customerId, data.customerName) !== customerId) return;

        const cash = Number(data.cashAmount ?? data.cashPaid ?? data.paid) || 0;
        const wallet = Number(data.walletAmount ?? data.walletPaid) || 0;
        const total = Number(data.total) || 0;
        const timeMs = data.timestamp?.seconds ? data.timestamp.seconds * 1000 : parseArabicDateToMs(data.time || data.date);
        invoices.push({ timeMs, total, paid: cash + wallet });

        (data.items || []).forEach(i => {
          if (i.isReturn) return;
          const n = i.name || 'غير معروف';
          if (!itemsMap[n]) itemsMap[n] = { qty: 0, value: 0 };
          itemsMap[n].qty += Number(i.qty) || 0;
          itemsMap[n].value += (Number(i.qty) || 0) * (Number(i.price) || 0);
        });
      });

      transSnap.forEach(d => {
        const tr = d.data();
        if (tr.isDeleted) return;
        if (tr.invoiceId || (tr.note && tr.note.includes('فاتورة'))) return;
        const key = matchKey(tr.partyId || tr.customerId, tr.customerName || tr.partyName);
        if (key !== customerId) return;
        const amt = Math.abs(Number(tr.amount || tr.total || 0));
        if (tr.type === 'قبض') vouchersCollected += amt;
        else if (tr.type === 'صرف') vouchersCollected -= amt;
      });

      if (invoices.length === 0) {
        body.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i>لا توجد فواتير لهذا العميل للتحليل.</div>';
        return;
      }

      invoices.sort((a, b) => a.timeMs - b.timeMs);

      const count = invoices.length;
      const totalSales = invoices.reduce((s, i) => s + i.total, 0);
      const paidOnInvoices = invoices.reduce((s, i) => s + i.paid, 0);
      const collected = paidOnInvoices + vouchersCollected;
      const avgInvoice = totalSales / count;
      const collectionRate = totalSales > 0 ? Math.min(100, (collected / totalSales) * 100) : 100;

      const lastMs = invoices[count - 1].timeMs;
      const firstMs = invoices[0].timeMs;
      const daysSince = lastMs ? Math.floor((Date.now() - lastMs) / 86400000) : null;
      let avgGap = null;
      if (count > 1 && lastMs && firstMs) avgGap = Math.round((lastMs - firstMs) / 86400000 / (count - 1));

      const cust = allCustomers.find(c => c.id === customerId);
      const balance = cust ? cust.realBalance : 0;

      // آخر 6 شهور
      const months = [];
      const now = new Date();
      for (let k = 5; k >= 0; k--) {
        const dt = new Date(now.getFullYear(), now.getMonth() - k, 1);
        months.push({ y: dt.getFullYear(), m: dt.getMonth(), label: (dt.getMonth() + 1) + '/' + String(dt.getFullYear()).slice(2), sum: 0 });
      }
      invoices.forEach(inv => {
        if (!inv.timeMs) return;
        const dt = new Date(inv.timeMs);
        const slot = months.find(x => x.y === dt.getFullYear() && x.m === dt.getMonth());
        if (slot) slot.sum += inv.total;
      });
      const maxMonth = Math.max(...months.map(x => x.sum), 1);
      const barsHtml = months.map(x =>
        '<div style="flex:1; text-align:center;">' +
          '<div style="height:70px; display:flex; align-items:flex-end; justify-content:center;">' +
            '<div style="width:70%; height:' + Math.max(3, (x.sum / maxMonth) * 70) + 'px; background:#000; border-radius:4px 4px 0 0;"></div>' +
          '</div>' +
          '<div style="font-size:.6rem; font-weight:800; color:#5a677d;">' + x.label + '</div>' +
          '<div class="num" style="font-size:.6rem;">' + Math.round(x.sum) + '</div>' +
        '</div>').join('');

      // أكتر الأصناف
      const topItems = Object.entries(itemsMap).sort((a, b) => b[1].value - a[1].value).slice(0, 5);
      const itemsHtml = topItems.map(([n, v]) =>
        '<tr><td style="text-align:right;">' + n + '</td><td>' + v.qty + '</td><td class="num">' + v.value.toFixed(0) + '</td></tr>').join('');

      // التقييم
      let rating = { txt: 'جيد', color: '#178a4a', bg: '#eefaf2', note: 'عميل منتظم.' };
      const inactive = daysSince !== null && daysSince > Math.max(60, (avgGap || 30) * 2.5);
      if (inactive) rating = { txt: 'خامل', color: '#b45309', bg: '#fffbeb', note: 'مبقاش بيشتري بنفس معدله، يستاهل تواصل.' };
      else if (balance > 0 && collectionRate < 50) rating = { txt: 'متأخر في السداد', color: '#FF0000', bg: '#fff1f1', note: 'نسبة التحصيل ضعيفة والرصيد عليه كبير.' };
      else if (collectionRate >= 90 && !inactive) rating = { txt: 'ممتاز', color: '#178a4a', bg: '#eefaf2', note: 'بيشتري بانتظام وبيسدد.' };

      const box = (lbl, val, color) =>
        '<div style="background:#fff; border:1px solid #e5e9f0; border-radius:12px; padding:10px 4px; text-align:center;">' +
        '<div style="font-size:.65rem; color:#5a677d; font-weight:800;">' + lbl + '</div>' +
        '<div class="num" style="font-size:.9rem; margin-top:4px; color:' + (color || '#000') + ';">' + val + '</div></div>';

      body.innerHTML =
        '<div style="background:' + rating.bg + '; border:1px solid ' + rating.color + '; border-radius:14px; padding:12px; text-align:center; margin-bottom:10px;">' +
          '<div style="font-weight:900; font-size:1.1rem; color:' + rating.color + ';">' + rating.txt + '</div>' +
          '<div style="font-size:.75rem; font-weight:700; margin-top:2px;">' + rating.note + '</div>' +
        '</div>' +
        '<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;">' +
          box('عدد الفواتير', count) +
          box('إجمالي المبيعات', fmt(totalSales)) +
          box('متوسط الفاتورة', fmt(avgInvoice)) +
          box('نسبة التحصيل', collectionRate.toFixed(0) + '%', collectionRate < 50 ? '#FF0000' : '#178a4a') +
          box('آخر شراء', daysSince !== null ? 'من ' + daysSince + ' يوم' : '-') +
          box('بيشتري كل', avgGap !== null ? avgGap + ' يوم' : '-') +
        '</div>' +
        '<div style="background:#fff; border:1px solid #e5e9f0; border-radius:12px; padding:10px; margin-bottom:10px; display:flex; justify-content:space-between; font-weight:800; font-size:.85rem;">' +
          '<span>الرصيد الحالي</span>' +
          '<span class="num" style="color:' + (balance > 0 ? '#FF0000' : balance < 0 ? '#178a4a' : '#5a677d') + ';">' + fmt(balance) + ' ' + (balance > 0 ? 'عليه' : balance < 0 ? 'له' : 'خالص') + '</span>' +
        '</div>' +
        '<div style="background:#fff; border:1px solid #e5e9f0; border-radius:12px; padding:10px; margin-bottom:10px;">' +
          '<div style="font-weight:900; font-size:.8rem; margin-bottom:6px;">مبيعات آخر 6 شهور</div>' +
          '<div style="display:flex; gap:4px;">' + barsHtml + '</div>' +
        '</div>' +
        '<div style="background:#fff; border:1px solid #e5e9f0; border-radius:12px; padding:10px;">' +
          '<div style="font-weight:900; font-size:.8rem; margin-bottom:6px;">أكتر الأصناف شراءً</div>' +
          '<table class="statement-item-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>القيمة</th></tr></thead><tbody>' + itemsHtml + '</tbody></table>' +
        '</div>';

    } catch (err) {
      console.error(err);
      body.innerHTML = '<div style="color:#f00; text-align:center; padding:20px; font-weight:700;">تعذر التحليل: ' + err.message + '</div>';
    }
  };

  /* ================= ترتيب وتحليل كل العملاء ================= */
  window._rankData = [];

  window.openAllCustomersAnalysis = async () => {
    const modal = document.getElementById('allAnalysisModal');
    const body = document.getElementById('allAnalysisBody');
    body.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>جاري تحليل كل العملاء...</div>';
    modal.style.display = 'flex';

    try {
      const [invSnap, transSnap] = await Promise.all([
        getDocs(collection(db, "invoices")),
        getDocs(collection(db, "transactions"))
      ]);

      const matchKey = (id, name) => {
        let key = id;
        if (!key && name) key = customersNameMap[normalizeName(name)];
        return key;
      };

      const stats = {};
      const get = (id) => stats[id] || (stats[id] = { count: 0, sales: 0, paid: 0, vouchers: 0, times: [] });

      invSnap.forEach(d => {
        const data = d.data();
        if (data.isDeleted) return;
        const key = matchKey(data.customerId, data.customerName);
        if (!key) return;
        const cash = Number(data.cashAmount ?? data.cashPaid ?? data.paid) || 0;
        const wallet = Number(data.walletAmount ?? data.walletPaid) || 0;
        const s = get(key);
        s.count++;
        s.sales += Number(data.total) || 0;
        s.paid += cash + wallet;
        const t = data.timestamp?.seconds ? data.timestamp.seconds * 1000 : parseArabicDateToMs(data.time || data.date);
        if (t) s.times.push(t);
      });

      transSnap.forEach(d => {
        const tr = d.data();
        if (tr.isDeleted) return;
        if (tr.invoiceId || (tr.note && tr.note.includes('فاتورة'))) return;
        const key = matchKey(tr.partyId || tr.customerId, tr.customerName || tr.partyName);
        if (!key) return;
        const amt = Math.abs(Number(tr.amount || tr.total || 0));
        if (tr.type === 'قبض') get(key).vouchers += amt;
        else if (tr.type === 'صرف') get(key).vouchers -= amt;
      });

      const now = Date.now();
      window._rankData = allCustomers.filter(c => stats[c.id]).map(c => {
        const s = stats[c.id];
        s.times.sort((a, b) => a - b);
        const last = s.times.length ? s.times[s.times.length - 1] : 0;
        const first = s.times.length ? s.times[0] : 0;
        const daysSince = last ? Math.floor((now - last) / 86400000) : null;
        const avgGap = s.count > 1 && last && first ? Math.round((last - first) / 86400000 / (s.count - 1)) : null;
        const rate = s.sales > 0 ? Math.min(100, ((s.paid + s.vouchers) / s.sales) * 100) : 100;
        const idle = daysSince !== null && daysSince > Math.max(60, (avgGap || 30) * 2.5);
        return { id: c.id, name: c.name, balance: c.realBalance, count: s.count, sales: s.sales, rate, daysSince, idle };
      });

      switchRank('top');
    } catch (err) {
      console.error(err);
      body.innerHTML = '<div style="color:#f00; text-align:center; padding:20px; font-weight:700;">تعذر التحليل: ' + err.message + '</div>';
    }
  };

  window.switchRank = (tab) => {
    document.querySelectorAll('[data-rank]').forEach(p => p.classList.toggle('active', p.dataset.rank === tab));
    const body = document.getElementById('allAnalysisBody');
    let list = [...window._rankData];
    let sub;

    if (tab === 'top') {
      list.sort((a, b) => b.sales - a.sales);
      sub = c => 'مبيعات: <b class="num">' + fmt(c.sales) + '</b> | فواتير: ' + c.count;
    } else if (tab === 'late') {
      list = list.filter(c => c.balance > 0).sort((a, b) => b.balance - a.balance);
      sub = c => 'عليه: <b class="num" style="color:#FF0000;">' + fmt(c.balance) + '</b> | تحصيل: ' + c.rate.toFixed(0) + '%';
    } else {
      list = list.filter(c => c.idle).sort((a, b) => b.daysSince - a.daysSince);
      sub = c => 'آخر شراء من <b class="num">' + c.daysSince + '</b> يوم | مبيعاته: ' + fmt(c.sales);
    }

    if (list.length === 0) {
      body.innerHTML = '<div class="empty-state"><i class="fas fa-circle-check"></i>لا يوجد عملاء في هذه القائمة.</div>';
      return;
    }

    body.innerHTML = list.slice(0, 50).map((c, i) =>
      '<div class="statement-card-item" style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="document.getElementById(\'allAnalysisModal\').style.display=\'none\'; openCustomerAnalysis(\'' + c.id + '\', \'' + (c.name || '').replace(/'/g, "\\'") + '\')">' +
        '<div class="num" style="width:28px; height:28px; border-radius:50%; background:' + (i < 3 && tab === 'top' ? '#FFCC00' : '#e2e8f0') + '; display:flex; align-items:center; justify-content:center; font-size:.75rem; flex-shrink:0;">' + (i + 1) + '</div>' +
        '<div style="flex:1; min-width:0;">' +
          '<div style="font-weight:800; font-size:.9rem;">' + c.name + '</div>' +
          '<div style="font-size:.72rem; color:#5a677d; font-weight:700; margin-top:2px;">' + sub(c) + '</div>' +
        '</div>' +
        '<i class="fas fa-chevron-left" style="color:#cbd5e1;"></i>' +
      '</div>').join('');
  };

  loadCustomers();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
</body>
