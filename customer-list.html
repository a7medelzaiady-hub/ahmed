<style>
  :root{
    --germany-black: #000000;
    --germany-gold: #FFCC00;
    --italy-green: #178a4a;
    --germany-red: #FF0000;
    --purple: #5b21b6;
    
    --ink: #000000;
    --paper: #f4f6f8;
    --panel: #ffffff;
    --line: #e5e9f0;
    --mute: #5a677d;
    
    --owed: var(--germany-red);
    --owed-bg: #fff1f1;
    --credit: var(--italy-green);
    --credit-bg: #eefaf2;
    
    --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
    --hover-shadow: 0 8px 24px rgba(0,0,0,0.12);
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }
  
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body{
    margin:0; background:#eceef1; color:var(--ink);
    font-family:'Cairo', sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom: 90px;
    font-size: 0.95rem;
  }

  .app-container {
    max-width: 500px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }
  
  .num { 
    font-family: 'Montserrat', 'Cairo', sans-serif !important; 
    font-weight: 800; 
    text-align: center;
  }

  header{
    background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
    color:#fff; 
    padding: 24px 20px 65px; 
    position:relative; 
    overflow:hidden;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); 
    border-bottom: 4px solid var(--germany-red);
  }
  header::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle at 80% 10%, rgba(255, 204, 0, 0.15), transparent 60%);
    pointer-events:none;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  
  .icon-link{
    color:#fff; background:rgba(255,255,255,.15);
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    text-decoration:none !important; font-size:.95rem; flex-shrink:0; transition:.2s ease;
    border: 1px solid rgba(255,255,255,0.1);
    outline: none;
  }
  .icon-link:active{ background:rgba(255,255,255,.3); transform: scale(0.9); }
  
  .brand{ text-align:center; }
  .brand .eyebrow{ font-size:.65rem; letter-spacing:1.5px; text-transform:uppercase; opacity:.9; font-weight:800; color: var(--germany-gold); }
  .brand h1{ font-size:1.15rem; font-weight:900; margin:3px 0 0; letter-spacing: -0.5px; color: #ffffff; }

  .search-wrap{ position:relative; z-index:1; margin-top:20px; display:flex; gap:10px; align-items:stretch; }
  .search-box{
    flex: 1;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    border-radius:16px; padding:12px 16px; display:flex; align-items:center; gap:10px;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .search-box:focus-within {
    background: rgba(255,255,255,0.2);
    border-color: var(--germany-gold);
  }
  .search-box i{ opacity:.9; font-size:.9rem; color: var(--germany-gold); }
  .search-box input{ background:transparent; border:none; outline:none; color:#fff; width:100%; font-family:'Cairo'; font-size:.9rem; font-weight: 600; }
  .search-box input::placeholder{ color:rgba(255,255,255,.65); }

  .danger-btn{
    width:48px; flex-shrink:0; background:var(--germany-red); border:1px solid rgba(255,0,0,0.2);
    color:#fff; font-size:1.05rem; border-radius:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:.2s ease;
    outline: none;
  }
  .danger-btn:active{ transform: scale(0.9); opacity:0.8; }

  .stats{
    position:relative; z-index:1; margin:-38px 16px 0; display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px;
  }
  .stat-card{
    background:var(--panel); border-radius:var(--radius-md); padding:12px 4px;
    box-shadow: var(--card-shadow); text-align:center;
    position: relative; min-width:0;
    border: 1px solid var(--line);
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; right: 0; left: 0; height: 4px; border-radius: 10px 10px 0 0;
  }
  .stat-card.owed::before{ background-color: var(--owed); }
  .stat-card.credit::before{ background-color: var(--credit); }
  .stat-card.net::before{ background-color: var(--germany-black); }
  
  .stat-card .lbl{ font-size:.65rem; color:var(--mute); font-weight:800; display: block; }
  .stat-card .val{ font-size:.9rem; margin-top:5px; font-weight:900; display: block; }
  .stat-card.owed .val{ color:var(--owed); }
  .stat-card.credit .val{ color:var(--credit); }
  .stat-card.net .val{ color:var(--germany-black); }

  .toolbar{
    margin:20px 16px 10px; display:flex; gap:8px; align-items:center; justify-content:space-between;

  .filter-pills{ display:flex; gap:6px; }
  .pill{
    border: 1px solid var(--line); background:#fff; color:var(--mute); font-size:.78rem; font-weight:800;
    padding:8px 16px; border-radius:999px; cursor:pointer; transition:.2s ease;

  .pill.active{ background:var(--germany-black); color:#fff; border-color:var(--germany-black); box-shadow: var(--card-shadow); }

  .count-tag{ font-size:.78rem; color:var(--germany-black); font-weight:800; }

  #customersContainer{ padding:6px 16px 0; }
  .customer-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:16px; margin-bottom:14px; display:flex; flex-direction: column;
    position: relative; transition:all 0.2s ease; box-shadow:var(--card-shadow);

  .customer-card:hover {
    box-shadow: var(--hover-shadow);
    transform: translateY(-1px);
  }
  .customer-card::before {
    content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 6px; 
    border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
  }
  .customer-card.has-debt::before{ background-color:var(--owed); }
  .customer-card.is-credit::before{ background-color:var(--credit); }
  .customer-card.is-zero::before{ background-color:var(--mute); }

  .row-main{ display:flex; gap:12px; align-items:center; }
  
  .avatar{
    width:44px; height:44px; border-radius:14px; background:var(--owed-bg); color:var(--germany-black);
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.95rem; flex-shrink:0;

  .customer-name{ font-weight:800; font-size:1rem; margin:0; color: var(--germany-black); }
  .phone-sub{ font-size:.75rem; color:var(--mute); font-weight:700; display:block; margin-top:4px; }
  
  .balance-strip {
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px;
    margin: 12px 0 14px 0;

    justify-content: space-between;

  .balance-value{ font-weight:900; font-size:1.1rem; display: inline-flex; align-items: center; gap: 4px; }
  
  .text-debt{ color:var(--owed); }
  .text-credit{ color:var(--credit); }
  .text-zero{ color:var(--mute); }
  
  .tag{ font-size:.65rem; font-weight:800; padding:4px 10px; border-radius:8px; margin-right:8px; letter-spacing: 0.2px;}
  .tag.debt{ background:var(--owed-bg); color:var(--owed); }
  .tag.credit{ background:var(--credit-bg); color:var(--credit); }
  .tag.zero{ background:#e2e8f0; color:var(--mute); }

  .action-container{ 
    display:grid; 
    grid-template-columns: repeat(2, 1fr);
    gap:8px; 
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  .action-btn{
    height: 38px; 
    border-radius: var(--radius-sm); 
    display:flex; 
    align-items:center; 
    justify-content:center;
    gap: 6px;
    text-decoration:none !important; 
    font-size:.75rem; 
    font-weight: 800;
    transition:.15s; 
    border:1px solid transparent;
    cursor: pointer;
  }
  .action-btn:active{ transform:scale(0.95); }
  
  .btn-log{ background:#ffffff; color:var(--germany-black); border-color:var(--germany-black); }
  .btn-info{ background:var(--germany-black); color:#ffffff; border-color:var(--germany-black); }
  .btn-share-direct{ background:linear-gradient(135deg, #25d366, #128c7e); color:#ffffff; border-color:#128c7e; }
  .btn-del{ background:var(--owed-bg); color:var(--owed); border-color:rgba(255, 0, 0, 0.15); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--mute); }
  .empty-state i{ font-size:2.5rem; opacity:.4; margin-bottom:12px; display:block; color: var(--germany-gold); }

  .statement-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10500;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(5px);
  }
  .statement-modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      height: 90vh;
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
      font-family: 'Cairo';
      overflow: hidden;
  }
  .statement-modal-header {
      padding: 14px 18px;
      background: var(--germany-black);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--germany-red);
  }
  .statement-modal-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      background: #f8fafc;
  }
  .statement-modal-footer {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
  }

  .statement-card-item {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: var(--card-shadow);
  }
  .statement-card-item.invoice-card { border-right: 4px solid var(--germany-black); }
  .statement-card-item.voucher-card { border-right: 4px solid var(--purple); background: #fcfbfe; }
  
  .statement-item-table {
      width: 100%;
      margin-top: 8px;
      font-size: 0.72rem;
      border-collapse: collapse;

  .statement-item-table th { background: #f1f5f9; padding: 4px 6px; border: 1px solid #e2e8f0; font-weight: 800; text-align: center; }
  .statement-item-table td { padding: 4px 6px; border: 1px solid #e2e8f0; text-align: center; font-weight: 700; }

  .btn-share-full {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 20000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-box {
    background: white;
    width: 86%;
    max-width: 340px;
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="app-container">

<!-- النافذة المنبثقة التفصيلية لكشف حساب السجل -->
<div id="customerStatementModal" class="statement-modal-overlay">

<!-- مودال شاشة التحميل للتجهيز الحراري -->

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, collection, getDocs, orderBy, query, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a",
    measurementId: "G-WE04GK5XZZ"
  };

  const app = initializeApp(firebaseConfig);
  let db;
  try {
      db = initializeFirestore(app, {
          localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
      });
  } catch (e) {
      db = getFirestore(app);
  }

  let allCustomers = [];
  let customersData = {};
  let customersNameMap = {};
  let currentFilter = 'all';

  const fmt = (n) => Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function normalizeName(str) {
      return String(str || '').trim().replace(/\s+/g, ' ').replace(/[\u064B-\u0652]/g, '').replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();
  }

  function convertToEnglishNumbers(str) {
      if (!str) return "";
      const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
      let res = str.toString();
      for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
      return res;
  }

  function parseArabicDateToMs(dateStr) {
      if (!dateStr) return 0;
      try {
          let cleanStr = convertToEnglishNumbers(String(dateStr)).replace(/ص/g, 'AM').replace(/م/g, 'PM');
          const parsed = Date.parse(cleanStr);
          if (!isNaN(parsed)) return parsed;
          const parts = cleanStr.match(/(\d+)/g);
          if (parts && parts.length >= 3) {
              let year = parseInt(parts[0]), month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
              if (year < 1000) { day = parseInt(parts[0]); month = parseInt(parts[1]) - 1; year = parseInt(parts[2]); }
              let hour = parts[3] ? parseInt(parts[3]) : 0, minute = parts[4] ? parseInt(parts[4]) : 0;
              if (cleanStr.includes('PM') && hour < 12) hour += 12;
              if (cleanStr.includes('AM') && hour === 12) hour = 0;
              return new Date(year, month, day, hour, minute).getTime();
          }
      } catch (e) { } return 0;
  }

  function cleanDateString(dateStr) {
      if (!dateStr) return "";
      dateStr = convertToEnglishNumbers(dateStr);
      const match = dateStr.match(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/) || dateStr.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/);
      return match ? match[0] : dateStr;
  }

  function parseInvoiceDate(inv) {
      let dateStr = "";
      if (inv.date) { dateStr = cleanDateString(inv.date); }
      else if (inv.timestamp?.seconds) { return new Date(inv.timestamp.seconds * 1000).toLocaleDateString('en-CA'); }
      if (!dateStr) return "";
      dateStr = convertToEnglishNumbers(dateStr);
      let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      return dateStr;
  }

  function parseVoucherDate(tr) {
      if (!tr) return "";
      if (tr.date) {
          let dateStr = convertToEnglishNumbers(tr.date);
          let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
          if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
          m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
          if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
          if (dateStr) return dateStr;
      }
      if (tr.timestamp?.seconds) { return new Date(tr.timestamp.seconds * 1000).toLocaleDateString('en-CA'); }
      return "";
  }

  function parseSignedNumber(val) {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return val;
    let s = String(val).trim().replace(/,/g, '');
    let negative = false;
    if (s.startsWith('(') && s.endsWith(')')) { negative = true; s = s.slice(1, -1); }
    if (s.endsWith('-')) { negative = true; s = s.slice(0, -1); }
    if (s.startsWith('-')) { negative = true; s = s.slice(1); }
    const n = parseFloat(s);
    if (isNaN(n)) return 0;
    return negative ? -n : n;
  }

  async function loadAllLedgerData() {
    const debtMap = {}; 

    const [invoicesSnap, transSnap] = await Promise.all([
      getDocs(collection(db, "invoices")),
      getDocs(collection(db, "transactions"))
    ]);

    invoicesSnap.forEach(d => {
      const data = d.data();
      if (data.isDeleted) return;
      const cid = data.customerId;
      if (!cid) return;
      debtMap[cid] = (debtMap[cid] || 0) + parseSignedNumber(data.remaining);
    });

    transSnap.forEach(d => {
      const tr = d.data();
      if (tr.isDeleted) return;
      const pid = tr.partyId || tr.customerId;
      if (!pid) return;
      let effect = 0;
      const amt = parseSignedNumber(tr.amount);
      if (tr.type === 'قبض') effect = -Math.abs(amt);
      else if (tr.type === 'صرف') effect = Math.abs(amt);
      debtMap[pid] = (debtMap[pid] || 0) + effect;
    });

    return debtMap;
  }

  async function loadCustomers() {
    const container = document.getElementById('customersContainer');
    try {
      const q = query(collection(db, "customers"), orderBy("name"));
      const [custSnap, debtMap] = await Promise.all([getDocs(q), loadAllLedgerData()]);

      customersData = {};
      customersNameMap = {};

      allCustomers = custSnap.docs.map(d => {
        const data = d.data();
        const initial = parseSignedNumber(data.initialBalance);
        const ledgerEffect = debtMap[d.id] || 0;
        
        customersData[d.id] = { id: d.id, name: data.name, initialBalance: initial };
        if (data.name) customersNameMap[normalizeName(data.name)] = d.id;

        return {
          id: d.id,
          ...data,
          realBalance: initial + ledgerEffect
        };
      });

      allCustomers.sort((a, b) => b.realBalance - a.realBalance);

      renderCustomers(allCustomers);
      updateStats(allCustomers);

    } catch (e) {
      container.innerHTML = `<div style="color:#ff0000;text-align:center;padding:20px;font-weight:700;">خطأ: ${e.message}</div>`;
    }
  }

  function updateStats(list) {
    let totalOwed = 0, totalCredit = 0;
    list.forEach(c => {
      if (c.realBalance > 0) totalOwed += c.realBalance;
      else if (c.realBalance < 0) totalCredit += Math.abs(c.realBalance);
    });
    document.getElementById('totalOwed').textContent = fmt(totalOwed);
    document.getElementById('totalCredit').textContent = fmt(totalCredit);
    const net = totalOwed - totalCredit;
    const netEl = document.getElementById('netBalance');
    netEl.textContent = (net < 0 ? '-' : '') + fmt(net);
  }

  function balanceMeta(balance) {
    if (balance > 0) return { cls: 'has-debt', txtCls: 'text-debt', tagCls: 'debt', tagTxt: 'عليه' };
    if (balance < 0) return { cls: 'is-credit', txtCls: 'text-credit', tagCls: 'credit', tagTxt: 'له' };
    return { cls: 'is-zero', txtCls: 'text-zero', tagCls: 'zero', tagTxt: 'خالص' };
  }

  function initials(name) {
    if (!name) return '؟';
    const parts = name.trim().split(' ');
    return parts.length > 1 ? (parts[0][0] + parts[1][0]) : parts[0].slice(0, 2);
  }

  window.renderCustomers = (list) => {
    const container = document.getElementById('customersContainer');
    document.getElementById('countTag').textContent = `${list.length} عميل`;

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i>لا توجد نتائج مطابقة</div>`;
      return;
    }

    container.innerHTML = list.map(cust => {
      const balance = cust.realBalance;
      const meta = balanceMeta(balance);
      const safeName = (cust.name || '').replace(/'/g, "\\'");
      return `
        <div id="card-${cust.id}" class="customer-card ${meta.cls}">
          <div class="row-main">
            <div class="avatar">${initials(cust.name)}</div>
            <div class="customer-info-box">
              <h6 class="customer-name">${cust.name}</h6>
              <small class="phone-sub"><i class="fas fa-phone-alt me-1"></i> ${cust.phone || 'بدون هاتف'}</small>
            </div>
          </div>
          
          <div class="balance-strip">
            <span class="balance-label">صافي الرصيد الحالي</span>
            <span class="balance-value ${meta.txtCls}">
              <span class="num">${fmt(balance)}</span>
              <small style="font-size:.7rem; font-weight: 800; margin-right: 2px;">ج.م</small>
              <span class="tag ${meta.tagCls}">${meta.tagTxt}</span>
            </span>
          </div>
          
          <div class="action-container">
            <button class="action-btn btn-log" onclick="openCustomerStatement('${cust.id}', '${safeName}')"><i class="fas fa-history"></i> كشف السجل</button>
            <a href="customer-details.html?id=${cust.id}" class="action-btn btn-info"><i class="fas fa-user-tag"></i> كشف الحساب</a>
            <button class="action-btn btn-share-direct" onclick="triggerDirectStatementShare('${cust.id}', '${safeName}')"><i class="fas fa-share-nodes"></i> مشاركة</button>
            <button class="action-btn btn-del" onclick="deleteCustomer('${cust.id}', '${safeName}')"><i class="fas fa-trash-alt"></i> حذف</button>
          </div>
        </div>
      `;
    }).join('');
  };

  window.currentStatementRows = [];
  window.currentStatementCustomerName = '';

  window.closeCustomerStatement = () => {
      document.getElementById('customerStatementModal').style.display = 'none';
  };

  window.triggerDirectStatementShare = async (customerId, customerName) => {
      await openCustomerStatement(customerId, customerName);
      setTimeout(() => {
          shareEntireStatement();
      }, 500);
  };

  window.openCustomerStatement = async (customerId, customerName) => {
      const isCashCustomer = !customerId && (!customerName || customerName.trim() === '' || customerName.trim() === 'عميل نقدى');
      if (isCashCustomer) {
          alert("هذه فاتورة عميل نقدي عابر، ولا يوجد له كشف حساب متراكم.");
          return;
      }

      const modal = document.getElementById('customerStatementModal');
      const body = document.getElementById('customerStatementBody');
      const titleEl = document.getElementById('customerStatementTitle');

      titleEl.innerHTML = `<i class="fas fa-file-invoice-dollar me-1" style="color:var(--germany-gold);"></i> كشف حساب السجل: ${customerName || 'عميل'}`;
      body.innerHTML = `<div class="empty-state py-4"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-3 fw-bold">جاري جلب كافة الأصناف والحركات...</p></div>`;
      modal.style.display = 'flex';

      try {
          const [invSnap, transSnap] = await Promise.all([
              getDocs(collection(db, "invoices")),
              getDocs(collection(db, "transactions"))
          ]);

          const targetKey = customerId || ("NAME_" + normalizeName(customerName));
          let events = [];

          invSnap.forEach(d => {
              const data = d.data();
              if (data.isDeleted) return;
              let key = data.customerId;
              if (!key && data.customerName) key = customersNameMap[normalizeName(data.customerName)];
              if (!key && data.customerName) key = "NAME_" + normalizeName(data.customerName);
              if (!key || key !== targetKey) return;

              const calculatedCash = Number(data.cashAmount ?? data.cashPaid ?? data.paid) || 0;
              const calculatedWallet = Number(data.walletAmount ?? data.walletPaid) || 0;
              const total = Number(data.total) || 0;
              const paid = calculatedCash + calculatedWallet;
              const remaining = total - paid;
              const timeMs = data.timestamp?.seconds ? (data.timestamp.seconds * 1000) : parseArabicDateToMs(data.time || data.date);

              events.push({
                  type: 'invoice',
                  timeMs,
                  date: parseInvoiceDate(data),
                  paymentMethod: data.paymentMethod || 'غير محدد',
                  cashPaid: calculatedCash,
                  walletPaid: calculatedWallet,
                  items: data.items || [],
                  total: total,
                  debit: remaining,
                  credit: 0
              });
          });

          transSnap.forEach(d => {
              const tr = d.data();
              if (tr.isDeleted) return;
              const isInvoicePayment = tr.invoiceId || (tr.note && tr.note.includes('فاتورة'));
              if (isInvoicePayment) return;

              let key = tr.partyId || tr.customerId;
              let partyName = tr.customerName || tr.partyName;
              if (!key && partyName) key = customersNameMap[normalizeName(partyName)];
              if (!key && partyName) key = "NAME_" + normalizeName(partyName);
              if (!key || key !== targetKey) return;

              const amt = Math.abs(Number(tr.amount || tr.total || 0));
              const timeMs = tr.timestamp?.seconds ? (tr.timestamp.seconds * 1000) : parseArabicDateToMs(tr.date || tr.time);

              events.push({
                  type: 'voucher',
                  timeMs,
                  date: parseVoucherDate(tr),
                  voucherType: tr.type,
                  method: tr.method || 'نقدى',
                  note: tr.note || '',
                  amt: amt,
                  debit: tr.type === 'صرف' ? amt : 0,
                  credit: tr.type === 'قبض' ? amt : 0
              });
          });

          events.sort((a, b) => a.timeMs - b.timeMs);

          let baseBalance = 0;
          if (customerId && customersData[customerId]) baseBalance = Number(customersData[customerId].initialBalance || 0);

          let running = baseBalance;
          window.currentStatementRows = [];
          window.currentStatementCustomerName = customerName || 'عميل';

          let renderedCards = [];

          if (baseBalance !== 0) {
              renderedCards.push({
                  timeMs: 0,
                  html: `
                  <div class="statement-card-item bg-light">
                      <div class="d-flex justify-content-between align-items-center">
                          <span class="fw-bold text-secondary">رصيد افتتاحي سابق</span>
                          <span class="num fw-bold text-dark">${baseBalance.toFixed(2)}</span>
                      </div>
                  </div>`
              });
              window.currentStatementRows.push({ date: '', desc: 'رصيد افتتاحي', items: '-', payDetails: '-', debit: '', credit: '', balance: baseBalance });
          }

          events.forEach(ev => {
              running += ev.debit - ev.credit;

              const remainingLabel = ev.debit >= 0 ? "المتبقي عليه من فاتورة اليوم" : "المتبقي له من فاتورة اليوم";
              const balanceLabel = running >= 0 ? "الصافي عليه" : "الصافي له";

              if (ev.type === 'invoice') {
                  let itemsRowsHtml = (ev.items || []).map(i => `
                      <tr>
                          <td style="text-align:right;">${i.name}</td>
                          <td>${i.qty}</td>
                          <td>${(Number(i.price)||0).toFixed(1)}</td>
                          <td class="num">${((Number(i.qty)||0)*(Number(i.price)||0)).toFixed(1)}</td>
                      </tr>`).join('');

                  let payInfoHtml = [];
                  if (ev.cashPaid > 0) payInfoHtml.push(`كاش: <b>${ev.cashPaid.toFixed(2)}</b>`);
                  if (ev.walletPaid > 0) payInfoHtml.push(`محفظة: <b>${ev.walletPaid.toFixed(2)}</b>`);

                  renderedCards.push({
                      timeMs: ev.timeMs,
                      html: `
                      <div class="statement-card-item invoice-card">
                          <div class="d-flex justify-content-between align-items-center mb-1">
                              <span class="badge bg-dark" style="font-size:0.75rem; color:white; padding:2px 8px; border-radius:6px;"><i class="fas fa-file-invoice me-1"></i> فاتورة مبيعات</span>
                              <span class="text-muted fw-bold" style="font-size:0.72rem;"><i class="far fa-clock"></i> ${ev.date || '-'}</span>
                          </div>
                          
                          <div class="d-flex justify-content-between align-items-center my-2 p-2 bg-light rounded" style="font-size:0.8rem;">
                              <span>إجمالي الفاتورة: <b class="num">${ev.total.toFixed(2)}</b></span>
                              <span>طريقة السداد: <b class="text-primary">${ev.paymentMethod}</b></span>
                          </div>

                          ${payInfoHtml.length > 0 ? `<div class="text-muted mb-2" style="font-size:0.73rem;">مدفوعات الفاتورة: ${payInfoHtml.join(' | ')}</div>` : ''}

                          ${ev.items && ev.items.length > 0 ? `
                              <table class="statement-item-table">
                                  <thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
                                  <tbody>${itemsRowsHtml}</tbody>
                              </table>
                          ` : '<div class="text-muted text-center py-1" style="font-size:0.72rem;">بلا أصناف تفصيلية</div>'}

                          <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top" style="font-size:0.78rem;">
                              <span class="${ev.debit >= 0 ? 'text-danger' : 'text-success'} fw-bold">${remainingLabel}: <span class="num">${Math.abs(ev.debit).toFixed(2)}</span></span>
                              <span class="fw-bold">${balanceLabel}: <span class="num ${running >= 0 ? 'text-danger' : 'text-success'}">${Math.abs(running).toFixed(2)}</span></span>
                          </div>
                      </div>`
                  });

              } else {
                  renderedCards.push({
                      timeMs: ev.timeMs,
                      html: `
                      <div class="statement-card-item voucher-card">
                          <div class="d-flex justify-content-between align-items-center mb-1">
                              <span class="badge" style="background:var(--purple); color:white; font-size:0.75rem; padding:2px 8px; border-radius:6px;"><i class="fas fa-hand-holding-usd me-1"></i> ${ev.voucherType === 'صرف' ? 'سند صرف' : 'سند قبض'} (${ev.method})</span>
                              <span class="text-muted fw-bold" style="font-size:0.72rem;"><i class="far fa-clock"></i> ${ev.date || '-'}</span>
                          </div>
                          ${ev.note ? `<div class="text-dark my-1 fw-bold" style="font-size:0.78rem;"><i class="fas fa-comment-alt me-1 text-muted"></i> ${ev.note}</div>` : ''}
                          
                          <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top" style="font-size:0.78rem;">
                              <span class="text-success fw-bold">المبلغ المستلم: <span class="num">${ev.credit.toFixed(2)}</span></span>
                              <span class="fw-bold">${balanceLabel}: <span class="num ${running >= 0 ? 'text-danger' : 'text-success'}">${Math.abs(running).toFixed(2)}</span></span>
                          </div>
                      </div>`
                  });
              }

              window.currentStatementRows.push({ 
                  date: ev.date, 
                  desc: ev.type === 'invoice' ? `فاتورة (${ev.total})` : `سند قبض (${ev.amt})`, 
                  items: ev.type === 'invoice' ? (ev.items || []).map(i => `${i.name} (${i.qty}×${i.price})`).join(' ، ') : '-',
                  payDetails: ev.type === 'invoice' ? `${ev.paymentMethod} (كاش: ${ev.cashPaid} | محفظة: ${ev.walletPaid})` : ev.method,
                  debit: ev.debit || '', 
                  credit: ev.credit || '', 
                  balance: running 
              });
          });

          if (events.length === 0 && baseBalance === 0) {
              body.innerHTML = `<div class="empty-state py-4"><i class="fas fa-folder-open fa-2x mb-2"></i><p class="fw-bold mb-0">لا توجد حركات تسديد أو فواتير لهذا العميل.</p></div>`;
              return;
          }

          renderedCards.sort((a, b) => b.timeMs - a.timeMs);
          let cardsHtml = renderedCards.map(c => c.html).join('');

          const globalBalanceLabel = running >= 0 ? "الصافي عليه" : "الصافي له";

          body.innerHTML = `
              <div class="d-flex justify-content-between align-items-center mb-2 p-2 rounded bg-white border" style="font-size:0.8rem; font-weight:800;">
                  <span>إجمالي الحركات: ${events.length}</span>
                  <span>${globalBalanceLabel}: <span class="num" style="color:${running >= 0 ? 'var(--germany-red)' : '#16a34a'}; font-size:1rem;">${Math.abs(running).toFixed(2)}</span></span>
              </div>
              ${cardsHtml}`;

      } catch (err) {
          console.error("خطأ في تجهيز كشف الحساب:", err);
          body.innerHTML = `<div class="alert alert-danger text-center p-3 my-2" style="border-radius:14px; font-weight:700;">تعذر تحميل كشف الحساب: ${err.message}</div>`;
      }
  };

  /* دالة تصوير كشف الحساب بالكامل دفعة واحدة الموثوقة */
  window.shareEntireStatement = function() {
      const statementBody = document.getElementById('customerStatementBody');
      if (!statementBody || !statementBody.children.length) {
          alert("لا يوجد كشف حساب متاح لمشاركته حالياً.");
          return;
      }

      document.getElementById('shareLoadingModal').style.display = 'flex';

      setTimeout(() => {
          html2canvas(statementBody, {
              scale: 2,
              backgroundColor: "#ffffff",
              useCORS: true,
              scrollX: 0,
              scrollY: 0
          }).then(canvas => {
              canvas.toBlob(blob => {
                  document.getElementById('shareLoadingModal').style.display = 'none';
                  const fileName = `كشف_حساب_${window.currentStatementCustomerName || 'عميل'}.png`;
                  const file = new File([blob], fileName, { type: 'image/png' });

                  if (navigator.canShare && navigator.canShare({ files: [file] })) {
                      navigator.share({
                          files: [file],
                          title: `كشف حساب - ${window.currentStatementCustomerName || 'عميل'}`,
                          text: `كشف الحساب الخاص بـ ${window.currentStatementCustomerName || 'العميل'} - شركة الزيادي`
                      }).catch(err => console.log('إلغاء المشاركة:', err));
                  } else {
                      const link = document.createElement('a');
                      link.download = fileName;
                      link.href = canvas.toDataURL('image/png');
                      link.click();
                  }
              }, 'image/png');
          }).catch(err => {
              document.getElementById('shareLoadingModal').style.display = 'none';
              alert("حدث خطأ أثناء إنشاء الصورة: " + err.message);
          });
      }, 300);
  };

  window.exportCustomerStatementExcel = () => {
      if (!window.currentStatementRows || window.currentStatementRows.length === 0) {
          alert("لا توجد بيانات لتصديرها بعد.");
          return;
      }
      try {
          const wsData = [["التاريخ", "الحركة", "الأصناف", "طريقة السداد", "مستحق", "مسدد", "الرصيد"]];
          window.currentStatementRows.forEach(r => wsData.push([r.date, r.desc, r.items, r.payDetails, r.debit, r.credit, r.balance]));
          const ws = XLSX.utils.aoa_to_sheet(wsData);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "كشف حساب تفصيلي");
          XLSX.writeFile(wb, `كشف_حساب_السجل_${window.currentStatementCustomerName}.xlsx`);
      } catch (err) {
          console.error("خطأ في تصدير كشف الحساب:", err);
          alert("تعذر تصدير الملف: " + err.message);
      }
  };

  function applyFilters() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    let filtered = allCustomers.filter(c =>
      (c.name && c.name.toLowerCase().includes(term)) ||
      (c.phone && c.phone.includes(term))
    );
    if (currentFilter === 'debt') filtered = filtered.filter(c => c.realBalance > 0);
    if (currentFilter === 'credit') filtered = filtered.filter(c => c.realBalance < 0);
    filtered.sort((a, b) => b.realBalance - a.realBalance);
    renderCustomers(filtered);
    updateStats(filtered);
  }

  window.filterCustomers = applyFilters;

  window.setFilter = (f) => {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === f));
    applyFilters();
  };

  window.deleteCustomer = async (id, name) => {
    if (!confirm(`هل أنت متأكد من مسح العميل "${name}"؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
    try {
      await deleteDoc(doc(db, 'customers', id));
      allCustomers = allCustomers.filter(c => c.id !== id);
      applyFilters();
    } catch (err) {
      alert('خطأ أثناء المسح: ' + err.message);
    }
  };

  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    if (allCustomers.length === 0) return;
    const sure1 = confirm(`سيتم مسح ${allCustomers.length} عميل نهائياً من قاعدة البيانات. هل أنت متأكد؟`);
    if (!sure1) return;
    const sure2 = confirm('تأكيد أخير: هذا الإجراء لا يمكن التراجع عنه. متابعة؟');
    if (!sure2) return;

    try {
      await Promise.all(allCustomers.map(c => deleteDoc(doc(db, 'customers', c.id))));
      allCustomers = [];
      applyFilters();
    } catch (err) {
      alert('خطأ أثناء مسح العملاء: ' + err.message);
    }
  });

  loadCustomers();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered Successfully"))
    .catch((err) => console.log("SW Registration Failed", err));
}
</script>
