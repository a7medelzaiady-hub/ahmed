<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل / إضافة صنف - شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --warning: #ffb703;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 40px;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 12px rgba(11, 102, 65, 0.12);
        }
        .top-nav .nav-icon { 
            cursor: pointer; 
            font-size: 1.2rem; 
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }
        .top-nav .nav-icon:active { transform: scale(0.9); }

        .form-container { padding: 15px; }

        .card-custom {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            margin-bottom: 15px;
        }

        .sec-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--primary-green);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1.5px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.15);
        }

        .readonly-field {
            background-color: #f1f5f9 !important;
            color: var(--primary-green) !important;
            font-weight: 800;
        }

        .btn-save {
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 800;
            width: 100%;
            font-size: 1.05rem;
            box-shadow: 0 4px 12px rgba(11, 102, 65, 0.2);
            transition: 0.2s;
        }
        .btn-save:hover { background: #0a5234; color: white; }

        .cancel-btn {
            background: #e2e8f0;
            color: var(--text-dark);
            border: none;
            border-radius: 10px;
            padding: 5px 12px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="nav-icon" title="الصفحة الرئيسية">
            <i class="fas fa-home"></i>
        </a>
        <i class="fas fa-sync-alt nav-icon" onclick="location.reload()" title="تحديث"></i>
    </div>
    <div class="d-flex align-items-center gap-2">
        <span class="fw-bold" id="pageTitle">إضافة صنف جديد</span>
        <a href="makhzan.html" class="cancel-btn ms-2">إلغاء التعديل</a>
    </div>
    <i class="fas fa-arrow-right nav-icon" onclick="history.back()" title="رجوع"></i>
</div>

<div class="container-fluid form-container">
    <form id="productForm">
        
        <!-- بيانات الصنف الأساسية -->
        <div class="card-custom">
            <div class="sec-title">
                <i class="fas fa-box-archive"></i>
                <span>بيانات الصنف الأساسية</span>
            </div>
            
            <div class="mb-3">
                <label class="form-label">اسم الصنف</label>
                <input type="text" id="productName" class="form-control" placeholder="أدخل اسم المنتج..." required>
            </div>

            <div class="row g-2">
                <div class="col-8">
                    <label class="form-label">الباركود</label>
                    <input type="text" id="productBarcode" class="form-control" placeholder="الباركود...">
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-success w-100 py-2" style="border-radius:12px; font-weight:700;" onclick="generateBarcode()">توليد</button>
                </div>
            </div>
        </div>

        <!-- رصيد أول المدة والتحويل -->
        <div class="card-custom">
            <div class="sec-title">
                <i class="fas fa-history"></i>
                <span>رصيد أول المدة ومعدل التحويل</span>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">الوحدة الكبرى</label>
                    <input type="text" id="unitName" class="form-control" value="كرتونة" readonly>
                </div>
                <div class="col-6">
                    <label class="form-label">معدل التحويل (قطع/جركن)</label>
                    <input type="number" id="pcsPerCarton" class="form-control" value="12" min="1" oninput="calculatePcs()">
                </div>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label">رصيد أول المدة (كرتونة)</label>
                    <input type="number" step="0.01" id="openingQty" class="form-control" value="0" oninput="calculatePcs()">
                </div>
                <div class="col-6">
                    <label class="form-label">إجمالي قطع أول المدة</label>
                    <input type="number" id="openingTotalPcs" class="form-control readonly-field" value="0" readonly>
                </div>
            </div>
        </div>

        <!-- التسعير والمخزون الحالي -->
        <div class="card-custom">
            <div class="sec-title">
                <i class="fas fa-sack-dollar"></i>
                <span>التسعير والمخزون الحالي</span>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">الرصيد الحالي (كرتونة)</label>
                    <input type="text" id="currentStockCartons" class="form-control readonly-field" value="0" readonly>
                </div>
                <div class="col-6">
                    <label class="form-label">حد الطلب (تنبيه)</label>
                    <input type="number" id="minAllowed" class="form-control" value="5">
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label">سعر الشراء (للكرتونة)</label>
                    <input type="number" step="0.01" id="priceBuy" class="form-control" value="0.00">
                </div>
                <div class="col-6">
                    <label class="form-label">سعر القطاعي (للكرتونة)</label>
                    <input type="number" step="0.01" id="priceSell" class="form-control" value="0.00">
                </div>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label">سعر الجملة</label>
                    <input type="number" step="0.01" id="priceGomla" class="form-control" value="0.00">
                </div>
                <div class="col-6">
                    <label class="form-label">سعر خاص / نص جملة</label>
                    <input type="number" step="0.01" id="priceHalfGomla" class="form-control" value="0.00">
                </div>
            </div>
        </div>

        <button type="submit" class="btn-save mb-4">
            <i class="fas fa-save me-2"></i> حفظ بيانات الصنف
        </button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const editProductId = urlParams.get('edit');

    window.calculatePcs = function() {
        const factor = Math.max(1, Number(document.getElementById('pcsPerCarton').value) || 1);
        const cartons = Number(document.getElementById('openingQty').value) || 0;
        document.getElementById('openingTotalPcs').value = Math.round(cartons * factor);
    };

    window.generateBarcode = function() {
        document.getElementById('productBarcode').value = Math.floor(100000000000 + Math.random() * 900000000000);
    };

    async function loadProductDataForEdit(id) {
        try {
            document.getElementById('pageTitle').innerText = "تعديل صنف حالي";
            const productDoc = await getDoc(doc(db, "inventory", id));
            if (!productDoc.exists()) return;

            const data = productDoc.data();
            const factor = Math.max(1, Number(data.unitFactor || data.pcsPerCarton || data.factor) || 1);

            document.getElementById('productName').value = data.name || '';
            document.getElementById('productBarcode').value = data.barcode || '';
            document.getElementById('pcsPerCarton').value = factor;
            document.getElementById('minAllowed').value = data.min || 5;

            document.getElementById('priceBuy').value = data.buy || 0;
            document.getElementById('priceSell').value = data.sell || 0;
            document.getElementById('priceGomla').value = data.sell2 || data.sellGomla || 0;
            document.getElementById('priceHalfGomla').value = data.sell3 || data.sellHalfGomla || 0;

            // 1. استرجاع رصيد أول المدة الحقيقي من سجل الحركات أو كارت الصنف
            let openingTotalPcs = 0;
            if (data.openingTotalPcs !== undefined && data.openingTotalPcs !== null) {
                openingTotalPcs = Number(data.openingTotalPcs);
            } else if (data.openingQty !== undefined && data.openingQty !== null) {
                openingTotalPcs = Math.round(Number(data.openingQty) * factor);
            } else {
                const qTrans = query(collection(db, "inventory_transactions"), where("productId", "==", id), where("type", "==", "opening_balance"));
                const snapTrans = await getDocs(qTrans);
                if (!snapTrans.empty) {
                    openingTotalPcs = Number(snapTrans.docs[0].data().quantityPcs) || 0;
                }
            }

            document.getElementById('openingQty').value = (openingTotalPcs / factor).toFixed(2);
            document.getElementById('openingTotalPcs').value = openingTotalPcs;

            // 2. تجميع المبيعات والمشتريات الحية لإلغاء السوالب المتراكمة القديمة
            let totalSalesPcs = 0;
            let totalPurchasesPcs = 0;

            const [invoicesSnap, supplierSnap] = await Promise.all([
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions"))
            ]);

            invoicesSnap.forEach(d => {
                d.data().items?.forEach(item => {
                    if (item.stockId === id || item.name?.trim() === data.name?.trim()) {
                        let pcs = Number(item.qty) || 0;
                        if (item.unit === 'box' || item.isCarton) pcs *= factor;
                        if (item.isReturn) totalSalesPcs -= pcs;
                        else totalSalesPcs += pcs;
                    }
                });
            });

            supplierSnap.forEach(d => {
                d.data().items?.forEach(item => {
                    if (item.stockId === id || item.name?.trim() === data.name?.trim()) {
                        const isReturn = Number(item.returnQty) > 0 || item.isReturn === true;
                        let rawQty = isReturn ? Number(item.returnQty || item.qty) : Number(item.qty);
                        let pcs = (item.unitName === 'كرتونة' || item.isCarton !== false) ? (rawQty * factor) : rawQty;
                        if (isReturn) totalPurchasesPcs -= pcs;
                        else totalPurchasesPcs += pcs;
                    }
                });
            });

            // 3. تطبيق المعادلة الحية الحقيقية للرصيد الفعلي
            const calculatedRealPcs = openingTotalPcs + totalPurchasesPcs - totalSalesPcs;
            document.getElementById('currentStockCartons').value = (calculatedRealPcs / factor).toFixed(2) + " كرتونة";

        } catch (e) {
            console.error("خطأ أثناء جلب بيانات التعديل:", e);
        }
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('productName').value.trim();
        const barcode = document.getElementById('productBarcode').value.trim();
        const factor = Math.max(1, Number(document.getElementById('pcsPerCarton').value) || 1);
        const openingQty = Number(document.getElementById('openingQty').value) || 0;
        const openingTotalPcs = Math.round(openingQty * factor);

        const buy = Number(document.getElementById('priceBuy').value) || 0;
        const sell = Number(document.getElementById('priceSell').value) || 0;
        const sell2 = Number(document.getElementById('priceGomla').value) || 0;
        const sell3 = Number(document.getElementById('priceHalfGomla').value) || 0;
        const min = Number(document.getElementById('minAllowed').value) || 5;

        const docId = editProductId || doc(collection(db, "inventory")).id;

        const productPayload = {
            name,
            barcode,
            unitFactor: factor,
            pcsPerCarton: factor,
            factor,
            openingQty,
            openingTotalPcs,
            buy,
            sell,
            sell2,
            sellGomla: sell2,
            sell3,
            sellHalfGomla: sell3,
            min,
            updatedAt: new Date()
        };

        try {
            await setDoc(doc(db, "inventory", docId), productPayload, { merge: true });
            alert("تم حفظ بيانات الصنف بنجاح!");
            window.location.href = "makhzan.html";
        } catch (err) {
            console.error("خطأ أثناء حفظ الصنف:", err);
            alert("حدث خطأ أثناء حفظ الصنف!");
        }
    });

    if (editProductId) {
        loadProductDataForEdit(editProductId);
    }
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch((err) => console.log(err));
}
</script>
</body>
</html>
