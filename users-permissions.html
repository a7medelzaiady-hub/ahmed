<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادى | إدارة المستخدمين والصلاحيات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #0E8F5B;
            --brand-dark: #075E3D;
            --brand-tint: #E6F7EF;
            --surface: #F3FAF7;
            --card-bg: #FFFFFF;
            --text-deep: #0F2A1E;
            --text-mid: #5B6B63;
            --border-subtle: #DFEFE7;
            --coral: #DC2626;
            --amber: #D97706;
            --shadow-sm: 0 4px 14px rgba(7, 94, 61, 0.07);
            --shadow-md: 0 10px 26px rgba(7, 94, 61, 0.11);
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--surface); color: var(--text-deep); padding-bottom: 40px; }

        .header {
            background: linear-gradient(135deg, var(--brand-dark), var(--brand));
            color: #fff; padding: 16px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-md); position: sticky; top: 0; z-index: 100;
        }
        .header-title { font-family: 'Tajawal', sans-serif; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .btn-back { background: rgba(255,255,255,0.2); border: none; color: #fff; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .container { max-width: 900px; margin: 20px auto; padding: 0 16px; }

        .card { background: var(--card-bg); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .card-title { font-size: 15px; font-weight: 800; color: var(--brand-dark); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--text-mid); }
        .form-control { padding: 10px 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; outline: none; background: #fff; }
        .form-control:focus { border-color: var(--brand); }

        .btn-primary { background: var(--brand); color: #fff; border: none; padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-primary:active { background: var(--brand-dark); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 13px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-subtle); }
        th { background: var(--brand-tint); color: var(--brand-dark); font-weight: 800; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-block; }
        .badge-admin { background: #FEF3C7; color: var(--amber); }
        .badge-user { background: #E0F7FA; color: #0E7C86; }

        .btn-action { border: none; background: none; cursor: pointer; font-size: 15px; padding: 6px; }
        .btn-delete { color: var(--coral); }
    </style>
</head>
<body>

<header class="header">
    <div class="header-title">
        <i class="fa-solid fa-user-shield"></i>
        إدارة المستخدمين والصلاحيات
    </div>
    <button class="btn-back" onclick="window.location.href='index1.html';"><i class="fas fa-arrow-left"></i></button>
</header>

<div class="container">
    <!-- نموذج إضافة/تعديل مستخدم -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-user-plus"></i> إضافة مستخدم جديد</div>
        <form id="userForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" class="form-control" placeholder="أدخل الاسم..." required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور..." required>
                </div>
                <div class="form-group">
                    <label>الصلاحية الرئيسية (الدور)</label>
                    <select id="userRole" class="form-control" required>
                        <option value="employee">موظف (محدد الصلاحيات)</option>
                        <option value="admin">مدير نظام (أدمن - صلاحية كاملة)</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-primary"><i class="fa-solid fa-save"></i> حفظ المستخدم</button>
        </form>
    </div>

    <!-- جدول عرض المستخدمين -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-users"></i> قائمة المستخدمين المسجلين</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>اسم المستخدم</th>
                        <th>الدور</th>
                        <th>تاريخ الإنشاء</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" style="text-align: center;">جاري تحصيل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // التحقق من الصلاحية: الأدمن فقط من يحق له الدخول
    const role = sessionStorage.getItem('role') || localStorage.getItem('role');
    if (role !== 'admin') {
        alert('عذراً، هذه الصفحة مخصصة لمدير النظام فقط.');
        window.location.href = 'index1.html';
    }

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const userForm = document.getElementById('userForm');
    const usersTableBody = document.getElementById('usersTableBody');

    // حفظ / تحديث المستخدم
    userForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const roleVal = document.getElementById('userRole').value;

        const userId = 'usr_' + username.toLowerCase().replace(/\s+/g, '_');

        try {
            await setDoc(doc(db, "users", userId), {
                username: username,
                password: password,
                role: roleVal,
                createdAt: serverTimestamp()
            }, { merge: true });

            alert('تم حفظ بيانات المستخدم بنجاح');
            userForm.reset();
        } catch (err) {
            console.error("خطأ في الحفظ:", err);
            alert('حدث خطأ أثناء حفظ المستخدم');
        }
    });

    // جلب مستخدمين النظام بشكل حي (Realtime)
    onSnapshot(collection(db, "users"), (snapshot) => {
        usersTableBody.innerHTML = '';
        if (snapshot.empty) {
            usersTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">لا يوجد مستخدمون حالياً</td></tr>';
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            const tr = document.createElement('tr');

            const isRoleAdmin = data.role === 'admin';
            const badgeClass = isRoleAdmin ? 'badge-admin' : 'badge-user';
            const roleText = isRoleAdmin ? 'مدير نظام' : 'موظف';

            tr.innerHTML = `
                <td><b>${data.username || ''}</b></td>
                <td><span class="badge ${badgeClass}">${roleText}</span></td>
                <td>${data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString('ar-EG') : '—'}</td>
                <td>
                    <button class="btn-action btn-delete" onclick="deleteUser('${id}')" title="حذف"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            usersTableBody.appendChild(tr);
        });
    });

    // دالة حذف المستخدم
    window.deleteUser = async function(userId) {
        if (confirm('هل أنت تأكد من رغبتك في حذف هذا المستخدم؟')) {
            try {
                await deleteDoc(doc(db, "users", userId));
                alert('تم حذف المستخدم بنجاح');
            } catch (err) {
                alert('حدث خطأ أثناء الحذف');
            }
        }
    };
</script>
</body>
</html>
