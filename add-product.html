<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الربح - شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-green: #0b6641; --bg-light: #f8fafc; --text-dark: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; }
        body { background-color: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-dark); margin: 0; padding-bottom: 40px; direction: rtl; }
        .top-nav { background: linear-gradient(135deg, var(--primary-green), #0a5234); color: white; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15); }
        .top-nav .nav-icon { cursor: pointer; font-size: 1.2rem; color: white; text-decoration: none; }
        .product-header { margin: 18px 15px; background: white; border-radius: 20px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.01); }
        .product-header .name { font-weight: 800; font-size: 1.15rem; margin-bottom: 3px; }
        .product-header .barcode { font-size: 0.8rem; color: var(--text-muted); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 15px 10px; }
        .stat-box { background: white; border-radius: 16px; padding: 12px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.01); }
        .stat-box .label { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .stat-box .value { font-size: 1.05rem; font-weight: 800; color: var(--primary-green); }
        .stat-box .value.current { color: #0284c7; }
        .stat-box .sub-val { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
        .filter-section { padding: 0 15px 10px; }
        .filter-card { background: white; border-radius: 18px; padding: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-color); }
        .filter-row { display: flex; gap: 10px; }
        .filter-row .form-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .filter-row input[type="date"] { border-radius: 10px; border: 1px solid var(--border-color); padding: 8px 10px; font-family: 'Cairo', sans-serif; font-size: 0.85rem; width: 100%; }
        .filter-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-apply { background: var(--primary-green); color: white; border: none; border-radius: 10px; padding: 8px 16px; font-weight: 700; font-size: 0.85rem; flex: 1; }
        .btn-clear { background: #f1f5f9; color: var(--text-muted); border: none; border-radius: 10px; padding: 8px 16px; font-weight: 700; font-size: 0.85rem; }
        .section-title { padding: 5px 20px 10px; font-weight: 800; font-size: 0.9rem; color: var(--text-dark); display: flex; align-items: center; justify-content: space-between; }
        .day-card { background: white; border-radius: 18px; margin: 0 15px 10px; padding: 14px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.01); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .day-date { font-weight: 700; font-size: 0.9rem; }
        .day-qty { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .day-profit { font-weight: 800; font-size: 0.95rem; color: var(--primary-green); text-align: left; }
        .day-profit .sub { font-size: 0.75rem; color: #0284c7; font-weight: 700; display: block; }
        .purchases-box { background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 16px; margin: 0 15px 15px; padding: 12px; }
        .purchase-item { display: flex; justify-content: space-between; align-items: center; background: white; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font-size: 0.8rem; border: 1px solid #e2e8f0; cursor: pointer; }
        .badge-buy { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(3px); }
        .modal-card { background: white; width: 90%; max-width: 420px; border-radius: 20px; padding: 18px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="profits.html" class="nav-icon"><i class="fas fa-chevron-right"></i></a>
    <span class="fw-bold">تفاصيل الربح</span>
    <a href="index.html" class="nav-icon"><i class="fas fa-home"></i></a>
</div>

<div class="product-header" id="productHeader">
    <div class="name">جاري التحميل...</div>
    <div class="barcode"></div>
</div>

<div class="stats-grid">
    <div class="stat-box">
        <div class="label">الربح (متوسط التكلفة)</div>
        <div class="value" id="totalProfitVal">0.00</div>
        <div class="sub-val" id="unitProfitAvg">ربح الوحدة: 0.00</div>
    </div>
    <div class="stat-box">
        <div class="label">الربح (سعر الشراء الحالي)</div>
        <div class="value current" id="totalProfitCurrVal">0.00</div>
        <div class="sub-val" id="unitProfitCurr">ربح الوحدة: 0.00</div>
    </div>
    <div class="stat-box">
        <div class="label">إجمالي الكميات المباعة</div>
        <div class="value" id="totalQtyVal" style="color: var(--text-dark); font-size: 0.85rem;">0</div>
    </div>
    <div class="stat-box">
        <div class="label">متوسط سعر التكلفة الحالي</div>
        <div class="value" id="avgVsCurrVal" style="color: var(--text-dark); font-size: 0.85rem;">0.00</div>
    </div>
</div>

<div class="section-title"><span><i class="fas fa-history text-success me-1"></i> سجل أسعار الشراء</span></div>
<div class="purchases-box" id="purchasesList"><div class="text-center text-muted font-small">جاري التحميل...</div></div>

<div class="filter-section">
    <div class="filter-card">
        <div class="filter-row">
            <div style="flex:1"><div class="form-label">من تاريخ</div><input type="date" id="fromDate"></div>
            <div style="flex:1"><div class="form-label">إلى تاريخ</div><input type="date" id="toDate"></div>
        </div>
        <div class="filter-actions">
            <button class="btn-apply" onclick="renderDetails()"><i class="fas fa-filter me-1"></i> تطبيق الفلتر</button>
            <button class="btn-clear" onclick="clearFilter()">مسح</button>
        </div>
    </div>
</div>

<div class="section-title"><span>الربح حسب اليوم</span></div>
<div id="daysContainer"><div class="text-center text-muted mt-5 fw-bold"><div class="spinner-border spinner-border-sm text-success mb-2"></div><br>جاري التحميل...</div></div>

<div class="modal-overlay" id="detailsModal">
    <div class="modal-card">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="fw-bold m-0" id="modalTitle">التفاصيل</h6>
            <i class="fas fa-times text-muted" style="cursor:pointer;" onclick="closeModal()"></i>
        </div>
        <div id="modalBody"></div>
        <button class="btn btn-sm btn-secondary w-100 mt-3 fw-bold" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function getDocDate(data) {
        if (data.timestamp && data.timestamp.toDate) return data.timestamp.toDate();
        if (data.date) { const d = new Date(data.date); if (!isNaN(d)) return d; }
        return new Date(0);
    }

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    let allLines = [], purchaseEvents = [], productFactor = 1;
    let currentBuyPrice = 0, currentSellPrice = 0;

    function formatQty(pcs, factor) {
        factor = Math.max(1, factor || 1);
        if (factor === 1) return `${pcs} قطعة`;
        const c = Math.floor(pcs / factor), r = pcs % factor;
        if (c > 0 && r > 0) return `${c} كرتونة و ${r} قطعة`;
        return c > 0 ? `${c} كرتونة` : `${r} قطعة`;
    }

    async function loadDetails() {
        if (!productId) return;
        try {
            const productSnap = await getDoc(doc(db, "inventory", productId));
            if (!productSnap.exists()) return;
            const pData = productSnap.data();
            
            productFactor = Math.max(1, Number(pData.unitFactor || pData.factor) || 1);
            
            // قراءة سعر الشراء والبيع الافتراضي من كارت الصنف (الحل الذي طلبته)
            currentBuyPrice = (Number(pData.buy) || 0) / productFactor;
            currentSellPrice = (Number(pData.sell || pData.sellPrice || pData.price) || 0) / productFactor;

            document.getElementById('productHeader').innerHTML = `<div class="name">${pData.name || 'بدون اسم'}</div><div class="barcode">باركود: ${pData.barcode || '---'}</div>`;

            const [invoicesSnap, supplierSnap, openingSnap] = await Promise.all([
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions")),
                getDocs(query(collection(db, "inventory_transactions"), where("type", "==", "opening_balance"), where("productId", "==", productId)))
            ]);

            let events = [];

            // 1. الرصيد الافتتاحي
            let openingPcs = 0, openingValue = 0;
            openingSnap.forEach(d => {
                const data = d.data();
                const qty = Number(data.quantityPcs) || 0;
                openingPcs += qty;
                openingValue += (data.totalAmount !== undefined ? Number(data.totalAmount) : (Number(data.unitPrice) || 0) * qty);
            });

            // لو مفيش سعر افتتاحي، هيعتمد على pData.buy اللي قرأناه فوق
            let openingPrice = (openingPcs > 0 && openingValue > 0) ? (openingValue / openingPcs) : currentBuyPrice;
            if (openingPcs) events.push({ type: 'purchase', label: 'رصيد افتتاحي', date: new Date(0), qty: openingPcs, price: openingPrice, partyName: 'تأسيس' });

            // 2. المشتريات
            supplierSnap.forEach(docSnap => {
                const data = docSnap.data();
                data.items?.forEach(item => {
                    if ((item.stockId || item.productId || item.id) !== productId) return;
                    const itemFactor = Math.max(1, Number(item.unitFactor || productFactor) || 1);
                    let pcs = (item.unit === 'box') ? (Number(item.qty) || 0) * itemFactor : (Number(item.qty) || 0);
                    let buyP = (Number(item.buy || item.price) || 0) / itemFactor;
                    
                    if (buyP === 0) buyP = currentBuyPrice; // لو الفاتورة بصفر ياخد من كارت الصنف
                    
                    if (item.isReturn || Number(item.returnQty) > 0) pcs = -Math.abs(pcs);
                    events.push({ type: 'purchase', label: 'شراء', date: getDocDate(data), qty: pcs, price: buyP, partyName: data.supplierName || 'مورد' });
                });
            });

            // تحديث السعر الحالي لآخر شراء
            let lastPurchase = events.filter(e => e.type === 'purchase' && e.price > 0).slice(-1)[0];
            if (lastPurchase) currentBuyPrice = lastPurchase.price;

            // 3. المبيعات (السر هنا)
            invoicesSnap.forEach(docSnap => {
                const data = docSnap.data();
                data.items?.forEach(item => {
                    if ((item.stockId || item.productId || item.id) !== productId) return;

                    const itemFactor = Math.max(1, Number(item.unitFactor || productFactor) || 1);
                    let rawQty = Number(item.qty || item.quantity) || 0;
                    let pcs = (item.unit === 'box') ? rawQty * itemFactor : rawQty;

                    let invPrice = Number(item.sell || item.sellPrice || item.price || item.unitPrice) || 0;
                    
                    // الحل: لو سعر البيع في الفاتورة طلع هو نفسه التكلفة، أو صفر، نستخدم سعر البيع الأساسي من كارت الصنف!
                    if (invPrice === 0 || invPrice === currentBuyPrice || invPrice === (currentBuyPrice * itemFactor)) {
                        if (currentSellPrice > 0) {
                            invPrice = currentSellPrice * (item.unit === 'box' ? itemFactor : 1);
                        }
                    }

                    let revenue = invPrice * rawQty;
                    if (item.totalPrice) revenue = Number(item.totalPrice);
                    else if (item.total) revenue = Number(item.total);

                    let finalUnitPrice = pcs > 0 ? revenue / pcs : 0;
                    if (item.isReturn) { pcs = -pcs; revenue = -revenue; }

                    events.push({ type: 'sale', date: getDocDate(data), qty: pcs, revenue, partyName: data.customerName || 'عميل نقدي', unitPrice: finalUnitPrice });
                });
            });

            events.sort((a, b) => a.date.getTime() - b.date.getTime());

            let runQty = 0, runAvg = 0;
            events.forEach(ev => {
                if (ev.type === 'purchase') {
                    if (ev.qty > 0) {
                        const newQty = runQty + ev.qty;
                        runAvg = newQty > 0 ? (runQty * runAvg + ev.qty * ev.price) / newQty : 0;
                        runQty = newQty;
                    } else runQty = Math.max(0, runQty + ev.qty);
                    purchaseEvents.push(ev);
                } else {
                    let costUnit = runAvg > 0 ? runAvg : currentBuyPrice; // يأخذ سعر الشراء من كارت الصنف كخيار أخير
                    allLines.push({ 
                        date: ev.date, qty: ev.qty, revenue: ev.revenue, 
                        costAvg: costUnit * ev.qty, profitAvg: ev.revenue - (costUnit * ev.qty),
                        costCurrent: currentBuyPrice * ev.qty, profitCurrent: ev.revenue - (currentBuyPrice * ev.qty),
                        partyName: ev.partyName, unitPrice: ev.unitPrice
                    });
                    runQty -= ev.qty;
                }
            });

            document.getElementById('avgVsCurrVal').innerText = `${(currentBuyPrice * productFactor).toFixed(2)} ج.م`;
            renderDetails();

        } catch (e) { console.error(e); }
    }

    window.renderDetails = function() {
        let byDay = {};
        allLines.forEach(l => {
            const key = l.date.toISOString().slice(0, 10);
            if (!byDay[key]) byDay[key] = { qty: 0, profitAvg: 0, profitCurrent: 0, items: [] };
            byDay[key].qty += l.qty; byDay[key].profitAvg += l.profitAvg; byDay[key].profitCurrent += l.profitCurrent; byDay[key].items.push(l);
        });

        let totalProfitAvg = 0, totalProfitCurrent = 0, totalQty = 0, html = '';
        Object.keys(byDay).sort((a, b) => b.localeCompare(a)).forEach(key => {
            const d = byDay[key];
            totalProfitAvg += d.profitAvg; totalProfitCurrent += d.profitCurrent; totalQty += d.qty;
            html += `
                <div class="day-card" onclick="showDay('${key}')">
                    <div>
                        <div class="day-date">${new Date(key).toLocaleDateString('ar-EG')}</div>
                        <div class="day-qty">المباع: ${formatQty(d.qty, productFactor)}</div>
                    </div>
                    <div class="day-profit">
                        <div>${d.profitAvg.toFixed(2)} ج.م</div>
                        <span class="sub">${d.profitCurrent.toFixed(2)} ج.م</span>
                    </div>
                </div>
            `;
        });

        document.getElementById('daysContainer').innerHTML = html || `<div class="text-center text-muted mt-5">لا توجد مبيعات</div>`;
        document.getElementById('totalProfitVal').innerText = `${totalProfitAvg.toFixed(2)} ج.م`;
        document.getElementById('totalProfitCurrVal').innerText = `${totalProfitCurrent.toFixed(2)} ج.م`;
        document.getElementById('totalQtyVal').innerText = formatQty(totalQty, productFactor);
        window.dayData = byDay;
    };

    window.showDay = function(key) {
        const data = window.dayData[key];
        document.getElementById('modalTitle').innerText = `مبيعات ${new Date(key).toLocaleDateString('ar-EG')}`;
        document.getElementById('modalBody').innerHTML = data.items.map(item => `
            <div class="p-2 border-bottom text-start mb-2" style="font-size:0.85rem;">
                <b>${item.partyName}</b> <span class="badge bg-success float-end">${item.qty} قطعة</span><br>
                <span class="text-muted">سعر البيع المقروء: ${(item.unitPrice * productFactor).toFixed(2)} ج.م للكرتونة</span><br>
                <span class="text-primary fw-bold">الربح: ${item.profitAvg.toFixed(2)} ج.م</span>
            </div>
        `).join('');
        document.getElementById('detailsModal').style.display = 'flex';
    };
    window.closeModal = () => document.getElementById('detailsModal').style.display = 'none';

    loadDetails();
</script>
</body>
</html>
