<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة مبيعات - شركة الزيادي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --accent: #0b5e3d;
            --accent-light: #0e7a4f;
            --header-bg: #0b5e3d;
            --bg-light: #f3f6f5;
            --text-primary: #1b2e26;
            --text-secondary: #6b7a73;
            --border: #e4e9e6;
            --white: #ffffff;
            --danger: #d90429;
            --success: #2d6a4f;
            --warning: #e69500;
            --purple: #6f42c1;
            --card-radius: 18px;
            --input-radius: 12px;
            --shadow-sm: 0 1px 3px rgba(11,94,61,0.06);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); padding-bottom: 80px; direction: rtl; }
        .header-nav { background: linear-gradient(135deg, var(--header-bg), #08432b); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 3px 12px rgba(0,0,0,0.15); color: white; position: sticky; top: 0; z-index: 1000; }
        .header-top-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .header-buttons-row { display: flex; gap: 6px; width: 100%; }
        .btn-nav-back, .btn-nav-home { flex: 1; padding: 6px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-nav-back { background: rgba(255,255,255,0.1); color: #fff !important; border: 1px solid rgba(255,255,255,0.2); }
        .btn-nav-home { background: #ffb703; color: #1b2e26 !important; border: none; }
        .invoice-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--card-radius); padding: 16px; margin-top: 14px; box-shadow: var(--shadow-sm); }
        .product-row { background: #f8faf9; border-radius: var(--input-radius); padding: 12px; margin-bottom: 14px; border: 1px solid var(--border); position: relative; }
        .product-row.is-return-row { background: #fff0f1; border-color: #ffccd0; }
        .btn-remove { position: absolute; left: -8px; top: -8px; color: var(--danger); background: white; border-radius: 50%; font-size: 1.4rem; cursor: pointer; z-index: 10; }
        .search-results { position: absolute; width: 100%; background: white; border: 1px solid var(--border); border-radius: 10px; z-index: 100; max-height: 220px; overflow-y: auto; box-shadow: 0 6px 16px rgba(0,0,0,0.1); display: none; margin-top: 5px; }
        .search-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f1f1f1; font-size: 0.85rem; text-align: right; }
        .total-box { background: linear-gradient(135deg, var(--header-bg), #08432b); color: white; border-radius: var(--card-radius); padding: 16px; margin-top: 14px; }
        .btn-save { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border: none; border-radius: var(--input-radius); padding: 13px; width: 100%; font-weight: 700; color: white; margin-top: 16px; font-size: 1rem; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        .sub-lbl { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 3px; display: block; font-weight: 700; text-align: center; }
    </style>
</head>
<body>

<div class="header-nav">
    <div class="header-top-row">
        <h6 class="m-0 fw-bold d-flex align-items-center gap-2" style="font-size: 0.95rem;">
            <i class="fas fa-file-invoice-dollar me-1"></i>
            <span>فاتورة مبيعات</span>
            <span id="modeText" class="badge bg-white px-2 py-1" style="color:var(--accent)!important; font-size: 0.7rem;">جديدة</span>
        </h6>
    </div>
    <div class="header-buttons-row">
        <a href="sales-history.html" class="btn-nav-back"><i class="fas fa-history"></i> سجل الفواتير</a>
        <a href="index.html" class="btn-nav-home"><i class="fas fa-home"></i> الرئيسية</a>
    </div>
</div>

<div class="container px-2">
    <div class="invoice-card">
        <div class="row g-2 mb-3">
            <div class="col-7 position-relative">
                <label class="sub-lbl" style="text-align:right;"><i class="fas fa-user me-1"></i> العميل</label>
                <input type="text" id="customerSearch" class="form-control text-start" placeholder="ابحث عن عميل..." oninput="searchCustomer(this)" autocomplete="off">
                <input type="hidden" id="customerSelect" value="">
                <div id="customerResults" class="search-results"></div>
            </div>
            <div class="col-5">
                <label class="sub-lbl" style="text-align:right;"><i class="fas fa-calendar-alt me-1"></i> التاريخ والوقت</label>
                <input type="text" id="invTime" class="form-control" style="font-size: 0.75rem;" readonly>
            </div>
        </div>

        <div id="itemsContainer"></div>

        <button class="btn btn-outline-success w-100 mb-3 fw-bold" onclick="addNewRow()">
            <i class="fas fa-plus-circle me-1"></i> إضافة صنف جديد
        </button>

        <div class="total-box">
            <div class="d-flex justify-content-between h6 text-white mb-2">
                <span>صافي الفاتورة:</span>
                <span id="displayTotal" class="fw-bold">0.00 ج.م</span>
            </div>
        </div>

        <button class="btn-save" onclick="saveInvoice()" id="saveBtn">حفظ وتحديث المخزون</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, collection, getDocs, doc, serverTimestamp, increment, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });

    let inventory = [];
    let customers = [];

    document.addEventListener("DOMContentLoaded", async () => {
        document.getElementById('invTime').value = new Date().toLocaleString('ar-EG');
        await loadInitialData();
        addNewRow();
    });

    async function loadInitialData() {
        try {
            const [cSnap, iSnap] = await Promise.all([
                getDocs(collection(db, "customers")),
                getDocs(collection(db, "inventory"))
            ]);
            customers = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            inventory = iSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch(e) {
            console.error("خطأ في تحميل البيانات الأولية:", e);
        }
    }

    window.searchCustomer = (input) => {
        const term = input.value.toLowerCase().trim();
        const resDiv = document.getElementById('customerResults');
        if (!term) { resDiv.style.display = 'none'; return; }
        const filtered = customers.filter(c => (c.name || '').toLowerCase().includes(term) || (c.phone || '').includes(term));
        resDiv.innerHTML = filtered.map(c => `
            <div class="search-item" onclick="selectCustomer('${c.id}', '${(c.name || '').replace(/'/g, "\\'")}')">
                <b>${c.name || 'بدون اسم'}</b> ${c.phone ? `(${c.phone})` : ''}
            </div>`).join('');
        resDiv.style.display = filtered.length ? 'block' : 'none';
    };

    window.selectCustomer = (cid, cname) => {
        document.getElementById('customerSearch').value = cname;
        document.getElementById('customerSelect').value = cid;
        document.getElementById('customerResults').style.display = 'none';
    };

    window.addNewRow = () => {
        const id = 'row_' + Math.random().toString(36).substr(2, 5);
        const html = `
            <div class="product-row" id="${id}">
                <i class="fas fa-times-circle btn-remove" onclick="document.getElementById('${id}').remove(); calc();"></i>
                <div class="row g-1 mb-2">
                    <div class="col-7 position-relative">
                        <span class="sub-lbl" style="text-align:right;">الصنف</span>
                        <input type="text" class="form-control p-search text-start" placeholder="ابحث..." oninput="searchProduct(this)" autocomplete="off">
                        <input type="hidden" class="p-select">
                        <div class="search-results"></div>
                    </div>
                    <div class="col-5">
                        <span class="sub-lbl" style="text-align:right;">الوحدة</span>
                        <select class="form-select p-unit" onchange="calc()">
                            <option value="pcs">جركن / قطعة</option>
                            <option value="box">كرتونة</option>
                        </select>
                    </div>
                </div>
                <div class="row g-1 align-items-end">
                    <div class="col-3 px-1">
                        <span class="sub-lbl">الكمية</span>
                        <input type="number" class="form-control p-qty px-1" value="1" min="1" oninput="calc()">
                    </div>
                    <div class="col-4 px-1">
                        <span class="sub-lbl">السعر</span>
                        <input type="number" class="form-control p-price px-1" value="0" oninput="calc()">
                    </div>
                    <div class="col-5 px-1">
                        <span class="sub-lbl">الإجمالي</span>
                        <input type="text" class="form-control p-subtotal px-1 fw-bold" readonly value="0.00">
                    </div>
                </div>
            </div>`;
        document.getElementById('itemsContainer').insertAdjacentHTML('beforeend', html);
    };

    window.searchProduct = (input) => {
        const term = input.value.toLowerCase().trim();
        const resDiv = input.parentElement.querySelector('.search-results');
        if (!term) { resDiv.style.display = 'none'; return; }
        const filtered = inventory.filter(i => (i.name || '').toLowerCase().includes(term) || (i.barcode || '').toLowerCase().includes(term));
        resDiv.innerHTML = filtered.map(p => `
            <div class="search-item" onclick="selectProduct('${input.closest('.product-row').id}', '${p.id}', '${(p.name || '').replace(/'/g, "\\'")}', ${p.sell || 0})">
                <b>${p.name || 'بدون اسم'}</b> (المتاح: ${p.totalPcs || 0} قطعة)
            </div>`).join('');
        resDiv.style.display = filtered.length ? 'block' : 'none';
    };

    window.selectProduct = (rowId, pid, pname, sellPrice) => {
        const row = document.getElementById(rowId);
        row.querySelector('.p-search').value = pname;
        row.querySelector('.p-select').value = pid;
        row.querySelector('.p-price').value = sellPrice;
        row.querySelector('.search-results').style.display = 'none';
        calc();
    };

    window.calc = () => {
        let total = 0;
        document.querySelectorAll('.product-row').forEach(r => {
            const qty = parseFloat(r.querySelector('.p-qty').value) || 0;
            const price = parseFloat(r.querySelector('.p-price').value) || 0;
            const sub = qty * price;
            r.querySelector('.p-subtotal').value = sub.toFixed(2);
            total += sub;
        });
        document.getElementById('displayTotal').innerText = total.toFixed(2) + " ج.م";
    };

    window.saveInvoice = async () => {
        const saveBtn = document.getElementById('saveBtn');
        const customerId = document.getElementById('customerSelect').value;
        const customerName = document.getElementById('customerSearch').value.trim();
        const rows = document.querySelectorAll('.product-row');
        
        let validRowsCount = 0;
        rows.forEach(r => {
            if (r.querySelector('.p-select').value) validRowsCount++;
        });

        if (validRowsCount === 0) return alert("يرجى إضافة أصناف صالحة للفاتورة!");

        saveBtn.disabled = true;
        saveBtn.innerText = "جاري الحفظ والخصم...";

        try {
            const batch = writeBatch(db);
            const invoiceRef = doc(collection(db, "invoices"));
            const invoiceId = invoiceRef.id;
            const items = [];
            let grandTotal = 0;

            for (const r of rows) {
                const stockId = r.querySelector('.p-select').value;
                const name = r.querySelector('.p-search').value;
                const unit = r.querySelector('.p-unit').value;
                const qty = parseFloat(r.querySelector('.p-qty').value) || 0;
                const price = parseFloat(r.querySelector('.p-price').value) || 0;

                if (!stockId || qty <= 0) continue;

                const product = inventory.find(p => p.id === stockId);
                const factor = product ? (Number(product.unitFactor || product.factor) || 1) : 1;
                const totalPieces = unit === 'box' ? (qty * factor) : qty;
                const rowTotal = qty * price;
                grandTotal += rowTotal;

                items.push({ stockId, name, unit, qty, price, totalPieces, rowTotal });

                // 1. خصم الكمية المباشرة من رصيد المخزن
                const storeRef = doc(db, "inventory", stockId);
                batch.update(storeRef, { totalPcs: increment(-totalPieces) });

                // 2. تسجيل حركة المخزون التاريخية
                const transRef = doc(collection(db, "inventory_transactions"));
                batch.set(transRef, {
                    productId: stockId,
                    productName: name,
                    type: "sale",
                    quantityPcs: totalPieces,
                    unitPrice: price,
                    invoiceId: invoiceId,
                    customerId: customerId || "cash",
                    customerName: customerName || "عميل نقدي",
                    date: document.getElementById('invTime').value,
                    timestamp: serverTimestamp()
                });
            }

            // 3. حفظ مستند الفاتورة الرئيسي
            batch.set(invoiceRef, {
                customerId: customerId || "cash",
                customerName: customerName || "عميل نقدي",
                items: items,
                totalAmount: grandTotal,
                date: document.getElementById('invTime').value,
                timestamp: serverTimestamp()
            });

            await batch.commit();
            alert("تم حفظ الفاتورة وتحديث المخزون بنجاح!");
            location.reload();

        } catch (error) {
            console.error("خطأ حفظ الفاتورة:", error);
            alert("حدث خطأ أثناء الحفظ: " + error.message);
            saveBtn.disabled = false;
            saveBtn.innerText = "حفظ وتحديث المخزون";
        }
    };
</script>
</body>
</html>
