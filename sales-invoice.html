<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فاتورة المبيعات - الزيادي لزيوت السيارات</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- مكاتب فايربيز -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --germany-black: #000000;
            --germany-red: #FF0000;
            --germany-gold: #FFCC00;
            --bg-light: #f4f6f8;
            --card-radius: 18px;
            --input-radius: 12px;
            --border: #dcdcdc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: #000000;
            padding-bottom: 90px;
            font-size: 0.9rem;
        }

        .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

        .header-nav {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--germany-red);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-nav h6 { font-weight: 900; margin: 0; font-size: 1.1rem; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.15);
            width: 38px; height: 38px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-custom {
            background: white;
            border-radius: var(--card-radius);
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .form-control, .form-select {
            border-radius: var(--input-radius);
            padding: 10px 12px;
            font-weight: 700;
            font-size: 0.88rem;
            border: 1px solid var(--border);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--germany-black);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.1);
        }

        .financial-summary {
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: var(--input-radius);
            padding: 12px;
            margin-top: 12px;
        }

        .fin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.85rem;
            font-weight: 800;
        }

        .fin-row.total-row {
            border-top: 1px solid #000;
            margin-top: 6px;
            padding-top: 8px;
            font-size: 1.05rem;
        }

        .btn-submit {
            background: var(--germany-black);
            color: white;
            font-weight: 800;
            border-radius: 14px;
            padding: 12px;
            width: 100%;
            border: none;
            font-size: 1rem;
        }

        #thermalPrintSection { display: none; }
        @media print {
            body * { visibility: hidden; }
            #thermalPrintSection, #thermalPrintSection * { visibility: visible; }
            #thermalPrintSection { display: block !important; position: absolute; left: 0; top: 0; width: 80mm; }
        }
    </style>
</head>
<body>

<div id="mainContainer">
    <div class="header-nav">
        <a href="sales-history.html" class="icon-btn" title="سجل المبيعات"><i class="fas fa-arrow-right"></i></a>
        <h6><i class="fas fa-file-invoice me-1"></i> فاتورة مبيعات جديدة</h6>
        <a href="index.html" class="icon-btn" title="الرئيسية"><i class="fas fa-home"></i></a>
    </div>

    <div class="container px-2 mt-3">
        <form id="invoiceForm" onsubmit="event.preventDefault(); saveInvoice();">
            <!-- بيانات العميل والتاريخ -->
            <div class="card-custom">
                <div class="row g-2">
                    <div class="col-12">
                        <label class="fw-bold mb-1" style="font-size: 0.8rem;">اسم العميل:</label>
                        <input type="text" id="customerNameInput" class="form-control" placeholder="اختر أو اكتب اسم العميل..." list="customersList" oninput="onCustomerSelectChange()" required>
                        <datalist id="customersList"></datalist>
                    </div>
                    <div class="col-6">
                        <label class="fw-bold mb-1" style="font-size: 0.8rem;">التاريخ:</label>
                        <input type="date" id="invoiceDate" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold mb-1" style="font-size: 0.8rem;">منفذ البيع:</label>
                        <select id="invoiceSource" class="form-select">
                            <option value="van_sales">السيارة</option>
                            <option value="main_store">المخزن</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- جدول الأصناف -->
            <div class="card-custom">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold" style="font-size: 0.88rem;"><i class="fas fa-boxes me-1"></i> الأصناف الفاتورة:</span>
                    <button type="button" class="btn btn-sm btn-outline-dark fw-bold" onclick="addItemRow()"><i class="fas fa-plus me-1"></i> إضافة صنف</button>
                </div>
                <div id="itemsContainer"></div>
            </div>

            <!-- المبالغ والسداد -->
            <div class="card-custom">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="fw-bold mb-1" style="font-size: 0.8rem;">سداد نقدي (كاش):</label>
                        <input type="number" step="0.01" id="cashPaidInput" class="form-control num" value="0" oninput="calculateFinancials()">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold mb-1" style="font-size: 0.8rem;">سداد محفظة:</label>
                        <input type="number" step="0.01" id="walletPaidInput" class="form-control num" value="0" oninput="calculateFinancials()">
                    </div>
                    <div class="col-12">
                        <label class="fw-bold mb-1" style="font-size: 0.8rem;">الخصم النقدي:</label>
                        <input type="number" step="0.01" id="discountInput" class="form-control num" value="0" oninput="calculateFinancials()">
                    </div>
                </div>

                <!-- الملخص المحاسبي -->
                <div class="financial-summary">
                    <div class="fin-row">
                        <span>إجمالي الأصناف:</span>
                        <span id="itemsTotalText" class="num">0.00 ج.م</span>
                    </div>
                    <div class="fin-row text-danger">
                        <span>الخصم:</span>
                        <span id="discountText" class="num">0.00 ج.م</span>
                    </div>
                    <div class="fin-row">
                        <span>صافي الفاتورة:</span>
                        <span id="netInvoiceText" class="num">0.00 ج.م</span>
                    </div>
                    <div class="fin-row text-primary">
                        <span>إجمالي المسدد:</span>
                        <span id="totalPaidText" class="num">0.00 ج.م</span>
                    </div>
                    <div class="fin-row text-danger">
                        <span>المتبقي (الأجل):</span>
                        <span id="remainingText" class="num">0.00 ج.م</span>
                    </div>
                    
                    <!-- سطر الحساب السابق يظهر شبيهاً بالفاتورة الرسمية -->
                    <div class="fin-row text-secondary" id="prevBalanceRow" style="display: none;">
                        <span id="prevBalanceLabel">حساب سابق:</span>
                        <span id="prevBalanceText" class="num">0.00 ج.م</span>
                    </div>

                    <div class="fin-row total-row">
                        <span>صافي الحساب النهائي:</span>
                        <span id="finalBalanceText" class="num">0.00 ج.م</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit mb-3"><i class="fas fa-save me-1"></i> حفظ وطباعة الفاتورة</button>
        </form>
    </div>
</div>

<div id="thermalPrintSection"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let customersList = [];
    let selectedCustomerId = null;
    let currentPrevBalance = 0;
    let currentLastPendingDate = null;

    function normalizeName(str) {
        return String(str || '').trim().replace(/\s+/g, ' ').replace(/[\u064B-\u0652]/g, '').replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();
    }

    function convertToEnglishNumbers(str) {
        if (!str) return "";
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let res = str.toString();
        for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
        return res;
    }

    function parseArabicDateToMs(dateStr) {
        if (!dateStr) return 0;
        try {
            let cleanStr = convertToEnglishNumbers(String(dateStr)).replace(/ص/g, 'AM').replace(/م/g, 'PM');
            const parsed = Date.parse(cleanStr);
            if (!isNaN(parsed)) return parsed;
            const parts = cleanStr.match(/(\d+)/g);
            if (parts && parts.length >= 3) {
                let year = parseInt(parts[0]), month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
                if (year < 1000) { day = parseInt(parts[0]); month = parseInt(parts[1]) - 1; year = parseInt(parts[2]); }
                return new Date(year, month, day).getTime();
            }
        } catch (e) { } return 0;
    }

    async function initPage() {
        document.getElementById('invoiceDate').value = new Date().toLocaleDateString('en-CA');
        addItemRow();
        await loadCustomers();
    }

    async function loadCustomers() {
        const snap = await db.collection("customers").get();
        const listEl = document.getElementById("customersList");
        listEl.innerHTML = "";
        customersList = [];
        
        snap.forEach(doc => {
            const data = doc.data();
            customersList.push({ id: doc.id, name: data.name, initialBalance: Number(data.initialBalance || 0) });
            const opt = document.createElement("option");
            opt.value = data.name;
            listEl.appendChild(opt);
        });
    }

    async function getRealBalance(customerId, customerName) {
        let baseBalance = 0;
        let custId = customerId;

        if (!custId && customerName) {
            const found = customersList.find(c => normalizeName(c.name) === normalizeName(customerName));
            if (found) custId = found.id;
        }

        if (custId) {
            const cDoc = customersList.find(c => c.id === custId);
            if (cDoc) baseBalance = Number(cDoc.initialBalance || 0);
        }

        // جلب كافّة الفواتير السابقة للعميل
        let invQuery = db.collection("invoices");
        let transQuery = db.collection("transactions");

        const [invSnap, transSnap] = await Promise.all([invQuery.get(), transQuery.get()]);

        let prevInvoiceDebt = 0;
        let lastPendingDate = null;
        let invoiceList = [];

        invSnap.forEach(d => {
            const inv = d.data();
            if (inv.isDeleted) return;
            const matchesId = custId && inv.customerId === custId;
            const matchesName = customerName && normalizeName(inv.customerName) === normalizeName(customerName);
            
            if (matchesId || matchesName) {
                let timeMs = inv.timestamp?.seconds ? (inv.timestamp.seconds * 1000) : parseArabicDateToMs(inv.date);
                let total = Number(inv.total || 0);
                let paid = Number(inv.cashAmount || inv.cashPaid || 0) + Number(inv.walletAmount || inv.walletPaid || 0);
                let remaining = inv.remaining !== undefined ? Number(inv.remaining) : (total - paid);
                
                invoiceList.push({ date: inv.date, remaining, timeMs });
            }
        });

        // ترتيب الأقدم فالأحدث لحساب تاريخ آخر فاتورة معلقة
        invoiceList.sort((a, b) => a.timeMs - b.timeMs);
        invoiceList.forEach(item => {
            if (item.remaining > 0) {
                lastPendingDate = item.date;
            }
            prevInvoiceDebt += item.remaining;
        });

        let transEffect = 0;
        transSnap.forEach(d => {
            const tr = d.data();
            if (tr.isDeleted) return;
            const matchesId = custId && (tr.partyId === custId || tr.customerId === custId);
            const matchesName = customerName && (normalizeName(tr.customerName) === normalizeName(customerName) || normalizeName(tr.partyName) === normalizeName(customerName));

            if (matchesId || matchesName) {
                let amt = Number(tr.amount || tr.total || 0);
                if (tr.type === 'قبض') transEffect -= Math.abs(amt);
                else if (tr.type === 'صرف') transEffect += Math.abs(amt);
            }
        });

        return {
            balance: baseBalance + prevInvoiceDebt + transEffect,
            lastPendingDate: lastPendingDate
        };
    }

    async function onCustomerSelectChange() {
        const name = document.getElementById("customerNameInput").value.trim();
        if (!name) {
            currentPrevBalance = 0;
            currentLastPendingDate = null;
            calculateFinancials();
            return;
        }

        const found = customersList.find(c => normalizeName(c.name) === normalizeName(name));
        selectedCustomerId = found ? found.id : null;

        const res = await getRealBalance(selectedCustomerId, name);
        currentPrevBalance = res.balance;
        currentLastPendingDate = res.lastPendingDate;

        calculateFinancials();
    }

    function addItemRow() {
        const container = document.getElementById("itemsContainer");
        const rowId = Date.now();
        const html = `
            <div class="row g-2 align-items-center mb-2" id="row_${rowId}">
                <div class="col-5">
                    <input type="text" class="form-control item-name" placeholder="الصنف" required>
                </div>
                <div class="col-3">
                    <input type="number" class="form-control item-qty num" placeholder="الكمية" value="1" min="1" oninput="calculateFinancials()" required>
                </div>
                <div class="col-3">
                    <input type="number" step="0.01" class="form-control item-price num" placeholder="السعر" oninput="calculateFinancials()" required>
                </div>
                <div class="col-1 text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger p-1" onclick="document.getElementById('row_${rowId}').remove(); calculateFinancials();"><i class="fas fa-times"></i></button>
                </div>
            </div>`;
        container.insertAdjacentHTML('beforeend', html);
    }

    function calculateFinancials() {
        let itemsTotal = 0;
        document.querySelectorAll("#itemsContainer .row").forEach(row => {
            const qty = Number(row.querySelector(".item-qty").value || 0);
            const price = Number(row.querySelector(".item-price").value || 0);
            itemsTotal += (qty * price);
        });

        const discount = Number(document.getElementById("discountInput").value || 0);
        const netInvoice = itemsTotal - discount;
        const cashPaid = Number(document.getElementById("cashPaidInput").value || 0);
        const walletPaid = Number(document.getElementById("walletPaidInput").value || 0);
        const totalPaid = cashPaid + walletPaid;
        const remaining = netInvoice - totalPaid;
        const finalBalance = currentPrevBalance + remaining;

        document.getElementById("itemsTotalText").innerText = itemsTotal.toFixed(2) + " ج.م";
        document.getElementById("discountText").innerText = discount.toFixed(2) + " ج.م";
        document.getElementById("netInvoiceText").innerText = netInvoice.toFixed(2) + " ج.م";
        document.getElementById("totalPaidText").innerText = totalPaid.toFixed(2) + " ج.م";
        document.getElementById("remainingText").innerText = remaining.toFixed(2) + " ج.م";

        // الشرط الأساسي: عدم ذكر أو إظهار الحساب السابق إذا كانت قيمته تساوي صفر
        const prevRow = document.getElementById("prevBalanceRow");
        const prevLabel = document.getElementById("prevBalanceLabel");
        const prevText = document.getElementById("prevBalanceText");

        if (currentPrevBalance !== 0) {
            prevRow.style.display = "flex";
            let shortDate = "";
            if (currentLastPendingDate) {
                let parts = currentLastPendingDate.split('-');
                shortDate = parts.length === 3 ? `${parts[2]}/${parts[1]}` : currentLastPendingDate;
                prevLabel.innerText = `حساب سابق (${shortDate}):`;
            } else {
                prevLabel.innerText = "حساب سابق (رصيد افتتاحي):";
            }
            prevText.innerText = currentPrevBalance.toFixed(2) + " ج.م";
        } else {
            prevRow.style.display = "none";
        }

        document.getElementById("finalBalanceText").innerText = finalBalance.toFixed(2) + " ج.م";
    }

    function generateThermalInvoiceHtml(inv) {
        let itemsRows = (inv.items || []).map(itm => `
            <tr>
                <td style="text-align:right; padding:4px 0; border-bottom:1px dashed #eee;">${itm.name}</td>
                <td style="text-align:center; padding:4px 0; border-bottom:1px dashed #eee;">${itm.qty}</td>
                <td style="text-align:center; padding:4px 0; border-bottom:1px dashed #eee;">${(Number(itm.price) || 0).toFixed(1)}</td>
                <td style="text-align:left; padding:4px 0; border-bottom:1px dashed #eee;">${((Number(itm.qty) || 0) * (Number(itm.price) || 0)).toFixed(1)}</td>
            </tr>
        `).join('');

        let cashAmount = Number(inv.cashAmount || 0);
        let walletAmount = Number(inv.walletAmount || 0);
        let prevBalAmt = Number(inv.previousBalance || 0);
        let remainingAmt = Number(inv.remaining || 0);

        let payMethodText = "آجل";
        if (cashAmount > 0 && walletAmount > 0) payMethodText = "سداد كاش ومحفظة";
        else if (cashAmount > 0) payMethodText = "سداد نقدي";
        else if (walletAmount > 0) payMethodText = "سداد محفظة";

        // تجهيز مسمى التاريخ المكتوب بداخل الفاتورة
        let prevBalanceLabel = "حساب سابق";
        if (inv.lastPendingInvoiceDate) {
            let parts = inv.lastPendingInvoiceDate.split('-');
            let lastShortDate = parts.length === 3 ? `${parts[2]}/${parts[1]}` : inv.lastPendingInvoiceDate;
            prevBalanceLabel = `حساب سابق (${lastShortDate})`;
        } else if (prevBalAmt > 0) {
            prevBalanceLabel = "حساب سابق (رصيد افتتاحي)";
        }

        // عدم كتابة الخانة إطلاقاً في الصورة والطباعة إذا كانت قيمتها صفراً
        const prevBalanceRowHtml = (prevBalAmt !== 0) ? `
            <div style="display:flex; justify-content:space-between; color:#4a5568; margin-top:2px;">
                <span>${prevBalanceLabel}:</span>
                <b>${prevBalAmt.toFixed(2)}</b>
            </div>
        ` : '';

        return `
            <div style="width:100%; font-family:'Cairo', sans-serif; color:#000; direction:rtl; padding:8px; background:#fff; box-sizing: border-box;">
                <div style="text-align:center; margin-bottom:12px;">
                    <h5 style="margin:0; font-weight:800; font-size:16px;">شركة الزيادي</h5>
                    <p style="margin:2px 0; font-size:11px; font-weight:600;">لزيوت وفلاتر السيارات</p>
                    <p style="margin:2px 0; font-size:10px; font-weight:600;">إدارة محاسب/ أحمد محمود الزيادي</p>
                </div>
                <div style="font-size:11px; border-bottom:1px dashed #000; padding-bottom:6px; margin-bottom:8px; line-height:1.5;">
                    <div><b>العميل:</b> ${inv.customerName || 'عميل نقدى'}</div>
                    <div><b>التاريخ:</b> ${inv.date}</div>
                    <div><b>طريقة السداد:</b> ${payMethodText}</div>
                </div>
                <table style="width:100%; font-size:11px; border-collapse:collapse; margin-bottom:8px;">
                    <thead>
                        <tr style="border-bottom:1px solid #000; font-weight:700;">
                            <th style="text-align:right; padding-bottom:4px;">الصنف</th>
                            <th style="text-align:center; padding-bottom:4px;">كمية</th>
                            <th style="text-align:center; padding-bottom:4px;">سعر</th>
                            <th style="text-align:left; padding-bottom:4px;">إجمالي</th>
                        </tr>
                    </thead>
                    <tbody>${itemsRows}</tbody>
                </table>
                <div style="font-size:11px; line-height:1.6; border-top:1px solid #000; padding-top:6px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span>إجمالي الفاتورة:</span>
                        <b>${(Number(inv.total) || 0).toFixed(2)}</b>
                    </div>
                    
                    ${cashAmount > 0 ? `<div style="display:flex; justify-content:space-between; color:#000;"><span>- سداد نقدي:</span><b>${cashAmount.toFixed(2)}</b></div>` : ''}
                    ${walletAmount > 0 ? `<div style="display:flex; justify-content:space-between; color:#000;"><span>- سداد محفظة:</span><b>${walletAmount.toFixed(2)}</b></div>` : ''}

                    ${prevBalanceRowHtml}
                    
                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:12.5px; border-top:1px solid #000; padding-top:3px; margin-top:2px;">
                        <span>صافي الحساب النهائي:</span>
                        <b>${(prevBalAmt + remainingAmt).toFixed(2)}</b>
                    </div>
                </div>
                <div style="text-align:center; margin-top:15px; border-top:1px dashed #000; padding-top:6px; font-size:10px; font-weight:700;">
                    <p style="margin:0;">شكراً لتعاملكم معنا 🙏</p>
                </div>
            </div>`;
    }

    async function saveInvoice() {
        const customerName = document.getElementById("customerNameInput").value.trim();
        const invoiceDate = document.getElementById("invoiceDate").value;
        const source = document.getElementById("invoiceSource").value;

        const items = [];
        document.querySelectorAll("#itemsContainer .row").forEach(row => {
            items.push({
                name: row.querySelector(".item-name").value.trim(),
                qty: Number(row.querySelector(".item-qty").value || 0),
                price: Number(row.querySelector(".item-price").value || 0)
            });
        });

        const discount = Number(document.getElementById("discountInput").value || 0);
        const cashAmount = Number(document.getElementById("cashPaidInput").value || 0);
        const walletAmount = Number(document.getElementById("walletPaidInput").value || 0);

        let itemsTotal = items.reduce((acc, i) => acc + (i.qty * i.price), 0);
        let netTotal = itemsTotal - discount;
        let totalPaid = cashAmount + walletAmount;
        let remaining = netTotal - totalPaid;

        let payMethod = "آجل";
        if (cashAmount > 0 && walletAmount > 0) payMethod = "سداد كاش ومحفظة";
        else if (cashAmount > 0) payMethod = "سداد نقدي";
        else if (walletAmount > 0) payMethod = "سداد محفظة";

        const invoiceData = {
            customerName: customerName || "عميل نقدي",
            customerId: selectedCustomerId || "",
            date: invoiceDate,
            source: source,
            items: items,
            discount: discount,
            total: netTotal,
            cashAmount: cashAmount,
            walletAmount: walletAmount,
            remaining: remaining,
            paymentMethod: payMethod,
            previousBalance: currentPrevBalance,
            lastPendingInvoiceDate: currentLastPendingDate || "",
            createdBy: localStorage.getItem("username") || "أحمد محمود الزيادي",
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            const docRef = await db.collection("invoices").add(invoiceData);
            invoiceData.id = docRef.id;

            // طباعة وحفظ حراري
            document.getElementById("thermalPrintSection").innerHTML = generateThermalInvoiceHtml(invoiceData);
            window.print();

            setTimeout(() => {
                window.location.href = "sales-history.html";
            }, 800);

        } catch (err) {
            alert("حدث خطأ أثناء حفظ الفاتورة: " + err.message);
        }
    }

    window.onload = initPage;
</script>
</body>
</html>
